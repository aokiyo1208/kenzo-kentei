<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KENZO検定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bk:#1a1a1a;--dk:#2C2C2C;--gd:#C8A96E;--gl:#E8CFA0;--cr:#F5F0E8;--wh:#FAFAF7;--gr:#8A8A8A;--bd:#D8D0C4;--ok:#4A7C59;--ng:#8B3A3A;--pd:#5A6A7A;--st:#3A6B8A}
body{font-family:'Noto Sans JP',sans-serif;background:var(--cr);color:var(--dk);min-height:100vh}
#app{min-height:100vh}
.hdr{background:var(--bk);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(200,169,110,.3)}
.logo{font-family:'Noto Serif JP',serif;font-size:19px;font-weight:700;letter-spacing:.15em;color:var(--gd)}
.logo span{color:rgba(255,255,255,.4);font-weight:300;font-size:11px;margin-left:9px}
.nav{display:flex;gap:4px;align-items:center}
.nb{background:none;border:none;color:rgba(255,255,255,.5);font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:6px 12px;cursor:pointer;border-radius:3px;transition:all .2s}
.nb:hover,.nb.act{color:var(--gd);background:rgba(200,169,110,.15)}
.tmr{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:700;color:var(--gd);background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.25);border-radius:3px;padding:3px 10px;margin-right:6px}
.tmr.warn{color:#E07070;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.utag{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.45)}
.utag strong{color:var(--gd);font-size:12px}
.lout{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.35);font-size:10px;padding:3px 9px;border-radius:2px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-left:5px}
.lout:hover{color:rgba(255,255,255,.75)}
.main{padding:32px 24px;max-width:820px;margin:0 auto;width:100%}
.pt{font-family:'Noto Serif JP',serif;font-size:24px;font-weight:300;margin-bottom:4px}
.ps{font-size:11px;color:var(--gr);margin-bottom:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.sc{background:var(--wh);border:1px solid var(--bd);padding:18px;border-radius:2px}
.sl{font-size:9px;color:var(--gr);letter-spacing:.2em;text-transform:uppercase;margin-bottom:7px}
.sv{font-family:'Noto Serif JP',serif;font-size:30px;font-weight:300}
.su{font-size:11px;color:var(--gr);margin-left:3px}
.stit{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:700;margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--bd)}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:24px}
.lcard{background:var(--wh);border:1px solid var(--bd);padding:16px 10px;border-radius:2px;cursor:pointer;transition:all .25s;text-align:center;position:relative;overflow:hidden}
.lcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--lc,var(--gd));transform:scaleX(0);transition:transform .25s}
.lcard:hover::before{transform:scaleX(1)}
.lcard:hover{border-color:var(--gd);transform:translateY(-2px)}
.lcard.dis{opacity:.4;cursor:not-allowed;pointer-events:none}
.lb{font-family:'Noto Serif JP',serif;font-size:19px;font-weight:700;margin-bottom:4px}
.ld{font-size:9px;color:var(--gr)}
.ls{margin-top:7px;font-size:9px;padding:2px 6px;border-radius:2px;display:inline-block}
.lo{background:rgba(200,169,110,.15);color:var(--gd)}
.ll{background:rgba(0,0,0,.05);color:var(--gr)}
.tbl{width:100%;border-collapse:collapse;background:var(--wh);border:1px solid var(--bd)}
.tbl th{background:var(--dk);color:var(--wh);font-size:9px;padding:9px 13px;text-align:left}
.tbl td{padding:9px 13px;font-size:11px;border-bottom:1px solid var(--bd)}
.tbl tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:9px;font-weight:500}
.bp{background:rgba(74,124,89,.15);color:var(--ok)}
.bf{background:rgba(139,58,58,.15);color:var(--ng)}
.bpd{background:rgba(90,106,122,.15);color:var(--pd)}
.bi{background:rgba(200,169,110,.15);color:#8B6A30}
.bst{background:rgba(58,107,138,.15);color:var(--st)}
.ebar{display:flex;align-items:center;gap:13px;margin-bottom:22px}
.back-btn{background:none;border:1px solid var(--bd);color:var(--gr);font-family:'Noto Sans JP',sans-serif;font-size:10px;padding:6px 13px;cursor:pointer;border-radius:2px}
.back-btn:hover{border-color:var(--dk);color:var(--dk)}
.elv{font-family:'Noto Serif JP',serif;font-size:15px;font-weight:700;color:var(--gd)}
.pbar{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--gd),var(--gl));transition:width .4s}
.ptxt{font-size:10px;color:var(--gr);white-space:nowrap}
.qcard{background:var(--wh);border:1px solid var(--bd);border-radius:2px;padding:28px 32px;margin-bottom:14px;animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.qmeta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.qcat{font-size:9px;color:var(--gd);letter-spacing:.2em;text-transform:uppercase}
.ttag{font-size:9px;padding:2px 6px;border-radius:2px;background:rgba(0,0,0,.06);color:var(--gr)}
.qtxt{font-family:'Noto Serif JP',serif;font-size:17px;line-height:1.7;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:7px}
.obtn{display:flex;align-items:center;gap:11px;padding:11px 15px;border:1px solid var(--bd);background:var(--wh);cursor:pointer;border-radius:2px;transition:all .2s;text-align:left;width:100%;font-family:'Noto Sans JP',sans-serif;font-size:12px}
.obtn:hover{border-color:var(--gd)}
.obtn.ok{border-color:var(--ok)!important;background:rgba(74,124,89,.08)!important}
.obtn.ng{border-color:var(--ng)!important;background:rgba(139,58,58,.08)!important}
.obtn.sh{border-color:var(--ok)!important;background:rgba(74,124,89,.04)!important}
.okey{width:24px;height:24px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.obtn.ok .okey,.obtn.sh .okey{background:var(--ok);border-color:var(--ok);color:#fff}
.obtn.ng .okey{background:var(--ng);border-color:var(--ng);color:#fff}
.tfrow{display:flex;gap:9px}
.tfbtn{flex:1;padding:14px;border:1px solid var(--bd);background:var(--wh);cursor:pointer;border-radius:2px;font-family:'Noto Serif JP',serif;font-size:17px;transition:all .2s;text-align:center}
.tfbtn:hover{border-color:var(--gd)}
.tfbtn.tf-ok{border-color:var(--ok)!important;background:rgba(74,124,89,.1)!important}
.tfbtn.tf-ng{border-color:var(--ng)!important;background:rgba(139,58,58,.1)!important}
.tfbtn.tf-sh{border-color:var(--ok)!important;background:rgba(74,124,89,.05)!important}
textarea.oarea{width:100%;min-height:90px;border:1px solid var(--bd);border-radius:2px;padding:11px;font-family:'Noto Sans JP',sans-serif;font-size:12px;resize:vertical;background:var(--wh);outline:none;display:block}
textarea.oarea:focus{border-color:var(--gd)}
.osbtn{background:var(--dk);color:var(--wh);border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:9px 22px;cursor:pointer;border-radius:2px;margin-top:8px}
.osbtn:hover{background:var(--gd);color:var(--dk)}
.osbtn:disabled{opacity:.4;cursor:not-allowed}
.mans{margin-top:12px;padding:12px;background:rgba(74,124,89,.07);border:1px solid rgba(74,124,89,.2);border-radius:2px;font-size:11px;color:var(--ok);line-height:1.6}
.mansl{font-size:9px;font-weight:700;margin-bottom:3px}
.fb{padding:11px 16px;border-radius:2px;margin-bottom:14px;font-size:12px}
.fb.ok-fb{background:rgba(74,124,89,.12);color:var(--ok)}
.fb.ng-fb{background:rgba(139,58,58,.12);color:var(--ng)}
.fb.pd-fb{background:rgba(90,106,122,.1);color:var(--pd)}
.exp{padding:11px 16px;background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.25);border-radius:2px;margin-bottom:14px;font-size:11px;line-height:1.8}
.expl{font-size:9px;font-weight:700;color:var(--gd);display:block;margin-bottom:3px}
.nxt{background:var(--dk);color:var(--wh);border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:11px 26px;cursor:pointer;border-radius:2px;display:block;margin-left:auto}
.nxt:hover{background:var(--gd);color:var(--dk)}
.rcard{background:var(--wh);border:1px solid var(--bd);border-radius:2px;padding:48px 32px;text-align:center}
.ricon{font-size:44px;margin-bottom:11px}
.rgold{width:32px;height:2px;background:var(--gd);margin:0 auto 14px}
.rtit{font-family:'Noto Serif JP',serif;font-size:22px;font-weight:300;margin-bottom:4px}
.rscore{font-family:'Noto Serif JP',serif;font-size:52px;font-weight:700;color:var(--gd);line-height:1;margin:14px 0}
.rscore span{font-size:16px;color:var(--gr);font-weight:300}
.racts{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.pbtn{background:var(--dk);color:var(--wh);border:none;font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:9px 20px;cursor:pointer;border-radius:2px}
.pbtn:hover{background:var(--gd);color:var(--dk)}
.sbtn2{background:none;color:var(--dk);border:1px solid var(--bd);font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:9px 20px;cursor:pointer;border-radius:2px}
.sbtn2:hover{border-color:var(--dk)}
.anote{background:rgba(90,106,122,.08);border:1px solid rgba(90,106,122,.2);border-radius:2px;padding:12px 16px;font-size:11px;color:var(--pd);line-height:1.7;margin-bottom:14px}
.empty{text-align:center;padding:48px 20px;color:var(--gr)}
.prow{padding:13px;border:1px solid var(--bd);border-radius:2px;background:var(--wh);margin-bottom:7px}
.pq{font-size:12px;font-weight:500;margin-bottom:4px}
.pa{font-size:11px;padding:7px;background:var(--cr);border-radius:2px;line-height:1.6}
.mref{font-size:10px;color:var(--gr);margin-top:3px;font-style:italic}
.pm{font-size:9px;color:var(--gr);margin-top:4px}
.si{border:1px solid var(--bd);border-radius:2px;padding:3px 7px;font-size:11px;width:60px;font-family:'Noto Sans JP',sans-serif}
.sbtn{background:var(--dk);color:var(--wh);border:none;padding:5px 11px;border-radius:2px;cursor:pointer;font-size:10px}
.sbtn:hover{background:var(--gd);color:var(--dk)}
.top-s{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bk);flex-direction:column}
.top-logo{font-family:'Noto Serif JP',serif;font-size:38px;font-weight:700;color:var(--gd);letter-spacing:.2em;margin-bottom:6px}
.top-sub{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.3em;margin-bottom:48px}
.top-cards{display:flex;gap:14px}
.tc{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:28px 32px;cursor:pointer;transition:all .3s;text-align:center;min-width:170px}
.tc:hover{background:rgba(200,169,110,.1);border-color:var(--gd);transform:translateY(-3px)}
.tc-icon{font-size:26px;margin-bottom:10px}
.tc-label{font-family:'Noto Serif JP',serif;font-size:16px;color:var(--wh);margin-bottom:3px}
.tc-desc{font-size:9px;color:rgba(255,255,255,.3)}
.auth-s{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bk)}
.auth-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:40px 44px;width:380px}
.auth-title{font-family:'Noto Serif JP',serif;font-size:19px;color:var(--wh);margin-bottom:4px;font-weight:400}
.auth-sub{font-size:10px;color:rgba(255,255,255,.3);margin-bottom:26px}
.auth-label{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.15em;margin-bottom:6px;display:block}
.auth-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:2px;padding:10px 13px;font-family:'Noto Sans JP',sans-serif;font-size:12px;color:var(--wh);outline:none;margin-bottom:11px;display:block}
.auth-input:focus{border-color:var(--gd)}
.auth-input::placeholder{color:rgba(255,255,255,.18)}
.auth-btn{width:100%;background:var(--gd);color:var(--dk);border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:700;padding:12px;cursor:pointer;border-radius:2px;margin-top:4px}
.auth-btn:hover{background:var(--gl)}
.auth-error{font-size:10px;color:#E07070;margin-bottom:8px}
.auth-back{background:none;border:none;color:rgba(255,255,255,.28);font-size:10px;cursor:pointer;margin-top:11px;font-family:'Noto Sans JP',sans-serif;display:block;width:100%;text-align:center}
.auth-back:hover{color:rgba(255,255,255,.6)}
.warn-bar{background:rgba(224,112,112,.1);border:1px solid rgba(224,112,112,.3);border-radius:2px;padding:11px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wtabs{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.wtab{padding:7px 14px;border:1px solid var(--bd);background:var(--wh);border-radius:2px;cursor:pointer;font-size:12px;font-family:'Noto Sans JP',sans-serif}
.wtab:hover{border-color:var(--gd)}
.hidden{display:none}
.score-row{display:flex;align-items:center;gap:6px;margin-top:7px}

.sq-row{border:1px solid var(--bd);border-radius:2px;margin-bottom:10px;overflow:hidden;background:var(--wh)}
.sq-hdr{padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;border-bottom:1px solid var(--bd)}
.sq-hdr.sq-ok{background:rgba(74,124,89,.07)}
.sq-hdr.sq-ng{background:rgba(139,58,58,.07)}
.sq-hdr.sq-pd{background:rgba(90,106,122,.07)}
.sq-body{padding:12px 14px;font-size:11px;color:var(--gr);line-height:1.7}
.sq-ans{margin-top:6px;padding:6px 10px;border-radius:2px;font-size:11px}
.sq-ans.ans-ok{background:rgba(74,124,89,.08);color:var(--ok)}
.sq-ans.ans-ng{background:rgba(139,58,58,.08);color:var(--ng)}
.sq-exp{margin-top:6px;padding:8px 10px;background:rgba(200,169,110,.08);border-radius:2px;font-size:10px;color:#8B6A30;line-height:1.6}
/* ケーススタディ（1級） */
.cbox{background:var(--wh);border:1px solid var(--bd);border-left:4px solid var(--gd);border-radius:2px;padding:20px 24px;margin-bottom:22px}
.cbox-title{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:700;color:var(--gd);letter-spacing:.1em;margin-bottom:10px}
.cbox-body{font-size:12px;line-height:2;color:var(--dk)}
.cbox-body ul{padding-left:1.4em;margin:.5em 0}
.cbox-body li{margin:.2em 0}
.cbox-body strong{color:var(--gd);font-weight:700}
.ctag{display:inline-block;background:rgba(44,62,80,.1);color:#2C3E50;font-size:9px;padding:2px 7px;border-radius:2px;font-weight:700;letter-spacing:.1em;margin-bottom:6px}
.case-toggle{background:none;border:1px solid var(--bd);color:var(--gr);font-family:'Noto Sans JP',sans-serif;font-size:10px;padding:4px 10px;cursor:pointer;border-radius:2px;margin-bottom:12px}
.case-toggle:hover{border-color:var(--gd);color:var(--gd)}
</style>
</head>
<body>
<div id="app"></div>

<script>
const Q4=[
{id:1,cat:"ユーザー登録",type:"c",q:"招待URLの有効期限は？",o:["24時間","1週間","3日","1か月"],a:"B",ex:"セキュリティと利便性のバランスから1週間です。"},
{id:2,cat:"ユーザー登録",type:"c",q:"登録時にチェックが必要な項目は？",o:["利用規約に同意する","メルマガ購読","位置情報の共有","端末認証"],a:"A",ex:"法的拘束力を持つのは利用規約への同意です。"},
{id:3,cat:"ユーザー登録",type:"c",q:"会員登録完了後にできることは？",o:["契約書が自動生成","物件が自動作成","取引先が自動登録","建設PADへログイン"],a:"D",ex:"登録完了＝利用権限の付与です。"},
{id:4,cat:"ユーザー登録",type:"c",q:"登録した基本情報は何に反映？",o:["注文書等の基本情報","CSV出力条件","契約書の条項","ストレージ容量"],a:"A",ex:"発注書・契約書に自動反映されます。"},
{id:5,cat:"プロフィール編集",type:"c",q:"組織情報編集はどこから？",o:["契約書","請求関連","組織・ユーザー","CSV出力"],a:"C",ex:"組織管理領域に配置されています。"},
{id:6,cat:"プロフィール編集",type:"c",q:"組織情報編集の注意点は？",o:["（必須）は必ず入力","（任意）も必ず入力","半角数字は不可","住所は入力不可"],a:"A",ex:"必須項目は書面生成に必要な情報です。"},
{id:7,cat:"通知情報",type:"c",q:"通知情報はどこから操作？",o:["契約書","HOME","組織・ユーザー","注文書・請書"],a:"B",ex:"全体横断情報なのでHOMEに配置。"},
{id:8,cat:"二段階認証",type:"c",q:"二段階認証はどこから開く？",o:["物件作成・更新","見積関連","HOME","ストレージ"],a:"C",ex:"アカウント全体の管理なのでHOMEです。"},
{id:9,cat:"二段階認証",type:"c",q:"二段階認証の操作は？",o:["事前設定パスワードを入力","取引先コードを入力","物件名を入力","ワンタイムパスワード"],a:"A",ex:"建設PADでは事前設定した二段階パスワードで認証します。"},
{id:10,cat:"二段階認証",type:"c",q:"パスワードを忘れた場合は？",o:["アカウント削除","パスワードを忘れた方はこちら","取引先を招待","PDFで確認"],a:"B",ex:"リカバリー導線は標準UI設計です。"},
{id:11,cat:"取引先招待",type:"c",q:"取引先招待で何が可能になる？",o:["自動入金","自動請求","自動施工","電子取引"],a:"D",ex:"招待の目的は電子書面のやり取りです。"},
{id:12,cat:"取引先招待",type:"c",q:"招待メール送信画面はどこ？",o:["取引先管理→招待する","契約・注文書→契約書","請求関連→一般通知書","見積関連→見積り依頼"],a:"A",ex:"関係構築フェーズなので取引先管理メニューです。"},
{id:13,cat:"取引先招待",type:"c",q:"招待先メールアドレスについて正しいのは？",o:["後から変更できる","招待メールが送られる","会社住所として使われる","CSV出力先になる"],a:"B",ex:"入力＝送信先指定です。"},
{id:14,cat:"取引先招待",type:"c",q:"取引先側でメールアドレス変更は？",o:["できない","できる","管理者だけできる","月1回できる"],a:"A",ex:"セキュリティ上、変更不可です。"},
{id:15,cat:"取引先招待",type:"c",q:"メールアドレス変更が必要な場合は？",o:["CSV出力から申請","取引先がプロフィール編集","サポートセンターに依頼","物件をクローズ"],a:"C",ex:"中央管理（サポートセンター）が妥当です。"},

{id:11,sec:"ストラテジ",cat:"ワークフロー",type:"c",q:"OUKAGAIのようなワークフローシステムを導入する主な狙いとして最も適切なのはどれか。",o:["稟議のプロセスを属人化すること","稟議・決裁の経路を標準化し、承認状況を可視化すること","稟議の証跡を残さないこと","稟議書をすべて紙と電子で両立する"],a:"B",ex:"稟議経路を標準化し「誰のところで止まっているか」まで可視化。属人化・紙台帳からの卒業。"},
{id:12,sec:"ストラテジ",cat:"AI・機械学習",type:"c",q:"機械学習（Machine Learning）の説明として最も適切なのはどれか。",o:["人がすべてのルールをプログラムに書き込む方式","データからパターンを学習し、予測や分類を行う方式","OSの更新機能の一種","ネットワーク帯域を自動調整する仕組み"],a:"B",ex:"データからパターンを学ぶ。ルールをすべて人が書くif文の山とは別物。"},
{id:13,sec:"ストラテジ",cat:"AI・機械学習",type:"c",q:"生成AI（Generative AI）の典型的な活用例として最も適切なのはどれか。",o:["コンクリートの配合設計計算のみ","既存のメールを自動で削除する","工事写真から説明文（キャプション）を自動生成する","現場のモルタルを自動で練る"],a:"C",ex:"テキスト・画像など「新しいコンテンツを生む」のが生成AI。工事写真→キャプション自動生成が好例。"},
{id:14,sec:"ストラテジ",cat:"AI・機械学習",type:"c",q:"AI導入時に考慮すべき「バイアス」の説明として最も適切なのはどれか。",o:["OSのバージョン差","学習データの偏りにより、不公平な結果が出てしまうこと","ネットワークの遅延","CPUクロックのばらつき"],a:"B",ex:"偏ったデータで学習すると不公平な判断が出る。「AIだから公平」は危険な思い込み。"},
{id:15,sec:"ストラテジ",cat:"AI倫理",type:"c",q:"「人間中心のAI」の考え方として最も適切なのはどれか。",o:["AIが人間の判断をすべて置き換えるべき","人間はAIに完全に従うべき","AIの設計・利用は、人間の尊厳・権利を尊重して行うべき","AIは倫理とは無関係でよい"],a:"C",ex:"AIはツール。主役は人。人権・尊厳・説明責任などを尊重して設計・運用する思想。"},
{id:16,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"個人情報保護法において「個人情報」に該当するものはどれか。",o:["工事名だけ","施工場所だけ","氏名と住所の組み合わせ","鉄筋の径"],a:"C",ex:"「個人を識別できる情報の組み合わせ」が個人情報。氏名＋住所はその典型。"},
{id:17,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"電子帳簿保存法に対応したシステム運用として適切なのはどれか。",o:["取引データをPDFにして保存するが、検索機能は持たない","取引データを削除してもバックアップは取らない","日付や金額などで検索できる形で電磁的記録を保存する","電子データは毎年プリントアウトして保存する"],a:"C",ex:"日付・金額・相手先で検索できる形の保存が要件の一つ。紙に戻せばOKではない。"},
{id:18,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"マイナンバーを取り扱う事業者に求められる対応として最も適切なのはどれか。",o:["社内の誰でも閲覧可能にする","メールで自由に送付する","利用目的を限定し、安全管理措置を講じる","紙に印刷して机の上に置いておく"],a:"C",ex:"利用目的の限定＋アクセス制御・保管・廃棄などの安全管理措置が必要。"},
{id:19,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"著作権侵害に該当する行為はどれか。",o:["フリー素材サイトの利用規約を守って画像を使う","自社で撮影した写真を自社資料に使う","他人が作成した有料CADデータを、許可なく配布する","パブリックドメインの資料を利用する"],a:"C",ex:"他人の有料CADデータを無断配布は著作権侵害。フリー素材・パブリックドメインは条件を守ればOK。"},
{id:20,sec:"ストラテジ",cat:"情報セキュリティ",type:"c",q:"情報セキュリティの3要素「CIA」のうち、C（Confidentiality）が意味するものはどれか。",o:["完全性","可用性","機密性","継続性"],a:"C",ex:"CIA：C(機密性)＝見ていい人だけが見られる、I(完全性)＝改ざんなし、A(可用性)＝必要なときに使える。"},
{id:21,sec:"ストラテジ",cat:"BCP・リスク管理",type:"c",q:"BCP（事業継続計画）の説明として最も適切なのはどれか。",o:["新規事業を立ち上げる計画","災害・障害時にも重要業務を継続または早期復旧するための計画","コスト削減のための計画","人員削減計画"],a:"B",ex:"BCP＝事業継続計画。災害・障害等でも重要業務を止めない・早期回復するための準備。"},
{id:22,sec:"ストラテジ",cat:"BCP・リスク管理",type:"c",q:"建設会社でBCPを考える際に、ITシステムに関して重要な観点はどれか。",o:["図面フォーマットの統一","社内LANの配線色","クラウドサービスやバックアップを活用したデータの冗長化","PCの色を揃えること"],a:"C",ex:"クラウド・バックアップ・冗長構成でデータとシステムを守る設計が最重要。"},
{id:23,sec:"ストラテジ",cat:"ITガバナンス",type:"c",q:"ITガバナンスの目的として最も適切なのはどれか。",o:["IT投資を現場に任せる","組織全体としてIT活用を経営目標に沿って最適化・統制すること","ITを使わない文化を守ること","IT部門だけが意思決定すること"],a:"B",ex:"IT活用を経営戦略と整合させ、組織全体でコントロールすること。野良SaaS乱立の逆。"},
{id:24,sec:"ストラテジ",cat:"経営指標",type:"c",q:"KPI（重要業績評価指標）の説明として最も適切なのはどれか。",o:["経営理念そのもの","最終的なゴール（KGI）","KGI達成に向けて進捗を測るための中間指標","社員の年齢"],a:"C",ex:"KGI＝最終ゴール、KPI＝そこへの途中の進捗指標。例：KGI「電子契約率80%」→KPI「今月の電子契約件数」。"},
{id:25,sec:"ストラテジ",cat:"建設DX",type:"c",q:"建設PADの導入効果を測るKPIとして適切なのはどれか。",o:["現場の騒音レベル","FAX送受信枚数の減少","人員の削減数","営業車のガソリン代"],a:"B",ex:"FAX枚数の減少で電子化の進捗が数字で見える。騒音・ガソリン代・人員数は直接的なDX進捗指標にならない。"},
{id:26,sec:"ストラテジ",cat:"ビジネスモデル",type:"c",q:"新規ITサービスのビジネスモデルとして「プラットフォーム型」に該当するものはどれか。",o:["ユーザー同士をマッチングし、取引の場を提供する","物販のみ行う","受託開発のみ行う","営業を行わない"],a:"A",ex:"Uberやマッチングサービスのように「場を提供して両者をつなぐ」のがプラットフォーム型。"},
{id:27,sec:"ストラテジ",cat:"ソフトウェア",type:"c",q:"OSS（オープンソースソフトウェア）の特徴として最も適切なのはどれか。",o:["ソースコードが公開され、ライセンスに従えば改変・再配布可能","必ず無料で、ライセンスも不要","商用利用は禁止されている","ソースコードは非公開"],a:"A",ex:"ソースコード公開＋ライセンス条件を守れば改変・再配布OK。「完全無料・権利ゼロ」ではない。"},
{id:28,sec:"ストラテジ",cat:"建設FDE",type:"c",q:"「デジタルデバイド」解消に向けた建設FDEの役割として最も適切なのはどれか。",o:["ITが苦手な社員を放置する","現場や事務社員に寄り添って、ツール導入や教育を支援する","システム部門だけで完結する","「分からない人が悪い」と伝える"],a:"B",ex:"現場に寄り添うインストラクター＋設計者がFDE。切り捨ては逆効果。"},
{id:29,sec:"ストラテジ",cat:"ITパスポート",type:"c",q:"ITパスポート試験の合格イメージとして最も適切なのはどれか。",o:["プロのプログラマーとして即戦力","企業活動全般で通用するITの基礎リテラシーを持っている","サーバ構築の専門家","ネットワーク設計の専門家"],a:"B",ex:"「会社でITの会話についていける基礎リテラシー」レベル。エンジニアのスペシャリストではなくIT教養。"},
{id:30,sec:"ストラテジ",cat:"建設FDE",type:"c",q:"KENZOの建設FDEに特に求められるスタンスとして最も適切なのはどれか。",o:["コードだけ書ければよく、現場理解は不要","建設業の業務を理解しつつ、ITと現場の橋渡し役を担う","ITツールの批判だけする","ベンダー任せでよい"],a:"B",ex:"建設業務を分からずITだけでは役立たない。業務×ITの橋渡しこそFDEの仕事。"},
{id:31,sec:"ストラテジ",cat:"ビジネス思考",type:"c",q:"「プロダクトアウト」の説明として適切なのはどれか。",o:["市場ニーズから発想して商品開発する","技術起点で作りたいものを作り、市場に出す","顧客の声を聞かない","原価だけを見て設計する"],a:"B",ex:"「うちの技術でこれ作れるから売ろう」がプロダクトアウト。マーケットインはその逆。"},
{id:32,sec:"ストラテジ",cat:"ビジネス思考",type:"c",q:"「マーケットイン」の説明として適切なのはどれか。",o:["技術的に面白いものを優先する","社内事情だけで決める","顧客のニーズから逆算して商品・サービスを設計する","原価を最小にすることだけ考える"],a:"C",ex:"「顧客の困りごとから逆算してサービス設計」。DX文脈ではマーケットインが推奨されがち。"},
{id:33,sec:"ストラテジ",cat:"ITパスポート",type:"c",q:"ITパスポート試験で「テクノロジ系」に分類される内容はどれか。",o:["経営戦略","会計","情報セキュリティ・ネットワーク・データベース","会社法"],a:"C",ex:"情報セキュリティ・ネットワーク・DB・ハード・ソフトなどの「技術要素」がテクノロジ系。"},
{id:34,sec:"ストラテジ",cat:"AI・DX",type:"c",q:"AIチャットボットを社内問い合わせ対応に導入する主なメリットとして最も適切なのはどれか。",o:["問い合わせ履歴が一切残らなくなる","深夜や休日でも基本的な質問に対応できる","人事評価が不要になる","社員数を必ず減らせる"],a:"B",ex:"24時間365日よくある質問を捌いてくれるのが強み。人をゼロにするわけではない。"},
{id:35,sec:"ストラテジ",cat:"DX推進",type:"c",q:"建設会社のDX推進において、最も避けるべき状態はどれか。",o:["現場の課題をヒアリングしてツール導入を検討する","形だけシステムを入れて、誰も使っていない","パイロット導入から始める","小さな成功例を社内で共有する"],a:"B",ex:"「システムだけ入れて誰も使わない」が最もよくある失敗。小さな成功を積み上げるのが王道。"},
// マネジメント Q36-55
{id:36,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"プロジェクトマネジメントで「スコープ」とは何を指すか。",o:["プロジェクトメンバーの人数","プロジェクトの予算","プロジェクトで実施する作業の範囲","会議の回数"],a:"C",ex:"スコープ＝「どこからどこまでやるか」の範囲。ここがブレると工期・コスト双方に影響する。"},
{id:37,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"WBS（Work Breakdown Structure）の目的として最も適切なのはどれか。",o:["作業を大きくまとめる","作業を階層的に分解し、抜け漏れをなくす","責任者を一人に集中させる","仕様変更を容易にする"],a:"B",ex:"大きな仕事を「木の枝」のように分解し、抜け漏れを減らす技法。"},
{id:38,sec:"マネジメント",cat:"開発手法",type:"c",q:"ウォーターフォール型開発の特徴として最も適切なのはどれか。",o:["仕様変更を前提に、小さく繰り返す","要件定義→設計→実装→テストの順に上から下へ進む","ドキュメントはほとんど作成しない","リリースを毎日行う"],a:"B",ex:"要件→設計→実装→テストを「流れ落ちる」ように進める。後戻りコストが高いのが特徴。"},
{id:39,sec:"マネジメント",cat:"開発手法",type:"c",q:"アジャイル開発の特徴として最も適切なのはどれか。",o:["一度決めた仕様は変更しない","小さく作って動かし、フィードバックを得ながら改善を繰り返す","ウォーターフォールよりもテストが不要","顧客とのコミュニケーションを減らす"],a:"B",ex:"小さく作ってユーザーに見せてフィードバックしながら回す。「完璧に決めてから作る」の逆。"},
{id:40,sec:"マネジメント",cat:"開発・運用",type:"c",q:"DevOpsの考え方として最も適切なのはどれか。",o:["開発と運用を分断する","開発と運用が連携し、継続的な改善・自動化を行う","運用部門を廃止する","テストを省略する"],a:"B",ex:"Dev(開発)とOps(運用)が一体となって自動化・継続改善する。「作って投げる」文化からの卒業。"},
{id:41,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"ITサービスマネジメントにおいて「インシデント管理」が扱うのはどれか。",o:["新機能の企画","システム障害やサービス中断への対処","販促キャンペーンの計画","中期経営計画"],a:"B",ex:"実際に起きた障害に対処するプロセス。問題管理は根本原因を潰すほう。"},
{id:42,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"変更管理の目的として最も適切なのはどれか。",o:["変更を口頭で素早く行う","影響評価や承認を行い、無秩序な変更を防ぐ","記録を残さない","現場の判断で勝手に変更させる"],a:"B",ex:"テストや承認なしに本番を変えると事故るので、変更を統制するためのプロセス。"},
{id:43,sec:"マネジメント",cat:"テスト・移行",type:"c",q:"システム移行プロジェクトにおいて特に重要なテストはどれか。",o:["画面の色味テスト","データ移行テスト","インストール時間テスト","キーボード入力テスト"],a:"B",ex:"正しくデータが移っているか（件数・項目・値）を検証しないと、後で地獄を見る。"},
{id:44,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"SLA（サービスレベル合意）で定義される内容として最も適切なのはどれか。",o:["社員の給与水準","取締役の人数","稼働率・応答時間などサービス品質の目標値","株主構成"],a:"C",ex:"稼働率・応答時間・復旧目標時間(RTO)など「どのレベルのサービスか」の約束。"},
{id:45,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"プロジェクトのクリティカルパスとは何を意味するか。",o:["最も費用が高いタスクの集合","並行して実行できるタスク群","遅れると全体の工期に直接影響するタスクの経路","管理しなくてよいタスクの集合"],a:"C",ex:"ここが遅れると工期全体が遅延する「肝」の経路。ここを守るために他を調整する。"},
{id:46,sec:"マネジメント",cat:"品質管理",type:"c",q:"品質保証活動として適切なのはどれか。",o:["本番でユーザに使わせてから直す","レビューやテストを通じて欠陥を早期に発見・是正する","不具合を隠す","品質をコストでしか判断しない"],a:"B",ex:"レビュー・テストで早めにバグを捕まえるのが基本。「本番でテスト」は冗談。"},
{id:47,sec:"マネジメント",cat:"テスト・移行",type:"c",q:"受入テスト（ユーザ受入テスト）の主な目的として最も適切なのはどれか。",o:["ベンダ側の都合で仕様を調整する","利用者側の観点で、要件通りに動作するか確認する","ネットワーク速度を測る","サーバ室の温度を測る"],a:"B",ex:"「ユーザー視点で要件通りか」を確認するフェーズ。ベンダ側単体の都合ではない。"},
{id:48,sec:"マネジメント",cat:"インフラ",type:"c",q:"ITサービスの可用性を高める手段として最も適切なのはどれか。",o:["単一サーバ構成にする","冗長構成（クラスタリング・多重化）をとる","バックアップを取らない","停止時間を記録しない"],a:"B",ex:"サーバを冗長化して、どれかが死んでも全体が止まらないようにする。"},
{id:49,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"障害対応における「初動」で最も優先すべきことはどれか。",o:["責任を追及する","影響範囲と重要度を把握し、関係者にエスカレーションする","障害を隠す","すぐに再起動だけを繰り返す"],a:"B",ex:"何がどこまで影響しているかを把握し、関係者に共有＆エスカレーション。原因追及はその後。"},
{id:50,sec:"マネジメント",cat:"ワークフロー",type:"c",q:"OUKAGAIでの稟議フロー変更をプロジェクトとして実施する場合に、最も重要なポイントはどれか。",o:["一部の人だけに仕様を説明する","現場ユーザーの業務をヒアリングし、承認経路・権限を整理する","とりあえず現在の紙の流れをそのまま画面化する","システム部門だけで決める"],a:"B",ex:"紙の流れを鵜呑みにせず、現場・総務・経理などからヒアリングして「あるべき承認経路」を整理する。"},
{id:51,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"ITサービスマネジメントにおける「問題管理」の役割はどれか。",o:["個別障害への即時対応","障害の根本原因分析と再発防止策の検討","新規機能の企画","利用料金の請求"],a:"B",ex:"同じ障害を繰り返さないよう「なぜ？」を深掘りして恒久対策を打つプロセス。"},
{id:52,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"プロジェクトで「スコープ・クリープ」が発生している状態として最も適切なのはどれか。",o:["当初合意していない要件が次々と追加されていく","当初計画どおりに進んでいる","予算が余っている","工期が短縮されている"],a:"A",ex:"「ついでにこれも」と合意していない要件が肥大していく状態。早期に変更管理プロセスを使う。"},
{id:53,sec:"マネジメント",cat:"建設FDE",type:"c",q:"IT人材育成の観点から、建設FDE研修でやるべきこととして最も適切なのはどれか。",o:["現場には行かず、座学だけ行う","建設業の業務理解と、IT基礎（クラウド・セキュリティ・AIなど）をセットで学ぶ","ツールの操作だけを覚える","プログラミング言語だけ学ぶ"],a:"B",ex:"業務理解＋IT基礎をセットで学ぶことで、現場と話ができる人材になる。"},
{id:54,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"SLAの「稼働率99.9%」のおおよその年間停止許容時間として最も近いものはどれか。",o:["約87.6時間","約8.8時間","約1時間","約0.1時間"],a:"B",ex:"1年≒8760時間 → 0.1%≒8.76時間。だいたい「9時間弱」がSLA 99.9%の意味。"},

// ========== 建設PAD検定 1級 ケーススタディ問題1 ==========
const CASE1_SCENARIO=`宮崎県内の中堅ゼネコンA社は、請求書のデジタル化を検討している。地域では燈 Digital Billderの導入が進んでおり、同社にも導入圧力がある。一方で、建設PADも提案されている。

A社の現状：
・月間請求書：250件
・見積・発注・請求はバラバラに管理
・協力会社：約120社
・DX専任人材なし

const PAD4_Q=[{"id":1,"cat":"基本操作","type":"c","q":"作業開始直後に最初に確認すべきことはどれか。","o":["前回開いていた一覧画面の検索条件をそのまま使い、表示された先頭行から処理する。","通知件数を見てから、対象書類の種類を決めずに未処理の操作へ進む。","取引先名を先に確認し、対象物件や書類種別は詳細画面で照合する。","メニューを開く前に、保存済みデータの有無を優先して確認する。","自分が処理する業務が見積・注文・請求のどの段階かを整理して入口を選ぶ。"],"a":"E"},{"id":2,"cat":"基本操作","type":"c","q":"Homeを開いたあと、次の操作へ進む判断として最も適切なものはどれか。","o":["未読件数が多いメニューから順に開き、対象書類は表示後に決める。","直近で使ったメニューを開き、同じ取引先の書類があれば処理を続ける。","処理目的に合わせて、見積・注文・請求など該当する入口を選ぶ。","一覧画面を開く前に、すべての設定メニューを確認する。","検索欄に取引先名を入れて、表示された書類種別に合わせて作業を決める。"],"a":"C"},{"id":3,"cat":"物件・工事管理","type":"c","q":"物件・工事を新規登録する前に確認すべきことはどれか。","o":["同じ物件・工事件名が既に登録されていないか、紐づきも含めて確認する。","請求書の明細を先に入力し、物件名は送信直前に合わせる。","見積依頼を作成してから、必要に応じて物件情報を後から探す。","注文書番号が発行されてから、物件登録の要否を判断する。","支払通知書の対象請求が決まってから、物件名を登録する。"],"a":"A"},{"id":4,"cat":"見積管理","type":"c","q":"見積依頼を作成する時、送信前に必須項目としてまず揃えるべき組み合わせはどれか。","o":["物件・工事、依頼先業者、工種、工事概要、見積要領、添付資料の有無。","物件・工事、依頼先業者、工種、見積返信期限、工事着手及び完成時期、依頼内容。","物件・工事、依頼先業者、見積番号、見積単価、数量、呼称。","依頼先業者、工種、見積返信期限、見積要領、添付資料、依頼一覧の表示条件。","物件・工事、工事概要、見積要領、添付資料、PDF確認、保存先一覧。"],"a":"D"},{"id":5,"cat":"見積管理","type":"c","q":"見積依頼で依頼先業者を選ぶ時の理解として正しいものはどれか。","o":["依頼先を複数選べるが、送信後は最初に回答した業者のみが依頼一覧に残る。","複数業者を選択できるため、送信前に選択した全業者が依頼対象として正しいか確認する。","依頼先を複数選べるが、同じ工種では1社ずつ依頼を作り分ける必要がある。","依頼先は物件に参加している取引先から選ぶが、送信時点では選択内容を確認を後回しにする。","依頼先は見積要領の本文に会社名を記載すると、一覧側にも自動で反映される。"],"a":"B"},{"id":6,"cat":"見積管理","type":"c","q":"見積依頼で複数業者を選択して送信する場合、送信後に一覧で確認すべきことはどれか。","o":["依頼先ごとの工事概要が18文字以内に自動調整されているか。","依頼先ごとに見積要領の本文が別々に編集済みか。","依頼先ごとに添付資料の閲覧可否が承認済み表示になっているか。","依頼先ごとに保存済み下書きが送信済みに変換されているか。","依頼先ごとの提出状況、返信期限、ステータス、見積金額が確認できるか。"],"a":"E"},{"id":7,"cat":"見積管理","type":"c","q":"見積依頼の「保存」と「送信」の違いとして正しいものはどれか。","o":["保存は入力内容を保持し、PDFで確認すると依頼先へ通知される操作である。","保存は依頼先へ通知し、送信は依頼一覧でステータスを更新するための操作である。","保存は入力内容を保持する操作、送信は依頼先業者へ見積依頼を渡す操作である。","保存は添付資料を登録し、送信は見積要領のみを相手に渡す操作である。","保存は物件選択を確定し、送信は依頼先選択を確定する操作である。"],"a":"C"},{"id":8,"cat":"注文管理","type":"c","q":"注文書を下書き保存した段階の理解として正しいものはどれか。","o":["下書きは入力内容を保持する状態であり、相手先への正式な送信や承認完了とは分けて考える。","下書き保存後は協力会社側で承認待ちとして扱われ、請求作成も可能になる。","下書き保存後は注文書PDFが確定し、発注金額の修正は請求側で行う。","下書き保存後は見積依頼のステータスも提出済みに変わり、返信期限は無効になる。","下書き保存後は支払い通知書の対象として選択できるため、請求承認を省ける。"],"a":"A"},{"id":9,"cat":"注文管理","type":"c","q":"注文書作成時にワークフローを使う場合、先に確認すべきことはどれか。","o":["請求書の支払期限が入力されているかを確認し、期限があれば承認申請へ進む。","見積依頼の返信期限を確認し、期限内であれば承認者の確認を省いて申請する。","相殺金額の有無を確認し、相殺がなければワークフローを使わず送信する。","承認経路、承認者、申請対象の注文内容、金額が正しいか確認する。","支払い通知書の作成権限を確認し、権限があれば注文書の申請も完了とする。"],"a":"D"},{"id":10,"cat":"注文管理","type":"c","q":"ワークフロー無しで注文書を扱う場合に注意すべきことはどれか。","o":["承認経路がないため、注文内容は作成者確認で完了したものとして扱う。","社内承認の画面遷移がない分、送信前に物件、取引先、金額、条件を自分で慎重に確認する。","ワークフローがない注文書は協力会社側に表示されないため、請求対象にもならない。","ワークフローがない注文書は見積依頼と紐づかないため、発注金額を請求側で調整する。","ワークフローがない場合は、注文書ではなく支払い通知書から発注内容を確定する。"],"a":"B"},{"id":11,"cat":"注文管理","type":"c","q":"協力会社側で注文書を確認するとき、最初に見るべき状態はどれか。","o":["請求一覧で支払済になっているかを確認し、支払済でなければ注文書を承認する。","見積依頼の期限が残っているかを確認し、期限内であれば注文内容も承認する。","支払い通知書の有無を確認し、通知があれば注文書も承認済みとして扱う。","注文書の詳細PDFが開けるかを確認し、開ければ内容確認前に閉じる。","承認待ち、承認済、修正依頼、否決、キャンセルなど現在のステータスを確認する。"],"a":"E"},{"id":12,"cat":"注文管理","type":"c","q":"協力会社側で注文書に修正依頼を出す場面として適切なものはどれか。","o":["注文書の内容は合っているが、請求書の振込先を後で変更したいとき。","支払い通知書の支払期限を変更したいが、注文内容には問題がないとき。","発注金額、工事内容、条件、対象物件などに確認・修正が必要なとき。","見積依頼の返信期限を延ばしたいが、発注内容には問題がないとき。","支払条件のみを後で見直したいが、注文内容には問題がないとき。"],"a":"C"},{"id":13,"cat":"請求管理","type":"c","q":"出来高請求書を作成する前提として最も重要なものはどれか。","o":["対象となる注文書が存在し、請求可能な承認状態になっていること。","一般請求書が保存済みで、同じ請求年月が入力されていること。","見積依頼が未提出のまま残っており、返信期限内であること。","支払い通知書が先に作成され、支払予定額が確定していること。","対象物件に取引先が参加しており、請求書番号の採番候補が残っていること。"],"a":"A"},{"id":14,"cat":"物件・工事管理","type":"c","q":"出来高請求で対象物件が表示されない場合、最初に切り分けるべきことはどれか。","o":["請求書の銀行口座が登録されているかを確認し、未登録なら物件を再登録する。","支払い通知書が作成済みかを確認し、未作成なら通知書を先に作る。","注文書の詳細PDFが開けるかを確認し、開ければ承認済みとして扱う。","請求可能な注文書が存在するか、注文書が承認済みか、過去請求が止まっていないかを確認する。","見積依頼の添付資料があるかを確認し、添付があれば出来高請求へ進む。"],"a":"D"},{"id":15,"cat":"請求管理","type":"c","q":"一般請求書を作成するとき、送信前に必ず確認すべき組み合わせはどれか。","o":["見積依頼の返信期限、注文書の承認日、支払い通知書の通知日。","宛先・対象工事・請求日・締め日・請求年月・支払期限・明細・振込先・添付。","支払い通知書の通知日、承認者、ワークフロー名、検索条件。","注文書PDFの表示有無、ホーム画面の通知件数、ログアウト履歴。","見積一覧の提出状況、注文一覧の操作ボタン、支払済の件数。"],"a":"B"},{"id":16,"cat":"請求管理","type":"c","q":"一般請求書で取引先を変更するときに注意すべきことはどれか。","o":["取引先を変更しても明細や宛先は必ず維持されるため、PDF確認のみでよい。","取引先変更後は注文書の承認状態も自動で確定するため、請求作成へ進める。","取引先変更は支払い通知書のみに影響し、一般請求書の入力内容には関係しない。","取引先変更後は相殺請求書の金額が優先されるため、明細確認は後で行う。","入力済み内容が変わる可能性があるため、宛先、明細、金額、添付を再確認する。"],"a":"E"},{"id":17,"cat":"支払管理","type":"c","q":"「支払通知書より引用」を使う判断として適切なものはどれか。","o":["見積依頼の内容を一般請求書へ転記したいとき。","注文書の承認者を請求書の送付先として使いたいとき。","支払通知書の内容をもとに請求書へ反映したいとき。","見積依頼の特記内容を注文書の条項へ転記したいとき。","ホーム画面の通知内容を請求明細に入れたいとき。"],"a":"C"},{"id":18,"cat":"ファイル・添付","type":"c","q":"PDFで確認する操作の目的として正しいものはどれか。","o":["送信前に帳票としての見え方、宛先、金額、明細、添付漏れを確認するため。","PDFを開いた時点で相手先への送信も完了するため。","PDFを表示すると請求書の承認状態が自動で承認済みに変わるため。","PDFを表示すれば、振込先や明細は帳票側で自動補正されるため。","PDFは支払い通知書のみに使う確認で、一般請求書では使わないため。"],"a":"A"},{"id":19,"cat":"建設PAD操作","type":"c","q":"保存する操作と先方へ送信する操作の違いとして正しいものはどれか。","o":["保存すると相手先へ通知され、送信は社内メモとして残す操作である。","保存は入力途中の保持で、送信は相手先の一覧に表示させる操作である。","送信はPDF表示の別名であり、相手先への共有状態には影響しない。","保存は入力内容を保持する操作、送信は相手先へ書類を渡す操作である。","保存は承認済みにする操作、送信は支払済みにする操作である。"],"a":"D"},{"id":20,"cat":"請求管理","type":"c","q":"請求一覧で対象請求を探すとき、最初に使うべき確認軸はどれか。","o":["対象物件の選択状態、一覧の検索条件、表示中ステータス。","取引先、物件・工事名、請求年月、支払期限、ステータス、金額。","見積依頼の返信期限、添付資料名、工種の表示順。","注文書のワークフロー名、承認者の人数、申請コメント。","支払い通知書の作成ボタン、相殺請求書の表示位置、PDFの開閉状態。"],"a":"B"},{"id":21,"cat":"請求管理","type":"c","q":"請求一覧で対象請求が見つからない場合の切り分けとして適切なものはどれか。","o":["対象請求がないと判断し、すぐ新しい請求書を作成する。","支払い通知書を先に作成し、通知書側から請求を探す。","相殺請求書一覧を優先し、元請求の確認を後回しにする。","注文書のPDFのみを確認し、請求一覧の検索条件は変更しない。","検索条件・取引先・物件・請求年月・ステータス・権限を順に確認する。"],"a":"E"},{"id":22,"cat":"支払管理","type":"c","q":"支払い通知書を作成する前に確認すべきことはどれか。","o":["見積依頼の提出状況と返信期限のみを確認する。","注文書の下書き保存日時とワークフロー名のみを確認する。","対象請求書、請求金額、支払条件、支払期限、承認状態が合っているか確認する。","相殺請求書の理由欄を優先し、元の請求書の詳細確認を後回しにする。","ホーム画面の通知件数を確認し、件数があれば通知書を作成する。"],"a":"C"},{"id":23,"cat":"請求管理","type":"c","q":"相殺請求書を作成するとき、最も重要な確認はどれか。","o":["どの請求に対して、いくらを、どの理由で控除・相殺するのかが説明できること。","見積依頼の返信期限が切れているかどうかを確認すること。","注文書の下書きが残っているかどうかを確認すること。","PDFで表示できるかのみを確認し、相殺理由は後から補足すること。","支払い通知書の作成者が誰かを確認し、金額確認は一覧で済ませること。"],"a":"A"},{"id":24,"cat":"請求管理","type":"c","q":"協力会社側で一般請求書を作成する場合、最初に選ぶべきものはどれか。","o":["支払い通知書の作成者。","注文書の承認者。","問い合わせコメントの要点。","書類を送信・表示する取引先。","ホーム画面の通知種別。"],"a":"D"},{"id":25,"cat":"請求管理","type":"c","q":"請求書の明細行を追加する目的として適切なものはどれか。","o":["支払い通知書の承認経路を増やすため。","作業内容・数量・単価・税率を行ごとに分けて表すため。","見積依頼の返信先を増やすため。","注文書の承認者を複数にするため。","問い合わせコメントを分類するため。"],"a":"B"},{"id":26,"cat":"建設PAD操作","type":"c","q":"インボイス番号を確認する目的として適切なものはどれか。","o":["注文書の承認ステータスを承認済みにするため。","見積依頼の提出期限を自動で延長するため。","支払い通知書の支払期限を入力するため。","請求書の備考欄を固定するため。","適格請求書に必要な登録番号を請求書上で示すため。"],"a":"E"},{"id":27,"cat":"請求管理","type":"c","q":"請求書を送信する前にPDFで違和感を見つけた場合の対応として正しいものはどれか。","o":["PDF表示ができているため、そのまま先方へ送信する。","送信後に相手先へ修正依頼を出してもらう前提で進める。","入力画面に戻って原因箇所を修正し、再度PDFで確認してから送信する。","請求一覧でステータスのみ確認し、明細の見え方は処理対象から外す。","支払い通知書を先に作成し、PDFの違和感は通知書側で補正する。"],"a":"C"},{"id":28,"cat":"承認・ワークフロー","type":"c","q":"承認待ちの書類を処理するとき、最初に確認すべきことはどれか。","o":["対象書類・物件・取引先・金額が自分の承認対象と合っているか。","請求一覧の支払済件数が増えているか。","見積依頼の返信期限が過ぎているか。","PDFで開ける書類が何件あるか。","問い合わせ入力ボタンが表示されているか。"],"a":"A"},{"id":29,"cat":"建設PAD操作","type":"c","q":"差し戻しを受けた書類を修正する時の進め方として適切なものはどれか。","o":["差し戻し理由を見ずに、同じ内容で再送信する。","対象書類を削除し、新規作成すれば差し戻し履歴を確認しなくてよい。","請求一覧の検索条件を変え、表示された別書類で処理を続ける。","差し戻し理由を確認・修正し、内容とPDFを確認してから再申請する。","問い合わせを選び、差し戻し理由に近い確認内容を入力する。"],"a":"D"},{"id":30,"cat":"建設PAD操作","type":"c","q":"作業終了時にログアウトする理由として最も適切なものはどれか。","o":["ログアウトすると未送信の書類が自動で相手先へ送信されるため。","共用端末や離席時に、別の人が自分のアカウントで操作する事故を防ぐため。","ログアウトすると承認待ちの書類が一括承認されるため。","ログアウトすると請求一覧の検索条件が全社共通で保存されるため。","ログアウトすると差し戻し理由が自動で取引先へ通知されるため。"],"a":"B"},{"id":31,"cat":"基本操作","type":"c","q":"Homeを開く主な目的はどれか。","o":["作業後にアカウント操作を終了し、共用端末での誤操作を防ぐ場面。","不明点がある時に操作手順を確認し、次の画面へ進む材料を得る場面。","画面遷移前に、現在扱っている書類種別と対象工事を確認する場面。","一覧、作成、詳細のどこで確認すべき内容か切り分ける場面。","ログイン後の起点として、主要な状況や各機能への入口を確認するため。"],"a":"E"},{"id":32,"cat":"基本操作","type":"c","q":"契約書メニューを使う場面として最も適切なものはどれか。","o":["メニュー名ではなく、処理したい書類と状態から入口を選ぶ場面。","ログイン後に主要機能への入口と現在の処理状況を確認する場面。","契約に関する書類を確認・管理したいとき。","メニューから見積、注文、請求のどの業務入口へ進むか判断する場面。","作業後にアカウント操作を終了し、共用端末での誤操作を防ぐ場面。"],"a":"C"},{"id":33,"cat":"基本操作","type":"c","q":"見積依頼関連メニューで最初に判断すべきことはどれか。","o":["新しく依頼を作るのか、既存依頼の提出状況を見るのか、提出済み見積を確認するのか。","支払い通知書を作るのか、相殺請求書を作るのか、請求一覧を絞るのか。","注文書を承認するのか、請書PDFを確認するのか、出来高請求へ進むのか。","ログアウトするのか、権限設定を変えるのか、ユーザーを追加するのか。","請求明細を増やすのか、振込先を変えるのか、インボイス番号を入力するのか。"],"a":"A"},{"id":34,"cat":"基本操作","type":"c","q":"注文書・請書メニューを使う場面として最も適切なものはどれか。","o":["発注金額や注文条件を確定させ、相手先の確認状態を追う場面。","注文書の送信前に、見積内容との整合と承認経路を確認する場面。","協力会社側で注文内容を確認し、承認または修正依頼を判断する場面。","注文書や注文請書の状態、PDF、添付、承認状況を確認したいとき。","注文書が請求の前提になるため、承認状態と対象工事を確認する場面。"],"a":"D"},{"id":35,"cat":"基本操作","type":"c","q":"請求関連メニューを使う場面として最も適切なものはどれか。","o":["前回までの出来高と今回請求分を合わせて、累計金額を確認する場面。","一般請求、出来高請求、支払通知、請求一覧など請求処理を行いたいとき。","注文書と請求履歴をセットで見て、請求可能な対象を選ぶ場面。","承認済み注文書を前提に、進捗率や今回請求額を入力する場面。","過去請求の承認状態、累計率、端数を確認してから作成する場面。"],"a":"B"},{"id":36,"cat":"建設PAD操作","type":"c","q":"ストレージを使う目的として最も適切なものはどれか。","o":["書類作成から相手先確認までを画面上で追跡し、後続処理を判断する。","工事別に見積・注文・請求を整理し、担当者が状態を確認しやすくする。","紙書類の作成負担を下げつつ、承認や請求の確認漏れを減らす。","見積依頼と注文書発行を中心に整備し、請求は後続確認として扱う。","書類やファイルを保管・参照し、後から探せるようにするため。"],"a":"E"},{"id":37,"cat":"建設PAD操作","type":"c","q":"組織・ユーザーを使う目的として最も適切なものはどれか。","o":["電子帳票の保管と検索を主軸にし、送信後の状態確認も行う。","書類作成から相手先確認までを画面上で追跡し、後続処理を判断する。","利用者や組織単位の設定・権限まわりを管理するため。","工事別に見積・注文・請求を整理し、担当者が状態を確認しやすくする。","紙書類の作成負担を下げつつ、承認や請求の確認漏れを減らす。"],"a":"C"},{"id":38,"cat":"協力会社管理","type":"c","q":"取引先管理を使う目的として最も適切なものはどれか。","o":["協力会社など取引先情報を登録・確認・管理するため。","見積依頼と注文書発行を中心に整備し、請求は後続確認として扱う。","工事ごとの帳票を電子保管し、承認状況は社内確認で補完する。","取引先への提出状況を一覧化し、金額確認は各書類の詳細で行う。","見積比較、発注、請求確認を同じ工事件名で追えるようにする。"],"a":"A"},{"id":39,"cat":"物件・工事管理","type":"c","q":"物件作成・更新を使う目的として最も適切なものはどれか。","o":["注文書の送信前に、見積内容との整合と承認経路を確認する場面。","協力会社側で注文内容を確認し、承認または修正依頼を判断する場面。","注文書が請求の前提になるため、承認状態と対象工事を確認する場面。","見積・注文・請求の対象になる工事や物件情報を登録・更新するため。","承認済みの注文内容をもとに、請求可能な状態か確認する場面。"],"a":"D"},{"id":40,"cat":"物件・工事管理","type":"c","q":"物件を選択する操作が重要な理由はどれか。","o":["承認済みの注文内容をもとに、請求可能な状態か確認する場面。","見積、注文、請求を正しい工事・物件に紐づけるため。","注文書と請書の内容、金額、取引先、対象工事を確認する場面。","下書き、承認待ち、承認済み、差し戻しの状態を見て次処理を決める場面。","発注金額や注文条件を確定させ、相手先の確認状態を追う場面。"],"a":"B"},{"id":41,"cat":"検索・一覧操作","type":"c","q":"書類検索を使う目的として最も適切なものはどれか。","o":["見積比較、発注、請求確認を同じ工事件名で追えるようにする。","電子帳票の保管と検索を主軸にし、送信後の状態確認も行う。","書類作成から相手先確認までを画面上で追跡し、後続処理を判断する。","工事別に見積・注文・請求を整理し、担当者が状態を確認しやすくする。","目的の書類を条件で探し、過去の書類や関連書類へたどり着くため。"],"a":"E"},{"id":42,"cat":"建設PAD操作","type":"c","q":"ヘルプセンターを見る場面として最も適切なものはどれか。","o":["画面遷移前に、現在扱っている書類種別と対象工事を確認する場面。","一覧、作成、詳細のどこで確認すべき内容か切り分ける場面。","操作手順や不明点を調べ、自己解決の材料を得たいとき。","メニュー名ではなく、処理したい書類と状態から入口を選ぶ場面。","ログイン後に主要機能への入口と現在の処理状況を確認する場面。"],"a":"C"},{"id":43,"cat":"建設PAD操作","type":"c","q":"ログアウトを行う目的として最も適切なものはどれか。","o":["共用端末や作業終了時に、自分のアカウント操作を終了するため。","メニューから見積、注文、請求のどの業務入口へ進むか判断する場面。","作業後にアカウント操作を終了し、共用端末での誤操作を防ぐ場面。","不明点がある時に操作手順を確認し、次の画面へ進む材料を得る場面。","画面遷移前に、現在扱っている書類種別と対象工事を確認する場面。"],"a":"A"},{"id":44,"cat":"建設PAD操作","type":"c","q":"見積り作成画面を使う場面として正しいものはどれか。","o":["提出済み見積の比較のみを行い、依頼先や期限は入力しない場面。","注文書の承認日を入力し、請求可能な注文に変える場面。","支払い通知書から請求書へ引用する場面。","物件・業者・工種・期限を入力し、協力会社へ見積依頼をする場面。","相殺理由と控除額を入力し、支払額を調整する場面。"],"a":"D"},{"id":45,"cat":"建設PAD操作","type":"c","q":"見積一覧を使う主な目的として正しいものはどれか。","o":["請求書の振込先、インボイス番号、税率、税込金額を確認するため。","依頼先の提出状況・返信期限・ステータス・見積金額を一覧で確認するため。","注文書の承認経路、承認者、請書PDF、発注金額を確定するため。","相殺金額、控除理由、支払通知書の通知日を確認するため。","ログイン履歴、権限設定、ユーザー追加状況を確認するため。"],"a":"B"},{"id":46,"cat":"請求管理","type":"c","q":"一般請求書を使う場面として最も適切なものはどれか。","o":["支払条件、支払期限、請求番号、請求日を整えて請求書を作る場面。","送信先を選ぶ際、取引先変更で入力内容が変わる可能性を確認する場面。","請求書として相手先に渡す前に、宛先、金額、振込先、添付を確認する場面。","請求根拠となる明細と資料を揃え、差し戻しを防ぐために確認する場面。","通常の請求書を作成し、明細・振込先・送付先を整えて送信するとき。"],"a":"E"},{"id":47,"cat":"請求管理","type":"c","q":"出来高請求書を使う場面として最も適切なものはどれか。","o":["対象注文が表示されない時に、注文書の状態や請求履歴を確認する場面。","工事の進捗に応じた複数回請求として扱い、100%超過を確認する場面。","注文書に基づき、工事の進捗や出来高に応じて請求するとき。","前回までの出来高と今回請求分を合わせて、累計金額を確認する場面。","注文書と請求履歴をセットで見て、請求可能な対象を選ぶ場面。"],"a":"C"},{"id":48,"cat":"支払管理","type":"c","q":"支払い通知書を使う場面として最も適切なものはどれか。","o":["請求に対する支払予定や支払内容を相手先へ通知するとき。","対象請求、支払期限、支払条件、金額を確認して通知する場面。","請求一覧から対象を選び、支払内容の通知対象を取り違えないようにする場面。","複数請求がある時に、注文番号や請求年月を照合して通知する場面。","支払予定を共有する前に、請求書の承認状態と金額を確認する場面。"],"a":"A"},{"id":49,"cat":"請求管理","type":"c","q":"相殺請求書を使う場面として最も適切なものはどれか。","o":["控除後の金額が一覧や通知内容とずれないか確認する場面。","対象請求に対して控除・相殺する金額と理由を整理する場面。","相殺後の支払額と元の請求額の整合を確認する場面。","支払額から控除・相殺する金額や内容を請求処理上で扱うとき。","相手先へ説明できる根拠を添えて、控除内容を処理する場面。"],"a":"D"},{"id":50,"cat":"請求管理","type":"c","q":"請求一覧を使う場面として最も適切なものはどれか。","o":["支払い通知、承認、確認へ進む前に対象行を特定する場面。","受信・作成された請求書を検索し、金額、期限、承認、支払状況を確認するとき。","複数の請求から、注文番号や請求年月を使って対象を選ぶ場面。","受信・作成された請求の状態を見て、承認待ちや差し戻しを判断する場面。","請求書PDFや操作ボタンへ進む前に、取引先と金額を確認する場面。"],"a":"B"},{"id":51,"cat":"基本知識","type":"c","q":"建設PADが正式にリリースされた日はいつか。","o":["2020年2月17日","2021年8月1日","2022年8月1日","2023年3月9日"],"a":"B","ex":"建設PADは2021年8月1日に正式リリースされました。選択肢の2022年8月1日はサービス開始から約1年後の日付、2020年2月17日・2023年3月9日は実際のリリースと無関係の日付です。"}];
const PAD3_Q=[{"id":51,"cat":"建設PAD操作","type":"c","q":"見積一覧のNoを問い合わせ対応で使う目的はどれか。","o":["請求書の税率を変更するため。","注文書の承認者を切り替えるため。","支払い通知書の支払期限を延長するため。","相殺請求書の控除理由を自動入力するため。","対象依頼を特定し、類似案件との取り違えを防ぐため。"],"a":"E"},{"id":52,"cat":"物件・工事管理","type":"c","q":"見積依頼で物件名を確認する理由はどれか。","o":["支払い通知書の支払期限を決めるため。","注文書の承認者を自動で割り当てるため。","どの工事・物件への依頼かを依頼先と自社で一致させるため。","相殺請求書の控除額を計算するため。","ログアウト時の確認メッセージを変えるため。"],"a":"C"},{"id":53,"cat":"見積管理","type":"c","q":"見積依頼の依頼先業者を確認する理由はどれか。","o":["依頼先を確定し、複数選択時も漏れや誤りがないか確認するため。","請求書の振込先を確定し、支払通知書の作成準備に使うため。","注文書の承認済みステータスを確定するため。","相殺請求書の控除理由を業者名から自動判定するため。","ホーム画面の通知件数を依頼先ごとに集計するため。"],"a":"A"},{"id":54,"cat":"注文管理","type":"c","q":"見積一覧に注文番号が表示されている場合、確認できることはどれか。","o":["請求書の振込先が承認済みになったこと。","相殺請求書の控除理由が確定したこと。","支払い通知書の送信先が確定したこと。","その見積が注文情報と紐づいている可能性があること。","見積依頼の返信期限が延長されたこと。"],"a":"D"},{"id":55,"cat":"見積管理","type":"c","q":"見積依頼で工種を入力・確認する目的はどれか。","o":["請求書の振込先を工種ごとに分けるため。","工事内容の区分を示し、業者が見積対象を判断しやすくするため。","注文書の承認者を工種名から自動で決めるため。","支払い通知書の支払期限を工種ごとに変えるため。","相殺請求書の控除理由を工種に置き換えるため。"],"a":"B"},{"id":56,"cat":"検索・一覧操作","type":"c","q":"見積一覧のステータスを見る理由はどれか。","o":["請求書の支払期限を延ばすか判断するため。","注文書PDFの印刷要否を判断するため。","相殺請求書の控除額を確定するため。","ログアウト前に未保存データを探すため。","依頼先の進捗状態（未提出・検討中・提出中）を確認するため。"],"a":"E"},{"id":57,"cat":"物件・工事管理","type":"c","q":"見積依頼で工事着手及び完成時期を入力する時の注意点はどれか。","o":["着手日と完成日は請求書の支払期限と同じ日付にする。","完成日を空欄にしても、業者側で工期を自動判断する。","開始日と終了日の前後関係を確認し、終了日が開始日より後になるようにする。","工期は注文書作成後に初めて確定するため、見積依頼では仮条件として扱う。","工期は相殺請求書の控除理由として入力する。"],"a":"C"},{"id":58,"cat":"建設PAD操作","type":"c","q":"見積一覧の見積合計金額を見る目的はどれか。","o":["見積額を比較し、注文判断の材料にするため。","請求書の振込先を確定するため。","支払い通知書の作成権限を確認するため。","問い合わせ理由欄へ確認内容を転記するため。","見積依頼の送信先業者を追加するため。"],"a":"A"},{"id":59,"cat":"見積管理","type":"c","q":"見積依頼日時を見る理由として正しいものはどれか。","o":["請求書の発行日を決めるため。","注文書の承認者を変更するため。","相殺請求書の控除額を決めるため。","依頼日から返信期限や催促タイミングを確認するため。","支払い通知書の支払予定日を確定するため。"],"a":"D"},{"id":60,"cat":"建設PAD操作","type":"c","q":"見積返信期限を設定・確認する目的はどれか。","o":["注文書の承認日を決めるため。","依頼先の回答期限を明確にし、期限超過時の対応判断に使うため。","請求書の支払期限を確定するため。","相殺請求書の控除理由を確定するため る。","見積依頼一覧で見積合計金額が入力済みかを見る。","送信済み一覧で承認待ちが承認済みに変わっているかを見る。","一般請求書一覧で請求番号が採番済みかを見る。","CSV出力画面で注文書データが検索できるかを見る。"],"a":"C"},{"id":142,"cat":"注文管理","type":"c","q":"注文書・請書に修正依頼が届いた際、元請側が建設PAD上で行う操作手順として正しいものはどれか。","o":["コメントで修正内容を確認し、編集から内容を直して再送する。","承認済みとして出来高請求の対象に進める。","キャンセルとして扱い、新しい物件を作成する。","支払い通知書で金額差分を調整して完了する。","CSV出力で修正内容をダウンロードして保管する。"],"a":"A"},{"id":143,"cat":"注文管理","type":"c","q":"注文書・請書が拒否された場合の一覧上の理解として正しいものはどれか。","o":["送信済みの承認状況が変更契約中に変わる。","編集中の注文書として下書き一覧へ戻る。","一般請求書の承認状況が非承認に変わる。","送信済みの承認状況が否決に変わる。","支払い通知書の受信済み一覧へ移る。"],"a":"D"},{"id":144,"cat":"基本操作","type":"c","q":"変更契約を開始する入口として正しいものはどれか。","o":["注文書作成画面で物件選択前に変更契約番号を入力する。","請求関連の支払い通知書から取り交わした注文書を引用する。","注文書・請書の一覧で対象注文書の操作欄から新変更契約を選ぶ。","見積依頼一覧で提出済み見積から変更契約を選ぶ。","CSV出力画面で注文書を検索して変更契約を作成する。"],"a":"C"},{"id":145,"cat":"建設PAD操作","type":"c","q":"変更契約を送信した直後の状態として正しい組み合わせはどれか。","o":["変更前の書類は承認済み、変更契約で送信した書類は下書きになる。","変更前の書類は否決、変更契約で送信した書類は承認済みになる。","変更前の書類は変更契約中、変更契約で送信した書類は承認待ちになる。","変更前の書類はキャンセル、変更契約で送信した書類は編集中になる。","変更前の書類は問い合わせ、変更契約で送信した書類は非承認になる。"],"a":"C"},{"id":146,"cat":"注文管理","type":"c","q":"変更契約が先方に承認された後の建設PAD上の状態として正しいものはどれか。","o":["初回の注文書は変更契約済、変更契約書類は承認済みになる。","初回の注文書は承認待ち、変更契約書類は変更契約中になる。","初回の注文書は下書き、変更契約書類は否決になる。","初回の注文書は問い合わせ、変更契約書類はキャンセルになる。","初回の注文書は非承認、変更契約書類は編集中になる。"],"a":"A"},{"id":147,"cat":"注文管理","type":"c","q":"アカウントを持っていない協力会社へ注文書を送る時、最初に切り替える操作はどれか。","o":["取引先一覧で未登録会社を選び、承認状況を承認済みに変える。","注文書・請書作成で物件選択後、メールアドレスを直接指定するに切り替える。","支払い通知書で書類タイプを取り交わした注文書にする。","CSV出力で協力会社メールを検索し、ダウンロードする。","見積依頼で依頼先を複数選択し、注文書へ変換する。"],"a":"B"},{"id":148,"cat":"物件・工事管理","type":"c","q":"メールアドレス直接指定に切り替えた後、登録済み取引先から選び直したい場合の理解はどれか。","o":["物件選択を解除すると自動的に登録済み取引先選択へ戻る。","注文条項フォームを追加すると登録済み取引先選択へ戻る。","PDFで確認を押すと登録済み取引先選択へ戻る。","切り替え後に表示される取引先から選ぶボタンで戻す。","承認待ちになった後に一覧から登録済み取引先へ戻す。"],"a":"D"},{"id":149,"cat":"注文管理","type":"c","q":"アカウントなし協力会社へ注文書を送る時、通常の取引先送信より追加で入力が必要なものはどれか。","o":["支払い通知書の承認日、請求年月、支払期限、請求番号。","見積依頼の工事概要、見積要領、返信期限、添付資料名。","受注側の社名、住所、電話番号、送付先メールアドレス。","CSVの検索条件、詳細検索の入力欄、青いダウンロードボタン。","ワークフローの最終承認者、差し戻しコメント、却下理由。"],"a":"C"},{"id":150,"cat":"注文管理","type":"c","q":"アカウントなし協力会社への注文書送信が完了したと判断する画面上の手がかりはどれか。","o":["承認済みの一般請求書が送信済み一覧に表示される。","データの準備ができました、というCSV通知が表示される。","支払い通知書確認ボタンが受信済み一覧に表示される。","注文書・注文請書を送信しましたのメッセージが画面上部に出る。","お問い合わせ入力ボタンが請求書詳細に表示される。"],"a":"D"}];
const PAD1_Q=[{"id":151,"cat":"注文管理","type":"c","q":"注文書作成で約款データの添付先を選ぶ場面として正しいものはどれか。","o":["注文書のみ、注文請書のみ、注文書・請書双方のどれに付けるか決める。","変更契約中、変更契約済、否決のどの状態に付けるか決める。","承認、問い合わせ、拒否のどの回答に付けるか決める。","受信した請求書、取り交わした注文書のどちらへ付けるか決める。","CSV検索結果、準備完了画面のどちらへ付けるか決める。"],"a":"A"},{"id":152,"cat":"注文管理","type":"c","q":"注文書に添付する約款PDFで拡張子に関する注意として正しいものはどれか。","o":["大文字の.PDFで添付する。","拡張子を外して添付する。","CSV形式へ変換して添付する。","画像として分割して添付する。","小文字の.pdfで添付する。"],"a":"E"},{"id":153,"cat":"注文管理","type":"c","q":"注文書を下書き保存した後に相手へ届かないと言われた場合、最初に確認することはどれか。","o":["承認済みの一般請求書に引用されているか。","下書き状態のまま送信まで完了していないか。","CSVの詳細検索で注文書が出力できるか。","支払い通知書の通知数が増えているか。","見積回答の添付資料が開けるか。"],"a":"B"},{"id":154,"cat":"注文管理","type":"c","q":"注文書・請書の承認状況確認で、修正依頼後に再送した時の状態理解として正しいものはどれか。","o":["再送後は変更契約済として旧書類にのみ表示される。","再送後は非承認として請求書一覧へ移る。","再送後はCSVの準備完了画面に移る。","再送後は承認状況が再び承認待ちになる。","再送後は協力会社側の支払通知書として届く。"],"a":"D"},{"id":155,"cat":"請求管理","type":"c","q":"出来高請求書の承認・問い合わせ・拒否で、承認を選んだ場合のコメント扱いとして正しいものはどれか。","o":["承認、問い合わせ、拒否のすべてでコメントが必須である。","問い合わせを選んだ時のみコメントが任意である。","拒否を選んだ時のみコメントが任意である。","コメントは支払い通知書作成時にのみ入力する。","承認を選んだ時のみコメントは任意である。"],"a":"E"},{"id":156,"cat":"請求管理","type":"c","q":"出来高請求書に問い合わせをした後の正しい待ち方はどれか。","o":["受注側が出来高請求書を修正して再送するか、問い合わせに回答するまで待つ。","承認済みとして支払い通知書を作成し、回答は後で確認する。","拒否済みとして請求書番号を再利用し、再作成を待つ。","変更契約中として注文書一覧に移動するまで待つ。","CSV出力で問い合わせ内容をダウンロードするまで待つ。"],"a":"A"},{"id":157,"cat":"基本操作","type":"c","q":"発注側で支払い通知書を確認する入口として正しいものはどれか。","o":["請求関連から支払い通知書を開き、物件または通知で対象を絞る。","注文書・請書の一覧から新変更契約を押して対象を表示する。","見積関連の依頼一覧から支払い通知書確認を押す。","CSV出力の詳細検索で対象通知を開く。","ワークフローの承認ルート設定から通知書を開く。"],"a":"A"},{"id":158,"cat":"支払管理","type":"c","q":"受信済みの支払い通知書を内容確認する操作として正しいものはどれか。","o":["送信済みの一般請求書一覧でキャンセルボタンをクリックする。","注文書一覧で新変更契約ボタンをクリックする。","受信済みの支払い通知書一覧で支払い通知書確認ボタンをクリックする。","CSV検索結果で青いダウンロードボタンをクリックする。","承認ルート設定で新規登録ボタンをクリックする。"],"a":"C"},{"id":159,"cat":"支払管理","type":"c","q":"協力会社側で届いた支払通知書へ返答する時の選択肢として正しい組み合わせはどれか。","o":["承認、差し戻し、却下から選び、PDF確認後に最終承認者へ送る。","承認待ち、変更契約中、変更契約済から選び、注文書一覧へ戻す。","保存、編集、キャンセルから選び、編集中の一般請求書へ戻す。","承認、問い合わせ、拒否から選び、必要に応じてコメント付きで送信する。","検索、ダウンロード、準備完了から選び、CSVを取得する。"],"a":"D"},{"id":160,"cat":"注文管理","type":"c","q":"一般請求書が発注側から問い合わせされた時、協力会社側で最初に確認するものはどれか。","o":["注文書の承認状況が変更契約中になっているかと、新変更契約の内容。","CSV出力の検索結果が準備完了になっているかと、出力ファイル名。","送信済み一般請求書の承認状況がお問い合わせになっているかと、お問い合わせ入力の内容。","ワークフローの承認ルートが最終承認者まで進んだかと、金額範囲。","支払い通知書が承認済みになっているかと、青いダウンロードボタン。"],"a":"C"},{"id":161,"cat":"請求管理","type":"c","q":"一般請求書の問い合わせに回答するのみの場合の操作として正しいものはどれか。","o":["編集ボタンで請求書を修正し、PDF確認せず承認済みにする。","新変更契約から注文書を作り直し、承認待ちにする。","CSV出力で問い合わせ内容を検索してダウンロードする。","支払通知書確認から拒否を選び、請求書を終了する。","お問い合わせ入力で回答を入力し送信する。"],"a":"E"},{"id":162,"cat":"請求管理","type":"c","q":"一般請求書の内容修正が必要な問い合わせを受けた場合の流れとして正しいものはどれか。","o":["お問い合わせ入力で回答のみ送り、請求書の承認状況を承認済みに変える。","注文書一覧で新変更契約を作り、請求書番号を引き継ぐ。","支払い通知書の作成元書類検索で受信した請求書を引用する。","編集で請求書を修正し、PDFで反映を確認して先方へ再送する。","CSV出力で対象請求を検索し、ダウンロードして完了する。"],"a":"D"},{"id":163,"cat":"基本操作","type":"c","q":"協力会社側で保存中の一般請求書を再編集する入口として正しいものはどれか。","o":["送信済みの一般請求書で承認済みの行をクリックする。","支払い通知書確認から問い合わせを選択する。","注文書・請書一覧から詳細PDFを開く。","編集中の一般請求書一覧から対象行の編集ボタンをクリックする。","CSV出力の検索結果からダウンロードする。"],"a":"D"},{"id":164,"cat":"請求管理","type":"c","q":"作成途中の一般請求書で保存するを押した後の状態として正しいものはどれか。","o":["送信済みの一般請求書に承認済みとして表示される。","編集中の一般請求書に保存データが表示される。","受信済みの支払い通知書に確認待ちとして表示される。","注文書一覧に承認待ちとして表示される。","CSV出力に準備完了として表示される。"],"a":"B"},{"id":165,"cat":"請求管理","type":"c","q":"一般請求書が拒否された時、協力会社側の承認状況表示として正しいものはどれか。","o":["送信済み一般請求書の承認状況が変更契約済に変わる。","送信済み一般請求書の承認状況が非承認に変わる。","編集中の一般請求書に下書きとして戻る。","支払い通知書の承認状況が承認待ちに変わる。","CSV出力の状態がデータ準備中に変わる。"],"a":"B"},{"id":166,"cat":"請求管理","type":"c","q":"請求書承認状況が右側に隠れて見えない場合の実務対応として正しいものはどれか。","o":["請求書番号を変更して一覧を再作成する。","物件をクローズして承認状況を再表示する。","一覧を右にスクロールして承認状況を確認する。","CSVを出力しないと承認状況は見られない。","注文書の変更契約画面から承認状況を確認する。"],"a":"C"},{"id":167,"cat":"支払管理","type":"c","q":"支払い通知書作成で作成元書類検索を使う時、書類タイプとして選べる正しい組み合わせはどれか。","o":["受信した見積依頼、編集中の見積書。","受信した請求書、取り交わした注文書。","変更契約中の注文書、否決された注文書。","CSV検索結果、ダウンロード履歴。","承認ルート、支払い承認ルートグループ。"],"a":"B"},{"id":168,"cat":"支払管理","type":"c","q":"支払い通知書の作成元書類検索で、対象書類を絞るために入力する日付はどれか。","o":["請求書作成日。","物件作成日。","CSV出力日。","ワークフロー設定日。","承認日。"],"a":"E"},{"id":169,"cat":"承認・ワークフロー","type":"c","q":"ワークフロー機能の前提理解として正しいものはどれか。","o":["全ユーザーで常時有効であり、注文書送信時に必ず自動適用される。","CSV出力を使う場合のみ有効になり、請求承認には関係しない。","協力会社側のみが使う機能で、発注側の承認には関係しない。","支払い通知書を送ると自動的に無効になる機能である。","オプション機能であり、利用する場合は承認ルート設定や承認手順を確認する。"],"a":"E"},{"id":170,"cat":"物件・工事管理","type":"c","q":"支払い承認ルートを新規登録する時、後から判別しやすくするために入力するものはどれか。","o":["請求書番号。","変更契約番号。","CSV出力名。","支払い通知書番号。","支払い承認ルート名。"],"a":"E"},{"id":171,"cat":"支払管理","type":"c","q":"支払い承認ルートで金額に応じて表示・非表示を分けたい場合に使う設定はどれか。","o":["工事概要の文字数設定。","PDF拡張子設定。","CSV準備完了設定。","通知数表示設定。","請求金額の範囲設定。"],"a":"E"},{"id":172,"cat":"承認・ワークフロー","type":"c","q":"承認者の順序に関する理解として正しいものはどれか。","o":["最下部の承認者が最終承認者で、最初に承認すると完了する。","最上部が最終承認者で、そこまで承認されると請求書が承認される。","追加した承認者はすべて参考表示で、承認可否に影響しない。","承認者の順序はCSV出力順のみに使われる。","承認者は協力会社側が支払通知書で選択する。"],"a":"B"},{"id":173,"cat":"承認・ワークフロー","type":"c","q":"承認者を増やしたい場合の操作として正しいものはどれか。","o":["CSV検索条件を追加し、ダウンロード後に承認者を選ぶ。","注文条項フォームを追加し、条項名に承認者を入力する。","追加で承認者欄を増やし、プラスから具体的な承認者ユーザーを選ぶ。","支払い通知書のコメント欄に承認者名を入力する。","見積依頼の依頼先欄に承認者を追加する。"],"a":"C"},{"id":174,"cat":"承認・ワークフロー","type":"c","q":"承認者を削除したい場合の操作として正しいものはどれか。","o":["承認対象書類のPDFを閉じると削除される。","請求金額の範囲設定を外すと全員削除される。","CSV出力を取り消すと承認者が削除される。","追加した承認者の右側のバツで削除する。","支払い通知書を拒否すると承認者が削除される。"],"a":"D"},{"id":175,"cat":"基本操作","type":"c","q":"承認者が承認対象書類を確認する入口として正しいものはどれか。","o":["CSV出力から詳細検索を開き、承認対象書類をダウンロードする。","取引先招待から会社名を選び、承認対象書類を開く。","HOMEの通知情報から承認フローを選び、対象書類をクリックする。","見積依頼の依頼一覧から承認フローを作成する。","物件作成画面から参加ユーザーを選び、承認対象書類を開く。"],"a":"C"},{"id":176,"cat":"承認・ワークフロー","type":"c","q":"承認判断前にPDFで確認する理由として正しいものはどれか。","o":["注文書・請書などの書面内容を確認してから承認、差し戻し、却下を選ぶため。","CSVの準備完了メッセージを確認してからダウンロードするため。","支払い通知書の通知数を確認してから物件選択するため。","取引先招待メールが届いたか確認してから承認するため。","見積依頼の工事概要を18文字以内にするため。"],"a":"A"},{"id":177,"cat":"承認・ワークフロー","type":"c","q":"ワークフローで差し戻しまたは却下を選ぶ場合のコメント扱いとして正しいものはどれか。","o":["承認、差し戻し、却下のすべてでコメントは任意である。","承認の場合のみコメントが必須である。","コメントはCSV出力時に自動で付与される。","コメントは協力会社側の請求書番号欄に入力する。","差し戻し、却下の場合はコメントを必ず入力する。"],"a":"E"},{"id":178,"cat":"承認・ワークフロー","type":"c","q":"承認操作の最終確認画面で行う判断として正しいものはどれか。","o":["データの準備ができましたという表示で青いダウンロードを選ぶ。","注文書・注文請書を送信しましたという表示を待つ。","お問い合わせ入力で回答を入力して送信する。","取引先から選ぶボタンで宛先指定に戻す。","承認しますかという確認に対して、はいまたはキャンセルを選ぶ。"],"a":"E"},{"id":179,"cat":"注文管理","type":"c","q":"ワークフロー設定で支払い承認ルートと注文書ワークフローの関係としてヘルプ上近い説明はどれか。","o":["支払い承認ルートはCSV出力の条件設定と同義とされている。","支払い承認ルートはアカウントなし送信のメール指定と同義とされている。","金額範囲や承認者設定の考え方は注文書のワークフローと同義とされている。","支払い承認ルートは見積依頼の複数業者選択と同義とされている。","支払い承認ルートは物件クローズの取消しと同義とされている。"],"a":"C"},{"id":180,"cat":"承認・ワークフロー","type":"c","q":"承認ルート設定で承認者を選ぶ際、プラスボタンの役割として正しいものはどれか。","o":["具体的な承認者ユーザーを一覧から選択する。","承認対象書類をPDF出力する。","請求金額の範囲設定を初期化する。","CSVダウンロードを開始する。","支払通知書の問い合わせを開く。"],"a":"A"},{"id":181,"cat":"CSV・データ連携","type":"c","q":"CSV出力の最初の操作として正しいものはどれか。","o":["メニュー欄からCSV出力を選択する。","注文書一覧から新変更契約を選択する。","請求関連から支払い通知書確認を選択する。","HOMEの通知情報から承認フローを選択する。","見積関連から見積り作成を選択する。"],"a":"A"},{"id":182,"cat":"CSV・データ連携","type":"c","q":"CSV出力で条件を入力する前に開くものはどれか。","o":["お問い合わせ入力。","新変更契約。","支払い通知書確認。","詳細検索。","承認ルート設定。"],"a":"D"},{"id":183,"cat":"CSV・データ連携","type":"c","q":"CSV出力で検索ボタンを押す前に行うことはどれか。","o":["注文書のPDF拡張子を小文字に変える。","赤枠内などの検索条件に出力したい内容を入力する。","支払い通知書の承認状況を拒否にする。","承認ルートの最終承認者を削除する。","一般請求書を編集中一覧へ保存する。"],"a":"B"},{"id":184,"cat":"CSV・データ連携","type":"c","q":"CSV出力で検索後、最初のダウンロード前に確認することはどれか。","o":["承認フローの最終確認がはいになっているか。","検索結果が出力したい対象内容と合っているか。","注文書が変更契約済になっているか。","請求書の問い合わせコメントが空欄か。","支払通知書の通知数が消えているか。"],"a":"B"},{"id":185,"cat":"CSV・データ連携","type":"c","q":"CSV出力でデータの準備ができましたと表示された後の操作はどれか。","o":["青いダウンロードボタンをクリックする。","承認するボタンをクリックする。","新変更契約ボタンをクリックする。","お問い合わせ入力ボタンをクリックする。","支払い通知書確認ボタンをクリックする。"],"a":"A"},{"id":186,"cat":"CSV・データ連携","type":"c","q":"CSV出力を使う時に最も避けるべき判断はどれか。","o":["検索条件と表示結果を照合せずにダウンロードする。","検索条件を入力してから検索する。","画面下の結果を見てからダウンロードする。","準備完了後に青いダウンロードボタンを押す。","出力対象の内容を事前に決めておく。"],"a":"A"},{"id":187,"cat":"CSV・データ連携","type":"c","q":"CSV出力がオプション機能であることを踏まえた一次対応として正しいものはどれか。","o":["CSVメニューが見当たらない場合、注文書を変更契約済にする。","CSVメニューが見当たらない場合、協力会社側で承認を選ぶ。","CSVメニューが見当たらない場合、請求書番号を変更する。","CSVメニューが見当たらない場合、利用契約や権限の有無も確認する。","CSVメニューが見当たらない場合、支払通知書を拒否する。"],"a":"D"},{"id":188,"cat":"CSV・データ連携","type":"c","q":"CSV出力の検索結果が目的と違う場合、次に行うべきことはどれか。","o":["青いダウンロードボタンで先に取得してから修正する。","注文書一覧で新変更契約を作る。","承認フローで却下コメントを入力する。","詳細検索の条件を見直して再検索する。","支払い通知書確認で問い合わせを選ぶ。"],"a":"D"},{"id":189,"cat":"基本操作","type":"c","q":"協力会社側で支払通知書が届いた時の入口として正しいものはどれか。","o":["注文書・請書一覧、新変更契約、変更契約中の順に開く。","CSV出力、詳細検索、ダウンロードの順に開く。","物件作成、参加取引先、作成の順に開く。","見積依頼、依頼先選択、先方へ送信の順に開く。","HOME、通知情報、請求関連、該当通知の順に開く。"],"a":"E"},{"id":190,"cat":"支払管理","type":"c","q":"支払通知書の内容を協力会社側で確認する操作として正しいものはどれか。","o":["支払い通知書確認をクリックして別ページの書類画面で確認する。","新変更契約をクリックして注文書作成画面で確認する。","詳細検索をクリックしてCSV結果で確認する。","承認ルート設定をクリックして最終承認者で確認する。","取引先から選ぶをクリックして宛先画面で確認する。"],"a":"A"},{"id":191,"cat":"支払管理","type":"c","q":"協力会社側で支払通知書へ返答する時、プルダウンで選ぶ項目として正しいものはどれか。","o":["承認、問い合わせ、拒否。","承認、差し戻し、却下。","承認待ち、変更契約中、変更契約済。","保存、編集、キャンセル。","検索、準備完了、ダウンロード。"],"a":"A"},{"id":192,"cat":"協力会社管理","type":"c","q":"協力会社側で見積回答を作成する前に添付資料を確認する理由はどれか。","o":["請求書番号を重複使用できるか確認するため。","変更契約中の注文書を承認済みにするため。","CSVダウンロードの準備完了を確認するため。","支払い承認ルートの最終承認者を確認するため。","発注条件・図面を確認し、見積範囲と単価の前提を合わせるため。"],"a":"E"},{"id":193,"cat":"協力会社管理","type":"c","q":"協力会社側の見積作成で数字入力に関する注意として正しいものはどれか。","o":["見積単価は全角、数量は半角で入力する。","見積単価や数量などは半角で入力する。","数字は添付資料にあれば画面入力しない。","数字は発注側が承認時に自動補正する。","数字はCSV出力後に入力する。"],"a":"B"},{"id":194,"cat":"注文管理","type":"c","q":"協力会社側で注文書・請書を受け取った時、内容に不備がある場合の返答はどれか。","o":["承認を選び、請求書の備考で修正箇所を伝える。","修正依頼を選び、コメントで修正箇所を伝える。","拒否を選び、出来高請求書をそのまま作成する。","保存を選び、発注側の注文書を編集する。","CSVを出力し、修正箇所をファイル名に入れる。"],"a":"B"},{"id":195,"cat":"注文管理","type":"c","q":"協力会社側で注文書・請書を承認した後に確認する状態はどれか。","o":["書類状況が変更契約中になっているか。","CSV状態が準備完了になっているか。","一般請求書が編集中になっているか。","支払通知書が問い合わせになっているか。","書類状況が承認済みになっているか。"],"a":"E"},{"id":196,"cat":"請求管理","type":"c","q":"協力会社側で出来高請求書を作成する時、引用元として選ぶものはどれか。","o":["支払通知書確認から該当通知書を選ぶ。","注文書選択のプルダウンから該当注文書を選ぶ。","CSV詳細検索から該当行を選ぶ。","承認ルート設定から最終承認者を選ぶ。","取引先招待一覧から該当会社を選ぶ。"],"a":"B"},{"id":197,"cat":"請求管理","type":"c","q":"協力会社側の出来高請求書で必須入力に近い組み合わせはどれか。","o":["見積返信期限、工事概要、見積要領、依頼先。","注文条項、約款添付先、メール直接指定、電話番号。","請求書発行日、請求書番号、請求率または出来高金額。","CSV検索条件、詳細検索、準備完了、青いボタン。","承認ルート名、金額範囲、最終承認者、却下コメント。"],"a":"C"},{"id":198,"cat":"請求管理","type":"c","q":"協力会社側で一般請求書を途中保存した後の再開方法として正しいものはどれか。","o":["送信済み一般請求書の承認済み行から編集する。","発注側の支払い通知書作成元から編集する。","CSV出力の検索結果から編集する。","編集中の一般請求書から編集をクリックする。","注文書の変更契約中の行から編集する。"],"a":"D"},{"id":199,"cat":"請求管理","type":"c","q":"協力会社側で一般請求書が問い合わせになった場合、請求内容の修正が必要な時の操作はどれか。","o":["お問い合わせ入力に回答のみ入れて承認済みにする。","編集で修正し、PDFで確認して先方へ送信する。","支払通知書の承認を選んで請求書を確定する。","注文書一覧から新変更契約を作成する。","CSVをダウンロードして発注側へ送る。"],"a":"B"},{"id":200,"cat":"請求管理","type":"c","q":"協力会社側で一般請求書が承認されたか確認する時、見落としやすい操作はどれか。","o":["見積依頼の添付資料を開いて承認状況を確認する。","注文書の約款PDFを小文字拡張子に変える。","承認状況が右側にある場合は横スクロールして確認する。","CSVの青いダウンロードボタンを押して確認する。","支払通知書の問い合わせを拒否に変える。"],"a":"C"}];

  {id:1,cat:"FDEの定義",type:"c",q:"FDE（Forward Deployed Engineer）の定義および最大の特徴として、最も適切なものはどれですか？",o:["営業が獲得した案件の契約締結と、トラブル時の窓口業務に特化する点","「課題抽出」「実装」「定着」のすべてのフェーズに一気通貫で顧客に携わる点","自社プロダクトの純粋な要件定義と開発進捗報告のみを短期接点で行う点","顧客の要望をそのまま開発チームに伝えるだけのブリッジエンジニアである点"],a:"B"},
  {id:2,cat:"他職種との違い",type:"c",q:"他職種との比較において、FDEが顧客と持つ接点（距離）の性質として正しいものはどれですか？",o:["商談時や要件確認時のみの「短期接点」である","常駐または定期訪問による「長期接点」である","契約時のみに限定された「一過性の接点」である","顧客と直接会うことはなく、すべてオンラインツール経由の間接的な接点である"],a:"B"},
  {id:3,cat:"FDEの動き方",type:"c",q:"顧客は通常業務を抱えながら対応しています。FDEに求められる「動き方」として適切なものはどれですか？",o:["先方から具体的な指示や要件定義書が提出されるまで、実装作業を待つ","FDE側が能動的に作業を提案し、具体的なたたき台等を作成して提示する","先方の業務を止めてでも、ヒアリングのための時間を最優先で確保させる","業務の進捗が遅れている場合は、先方の担当者を強く問い詰める"],a:"B"},
  {id:4,cat:"ナレッジの横展開",type:"c",q:"ある業種で得た課題や知見に対するFDEの行動指針として、正しいものはどれですか？",o:["その顧客固有の秘密として、社内の他メンバーにも共有しないようにする","業種に依存しない課題の共通点を見つけ、他顧客にも横展開できる形でナレッジ化する","他業種の顧客には一切真似ができないよう、複雑な個別カスタマイズに終始する","その業種の専門家になるために、自社のエンジニアリング業務を一時中断する"],a:"B"},
  {id:5,cat:"完璧主義の排除",type:"c",q:"FDEの行動指針として「完璧主義を持ち込まない」とあります。これは具体的にどういう動き方を意味していますか？",o:["成果物のクオリティは低くてよいため、適当に作ったシステムをそのまま納品する","下書きや荒い粒度であっても、まずは前に進めながら洗練させていく","上司のレビューを受けるまでは、一切の資料を顧客に見せないようにする","完璧なシステムが作れないと判断した場合は、その時点で改善提案を諦める"],a:"B"},
  {id:6,cat:"業務フローの柔軟性",type:"c",q:"業務フローの各フェーズの関係性についての記述として、最も適切なものはどれですか？",o:["フェーズは厳密な工程区分であり、前の工程に戻ることは原則として禁止されている","フェーズは「今の主軸は何か」を示すラベルであり、状況に応じて往来するものである","すべてのフェーズはFDEが単独で主導し、他部署が介入することはない","フェーズは顧客の企業規模によって割り振られ、一度決まったら変更できない"],a:"B"},
  {id:7,cat:"Phase1の目的",type:"c",q:"Phase 1（導入決定〜事前ヒアリング）の主導部署と、このフェーズの主たる目的として正しいものはどれですか？",o:["【FDE主導】顧客のネットワーク環境を構築し、システムを稼働させる","【営業主導】顧客との契約を締結し、FDE着任時に必要な前提情報を営業からFDEへ引き継ぐ","【開発主導】自社プロダクトのソースコードを顧客向けにカスタマイズする","【人事主導】顧客先へ常駐するFDEメンバーの採用活動を行う"],a:"B"},
  {id:8,cat:"Phase1のアウトプット",type:"c",q:"導入決定～事前ヒアリングの際、主なアウトプット（引き継ぎ資料）に含まれないものはどれですか？",o:["契約書／発注書","営業が把握した課題感・期待値・初期要望","既存ポリシー文書（情報セキュリティ方針など、ある場合）","ユーザー向け操作説明ドキュメント"],a:"D"},

  {id:81,cat:"DX手法整理・応用",type:"c",q:"FDE業務において「ヒアリング中に顧客が書類を見せてくれた」場面で、DX手法整理フローを開始すると同時にFDEナレッジへの課題登録も行うことは適切ですか？その理由も含めて最も正しいものはどれですか？",o:["適切ではない。DX手法整理とナレッジ登録は別々に行うべきで、一括して登録する","適切である。課題が明確化した瞬間にナレッジ登録することがルールである。","適切ではない。ナレッジ登録は上司の承認後に行うため、その場での登録は禁止されている","適切である。ただしDX手法整理が完了してから、すべての課題をまとめてナレッジ登録する"],a:"B"},
  {id:82,cat:"MTG議事録・応用",type:"c",q:"FDEが毎週月曜日にナレッジ確認を行う際、「前週に録音・文字起こし・要約まで完了したMTG議事録」がある場合、そのMTG内容とナレッジ確認の正しい連動フローはどれですか？",o:["MTGの議事録はドキュメントとして顧客共有が目的であり、ナレッジ確認とは切り離して管理する","議事録から明確化した課題を抽出し、ナレッジ確認の「前週ナレッジ化すべきもの」として登録。また進捗変化があればステータスも更新し、その実施を当日の日報に記載する","MTGの議事録はFDEナレッジDBに自動連携されるため、手動での登録作業は不要","ナレッジ確認は月末のみ行えばよく、MTG直後のナレッジ登録は二重管理になるため禁止されている"],a:"B"},
  {id:83,cat:"DX手法整理・応用",type:"c",q:"DX提案の商談において「顧客が『検討してみようかな』と反応した」場面でFDEが次に取るべきアクションとして、マニュアルに定められているものはどれですか？",o:["「では契約書を準備しますので、今日中にご返答ください」と即座にクロージングに入る","「資料をお送りしますね」と次のアクションを確定させ、具体的な送付内容と期限を確認する","「ご検討のほど、よろしくお願いいたします」とだけ伝えて、顧客からの連絡を待つ","「他の顧客でも同じ反応がありましたが、導入しなかった事例が多いです」と現実的なリスクを説明する"],a:"B"},
  {id:84,cat:"オンボーディング・応用",type:"c",q:"FDEがキックオフMTGの議事録を作成する際、MTG議事録作成マニュアルのフローに沿った正しい手順として適切なものはどれですか？",o:["MTG中にリアルタイムでWordに打ち込み、MTG終了直後にそのまま顧客に送付する","MTG中に録音→MTG後に音声を30分ごとに分割→Google AI Studioで文字起こし→Claudeで要約・議事録化→48時間以内に送付する","MTG終了後にFDEの記憶をもとに要約のみ作成し、録音・文字起こしは行わない","録音データをそのまま顧客に送付し、顧客自身に文字起こしを依頼する"],a:"B"},
  {id:85,cat:"オンボーディング・応用",type:"c",q:"FDE導入オンボーディングのチェックリストにおいて「営業／FDE」が共同で担う項目として正しいものはどれですか？また、その理由として最も適切なものはどれですか？",o:["PC手配。FDEと営業が両方サインオフすることで、機器調達の承認フローが完結するため","営業→FDE引き継ぎMTGの実施。営業が把握している顧客情報・初期要望・期待値をFDEに正確に伝える必要があるため","Notion顧客情報ページの作成。営業とFDEが共同でページを作成しないと権限が付与されないため","請求書の作成と送付。営業がFDEの稼働時間を確認してから請求書を作成するため"],a:"B"},
  {id:86,cat:"応用・総合",type:"c",q:"FDEダッシュボードの構成要素として含まれているものをすべて正しく示した組み合わせはどれですか？",o:["顧客情報・FDEナレッジ・FDEマニュアル・月一勉強会・FDE業務レポート・全体のGoogleドライブ","売上管理・採用情報・競合分析・プレスリリース・広報資料","製品カタログ・価格表・営業トークスクリプト・契約書テンプレート","社員食堂メニュー・駐車場情報・交通費精算・健康診断記録"],a:"A"},
  {id:87,cat:"応用・総合",type:"c",q:"DX手法整理ナレッジにおいて「書類起点のアプローチ」が顧客にとって有効な理由として、マニュアルに示されている3つの効果を正しく示したものはどれですか？",o:["顧客が予算を増額しやすくなる・競合他社を排除できる・契約が即日決まる","顧客が自分ごととして理解できる・提案がその場で出せる・自社プロダクトの導入提案につながる","顧客のIT知識が向上する・複数部署が巻き込まれる・実装コストが下がる","顧客の担当者が変わりにくくなる・クレームが減る・月次報告が不要になる"],a:"B"},
  {id:88,cat:"応用・総合",type:"c",q:"FDE業務において「現状・課題抽出」の「ヒアリング中」に顧客が「今お使いの書類を見せてほしい」と言った場面でのFDEの対応として、業務フロー上最も適切なものはどれですか？",o:["「今回はヒアリングのみであり、書類の受領は後日行います」と伝えて後回しにする","ヒアリング中であっても書類を受領し、DX手法整理フローを並行して開始する","書類の受領は営業担当の仕事であるため、FDEは営業に依頼する","書類の受領に別途費用が発生するため、上司に確認してから返答する"],a:"B"},
  {id:89,cat:"応用・総合",type:"c",q:"非常駐型（定期MTG型）の顧客案件でMTGを録音した後、「音声ファイルが1時間45分ある」場合のFDEの正しい対応はどれですか？",o:["1時間45分のファイルをそのままGoogle AI Studioにアップロードして文字起こしする","FreeMP3CutterJoinerなどで30分ごとに分割（4ファイル）し、ファイルごとに新規セッションで文字起こしする","1時間以上の録音は文字起こしが禁止されているため、メモのみで対応する","音声ファイルを顧客に送付し、顧客自身に文字起こしを依頼する"],a:"B"},
  {id:90,cat:"応用・総合",type:"c",q:"FDEが顧客先で「稟議書の紙運用が多く、承認に1週間かかることがある」という課題を発見しました。FDEナレッジのタイトルとして最も適切なものはどれですか？",o:["○○株式会社の稟議書が紙で非効率な問題","紙ベースの承認フローのため、処理遅延と追跡困難が発生している","稟議書のWordテンプレートが古くて使いにくい","○○部長が承認を後回しにすることが多い"],a:"B"},
  {id:91,cat:"応用・総合",type:"c",q:"FDEが初回の顧客商談に臨む前に最低限把握しておくべき2つの事項として正しい組み合わせはどれですか？",o:["競合他社のサービス価格と自社の利益率","DX手法整理ナレッジ（書類起点の提案フレームワーク）と自社プロダクト（建設PAD・OUKAGAI）の概要","顧客企業の株価推移と財務諸表の内容","顧客担当者のSNSアカウントと趣味・嗜好"],a:"B"},
  {id:92,cat:"応用・総合",type:"c",q:"FDEが実装中に新たに大きな課題を発見しました。この課題はFDE単独では対応が難しく、大きな工数が必要と判断されます。このとき正しい行動の組み合わせはどれですか？",o:["新たな課題はFDEナレッジに登録し、営業担当を交えて対応可否と契約範囲を確認する","実装中に新課題が出た場合は、現在の実装を止めてすべてリセットする","新たな課題は顧客には伝えず、FDEが単独で対応できるレベルまで縮小して実装する","大きな工数が必要と判断したら、その案件から撤退を申し出る"],a:"A"},
  {id:93,cat:"応用・総合",type:"c",q:"キックオフMTGにおいて録音・録画の同意取得を「最初に」行う理由と、同意が得られなかった場合のFDEの正しい対応の組み合わせとして最も適切なものはどれですか？",o:["同意取得を最初に行うのは形式的な手順のため・同意なしでも録音を継続する","透明性のある記録を担保するため・同意が得られない場合はメモと手書き議事録で対応し、録音・録画は行わない","法的義務があるため・同意なしでも録音が禁止されるのは動画のみで、音声は問題ない","社長の指示があるため・同意が得られなければMTGを中止する"],a:"B"},
  {id:94,cat:"応用・総合",type:"c",q:"FDE業務全体を通じて「AIを活用する場面」と「FDEが目視・判断する場面」の正しい役割分担として最も適切なものはどれですか？",o:["AIに全作業を委託し、FDEはAIの出力を承認するだけでよい","AIはリスト化・手法判別・文字起こしなどの効率化に活用し、FDEは判断が必要な部分を担う","FDEはAIを一切使わず、すべて手作業で行うことで品質を担保する","AIは営業フェーズのみで活用し、FDEの現場業務ではAIは使用しない"],a:"B"},
  {id:95,cat:"応用・総合",type:"c",q:"FDEとして顧客の「現場でExcelが属人化していて担当者が休むと業務が止まる」という課題を聞いた場合の、正しい一連の対応フローとして最も適切なものはどれですか？",o:["その場で解決策を即答し、Excelの作り直しをすぐに開始する","課題をFDEナレッジに登録し、チームに共有。解決策を検討、提案資料を作成後、先方と合意後に実装する","課題は口頭で上司に伝えるだけで、ナレッジ登録は実装完了後に行う","顧客の担当者に「Excelの使い方を勉強してください」と伝える"],a:"B"},
  {id:96,cat:"応用・総合",type:"c",q:"FDEが担当顧客への訪問前日に行う準備として、FDE共通ルール・オンボーディングマニュアル・ナレッジ管理ルールを踏まえた最も適切な行動の組み合わせはどれですか？",o:["Googleカレンダーに出社予定を登録（まだであれば）・FDEナレッジで前回課題の進捗を確認・録音ツールの動作確認","競合他社の最新サービスを調査・担当者の個人SNSをチェック・プレゼン資料を一から作成","顧客への請求書を送付・上司への訪問許可申請・翌日のMTG後の報告書を先に作成","FDEナレッジの前回登録内容を全削除・前回議事録を破棄・白紙の状態で訪問"],a:"A"},
  {id:97,cat:"応用・総合",type:"c",q:"FDEナレッジへの課題登録において「具体的な製品名が入っていたら注意」とされている理由として最も適切なものはどれですか？",o:["製品名を入れると著作権侵害になる恐れがあるため","特定の製品名が入ると、ナレッジの汎用性・横展開性が失われるため","製品名を入れると顧客情報が外部に流出するリスクがあるため","製品名を入れるとFDEナレッジのデータベースに登録できない仕様になっているため"],a:"B"},
  {id:98,cat:"応用・総合",type:"c",q:"FDE業務の中で「現状・課題抽出」と「改善提案・実装」が往来している状態の具体例として最も正しいものはどれですか？",o:["営業担当が「現状・課題抽出」を、FDE担当が「改善提案・実装」を並行して担当している状態","「改善提案・実装」の実装中に新たな課題が見つかり、その課題の現状把握・ナレッジ登録を「現状・課題抽出」相当で並行して行っている状態","「現状・課題抽出」の途中で顧客が契約を解除し、「改善提案・実装」に進めない状態","「現状・課題抽出」と「改善提案・実装」を同じ担当者ではなく別々の担当者が分業している状態"],a:"B"},
  {id:99,cat:"応用・総合",type:"c",q:"FDE（伴走DX支援）の業務全体において、顧客の課題解決と自社の資産蓄積を両立させ、FDEとしてのコアバリューを最大化するために、日々の実務で最も徹底すべき総合的な動き方はどれですか？",o:["現場から能動的に課題を拾って汎用的にナレッジ化し、AIによる効率化と目視での品質管理を両立させ、実装から現場での定着まで一気通貫で伴走する","顧客からの指示や要件定義書が提出されるのを待ち、自社プロダクトのAPI設計や高度なプログラミングによる完璧なシステムの実装のみに特化して対応する","競合他社に真似されないよう課題を顧客固有の秘密として扱い、大きな工数がかかる改修であっても営業やチームに相談せず、一過性の短期接点として単独で解決する","リスト化や議事録作成などの全作業をAIに丸投げして目視確認を省略し、ツールを本番環境へ配置した後は定着支援を行わず現場の自己責任として業務を終了する"],a:"A"},
  {id:100,cat:"応用・総合",type:"c",q:"FDEとして「顧客の課題を自分ごととして捉え、定着するまで伴走し続ける」という姿勢が最も試される場面として最も適切なものはどれですか？",o:["新しいプロダクトの機能説明会を開催し、顧客に操作方法を一度だけ教えた時点","実装したツールが現場でなかなか使われず、原因を特定して再設計・再導入を繰り返しながら定着を目指している場面","顧客から「やっぱり以前のやり方に戻したい」と言われた際に、すぐに元に戻して撤退した場面","契約締結が完了し、FDE担当のアサインが決まった時点"],a:"B"}

  {id:8,cat:"経理部",type:"c",q:"「仮払い精算」の説明として正しいものはどれか。",o:["翌月払いの請求を前払いする処理","役員報酬を一時的に支払う処理","消費税を別途精算する処理","毎月定額の手当を支給する処理","概算で渡した現金を領収書等で実費精算する処理","銀行振込を現金払いに変更する処理"],a:"E",ex:"仮払い精算とは、出張費等を概算で前渡しした後、実際の費用を領収書等で確認して過不足を精算する処理です。"},
  {id:9,cat:"経理部",type:"c",q:"振込業務で最初に確認すべきことはどれか。",o:["振込手数料が最安の銀行","前月の振込履歴","担当者の氏名","社内の承認フロー名称","発注者の連絡先","振込先口座番号・金額・振込日の正確性"],a:"F",ex:"振込業務では振込先の口座番号・金融機関名・金額・振込期日が正確かを確認してから操作します。誤振込は回収が困難です。"},
  {id:10,cat:"経理部",type:"c",q:"「税込価格」とは何か。",o:["消費税を別途請求する価格","消費税が免除された価格","消費税が含まれた合計金額","軽減税率のみが適用された価格","仕入税額を控除した価格","輸入消費税を加算した価格"],a:"C",ex:"税込価格とは本体価格に消費税を加算した合計金額です。現在の標準税率は10%、軽減税率（飲食料品等）は8%です。"},
  {id:11,cat:"経理部",type:"c",q:"領収書・請求書の一般的な帳簿書類の保存年限はどれか。",o:["1年","3年","5年","7年","10年","15年"],a:"D",ex:"法人税法上、帳簿書類（請求書・領収書等）の保存期間は原則7年間です（欠損金がある場合は10年）。"},
  {id:12,cat:"経理部",type:"c",q:"「出来高払い」の仕組みとして正しいものはどれか。",o:["工事の進捗に応じて段階的に支払う方式","工事完成後に全額一括で支払う方式","月末に一律で支払う方式","材料費のみを先払いする方式","工事中に予算額の半分を前払いする方式","請求書受領後5日以内に支払う方式"],a:"A",ex:"出来高払いは工事の完成割合（出来高）に応じて代金を段階的に支払う方式で、建設工事で広く用いられます。"},
  // 【設計部】
  {id:13,cat:"設計部",type:"c",q:"図面の「縮尺（スケール）」とはどれか。",o:["図面の用紙サイズ","建物の高さ制限","設計者のサイン欄","図面番号の記載方法","実際の寸法と図面上の寸法の比率","印刷解像度の設定値"],a:"E",ex:"縮尺（スケール）とは実際の寸法を一定の割合で縮小した比率です。例えば1/100なら実際の1/100の大きさで描かれています。"},
  {id:14,cat:"設計部",type:"c",q:"CADとは何の略称か。",o:["Construction And Design","Computer-Aided Design","Certified Architect Division","Civil Architecture Development","Construction Archive Database","Coordinated Architectural Drawing"],a:"B",ex:"CAD（Computer-Aided Design）はコンピュータを使って設計・製図を行うシステムの総称です。"},
  {id:15,cat:"設計部",type:"c",q:"建築図面の「平面図」が示すものはどれか。",o:["建物を正面から見た立面図","建物の基礎の伏せ図","建物を縦方向に切った断面図","建物を水平に切り真上から見た図","建物の屋根を真下から見た図","各階の高さを示す展開図"],a:"D",ex:"平面図は建物を水平に切って真上から見た図で、間取りや各室の配置・寸法を示します。"},
  {id:16,cat:"設計部",type:"c",q:"「実施設計」の説明として正しいものはどれか。",o:["建物のコンセプトを検討する段階","完成後の品質検査を行う段階","施工業者の選定を行う段階","施工中の進捗を確認する段階","建物の維持管理計画を立案する段階","工事に使える詳細な図面・仕様書を作成する段階"],a:"F",ex:"実施設計は工事着工に使用できる詳細な設計図面・仕様書・各種計算書を作成する段階です。基本設計をさらに詳細化します。"},
  {id:17,cat:"設計部",type:"c",q:"図面上の「GL」とは何を意味するか。",o:["Ground Level（地盤面の高さ基準）","Glass Line（ガラス面の基準線）","Grid Line（基準格子線）","General Layout（全体配置図）","Gradient Line（勾配の基準線）","Grade Limit（勾配の制限値）"],a:"A",ex:"GL（Ground Level）は地盤面の高さ基準を示す記号です。建物の高さや基礎の深さはGLを基準に表記します。"},
  {id:18,cat:"設計部",type:"c",q:"「意匠図」が主に表現するものはどれか。",o:["電気配線の経路","給排水設備の配管経路","建物のデザイン・外観・内観・仕上げ","構造部材の配筋詳細","空調設備の配管経路","建物の基礎の種類と形状"],a:"C",ex:"意匠図は建物の外観・内観のデザイン、仕上げ材料、開口部の位置等を示す図面で、建物の美観・機能を表現します。"},
  // 【総務部】
  {id:19,cat:"総務部",type:"c",q:"雇用保険の被保険者となる条件として正しいものはどれか。",o:["週10時間以上の労働者","週15時間以上の労働者","週20時間以上かつ31日以上の雇用見込みがある者","月給制の正社員のみ","役員以外の全ての従業員","契約社員のみ"],a:"C",ex:"雇用保険は1週間の所定労働時間が20時間以上、かつ31日以上の雇用見込みがある労働者が被保険者となります。"},
  {id:20,cat:"総務部",type:"c",q:"健康保険の被扶養者として認められる条件はどれか。",o:["同居している親族であれば誰でも","年収130万円未満で主として被保険者の収入で生活する者","配偶者と子のみ","同居家族全員","65歳未満の親族のみ","年収200万円未満の者"],a:"B",ex:"健康保険の被扶養者は年収130万円未満（60歳以上等は180万円未満）で主として被保険者の収入で生活する者が対象です。"},
  {id:21,cat:"総務部",type:"c",q:"就業規則を変更した場合に必要な手続きはどれか。",o:["労働基準監督署への届出と社員への周知","全社員の同意書の収集のみ","役員会の承認のみ","取引先への通知のみ","株主総会での承認のみ","社員代表の単独決裁のみ"],a:"A",ex:"就業規則を変更する場合は、労働基準監督署への届出と社員（過半数代表者の意見書添付）への周知が義務付けられています。"},
  {id:22,cat:"総務部",type:"c",q:"会社の印章（社印）管理で注意すべきことはどれか。",o:["発注書のみに使用できる","使用後は各自が保管する","誰でも自由に使用できる","保管者を定め使用履歴を記録し適切に管理する","社長のみが使用できる","毎月交換が必要"],a:"D",ex:"社印は会社の意思表示に用いる重要な印章です。保管責任者を定め、使用ごとに台帳に記録して不正使用や紛失を防ぎます。"},
  {id:23,cat:"総務部",type:"c",q:"建設業者が「雇用管理責任者」を選任する目的はどれか。",o:["建設業許可の更新申請のため","税務署への届出のため","取引先との契約交渉のため","社員の給与計算のため","現場の品質管理を担当させるため","建設工事での雇用改善・職業訓練等を推進するため"],a:"F",ex:"雇用管理責任者は建設労働者雇用改善法に基づき選任が必要で、雇用環境の整備・改善・職業訓練の推進を担います。"},
  {id:24,cat:"総務部",type:"c",q:"「労働条件通知書」に記載が必要な事項はどれか。",o:["会社の創業年と代表者名","取引先の一覧","社員の趣味と特技","会社の決算状況","業務内容・就業場所・労働時間・賃金・休日等","社員の家族構成"],a:"E",ex:"労働条件通知書には業務内容・就業場所・労働時間・賃金・休日・退職等の主要事項を明示することが労働基準法で義務付けられています。"},
  // 【積算部】
  {id:25,cat:"積算部",type:"c",q:"工事費の概算見積を行う際に最初に確認すべきことはどれか。",o:["取引先の社員数","設計図書・仕様書・工事範囲・工期","競合他社の受注金額","発注者の趣味嗜好","施工業者の所在地","工事保険の種類"],a:"B",ex:"概算見積では設計図書・仕様書・工事範囲・工期など工事の基本情報を最初に確認し、積算の前提条件を把握します。"},
  {id:26,cat:"積算部",type:"c",q:"「数量拾い（数量積算）」とはどれか。",o:["作業員の出勤人数を数えること","材料の在庫を確認すること","完成後の建物面積を計測すること","設計図面から工事に必要な材料・作業量を計算すること","発注書の枚数を確認すること","工事写真の枚数を整理すること"],a:"D",ex:"数量拾いは設計図面・仕様書から各工種の材料数量や作業量を計算して積み上げる積算の基本作業です。"},
  {id:27,cat:"積算部",type:"c",q:"「歩掛かり」とはどれか。",o:["工事現場への通勤時間","足場工事の歩行距離","材料の廃棄量の割合","工事中の歩行者通路の幅","作業員1人が1日に行える標準的な作業量の基準値","工事現場の傾斜角度"],a:"E",ex:"歩掛かりは作業員1人（または1組）が1日に施工できる標準的な数量の基準値で、労務費計算の基礎となります。"},
  {id:28,cat:"積算部",type:"c",q:"積算で「設計単価」を使用する意味はどれか。",o:["発注者から指定された販売価格","過去の工事から算出した最高単価","競合他社の見積単価","材料の小売価格","下請業者の希望単価","国や業界団体が定めた標準的な工事単価"],a:"F",ex:"設計単価は国土交通省や各都道府県が定める積算基準等に基づく標準的な工事単価で、公共工事積算の基準として使用します。"},
  {id:29,cat:"積算部",type:"c",q:"工事費の構成として「純工事費」に含まれないものはどれか。",o:["一般管理費","労務費","直接工事費","仮設工事費","外注費","材料費"],a:"A",ex:"純工事費は直接工事費＋共通仮設費で構成されます。一般管理費（本社経費等）は純工事費に含まれず、総工事費に加算されます。"},
  {id:30,cat:"積算部",type:"c",q:"「見積書」を提出する際に確認すべき主な事項はどれか。",o:["担当者の名前のみ","封筒のデザイン","金額・工期・工事範囲・仕様が依頼内容と合っているか","競合他社の見積金額","発注者の経営状況","社内の承認者数"],a:"C",ex:"見積書提出前は金額・工期・工事範囲・仕様が発注者の依頼内容と一致しているか確認し、不備があれば修正してから提出します。"}

// ========== 建設業検定 3級 ==========
const KENSETSU_Q3 = [
  // 【現場担当者】
  {id:1,cat:"現場担当者",type:"c",q:"「バーチャート工程表」の特徴として正しいものはどれか。",o:["作業間の依存関係（クリティカルパス）を分析できる","コスト管理に特化した管理表","各作業の開始・終了を横棒で示し全体を把握しやすい","品質基準を定めたチェックリスト","資材の発注時期を管理する表","作業員の配置計画を示す表"],a:"C",ex:"バーチャート工程表は各作業を横棒（バー）で表し、開始・終了時期と全体の進捗を視覚的に把握しやすい工程管理ツールです。"},
  {id:2,cat:"現場担当者",type:"c",q:"「施工計画書」を作成する主な目的はどれか。",o:["完成後に発注者へ提出するための報告書","工事の安全・品質・工程等の実施方針を事前にまとめるため","経理部の原価集計のため","下請業者への発注書として使うため","設計図面の代替として使うため","材料の仕入れ先を決めるため"],a:"B",ex:"施工計画書は工事着工前に安全管理・品質管理・工程管理・環境管理などの実施方針をまとめた文書で、関係者間で共有します。"},
  {id:3,cat:"現場担当者",type:"c",q:"施工中に設計変更が生じた場合の対応として正しいものはどれか。",o:["現場担当者が独断で変更して施工を続ける","口頭で合意を得れば文書化は不要","変更は後から請求書に反映すればよい","変更内容を文書で確認・合意してから施工する","発注者に知らせず完成後に報告する","設計者に無断で仕様を変更してよい"],a:"D",ex:"設計変更が生じた場合は、変更内容・費用・工期への影響を発注者・監理者と文書で確認・合意してから変更後の施工を行います。"},
  {id:4,cat:"現場担当者",type:"c",q:"コンクリート打設後の「養生」が必要な理由はどれか。",o:["見栄えをよくするため","次工程のスペースを確保するため","廃材を覆い隠すため","施工写真の撮影を容易にするため","温度・湿度を保ちコンクリートの強度を確保するため","型枠を取り外しやすくするため"],a:"E",ex:"コンクリート養生は打設後に適切な温度・湿度を保ち、水和反応を促進して設計強度を確保するために必要な工程です。"},
  {id:5,cat:"現場担当者",type:"c",q:"「完成検査」で確認すべき主な事項はどれか。",o:["作業員の出勤率","設計図・仕様書通りに施工されているか不具合がないか","工事中の天気記録","材料のメーカー保証期間","原価管理表の内容","下請業者の資格証一覧"],a:"B",ex:"完成検査では設計図書・仕様書通りに施工されているか、不具合・未完了箇所がないかを発注者・監理者立会いのもと確認します。"},
  {id:6,cat:"現場担当者",type:"c",q:"「ヒヤリハット報告」を行う目的はどれか。",o:["作業員の個人評価に使うため","保険会社への申告のため","発注者への定期報告のため","重大事故に至る危険事象を共有し再発を防ぐため","工事費用の増額を申請するため","現場監督の業績評価に使うため"],a:"D",ex:"ヒヤリハット報告は「ヒヤリとしたが事故に至らなかった事象」を共有し、再発防止策を講じて重大事故を未然に防ぐ制度です。"},
  // 【経理部】
  {id:7,cat:"経理部",type:"c",q:"「未成工事支出金」とはどれか。",o:["完成工事の未回収代金","下請への未払い代金","工事完成前の資産を処分した利益","発注者から受け取った前受金","工事完成前に発生した原価を一時集計する勘定科目","完成後の瑕疵担保費用"],a:"E",ex:"未成工事支出金は工事完成・引渡し前に発生した材料費・労務費等の原価を一時的に集計する勘定科目（資産）です。"},
  {id:8,cat:"経理部",type:"c",q:"「完成工事未収入金」とはどれか。",o:["工事中の材料費の未払い分","工事完成・引渡し後の未収の請負代金","前払いで受け取った代金","設計費用の未請求分","下請への未払い外注費","施工中の労務費未払い分"],a:"B",ex:"完成工事未収入金は工事完成・引渡しは済んでいるが、まだ代金を受け取っていない売掛金相当の勘定科目（資産）です。"},
  {id:9,cat:"経理部",type:"c",q:"建設業での「前払金」受取時の経理処理はどれか。",o:["売上として計上する","借入金として計上する","未成工事受入金として負債に計上する","雑収入として計上する","前払費用として資産計上する","資本金として計上する"],a:"C",ex:"発注者から受け取った前払金は、工事完成・引渡し前は「未成工事受入金」として負債に計上し、完成時に収益へ振り替えます。"},
  {id:10,cat:"経理部",type:"c",q:"下請への支払い期限に関する建設業法の規定はどれか。",o:["請求書受領から10日以内","月末締め翌月末払いが原則","工事完成から30日以内","引渡しの申出を受けた日から50日以内","検収完了から60日以内","工事着手から90日以内"],a:"D",ex:"建設業法では元請が発注者から代金を受領した日から1か月以内、かつ下請からの引渡し申出日から50日以内に支払う義務があります。"},
  {id:11,cat:"経理部",type:"c",q:"「外注費」と「労務費」の違いとして正しいものはどれか。",o:["同じ意味で使われる用語","外注費は材料費の一種","外注費は外部業者への発注費、労務費は自社作業員の人件費","労務費は機械賃借料を含む","外注費のみが工事原価に含まれる","労務費は完成後に計上する"],a:"C",ex:"外注費は外部の協力業者（下請）への発注費用、労務費は自社で直接雇用している作業員等の人件費です。どちらも工事原価を構成します。"},
  {id:12,cat:"経理部",type:"c",q:"工事原価の主な構成要素として正しい組み合わせはどれか。",o:["売上高・利益・固定費","人件費・広告費・接待費","材料費・減価償却費・福利厚生費","材料費・労務費・外注費・経費","広告費・旅費・通信費・印刷費","仕入費・販売費・管理費"],a:"D",ex:"工事原価は材料費・労務費・外注費・経費（現場経費）の4つで構成されます。これが建設業の売上原価に相当します。"},

  {id:17,cat:"設計部",type:"c",q:"「設計VE（バリューエンジニアリング）」とは何か。",o:["完成後の建物の市場価値評価","必要な機能を維持しながらコストを削減するための設計改善手法","省エネ設備のみを選定する手法","法的規制の最低基準を満たす設計","建物の資産価値を算定する手法","デザインの優先度を高める設計手法"],a:"B",ex:"設計VEは建物に必要な機能・品質を確保しながら、材料・工法・仕様を見直してコスト削減を図る設計段階での改善活動です。"},

  {id:21,cat:"総務部",type:"c",q:"「男女雇用機会均等法」が建設会社に求めることはどれか。",o:["採用・配置・昇進・教育訓練等で性別による差別的取り扱いをしないこと","女性社員の採用を優先すること","男女で賃金に差をつけてよい","女性は現場業務から除外してよい","育児休業は女性のみが取得できる","管理職の女性比率を50%にすること"],a:"A",ex:"男女雇用機会均等法は採用・配置・昇進・研修・定年・退職・解雇等のあらゆる局面で性別による差別を禁止しています。"},

  {id:28,cat:"積算部",type:"c",q:"「概算積算」と「実施積算」の違いはどれか。",o:["概算積算は大まかな費用把握、実施積算は詳細図書に基づく精密な費用算出","同じ意味で使われる","概算積算は施工後、実施積算は設計前に行う","概算積算は積算部、実施積算は経理部が担当","どちらも同じ精度で行う","概算積算は不要で実施積算のみでよい"],a:"A",ex:"概算積算は計画段階で事業費の大枠を把握するもの。実施積算は詳細設計図書に基づいて詳細な数量・単価で精密に算出するものです。"},
  {id:29,cat:"積算部",type:"c",q:"「歩掛かりの見直し」が必要になる主な場合はどれか。",o:["社員の給与が上がった場合","設計図面の枚数が増えた場合","施工技術の変化・新工法の導入・地域特性等により実態と乖離が生じた場合","発注者から要求された場合のみ","競合他社が見直した場合のみ","5年ごとに定期的に行うのみ"],a:"C",ex:"歩掛かりは施工技術の進歩・新工法導入・機械化・地域の労働慣行変化等で実態と乖離が生じた場合に見直しが必要です。"},

  {id:9,cat:"経理部",type:"c",q:"「経審のX2点数（自己資本額及び平均利益額）」を高めるのに有効な施策はどれか。",o:["売上高だけを増やす","借入金を増やし投資を拡大する","従業員数を減らす","設備投資を最大化する","役員報酬を増やす","自己資本の充実（内部留保・増資等）と利益率の向上"],a:"F",ex:"X2は自己資本額と平均利益額（営業利益+減価償却費の平均）で算定されます。内部留保の積み上げ・増資・収益性向上が有効です。"},

function openResultMailto(toEmail,toName,level,autoCorrect,autoTotal,opens,passed,timedOut){
  if(!toEmail)return;
  const rate=autoTotal>0?Math.round(autoCorrect/autoTotal*100):0;
  const passLabel=passed===true?"合格":passed===false?"不合格":"—";
  const subject=encodeURIComponent("【建設PAD検定】"+level+"級 受験結果");
  const nl="\n";
  const body=encodeURIComponent(
    toName+" さん"+nl+nl+
    "建設PAD検定の受験結果をお知らせします。"+nl+nl+
    "━━━━━━━━━━━━━━━━"+nl+
    "　級　　："+level+"級"+nl+
    "　得点　："+(autoTotal>0?autoCorrect+" / "+autoTotal+"問":"—")+nl+
    "　正答率："+(autoTotal>0?rate+"%":"—")+nl+
    "　判定　："+passLabel+nl+
    (timedOut?"　※時間切れで終了しました"+nl:"")+
    "　受験日："+new Date().toLocaleDateString("ja-JP")+nl+
    "━━━━━━━━━━━━━━━━"+nl+nl+
    "引き続き学習を頑張ってください。"+nl+
    "KENZO検定"
  );
  window.location.href="mailto:"+toEmail+"?subject="+subject+"&body="+body;
}

function sendToSheets(r){
  if(!state.sheetsUrl)return;
  const kind=r.kind==="fde"?"建設FDE検定":r.kind==="cs"?"CS検定":"建設PAD検定";
  const rate=r.autoTotal>0?Math.round(r.autoCorrect/r.autoTotal*100):"";
  const passed=r.passed===true?"合格":r.passed===false?"不合格":"未採点";
  // 受験回数を計算
  const sameLv=state.results.filter(x=>x.userEmail===r.userEmail&&x.kind===r.kind&&x.level===r.level);
  const attemptNo=sameLv.length;
  const payload={受験者名:r.userName||"不明",メールアドレス:r.userEmail||"",検定種別:kind,級:r.level+"級",受験日:r.date||"",受験回数:attemptNo,正答数:r.autoCorrect||0,総問題数:r.autoTotal||0,"正答率(%)":rate,合否:passed};
  fetch(state.sheetsUrl,{method:"POST",body:JSON.stringify(payload)}).catch(()=>{});
}

let timerInterval=null;
function startTimer(secs){
  clearInterval(timerInterval);
  state.timeLeft=secs;
  timerInterval=setInterval(()=>{
    if(state.timeLeft<=0){clearInterval(timerInterval);handleTimeout();return;}
    state.timeLeft--;
    const tmrEl=document.querySelector('.tmr');
    if(tmrEl){
      tmrEl.textContent="⏱ "+fmtTime(state.timeLeft);
      tmrEl.className='tmr'+(state.timeLeft<=60?' warn':'');
    }
  },1000);
}
function stopTimer(){clearInterval(timerInterval);state.timeLeft=null;}
function handleTimeout(){
  const u=state.currentUser;
  const corr=state.session.filter(a=>a.correct===true).length;
  const total=state.session.length;
  const rate=total>0?Math.round(corr/total*100):0;
  const nr={
    id:Date.now(),date:new Date().toLocaleDateString("ja-JP"),
    level:state.examLv,week:state.examWk,
    autoCorrect:corr,autoTotal:total,openCount:0,
    total:state.examQs.length,passed:rate>=80,
    userName:u?u.name:"不明",userEmail:u?u.email:"",
    timedOut:true,mode:"exam",kind:state.examKind
  };
  state.results=[nr,...state.results];
  state.timeLeft=null;state.timedOut=true;state.done=true;
  saveData();
  sendToSheets(nr);

// ===== 記述式 自動採点（ニュアンスマッチング） =====
function autoGradeOpen(userAns, gradingAns){
  if(!userAns||!gradingAns)return false;
  const ua=userAns.trim();
  const uaNorm=ua.replace(/[ぁ-ん]/g,s=>String.fromCharCode(s.charCodeAt(0)+0x60))
                  .toLowerCase().replace(/\s+/g,"");
  const tokens=gradingAns.split(/[、,・。\n（）【】：「」『』,\s\/＋　]+/)
    .map(t=>t.trim()).filter(t=>t.length>=2||/^[a-zA-Z]$/.test(t));
  if(tokens.length===0)return false;
  const uaWords=ua.split(/[、,・。\s\n（）【】：「」　]+/).map(w=>w.trim()).filter(w=>w.length>=1);
  const matched=tokens.filter(t=>{
    const tNorm=t.replace(/[ぁ-ん]/g,s=>String.fromCharCode(s.charCodeAt(0)+0x60))
                  .toLowerCase().replace(/\s+/g,"");
    if(ua.includes(t)||uaNorm.includes(tNorm))return true;
    if(uaWords.some(w=>w.length>=2&&(t.includes(w)||tNorm.includes(w.toLowerCase()))))return true;
    if(t.length>=3&&(ua.includes(t.slice(0,Math.ceil(t.length*0.5)))||uaNorm.includes(tNorm.slice(0,Math.ceil(tNorm.length*0.5)))))return true;
    if(t.length>=4){
      const chars=[...t];
      const charHits=chars.filter(c=>ua.includes(c)).length;
      if(charHits/chars.length>=0.6)return true;
    }
    return false;
  }).length;
  const threshold=tokens.length<=2?1/tokens.length:0.5;
  return matched/tokens.length>=threshold;
}

// ========== DOM helpers ==========
function el(tag,attrs={},...children){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==="cls")e.className=v;
    else if(k==="style")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of children){
    if(c===null||c===undefined)continue;
    if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}
function div(cls,...children){return el("div",{cls},...children);}
function btn(cls,text,onclick){return el("button",{cls,onClick:onclick},text);}
function badge(cls,text){return el("span",{cls:"badge "+cls},text);}
function passedBadge(passed,mode){
  if(passed===true)return badge("bp","合格");
  if(passed===false)return badge("bf","不合格");
  return badge("bpd","採点中");
}
