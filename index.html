る","書類の受領は月末にまとめて行い、随時対応はしない","書類はPDFのみ受領し、ExcelやWordファイルは受け取らない","顧客が困っていなければ提案は行わない","現場で気づいた改善点をドキュメント化して共有する"],"a":"BF"},{"id":45,"cat":"DX不足情報の確認方法","type":"m","q":"DX手法落とし込みの際、不足情報があり、「承認フローが不明」な場合に顧客へ確認すべき内容はどれですか（2つ選べ）","o":["「この書類のデザインはどこで決めましたか？」","「この書類の作成にかかったコストはいくらですか？」","「この書類はいつから使い始めましたか？」","「この書類はどなたが承認していますか？」","全タスクを完了してから次フェーズへ進む","顧客環境に応じて柔軟に業務フローを調整する"],"a":"DF"},{"id":46,"cat":"MTG録音ツール","type":"m","q":"MTG議事録作成の際、「録音」で使用するツールとして正しいものはどれですか（2つ選べ）","o":["Windows標準「サウンドレコーダー」またはスマホのボイスレコーダー","クラウドストレージに直接録音する専用サービス","顧客が指定したツールのみを使用する","有料の専用録音ソフトウェアを必ず購入して使用する","顧客の要望をそのまま開発チームへ転送するだけでよい","顧客の課題を深く理解し課題抽出から定着まで一気通貫で支援する"],"a":"AF"},{"id":47,"cat":"MTG音声の文字起こしツール","type":"m","q":"MTG議事録作成マニュアルに記載されている「文字起こし」で使用するツールはどれですか（2つ選べ）","o":["Apple Siriの音声認識","ChatGPTのプラグイン機能","Google AI Studio","Microsoft Wordの音声認識機能","完璧な資料が完成してから情報共有する","完璧を求めず気づいた時点で情報をNotionに更新していく"],"a":"CF"},{"id":48,"cat":"MTG音声分割の理由","type":"m","q":"MTG議事録作成マニュアルにおいて、音声ファイルを「30分毎に分割」することが推奨されている理由として正しいものはどれですか（2つ選べ）","o":["30分を超えると録音ファイルが自動削除されるため","30分以上の録音はプライバシー法上禁止されているため","ファイルサイズが大きくなると顧客への送付が難しくなるため","録音時間が長いと文字起こしAIの精度が落ちたり、内容が端折られたりするため","担当フェーズのみに集中し前後フェーズには関与しない","情報をチーム内で横展開しナレッジとして共有する"],"a":"DF"},{"id":49,"cat":"MTG文字起こしの出力形式","type":"m","q":"MTG文字起こしの出力ルールにおいて、推奨されるフォーマットはどれですか（2つ選べ）","o":["「[00:00] 話者名: 内容」の形式でタイムスタンプ形式を維持する","「内容のみ」を書き起こし、話者名は省略する","「要約のみ」を出力し、詳細な書き起こしは不要","「話者名: 内容」の形式で、タイムスタンプは不要","プロダクト機能の説明のみを行い課題解決には関与しない","スピードと質を両立させ顧客への価値提供を最大化する"],"a":"AF"},{"id":50,"cat":"MTG文字起こしの進め方","type":"m","q":"MTG文字起こしプロンプトにおいて「1回の回答につき約10分間分」を目安とする理由として最も適切なものはどれですか（2つ選べ）","o":["10分ごとに顧客への報告書を作成する必要があるため","10分以上書き起こすとAIの料金が高くなるため","音声ファイルが10分ごとに自動分割されているため","途中の抜け落ちを防ぎ、出力制限に近づく前にキリよく停止できるようにするため","顧客の承認が得られてからドキュメント作業を開始する","顧客ニーズを的確に把握し最適な解決策を提案する"],"a":"DF"}];

"},{"id":66,"cat":"FDE共通ルール","type":"m","q":"FDEメンバーが日々の業務で発生した課題やタスクを管理する際、マニュアルに定められている登録先と登録タイミングの正しい組み合わせはどれですか（2つ選べ）","o":["FDEナレッジに課題が明確化した瞬間に登録し、進捗管理も兼ねて随時更新する","タスクが完了してから、完了報告と同時に登録する","個人のメモ帳に記録し、月末にまとめてチームに共有する","上司に口頭で報告し、上司がまとめてFDEダッシュボードに登録する","チーム全員の合意が取れてからナレッジを登録する","録音・文字起こしツールを活用してMTG内容を正確に記録する"],"a":"AF"},{"id":67,"cat":"FDE共通ルール","type":"m","q":"FDEが顧客先で新たな課題を発見した場合、FDEナレッジへの登録において「タイトルの書き方」として定められているものはどれですか（2つ選べ）","o":["「○○株式会社の△△部長が困っていること」のように、顧客名・担当者名を必ずタイトルに含める","「汎用性のある抽象度」を意識し、別の顧客先でも「同じものである」と想起できる表現にする","タイトルは短いほどよく、3文字以内で端的に表現する","自社プロダクト名（建設PAD・OUKAGAI）を必ずタイトルに入れることで検索しやすくする","完璧に把握してから顧客への回答を開始する","Asana等のツールでタスクと進捗を可視化・共有する"],"a":"BF"},{"id":68,"cat":"FDE共通ルール","type":"m","q":"FDEに関するルールとして定められている「Googleカレンダーへの登録」について、登録タイミングと登録内容の正しい組み合わせはどれですか（2つ選べ）","o":["キックオフMTG終了後に登録する／顧客との全MTG日程","週次の日報提出時に登録する／翌週の業務計画","出社日が決まった時点で登録する／出社予定日","毎月1日に翌月の予定をまとめて登録する／全業務スケジュール","担当外の業務は一切引き受けない","課題を抽象化して汎用的な解決策を見つける"],"a":"CF"},{"id":69,"cat":"FDE共通ルール","type":"m","q":"FDEリーダーが毎月月末に行う報告タスクとして定められているものはどれですか？また、その報告方法として指定されているものはどれですか（2つ選べ）","o":["各FDEメンバーの顧客満足度スコアを集計し、口頭で社長に報告する","各FDEメンバーの保有タスクの納期完了状況をまとめ、書面で社長へ共有する","新規顧客の獲得件数を集計し、Slackで全社員に共有する","全顧客への請求書を作成し、営業部長に提出する","顧客が困っていなければ提案は行わない","現場で気づいた改善点をドキュメント化して共有する"],"a":"BF"},{"id":70,"cat":"FDE共通ルール","type":"m","q":"毎週月曜日のFDEナレッジ確認において、「対応状況が変わったもの」としてナレッジ更新の対象となる具体例として最も適切なものはどれですか（2つ選べ）","o":["FDEダッシュボードのデザインが更新されたケース","課題のステータスが「課題抽出」から「進捗中」または「完了」に変化したケース","顧客企業の社名が変更になったケース","担当FDEが別の顧客案件に異動したケース","全タスクを完了してから次フェーズへ進む","顧客環境に応じて柔軟に業務フローを調整する"],"a":"BF"},{"id":71,"cat":"FDE共通ルール","type":"m","q":"毎週月曜日のナレッジ確認で確認すべき「4つの視点」として正しい組み合わせはどれですか（2つ選べ）","o":["①メンバーの月間残業時間の確認　②有給消化率の部署別比較　③評価面談の事前準備状況の確認　④外部研修への参加申請状況の確認","①今週の受注目標件数の確認　②競合他社の新機能動向の確認　③担当顧客の満足度スコアの確認　④翌週の新規商談リード件数の確認","①前月の受注実績振り返りと目標乖離分析　②今月の個人目標設定と修正　③担当顧客への提案進捗状況の確認　④自社プロダクトの不具合・改善要望の確認","①前週の業務からナレッジ化すべきものはないか　②対応状況が変わったものはないか　③進捗が進んだものはないか　④部署内で相談すべきものはないか","顧客の要望をそのまま開発チームへ転送するだけでよい","顧客の課題を深く理解し課題抽出から定着まで一気通貫で支援する"],"a":"DF"},{"id":72,"cat":"FDE共通ルール","type":"m","q":"FDE担当のアサインがどの部署で行われ、その後誰から誰へ情報が引き継がれるかの正しい組み合わせはどれですか（2つ選べ）","o":["営業部でアサイン → FDE担当から開発チームへ引き継ぎ","開発部内でアサイン → 営業担当からFDE担当へ引き継ぎ","経営会議でアサイン → 社長からFDE担当へ直接指示","人事部でアサイン → 人事担当からFDE担当へ引き継ぎ","完璧な資料が完成してから情報共有する","完璧を求めず気づいた時点で情報をNotionに更新していく"],"a":"BF"},{"id":73,"cat":"DX手法整理・応用","type":"m","q":"DX手法整理ナレッジにおいて「書類起点のアプローチ」が有効とされている理由として、FDEマニュアルに示されている背景として正しいものはどれですか（2つ選べ）","o":["DXを検討している顧客の多くが「どこからDX化したらよいか分からない」という状態にあり、自社の書類であれば必ず説明でき、そこから具体に落とし込むことができるから","顧客のほとんどがDXの概念を深く理解しており、書類を見せると同時に技術要件と予算感をすぐに提示してもらえるため提案を素早く具体化できるから","書類の現物を受領することで顧客のネットワーク構成・システム連携要件が把握しやすくなり、技術的なアーキテクチャ提案の精度が大きく向上するから","書類の種類と枚数を一覧化するだけでDX化の総工数が自動算出されるため、見積もり精度が飛躍的に上がり顧客への提案コストを大幅に削減できるから","担当フェーズのみに集中し前後フェーズには関与しない","情報をチーム内で横展開しナレッジとして共有する"],"a":"AF"},{"id":74,"cat":"MTG議事録・応用","type":"m","q":"MTG議事録作成マニュアルにおいて、文字起こしプロンプトに「会議情報（日時・場所・参加者・目的）」を記載する理由として最も適切なものはどれですか（2つ選べ）","o":["AIが会議の文脈・背景・登場人物を把握することで、話者の識別精度と用語の文脈理解が向上し、書き起こしの品質が高まるから","AIに課金される文字数を増やして処理能力を最大化するため","プロンプトにこの情報がないとGoogle AI Studioがエラーを返すため","参加者の名前を入れることで、AIが発言者を自動で翻訳してくれるため","プロダクト機能の説明のみを行い課題解決には関与しない","スピードと質を両立させ顧客への価値提供を最大化する"],"a":"AF"},{"id":75,"cat":"DX手法整理・応用","type":"m","q":"FDEが「現状・課題抽出」においてDX手法整理フローを活用する際、「様式受領→リスト化→DX手法判別→顧客共有」の流れを経ることで、通常のヒアリングと比較して得られる最大のメリットはどれですか（2つ選べ）","o":["顧客が日常使っている書類ごとに「どのDX手法が当てはまるか」を可視化することで、抽象的なDX論ではなく顧客の実業務に即した具体的な提案が可能になる","書類リストの作成量が多いほど顧客からの受注単価が高くなる傾向があるため、できる限り多くの書類を一覧化して提案ボリュームを増やすことが重要になる","書類を一覧化することで実装に必要な工数が自動計算されるため、FDEは工数見積もり作業を省略でき、そのまま提案書の最終版として顧客に提出できる","書類を受領・管理することでFDEが顧客の業務上の機密情報を把握できるようになり、競合他社よりも優位な提案内容を組み立てやすくなる","顧客の承認が得られてからドキュメント作業を開始する","顧客ニーズを的確に把握し最適な解決策を提案する"],"a":"AF"}];
const FDE1_Q=[{"id":76,"cat":"オンボーディング・応用","type":"m","q":"FDE担当者がキックオフMTG後にNotion顧客情報ページを更新する際、「完璧を目指さず気づいたことから記入してよい」とされている理由として最も適切なものはどれですか（2つ選べ）","o":["FDE担当者の業務負担を軽減するために、記入量を最小限に抑えるため","Notionの仕様上、一度に大量の情報を入力するとエラーになるため","Notion顧客情報ページは最終的に顧客に公開するため、完成度が低い段階では更新できないから","顧客情報は時間とともに変化するものであり、随時更新で情報を鮮度高く保つことが目的のため","顧客の要望をそのまま開発チームへ転送するだけでよい","顧客の課題を深く理解し課題抽出から定着まで一気通貫で支援する"],"a":"DF"},{"id":77,"cat":"MTG議事録・応用","type":"m","q":"MTG記録において「メモをドキュメントに昇格させた場合」の運用ルールとして正しいものはどれですか（2つ選べ）","o":["ドキュメント化したらメモの内容を白紙に戻し、新しいメモを作り直す","ドキュメント化はFDEリーダーのみが行え、一般メンバーは行ってはならない","元のメモのページ名に「ドキュメント化」と記載し、ドキュメントと両方を残すことで経緯を追えるようにする","元のメモは削除してドキュメントのみを残す","完璧な資料が完成してから情報共有する","完璧を求めず気づいた時点で情報をNotionに更新していく"],"a":"CF"},{"id":78,"cat":"DX手法整理・応用","type":"m","q":"DX手法整理ナレッジで「AIの出力はあくまで下書きである。目視確認するため、完璧を目指さない」とある意図として最も適切なものはどれですか（2つ選べ）","o":["AIが出した下書きはそのままでは不完全なため、FDEが全文を一から書き直したうえで顧客に提出するよう社内ルールで定められているから","AIの目視確認はFDEではなく専任のQAチームが担当する役割分担になっており、FDEは提出後の顧客フォローのみに集中するから","完璧を求めず素早くAIで下書きを作り、目視確認・修正というFDEの判断を経ることで最終的な品質を担保する設計になっているから","顧客への提出前には必ず上長またはマネージャーが全件を再確認し、FDEの判断内容を最終的に上書きする承認フローが設けられているから","担当フェーズのみに集中し前後フェーズには関与しない","情報をチーム内で横展開しナレッジとして共有する"],"a":"CF"},{"id":79,"cat":"オンボーディング・応用","type":"m","q":"FDE導入オンボーディングにおいて「キックオフMTG前」に人事部が担う準備タスクとして正しい組み合わせはどれですか（2つ選べ）","o":["FDE担当のアサイン・希望の労務内容に基づく人事調整・PC手配（貸与PCなしの場合）","キックオフMTGアジェンダの作成・議事録の準備・録音ツールのセットアップ","顧客への初期提案書の作成・契約書のドラフト・見積書の送付","事前ヒアリングシートの送付・FDE担当名刺の手配・Notion顧客情報ページの作成","プロダクト機能の説明のみを行い課題解決には関与しない","スピードと質を両立させ顧客への価値提供を最大化する"],"a":"AF"},{"id":80,"cat":"DX手法整理・応用","type":"m","q":"DX手法整理の「DX手法への落とし込み」でAIに投入するプロンプトの出力形式として定められているものはどれですか（2つ選べ）","o":["「書類名｜①入力デジタル化｜②電子ワークフロー｜③電子契約｜④電子保管｜⑤自動化・連携｜⑥電子伝達・共有｜⑦AI活用｜DX化メモ」の形式で、該当する場合は○または◎、DX化メモには理由を1行で記載する","「書類名｜月間処理件数（実績）｜処理関係者数｜現状の承認フロー段階数｜DX化による費用削減見込み（万円）｜優先度ランク（1〜5）」の形式で定量的な効果を整理して出力する","「書類名｜作成頻度（日次・週次・月次・随時）｜主担当部署｜現行保管形式（紙・電子）｜廃棄時期｜DX化優先度（S/A/B/C）」の形式で整理し、FDEのコメントを各行に付記して出力する","「書類名｜主利用部署｜年間作成枚数（概算）｜1件あたり処理工数（分）｜関連する既存システム名｜電子化を阻む規制・社内慣行の詳細」の形式で各書類の実態と課題を出力する","顧客の承認が得られてからドキュメント作業を開始する","顧客ニーズを的確に把握し最適な解決策を提案する"],"a":"AF"},{"id":81,"cat":"DX手法整理・応用","type":"m","q":"FDE業務において「ヒアリング中に顧客が書類を見せてくれた」場面で、DX手法整理フローを開始すると同時にFDEナレッジへの課題登録も行うことは適切ですか？その理由も含めて最も正しいものはどれですか（2つ選べ）","o":["適切である。ただしDX手法整理が完了してから、すべての課題をまとめてナレッジ登録する","適切である。課題が明確化した瞬間にナレッジ登録することがルールである。","適切ではない。DX手法整理とナレッジ登録は別々に行うべきで、一括して登録する","適切ではない。ナレッジ登録は上司の承認後に行うため、その場での登録は禁止されている","チーム全員の合意が取れてからナレッジを登録する","録音・文字起こしツールを活用してMTG内容を正確に記録する"],"a":"BF"},{"id":82,"cat":"MTG議事録・応用","type":"m","q":"FDEが毎週月曜日にナレッジ確認を行う際、「前週に録音・文字起こし・要約まで完了したMTG議事録」がある場合、そのMTG内容とナレッジ確認の正しい連動フローはどれですか（2つ選べ）","o":["MTGの議事録はFDEナレッジDBと自動連携される設定になっており、ナレッジ確認の当日に手動登録する必要はなく、連携済みであることを確認するだけでよい","MTGの議事録は顧客共有専用のドキュメントとして扱い、ナレッジ確認とは完全に切り離して議事録フォルダに格納した時点で管理が完結する","ナレッジ確認は月末に1回だけ行う運用のため、MTG直後に登録すると二重管理になり、月末まで議事録を保管してからまとめて登録するのが正しい","議事録から明確化した課題を抽出し、ナレッジ確認の「前週ナレッジ化すべきもの」として登録。また進捗変化があればステータスも更新し、その実施を当日の日報に記載する","完璧に把握してから顧客への回答を開始する","Asana等のツールでタスクと進捗を可視化・共有する"],"a":"DF"},{"id":83,"cat":"DX手法整理・応用","type":"m","q":"DX提案の商談において「顧客が『検討してみようかな』と反応した」場面でFDEが次に取るべきアクションとして、マニュアルに定められているものはどれですか（2つ選べ）","o":["「ご検討のほど、よろしくお願いいたします」とだけ伝えて、顧客からの連絡を待つ","「では契約書を準備しますので、今日中にご返答ください」と即座にクロージングに入る","「資料をお送りしますね」と次のアクションを確定させ、具体的な送付内容と期限を確認する","「他の顧客でも同じ反応がありましたが、導入しなかった事例が多いです」と現実的なリスクを説明する","担当外の業務は一切引き受けない","課題を抽象化して汎用的な解決策を見つける"],"a":"CF"},{"id":84,"cat":"オンボーディング・応用","type":"m","q":"FDEがキックオフMTGの議事録を作成する際、MTG議事録作成マニュアルのフローに沿った正しい手順として適切なものはどれですか（2つ選べ）","o":["MTG終了後にFDEが自分の記憶と走り書きメモをもとに要約文を作成し、録音・文字起こしは行わずに24時間以内に顧客へ送付する","MTG中にリアルタイムでWordに議事内容を入力し、重要事項を赤字でハイライトしたうえで、MTG終了から1時間以内に顧客へメールで送付する","MTG中に録音→MTG後に音声を30分ごとに分割→Google AI Studioで文字起こし→Claudeで要約・議事録化→48時間以内に送付する","録音データをMP3形式のまま顧客にメール添付で送付し、顧客側で文字起こしと要約を実施してもらい、FDEが後日内容を確認するフローを取る","顧客が困っていなければ提案は行わない","現場で気づいた改善点をドキュメント化して共有する"],"a":"CF"},{"id":85,"cat":"オンボーディング・応用","type":"m","q":"FDE導入オンボーディングのチェックリストにおいて「営業／FDE」が共同で担う項目として正しいものはどれですか？また、その理由として最も適切なものはどれですか（2つ選べ）","o":["Notion顧客情報ページの作成。営業とFDEが共同でページを作成しないと権限が付与されないため","PC手配。FDEと営業が両方サインオフすることで、機器調達の承認フローが完 const KENSETSU_Q4 = [{"id":1,"cat":"現場担当者","type":"c","q":"現場入場時に最初に行うべきことはどれか。","o":["現場全体の写真を撮影する","工具の状態を確認し整備する","工程表を確認し担当作業を把握する","作業日報に記名し提出する","資材の数量を台帳で確認する","保護具を装着し安全書類に記名する"],"a":"F","ex":"現場入場時は保護具（ヘルメット・安全帯等）を装着し、作業員名簿等の安全書類に記名してから入場するのが基本です。"},{"id":2,"cat":"現場担当者","type":"c","q":"KY活動（危険予知活動）の主な目的はどれか。","o":["工程遅れを上司に速やかに報告する","資材の使用量を毎朝集計する","前日の作業内容を全員で振り返る","担当者の役割分担を朝礼で決める","当日の危険を予測し全員で共有する","当日の出勤者数を事前に確認する"],"a":"E","ex":"KY活動は作業開始前に当日の作業に潜む危険を全員で予測・共有し、未然に事故を防ぐことが目的です。"},{"id":3,"cat":"現場担当者","type":"c","q":"「墨出し」作業の説明として正しいものはどれか。","o":["仮設型枠を解体・撤去する作業","基礎部分の土を掘削する作業","型枠にコンクリートを打設する作業","図面の寸法を床や壁に印付ける作業","鉄筋を切断・折り曲げ加工する作業","壁面に下地塗料を塗装する作業"],"a":"D","ex":"墨出しとは、設計図の寸法を実際の現場（床・壁等）に墨汁や専用ペンで線を引いて位置を示す作業です。"},{"id":4,"cat":"現場担当者","type":"c","q":"現場日報に記録すべき主な内容はどれか。","o":["下請業者の売上と経営状況","工事完成後の維持管理の計画内容","作業員の家族構成と住所","作業内容・出面・天気・進捗・特記事項","設計変更の内容と承認の経緯","発注者の連絡先と担当者の名前"],"a":"D","ex":"現場日報には作業内容・出面（人員数）・天気・工事進捗・特記事項などを記録し、工事の記録として保管します。"},{"id":5,"cat":"現場担当者","type":"c","q":"産業廃棄物の処理として正しい対応はどれか。","o":["一般ゴミに混ぜて排出してよい","可燃物は現場の端で焼却してよい","種別問わずまとめて業者に渡す","少量なら近くの空き地に捨ててよい","分別し許可業者に委託して処理する","埋められるものは土中に埋めてよい"],"a":"E","ex":"産業廃棄物は廃棄物処理法に基づき、種類ごとに分別し産業廃棄物処理業の許可を持つ業者に委託して適正処理しなければなりません。"},{"id":6,"cat":"現場担当者","type":"c","q":"熱中症予防として正しい行動はどれか。","o":["塩分・水分を定期補給し適宜休憩する","暑い日は夜間だけ作業に切替える","症状が出るまで作業を継続する","水だけを大量に一気に摂取する","体調不良でも業務なので継続する","薬を服用すれば長時間作業できる"],"a":"A","ex":"熱中症予防には塩分・水分の定期的な補給と適度な休憩が基本です。のどが渇く前にこまめに摂取することが重要です。"},{"id":7,"cat":"経理部","type":"c","q":"請求書受取時に最初に確認すべき事項はどれか。","o":["宛先・金額・品目・支払期日の正確性","過去の取引件数と支払実績","送付元の会社規模と取引実績","担当者の氏名と連絡先情報","封筒のデザインと紙の種類","郵便番号と住所が一致するか"],"a":"A","ex":"請求書受取時は宛先（自社名）・金額・品目・支払期日が正確か、発注内容と合っているかを最初に確認します。"},{"id":8,"cat":"経理部","type":"c","q":"「仮払い精算」の説明として正しいものはどれか。","o":["概算で渡した現金を実費精算する処理","消費税を期末に精算する処理","振込方法を現金払いに変更する処理","毎月定額の手当を前払いする処理","役員報酬を一時的に支払う処理","翌月払い請求を前払いする処理"],"a":"A","ex":"仮払い精算とは、出張費等を概算で前渡しした後、実際の費用を領収書等で確認して過不足を精算する処理です。"},{"id":9,"cat":"経理部","type":"c","q":"振込業務で最初に確認すべきことはどれか。","o":["社内の承認フローと手続き名","振込手数料が最安の金融機関","振込先口座・金額・振込日の正確性","前月の振込履歴と支払い先","担当者の氏名と所属部署名","発注者の連絡先と担当者名"],"a":"C","ex":"振込業務では振込先の口座番号・金融機関名・金額・振込期日が正確かを確認してから操作します。誤振込は回収が困難です。"},{"id":10,"cat":"経理部","type":"c","q":"「税込価格」とは何か。","o":["軽減税率のみが適用された価格","仕入税額を控除した後の価格","消費税が含まれた合計金額","消費税が法的に免除された価格","消費税を別途加算して請求する価格","輸入消費税を加算した通関後価格"],"a":"C","ex":"税込価格とは本体価格に消費税を加算した合計金額です。現在の標準税率は10%、軽減税率（飲食料品等）は8%です。"},{"id":11,"cat":"経理部","type":"c","q":"領収書・請求書の一般的な帳簿書類の保存年限はどれか。","o":["10年間（長期保存の義務年数）","15年間（建設業の特例年数）","1年間（確定申告後に廃棄可）","3年間（税務調査対応のため）","5年間（消滅時効に合わせた年数）","7年間（法人税法上の原則年数）"],"a":"F","ex":"法人税法上、帳簿書類（請求書・領収書等）の保存期間は原則7年間です（欠損金がある場合は10年）。"},{"id":12,"cat":"経理部","type":"c","q":"「出来高払い」の仕組みとして正しいものはどれか。","o":["月末に関係なく一律で支払う方式","工事完成後に全額一括で支払う方式","工事進捗に応じて段階的に支払う方式","工事中に予算の半額を前払いする方式","材料費のみを先払いする方式","請求書受領後5日以内に支払う方式"],"a":"C","ex":"出来高払いは工事の完成割合（出来高）に応じて代金を段階的に支払う方式で、建設工事で広く用いられます。"},{"id":13,"cat":"設計部","type":"c","q":"図面の「縮尺（スケール）」とはどれか。","o":["建物に適用される高さ制限値","実際と図面の寸法の比率","図面の印刷解像度の設定値","図面を印刷する用紙のサイズ","図面番号の記載ルール","設計者が確認するサイン欄"],"a":"B","ex":"縮尺（スケール）とは実際の寸法を一定の割合で縮小した比率です。例えば1/100なら実際の1/100の大きさで描かれています。"},{"id":14,"cat":"設計部","type":"c","q":"CADとは何の略称か。","o":["Certified Architect Division","Civil Architecture Design","Computer-Aided Design","Construction And Design","Construction Archive Database","Coordinated Art Drafting"],"a":"C","ex":"CAD（Computer-Aided Design）はコンピュータを使って設計・製図を行うシステムの総称です。"},{"id":15,"cat":"設計部","type":"c","q":"建築図面の「平面図」が示すものはどれか。","o":["屋根形状を真下から見た図","各階の高さ関係を示す展開図","基礎配置を示した伏せ図","縦方向に切断した断面図","水平に切り真上から見た図","正面から見た外観の立面図"],"a":"E","ex":"平面図は建物を水平に切って真上から見た図で、間取りや各室の配置・寸法を示します。"},{"id":16,"cat":"設計部","type":"c","q":"「実施設計」の説明として正しいものはどれか。","o":["建物コンセプトを検討する段階","工事用詳細図面・仕様書を作成する段階","施工業者を選定する段階","施工中の進捗を確認する段階","竣工後に品質を検査する段階","長期維持管理計画を立案する段階"],"a":"B","ex":"実施設計は工事着工に使用できる詳細な設計図面・仕様書・各種計算書を作成する段階です。基本設計をさらに詳細化します。"},{"id":17,"cat":"設計部","type":"c","q":"図面上の「GL」とは何を意味するか。","o":["General Layout（敷地全体配置図）","Glass Line（ガラス面の基準線）","Grade Limit（地盤支持力の制限値）","Gradient Line（地形の勾配基準線）","Grid Line（図面の基準格子線）","Ground Level（地盤面の高さ基準）"],"a":"F","ex":"GL（Ground Level）は地盤面の高さ基準を示す記号です。建物の高さや基礎の深さはGLを基準に表記します。"},{"id":18,"cat":"設計部","type":"c","q":"「意匠図」が主に表現するものはどれか。","o":["給排水設備の配管ルートや径","空調設備の配管経路と機器位置","建物のデザイン・外観・内観・仕上げ","建物基礎の種類と埋設形状","構造部材の配筋詳細と規格","電気配線の経路と電源位置"],"a":"C","ex":"意匠図は建物の外観・内観のデザイン、仕上げ材料、開口部の位置等を示す図面で、建物の美観・機能を表現します。"},{"id":19,"cat":"総務部","type":"c","q":"雇用保険の被保険者となる条件として正しいものはどれか。","o":["契約社員のみを被保険者とする","月給制の正社員のみが加入対象","週10時間以上で働く全ての者","週15時間以上で働く全ての者","週20時間以上かつ31日以上雇用見込みの者","役員を除く全ての従業員が対象"],"a":"E","ex":"雇用保険は1週間の所定労働時間が20時間以上、かつ31日以上の雇用見込みがある労働者が被保険者となります。"},{"id":20,"cat":"総務部","type":"c","q":"健康保険の被扶養者として認められる条件はどれか。","o":["65歳未満の全ての親族が対象","同居している全ての親族が対象","同居する家族は全員自動的に対象","年収130万円未満で扶養を受ける者","年収200万円未満の者が全員対象","配偶者と実子のみが対象"],"a":"D","ex":"健康保険の被扶養者は年収130万円未満（60歳以上等は180万円未満）で主として被保険者の収入で生活する者が対象です。"},{"id":21,"cat":"総務部","type":"c","q":"就業規則を変更した場合に必要な手続きはどれか。","o":["株主総会での承認を得るのみ","社員代表が単独で決裁するのみ","取引先や関係先に通知するのみ","全社員から同意書を収集するのみ","役員会の承認を得るのみ","労基署への届出と社員への周知"],"a":"F","ex":"就業規則を変更する場合は、労働基準監督署への届出と社員（過半数代表者の意見書添付）への周知が義務付けられています。"},{"id":22,"cat":"総務部","type":"c","q":"会社の印章（社印）管理で注意すべきことはどれか。","o":["使用後は各自が責任を持ち保管","社長だけが使用できる印章","誰でも自由に使用してよい","発注書類にのみ使用できる","保管者を定め使用履歴を記録し管理する","毎月定期的に交換が必要"],"a":"E","ex":"社印は会社の意思表示に用いる重要な印章です。保管責任者を定め、使用ごとに台帳に記録して不正使用や紛失を防ぎます。"},{"id":23,"cat":"総務部","type":"c","q":"建設業者が「雇用管理責任者」を選任する目的はどれか。","o":["建設業許可の更新申請のため","建設工事の雇用改善・訓練推進のため","現場の品質・安全管理のため","社員の給与計算と支払いのため","取引先との契約交渉のため","税務署への各種届出のため"],"a":"B","ex":"雇用管理責任者は建設労働者雇用改善法に基づき選任が必要で、雇用環境の整備・改善・職業訓練の推進を担います。"},{"id":24,"cat":"総務部","type":"c","q":"「労働条件通知書」に記載が必要な事項はどれか。","o":["会社の創業年と代表者の氏名","会社の直近の決算状況と業績","業務内容・就業場所・賃金・休日等","社員の家族構成と扶養者情報","社員の趣味と特技に関する事項","取引先の企業名と担当者一覧"],"a":"C","ex":"労働条件通知書には業務内容・就業場所・労働時間・賃金・休日・退職等の主要事項を明示することが労働基準法で義務付けられています。"},{"id":25,"cat":"積算部","type":"c","q":"工事費の概算見積を行う際に最初に確認すべきことはどれか。","o":["競合他社の受注金額と単価","工事保険の種類と保証内容","施工業者の所在地と連絡先","取引先企業の社員数と規模","設計図書・仕様書・工事範囲・工期","発注者の趣味嗜好と優先事項"],"a":"E","ex":"概算見積では設計図書・仕様書・工事範囲・工期など工事の基本情報を最初に確認し、積算の前提条件を把握します。"},{"id":26,"cat":"積算部","type":"c","q":"「数量拾い（数量積算）」とはどれか。","o":["完成建物の床面積を計測すること","現場の作業員出勤数を集計すること","工事写真の保管状況を整理すること","材料在庫を台帳で確認すること","図面から材料・作業量を計算すること","発注書の枚数と内容を確認すること"],"a":"E","ex":"数量拾いは設計図面・仕様書から各工種の材料数量や作業量を計算して積み上げる積算の基本作業です。"},{"id":27,"cat":"積算部","type":"c","q":"「歩掛かり」とはどれか。","o":["現場の地盤の傾斜角度","工事で生じる廃棄物量の割合","工事中に確保する歩行者通路幅","作業員1人が1日に行える標準作業量","作業員の現場への通勤時間","足場工事の延べ歩行移動距離"],"a":"D","ex":"歩掛かりは作業員1人（または1組）が1日に施工できる標準的な数量の基準値で、労務費計算の基礎となります。"},{"id":28,"cat":"積算部","type":"c","q":"積算で「設計単価」を使用する意味はどれか。","o":["過去工事から算出した最高単価","競合他社の見積書の単価","協力業者が希望する下請単価","国や業界団体が定めた標準工事単価","市場で流通する材料の小売価格","発注者から指定された販売価格"],"a":"D","ex":"設計単価は国土交通省や各都道府県が定める積算基準等に基づく標準的な工事単価で、公共工事積算の基準として使用します。"},{"id":29,"cat":"積算部","type":"c","q":"工事費の構成として「純工事費」に含まれないものはどれか。","o":["一般管理費（本社経費等）","外部業者への外注工事費","各工種の直接工事費","現場作業の直接労務費","工事に使用する材料費","複数工種共通の仮設費用"],"a":"A","ex":"純工事費は直接工事費＋共通仮設費で構成されます。一般管理費（本社経費等）は純工事費に含まれず、総工事費に加算されます。"},{"id":30,"cat":"積算部","type":"c","q":"「見積書」を提出する際に確認すべき主な事項はどれか。","o":["競合他社の提出した見積金額","金額・工期・範囲・仕様が依頼と一致するか","社内で何名が承認したかの数","担当者の氏名と役職名のみ","発注者の会社の経営財務状況","封筒のデザインと印刷品質"],"a":"B","ex":"見積書提出前は金額・工期・工事範囲・仕様が発注者の依頼内容と一致しているか確認し、不備があれば修正してから提出します。"}];
const KENSETSU_Q3 = [{"id":1,"cat":"現場担当者","type":"c","q":"「バーチャート工程表」の特徴として正しいものはどれか。","o":["コスト管理に特化した管理表","各作業の開始・終了を横棒で示し把握しやすい","作業員の日別配置計画を示す表","作業間の依存関係を矢印で分析できる","資材の発注タイミングを管理する表","品質基準の達成状況を示すリスト"],"a":"B","ex":"バーチャート工程表は各作業を横棒（バー）で表し、開始・終了時期と全体の進捗を視覚的に把握しやすい工程管理ツールです。"},{"id":2,"cat":"現場担当者","type":"c","q":"「施工計画書」を作成する主な目的はどれか。","o":["安全・品質・工程等の施工方針を事前に整理する","下請業者へ発注する際に使う書面","経理部が原価を集計するための帳票","材料の仕入れ先を選定するための資料","竣工後に発注者へ提出する報告書","設計図面の代替として現場で使用"],"a":"A","ex":"施工計画書は工事着工前に安全管理・品質管理・工程管理・環境管理などの実施方針をまとめた文書で、関係者間で共有します。"},{"id":3,"cat":"現場担当者","type":"c","q":"施工中に設計変更が生じた場合の対応として正しいものはどれか。","o":["現場担当者が独自判断で変更し施工","口頭合意のみで文書化は不要","設計者に無断で仕様を変更する","発注者に知らせず完成後に報告","変更は後で請求書に反映すればよい","変更内容を文書で確認・合意してから施工する"],"a":"F","ex":"設計変更が生じた場合は、変更内容・費用・工期への影響を発注者・監理者と文書で確認・合意してから変更後の施工を行います。"},{"id":4,"cat":"現場担当者","type":"c","q":"コンクリート打設後の「養生」が必要な理由はどれか。","o":["温度・湿度を保ち強度を確保するため","完成後の見栄えを良くするため","型枠を取り外しやすくするため","施工写真を撮影しやすくする","次工程の作業スペースを確保する","廃材を覆い隠すために行う"],"a":"A","ex":"コンクリート養生は打設後に適切な温度・湿度を保ち、水和反応を促進して設計強度を確保するために必要な工程です。"},{"id":5,"cat":"現場担当者","type":"c","q":"「完成検査」で確認すべき主な事項はどれか。","o":["下請業者が保有する資格証一覧","工事期間中の作業員出勤状況","工事期間中の天気と気象記録","工事全体の原価管理表の内容","使用材料のメーカー保証期間","設計図・仕様書通りに施工され不具合がないか"],"a":"F","ex":"完成検査では設計図書・仕様書通りに施工されているか、不具合・未完了箇所がないかを発注者・監理者立会いのもと確認します。"},{"id":6,"cat":"現場担当者","type":"c","q":"「ヒヤリハット報告」を行う目的はどれか。","o":["危険事象を共有し重大事故を未然防止するため","現場監督者の業績評価資料とする","工事費増額申請の根拠にするため","作業員の個人評価資料にするため","発注者への定期的な安全報告のため","保険会社への事故申告書として使う"],"a":"A","ex":"ヒヤリハット報告は「ヒヤリとしたが事故に至らなかった事象」を共有し、再発防止策を講じて重大事故を未然に防ぐ制度です。"},{"id":7,"cat":"経理部","type":"c","q":"「未成工事支出金」とはどれか。","o":["下請業者への未払い外注費","完成後の瑕疵補修に備えた費用","完成工事の未回収の売上金","工事完成前の原価を一時集計する勘定科目","工事完成前の固定資産処分益","発注者から事前に受け取った前受金"],"a":"D","ex":"未成工事支出金は工事完成・引渡し前に発生した材料費・労務費等の原価を一時的に集計する勘定科目（資産）です。"},{"id":8,"cat":"経理部","type":"c","q":"「完成工事未収入金」とはどれか。","o":["下請への支払いが残る外注費","完了後に未請求の設計費用","工事完成・引渡し後の未収請負代金","施工中に生じた労務費の未払い分","施工中に発生した材料費の未払い分","着工前に前払いで受け取った代金"],"a":"C","ex":"完成工事未収入金は工事完成・引渡しは済んでいるが、まだ代金を受け取っていない売掛金相当の勘定科目（資産）です。"},{"id":9,"cat":"経理部","type":"c","q":"建設業での「前払金」受取時の経理処理はどれか。","o":["銀行からの借入金として計上","雑収入として当期収益に計上","資本金として純資産に計上","受取時に売上として直ちに計上","前払費用として流動資産に計上","未成工事受入金として負債に計上する"],"a":"F","ex":"発注者から受け取った前払金は、工事完成・引渡し前は「未成工事受入金」として負債に計上し、完成時に収益へ振り替えます。"},{"id":10,"cat":"経理部","type":"c","q":"下請への支払い期限に関する建設業法の規定はどれか。","o":["引渡し申出を受けた日から50日以内","月末締め翌月末払いが原則","検収完了から60日以内","工事完成から30日以内","工事着手から90日以内","請求書受領から10日以内"],"a":"A","ex":"建設業法では元請が発注者から代金を受領した日から1か月以内、かつ下請からの引渡し申出日から50日以内に支払う義務があります。"},{"id":11,"cat":"経理部","type":"c","q":"「外注費」と「労務費」の違いとして正しいものはどれか。","o":["外注費だけが工事原価に算入される","外注費は外部発注費、労務費は自社作業員の人件費","外注費は材料費の一種に分類される","実務上はどちらも同じ意味で使われる","労務費には機械賃借料も含まれる","労務費は工事完成後に計上するもの"],"a":"B","ex":"外注費は外部の協力業者（下請）への発注費用、労務費は自社で直接雇用している作業員等の人件費です。どちらも工事原価を構成します。"},{"id":12,"cat":"経理部","type":"c","q":"工事原価の主な構成要素として正しい組み合わせはどれか。","o":["広告費・旅費・通信費・印刷費","材料費・減価償却費・福利厚生費","材料費・労務費・外注費・経費","仕入費・販売費・一般管理費","人件費・広告費・接待交際費","売上高・当期利益・固定費"],"a":"C","ex":"工事原価は材料費・労務費・外注費・経費（現場経費）の4つで構成されます。これが建設業の売上原価に相当します。"},{"id":13,"cat":"設計部","type":"c","q":"「基本設計」と「実施設計」の違いとして正しいものはどれか。","o":["基本設計は規模方向性決定、実施は詳細図面作成","基本設計は構造計算のみが対象となる","基本設計は施工会社が行うものである","基本設計は発注者が自ら行うもの","実施設計は完成後に作成する記録図","両者に違いはなく実質的に同じ業務"],"a":"A","ex":"基本設計は建物の基本的な方向性・規模・形状を決める段階、実施設計は工事に使用できる詳細な図面・仕様書を作成する段階です。"},{"id":14,"cat":"設計部","type":"c","q":"「構造図」が主に示すものはどれか。","o":["空調設備の系統図と機器の配置","建物の内装デザインと仕上げ","建物外観のデザインイメージ","建物周辺の外構・植栽造園計画","柱・梁・基礎等の構造部材の位置・寸法・配筋","電気・給排水の配管経路と設備"],"a":"E","ex":"構造図は柱・梁・基礎・スラブ等の構造部材の位置・断面寸法・鉄筋の配置等を示す図面で、構造設計者が作成します。"},{"id":15,"cat":"設計部","type":"c","q":"建築基準法の「建蔽率（けんぺいりつ）」とは何か。","o":["各階床面積の合計比率","建物延床面積を示す割合","建物高さ制限を表す割合","窓面積と床面積の比率","道路幅員に対する建物幅の比率","敷地面積に対する建築面積の上限割合"],"a":"F","ex":"建蔽率は敷地面積に対する建築面積（建物の真上から見た面積）の割合の上限で、用途地域ごとに制限されています。"},{"id":16,"cat":"設計部","type":"c","q":"「容積率」とは何か。","o":["外壁を道路から後退させる距離割合","各階の天井高の平均値","建物の高さと前面道路幅員の比率","建物建築面積が敷地に占める割合","敷地内に確保する緑化の割合","敷地面積に対する延床面積の上限割合"],"a":"F","ex":"容積率は敷地面積に対する建物の延床面積（各階の床面積の合計）の割合の上限で、建物の規模を規制します。"},{"id":17,"cat":"設計部","type":"c","q":"「設計監理業務」の説明として正しいものはどれか。","o":["建設会社が設計と施工を一体で行う","施工会社が竣工後に完成図を作成する","施工業者が必要に応じ設計変更する","設計者が工事の設計図への適合を確認・監督すること","設計者が請負者として直接施工する","発注者が工事の全過程を自ら管理する"],"a":"D","ex":"設計監理業務は設計者（設計事務所）が施工段階に工事が設計図書通りに適正に行われているかを確認・監督する業務です。"},{"id":18,"cat":"設計部","type":"c","q":"「断熱設計」を行う主な目的はどれか。","o":["建物の外観を美しく見せるため","建物の構造強度や剛性を高めるため","建物の耐震性能を向上させるため","工事の初期コストを削減するため","設計図面の枚数や工数を増やすため","熱の流出入を抑え省エネ性と快適性を高めるため"],"a":"F","ex":"断熱設計は外壁・屋根・床等の断熱性能を高めることで室内外の熱移動を抑え、冷暖房エネルギーの削減と室内快適性向上を図ります。"},{"id":19,"cat":"総務部","type":"c","q":"「36協定」の説明として正しいものはどれか。","o":["管理職や役員のみに適用される制度","退職金の支払方法を定める協定","年間の総労働時間を一律に決定する協定","法定時間外労働を無制限に認める協定","有給休暇の付与日数を決める協定","労使協定の届出で法定外労働が可能になる制度"],"a":"F","ex":"36協定（時間外・休日労働に関する協定）は労使で締結し労働基準監督署に届け出ることで法定時間外・休日労働が可能になります。"},{"id":20,"cat":"総務部","type":"c","q":"「月額変更届（随時改定）」が必要になる場合はどれか。","o":["会計上の決算期が変更になった場合","会社の所在地が変更した場合","在籍社員が退職した場合","昇給等で報酬が2等級以上変動した場合","新入社員を採用した場合","毎月必ず定期的に提出する届出"],"a":"D","ex":"月額変更届（随時改定）は昇給・降給等で固定的賃金が変動し、変動後の報酬が2等級以上変わった場合に提出します。"},{"id":21,"cat":"総務部","type":"c","q":"「安全衛生委員会」の設置が必要な条件はどれか。","o":["規模に関わらず全事業場に必要","建設業では常時50人以上を使用する事業場","現場を持つ全建設会社に必要","常時10人以上を使用する事業場","年間売上が1億円以上の会社","本社のある拠点のみに設置義務"],"a":"B","ex":"建設業では常時50人以上の労働者を使用する事業場に安全衛生委員会（安全委員会＋衛生委員会）の設置が義務付けられています。"},{"id":22,"cat":"総務部","type":"c","q":"「育児休業」取得に関して会社が行うべき対応はどれか。","o":["育休後は元の職位に戻さなくてよい","育休取得者の代替要員は不要である","育休中の給与は会社が全額負担する","会社の事情で取得可否を決めてよい","制度周知・雇用継続を前提とした取得促進・環境整備","男性社員は法律上育休取得できない"],"a":"E","ex":"育児・介護休業法により会社は育休制度の周知・個別周知、雇用継続・職場復帰支援が義務付けられています。男性も取得可能です。"},{"id":23,"cat":"総務部","type":"c","q":"「経営業務の管理責任者」として認められる主な条件はどれか。","o":["1級建設施工管理技士の資格保有","建設業で3年以上の現場作業経験","建設業で5年以上管理的地位にあった者等","建設業許可取得から5年以上経過","資本金が1億円以上の会社の役員","大学の建築・土木学科の卒業者"],"a":"C","ex":"経営業務管理責任者は建設業の経営業務（許可業種）について5年以上（または準じる経験で6年以上等）管理的立場にあった者等が要件です。"},{"id":24,"cat":"総務部","type":"c","q":"「個人情報保護法」に基づき行うべき対応はどれか。","o":["10年に一度の確認で十分である","建設業は個人情報保護法の適用外","個人情報は社内業務に自由に活用できる","紙書類だけが個人情報の管理対象","目的明示・適切管理・第三者提供制限・開示に対応","役員や幹部の情報のみが管理対象"],"a":"E","ex":"個人情報保護法は全業種に適用され、利用目的の明示・安全管理措置・第三者提供の制限・本人の開示請求への対応等が義務です。"},{"id":25,"cat":"積算部","type":"c","q":"「積算基準書（標準歩掛かり）」を使用する主な目的はどれか。","o":["工事の品質水準を定める基準として使用","工事完了後の竣工検査の資料に使用","施工業者の技術力を客観的に評価","社員の基本給与の算定に活用する","人工・材料等を統一基準で客観的に算出するため","発注者と締結する請負契約書として使用"],"a":"E","ex":"積算基準書の標準歩掛かりは国交省等が定める積算基準で、人工・材料量を客観的・統一的に算出するための基準として使用します。"},{"id":26,"cat":"積算部","type":"c","q":"「直接工事費」と「共通仮設費」の違いとして正しいものはどれか。","o":["実質的に同じ意味で使われている","直接工事費は各工種費用・共通仮設費は仮設費用","直接工事費は元請費用、共通仮設費は下請費用","直接工事費は材料費のみを指す","直接工事費は設計費、共通仮設費は施工費","両者の合計額が純工事費の全額となる"],"a":"B","ex":"直接工事費は各工種の施工に直接かかる費用、共通仮設費は現場事務所・足場・養生等の複数工種に共通する仮設工事費です。"},{"id":27,"cat":"積算部","type":"c","q":"「実勢価格」を積算で使用する場合の注意点はどれか。","o":["海外市場の価格動向を参考にする","競合他社と同じ見積単価になる","建設業法で規定された固定価格","公定価格で変動がなく常に一定","時期・地域・量によって変動し最新確認が必要","設計単価と比較して常に安くなる"],"a":"E","ex":"実勢価格は市場で実際に取引される価格で、資材の需給状況・時期・地域・数量によって変動するため、積算時点での確認が重要です。"},{"id":28,"cat":"積算部","type":"c","q":"設計変更による「追加費用の積算」で注意すべき点はどれか。","o":["口頭合意があれば積算書は不要","追加費用の金額は設計者が決定","追加費用は工事竣工後に精算する","変更前の契約金額の10%を一律加算","変更前後の差分を正確に算出し書面で合意する","変更費用は元請が全額負担する"],"a":"E","ex":"設計変更の追加費用は変更前後の数量・仕様の差分を積算で正確に算出し、発注者・元請・下請の書面による合意のもとで処理します。"},{"id":29,"cat":"積算部","type":"c","q":"「総合単価」とはどれか。","o":["下請業者への発注時に使う契約単価","海外輸入材料の通関費用を含む単価","材料費・労務費・機械費・諸経費の1単位合計","材料費だけを算出した1単位の単価","消費税込みで確定した工事費の単価","定価に値引き率を掛けた販売単価"],"a":"C","ex":"総合単価は材料費・労務費・施工機械費・諸経費等を含む工種ごとの工事1単位（m・㎡・本等）当たりの総費用です。"},{"id":30,"cat":"積算部","type":"c","q":"「VE提案」を積算部が行う際のポイントはどれか。","o":["下請業者にコスト削減を一方的に求める","機能・品質を確保しコスト削減案を提案する","競合他社の積算単価を下回るのが目的","見積金額を下げることのみ優先","設計図書通りに積算するだけでよい","発注者に無断で仕様を変更する"],"a":"B","ex":"VE（バリューエンジニアリング）提案は必要な機能・品質を維持しながら、材料・工法・仕様の見直しでコスト削減を図る提案活動です。"}];
const KENSETSU_Q2 = [{"id":1,"cat":"現場担当者","type":"c","q":"「品質管理計画」に含めるべき主な事項はどれか。","o":["工事の広告・宣伝計画","作業員の報酬と給与計画","資材の購入先と仕入れ先一覧","社内の組織図と各管理責任者","竣工後の建物維持管理費用","品質目標・基準・検査方法・不適合処置"],"a":"F","ex":"品質管理計画には品質目標・品質基準・検査箇所・検査方法・合否判定基準・不適合発生時の処置方法等を定めます。"},{"id":2,"cat":"現場担当者","type":"c","q":"コンクリートの「供試体」を採取する目的はどれか。","o":["工期を短縮する方法を検討するため","作業員の施工技量を評価するため","使用材料の在庫量を管理するため","設置した型枠の強度を確認するため","打設コンクリートの設計強度達成を確認するため","配筋の間隔と位置を記録するため"],"a":"E","ex":"供試体は打設したコンクリートから採取し、材齢28日等の時点で圧縮強度試験を行い設計基準強度を満足するか確認します。"},{"id":3,"cat":"現場担当者","type":"c","q":"「クリティカルパス」の管理が重要な理由はどれか。","o":["この経路上の作業遅れが工期全体の遅延になるため","下請業者の評価と選定基準になる","最もコストのかかる作業を特定できる","作業員の適性と技能を判断できる","資材の発注タイミングを最適化できる","品質検査の実施順序を決定できる"],"a":"A","ex":"クリティカルパスは工程上余裕のない作業の連なりで、この経路上の作業が1日遅れると竣工日も1日遅れるため重点管理が必要です。"},{"id":4,"cat":"現場担当者","type":"c","q":"施工中の「出来形管理」とは何か。","o":["下請業者の担当施工範囲を確認し管理する","完成建物の外観を品質検査すること","現場で使用する資材の在庫状況を管理する","工事全工程で写真を撮影・整理すること","構造物の寸法・位置を設計値と照合し記録・管理","作業員の出来高に応じた賃金管理"],"a":"E","ex":"出来形管理は施工した構造物の幅・高さ・厚さ・位置等を測定し、設計値・規格値に対する出来映えを確認・記録・管理することです。"},{"id":5,"cat":"現場担当者","type":"c","q":"「特定元方事業者」に求められることはどれか。","o":["下請業者の経営に直接介入する","現場の全作業員を直接雇用する","工事発注者から工法の直接指示を受ける","混在現場の安全衛生を統括管理する義務がある","施工関係全業者の給与を決定する","設計図面の最終確認と承認を担う"],"a":"D","ex":"特定元方事業者（建設業の元請）は複数の下請が混在する現場で安全衛生管理を統括管理する義務があります（労安法第15条）。"},{"id":6,"cat":"現場担当者","type":"c","q":"「工期短縮」を検討する際に最初に行うべきことはどれか。","o":["クリティカルパス特定・並行化・資源追加を検討","まず人件費を削減することを優先する","下請業者に作業を速めるよう指示する","工事監理者に追加費用の負担を請求する","使用材料の仕様を独自に変更する","設計変更の実施を発注者に要求する"],"a":"A","ex":"工期短縮はまずクリティカルパスを特定し、その上の作業を並行化（ファストトラック）したり資源を追加投入する方法を検討します。"},{"id":7,"cat":"経理部","type":"c","q":"「工事原価」と「販管費」の違いとして正しいものはどれか。","o":["どちらも損益計算書に計上されない","工事原価は会計上、販管費は税務上の費用","工事原価は完成後、販管費は施工前費用","工事原価は工事費用、販管費は本社等の管理費用","工事原価は材料費のみ、販管費は人件費","実務上はどちらも同じ意味で使われる"],"a":"D","ex":"工事原価は材料費・労務費・外注費・経費で構成される工事の製造原価。販管費（販売費・一般管理費）は本社経費・営業費等です。"},{"id":8,"cat":"経理部","type":"c","q":"建設業の「完成工事高」とはどれか。","o":["下請業者に発注した工事の合計","会社が受注した工事の累計金額","着工前に前払いで受け取った金額","当期に完成・引き渡した工事の請負金額合計","当期に生じた全人件費の合計","当期に発生した工事原価の合計"],"a":"D","ex":"完成工事高は当期中に発注者に完成引渡しを行った工事の請負金額の合計で、建設業の売上高に相当します。"},{"id":9,"cat":"経理部","type":"c","q":"「工事損失引当金」を計上する目的はどれか。","o":["銀行借入に対する担保の積立金","工事完成時の損失見込みを先行計上するため","将来の設備投資に備えた社内積立","前期比で売上減少の補填のため","退職給付のための社内積立金","不良在庫に対する評価損の計上"],"a":"B","ex":"工事損失引当金は、工事の請負金額を工事原価が上回ることが見込まれる場合にその損失を計上する会計処理で、損失の早期認識が目的です。"},{"id":10,"cat":"経理部","type":"c","q":"「外注費の三者照合」とはどれか。","o":["3社以上から相見積もりを必ず取る","3書類を照合し支払いの正確性を確認すること","3名以上の承認が必要な決裁フロー","支払いを3回に分割して実施する","社長・経理・営業の3者が承認する","税務・法務・経理の3部門で確認"],"a":"B","ex":"三者照合は発注書（注文した内容）・納品書（納品された内容）・請求書（請求内容）の3書類を照合して支払いの妥当性を確認することです。"},{"id":11,"cat":"経理部","type":"c","q":"「現場経費」として計上できるものはどれか。","o":["株主への利益配当に関する費用","現場事務所賃借料・光熱費・現場管理職の人件費","社員の資格取得を奨励する奨励金","新規採用のための求人広告宣伝費","本社で使用するOA機器購入費","本社役員が使用する接待交際費"],"a":"B","ex":"現場経費は工事原価の一部で、現場事務所の賃借料・水道光熱費・通信費・現場管理職の人件費・保険料等が含まれます。"},{"id":12,"cat":"経理部","type":"c","q":"「仕入税額控除の按分計算」が重要な理由はどれか。","o":["課税・非課税売上の比率で消費税納税額が変わるため","外注費の計上上限を決定するために必要","建設業許可の種類判定のために必要","元請と下請の費用区分を明確にするため","源泉所得税の税額計算に使用するため","工事の種別を正確に分類するために行う"],"a":"A","ex":"課税売上割合（課税売上÷総売上）が低い場合、仕入税額控除が制限されるため課税・非課税売上の按分管理が重要です。"},{"id":13,"cat":"設計部","type":"c","q":"「省エネ基準（建築物省エネ法）」の適合義務の説明として正しいものはどれか。","o":["公共建築物だけが規制の対象となる","住宅・非住宅とも一定規模以上で適合義務がある","住宅のみが省エネ基準の対象となる","全建築物が対象で規模は無関係","非住宅建築物のみが適用対象となる","木造建築物だけが対象とする規定"],"a":"B","ex":"建築物省エネ法により一定規模以上（住宅は原則全て、非住宅は300㎡以上等）の建築物は省エネ基準への適合義務があります。"},{"id":14,"cat":"設計部","type":"c","q":"耐震設計の「一次設計・二次設計」の説明として正しいものはどれか。","o":["一次・二次設計はどちらも同じ内容となる","一次は軽微な地震・二次設計は強風への対応","一次は木造・二次はRC造など構造別に適用される","一次設計が大地震、二次設計が中地震に対応する","中地震での損傷防止と大地震での倒壊防止を確認","二次設計は建物竣工後に遡って実施するもの"],"a":"E","ex":"一次設計（許容応力度設計）は中地震で損傷しないこと、二次設計（保有水平耐力計算等）は大地震で倒壊しないことを確認します。"},{"id":15,"cat":"設計部","type":"c","q":"「BIM」を活用する主なメリットはどれか。","o":["2D図面の作成が従来より容易になる","BIMで干渉確認・数量算出・情報共有が効率化","完成後の解体計画が不要になる","建設費の最終金額を自動確定できる","現場の作業員が直接操作できる","法的な申請手続きが自動化される"],"a":"B","ex":"BIM（Building Information Modeling）は3Dモデルに属性情報を付加し、設計・施工・維持管理で情報共有・干渉チェック・積算連携等を効率化します。"},{"id":16,"cat":"設計部","type":"c","q":"「ZEB（ネット・ゼロ・エネルギー・ビル）」の説明として正しいものはどれか。","o":["CO₂排出量を50%削減した建物","外壁からの熱損失を完全ゼロにする建物","建設・工事費用をゼロにする建物","建物内の音環境をゼロ騒音にした建物","省エネ+創エネで年間エネルギー消費を正味ゼロ","年間維持管理費をゼロにする建物"],"a":"E","ex":"ZEBは高い省エネ性能（エネルギー消費を削減）と太陽光等の創エネを組み合わせ、年間一次エネルギー消費量を正味ゼロにする建物です。"},{"id":17,"cat":"設計部","type":"c","q":"「設計VE（バリューエンジニアリング）」とは何か。","o":["デザイン性を最大化する設計手法","機能を維持しつつコスト削減する設計改善手法","建物の不動産としての資産価値を算定する","竣工後の建物の市場価格を評価する","省エネ設備だけを優先的に選定する手法","法令の最低基準を満たすだけの設計"],"a":"B","ex":"設計VEは建物に必要な機能・品質を確保しながら、材料・工法・仕様を見直してコスト削減を図る設計段階での改善活動です。"},{"id":18,"cat":"設計部","type":"c","q":"建物の「ライフサイクルコスト（LCC）」に含まれる費用はどれか。","o":["建設初期費用のみを対象とした費用","建設費・運用費・修繕費・解体費の生涯総コスト","建設費と10年間の維持管理費の合計","建設費と工事保険料の合計のみ","初期投資額と減価償却費の合計","設計費と建設費だけの合計費用"],"a":"B","ex":"LCC（ライフサイクルコスト）は建物の建設費だけでなく、使用期間中の運用費・修繕費・改修費・解体廃棄費まで含む生涯総費用です。"},{"id":19,"cat":"総務部","type":"c","q":"「建設業における社会保険加入義務化」の背景として正しいものはどれか。","o":["外国人労働者の急増に対応するため","技能者の処遇改善・担い手確保が主な目的となる","建設業許可要件の簡素化のため","建設業者の整理統合を促進するため","工事品質向上だけを目的とする施策","消費税増税への経理処理対応のため"],"a":"B","ex":"建設業の社会保険加入義務化は技能者の処遇改善・長期就労の促進・担い手確保と、加入していない業者との不公正競争排除が目的です。"},{"id":20,"cat":"総務部","type":"c","q":"「労働安全衛生マネジメントシステム（OSHMS）」の目的はどれか。","o":["PDCAで安全衛生活動を改善し労働災害を防止","建設業許可の更新申請を簡略化するため","顧客満足度と社会的評判を向上させるため","工事に伴う環境負荷を低減するため","工事の品質水準の向上を主な目的とする","社員の給与水準・評価体系を見直すため"],"a":"A","ex":"OSHMSはPlan-Do-Check-Actionのサイクルで安全衛生活動を組織的・継続的に改善し、労働災害の未然防止を図る仕組みです。"},{"id":21,"cat":"総務部","type":"c","q":"「男女雇用機会均等法」が建設会社に求めることはどれか。","o":["育児休業は女性のみが取得できる","管理職の女性比率を50%以上にすること","採用・配置・昇進など全過程で性差別を禁止する","女性社員の採用を優先的に行うこと","女性社員を現場業務から除外してよい","男女間の賃金格差を設けてよい"],"a":"C","ex":"男女雇用機会均等法は採用・配置・昇進・研修・定年・退職・解雇等のあらゆる局面で性別による差別を禁止しています。"},{"id":22,"cat":"総務部","type":"c","q":"「ストレスチェック制度」について正しいものはどれか。","o":["50人以上の事業場が実施義務・本人へ直接通知","管理職・役員だけが受検を義務付けられる","結果を本人同意なく会社が自由に閲覧できる","建設業は特例により適用除外される","事業規模問わず全ての企業に実施義務がある","年間3回以上の実施が法律で義務付けられる"],"a":"A","ex":"ストレスチェックは常時50人以上使用の事業場に年1回以上の実施義務があります。結果は本人に直接通知され、本人同意なしに会社へ開示できません。"},{"id":23,"cat":"総務部","type":"c","q":"「解雇」を行う場合に会社が注意すべき事項はどれか。","o":["解雇は口頭での意思表示だけで足りる","解雇理由を社員に開示しなくてよいとされる","合理的理由と相当性が必要で予告か予告手当が要","試用期間中であれば即日解雇できるとされる","就業規則に記載があれば自由に解雇できる","退職金を支払えば理由なく解雇できる規定がある"],"a":"C","ex":"解雇は客観的・合理的な理由と社会通念上の相当性が必要（労契法16条）。少なくとも30日前の予告か解雇予告手当（30日分）が必要です。"},{"id":24,"cat":"総務部","type":"c","q":"「外国人技能実習生」の受け入れで注意すべき事項はどれか。","o":["在留資格確認・適正賃金支払い・環境整備が必要","実習生には最低賃金法が適用されない","実習生には時間外労働させることができる","実習生には労働基準法が適用されない","実習生は社会保険への加入が不要","実習生への安全衛生教育は不要とされる"],"a":"A","ex":"技能実習生にも労働基準法・最低賃金法・社会保険等が適用されます。在留資格の確認・適正な賃金・安全な労働環境の整備が必要です。"},{"id":25,"cat":"積算部","type":"c","q":"「発注者支援型CM」での積算部の役割はどれか。","o":["現場の安全管理と巡回指導を担当する","工事の品質検査と完成確認を担当する","施工業者の技術審査と選定のみを担当","竣工後の維持管理計画を立案する","積算審査・コスト・変更費用算出で発注者を支援","発注者の代わりに設計図書を作成する"],"a":"E","ex":"発注者支援型CMでは積算部がコスト管理・見積審査・VE提案・設計変更費用の算出等を通じて発注者の予算管理を支援します。"},{"id":26,"cat":"積算部","type":"c","q":"「材料費の変動リスク」に対して積算部が行うべき対応はどれか。","o":["スライド条項設定と複数時点での見積確認を行う","価格上昇分は施工後に発注者に請求","材料費変動は施工者だけの責任","材料費変動リスクを全て下請に転嫁","市況変動を考慮せず積算を進める","常に公表の設計単価のみを使用"],"a":"A","ex":"資材価格変動リスクに対しては、スライド条項（物価変動に応じた契約金額の変更条項）の契約への組み込みと定期的な市場価格確認が有効です。"},{"id":27,"cat":"積算部","type":"c","q":"「内訳書（単価・数量入り見積書）」の作成で重要な点はどれか。","o":["競合他社の内訳書を参考にして作成してよい","合計金額さえ正確なら内訳の記載は省略可","数量・単価・金額を正確に記載し変更に対応する","数量は概算程度でよく精度は必要ない","単価を高めに設定して価格交渉の余地を持たせる","内訳書は竣工後に遡って作成するもの"],"a":"C","ex":"内訳書は工種・種別ごとの数量・単価・金額を正確に記載し、発注者からの査定・設計変更・追加工事への対応基盤となります。"},{"id":28,"cat":"積算部","type":"c","q":"「概算積算」と「実施積算」の違いはどれか。","o":["概算は施工完了後、実施は設計前に行う","概算は省略でき実施積算だけで十分","概算は積算部、実施は経理部が担当","概算は費用の大枠把握、実施は精密な費用算出","実務上では同じ意味で用いられている","両者とも同じ精度と方法で実施する"],"a":"D","ex":"概算積算は計画段階で事業費の大枠を把握するもの。実施積算は詳細設計図書に基づいて詳細な数量・単価で精密に算出するものです。"},{"id":29,"cat":"積算部","type":"c","q":"「歩掛かりの見直し」が必要になる主な場合はどれか。","o":["5年周期で定期的に行うだけでよい","競合他社が見直したときのみ実施する","施工技術変化・新工法導入で実態と乖離した場合","社員の基本給与が上昇した場合のみ","設計図面の総枚数が増加した場合","発注者から見直しの要求があった場合のみ"],"a":"C","ex":"歩掛かりは施工技術の進歩・新工法導入・機械化・地域の労働慣行変化等で実態と乖離が生じた場合に見直しが必要です。"},{"id":30,"cat":"積算部","type":"c","q":"「BIM連携積算ソフト」の活用メリットはどれか。","o":["BIMで数量を自動算出し積算効率・精度を向上","競合他社の積算結果を入手できる","建設工事の施工費用がゼロになる","人手による確認作業が完全に不要になる","設計変更が自動的に処理されるようになる","法的な申請業務が完全に自動化される"],"a":"A","ex":"BIM連携積算ソフトはBIMモデルから数量を自動算出し、積算の手間削減・精度向上・設計変更時の数量自動更新が可能になります。"}];
const KENSETSU_Q1 = [{"id":1,"cat":"現場担当者","type":"c","q":"「現場代理人」の役割と責任として正しいものはどれか。","o":["下請業者の採用面接を単独で担当する","工事費用の最終支払いを決裁する","竣工後の維持管理計画を立案する","請負人に代わり現場管理・運営と発注者協議を行う","設計事務所との契約交渉を担当する","設計図面の内容と仕様を最終確認する"],"a":"D","ex":"現場代理人は請負人の代理として現場の管理・運営全般を担い、発注者との協議・現場内での請負人の権限を行使します（建設業法26条の2）。"},{"id":2,"cat":"現場担当者","type":"c","q":"「監理技術者」と「主任技術者」の配置要件の違いとして正しいものはどれか。","o":["1億円以上の工事では両者の配置が必要","下請工事にのみ監理技術者の配置が必要","元請工事にのみ主任技術者が必要となる","公共工事にのみ監理技術者が必要になる","設計施工一括発注の場合のみ監理技術者が必要","特定建設業者の一定額以上の下請発注時に必要"],"a":"F","ex":"特定建設業者が4,500万円（建築一式7,000万円）以上の下請発注をする場合は監理技術者の配置が必要です（建設業法26条）。"},{"id":3,"cat":"現場担当者","type":"c","q":"施工中に重大な品質不良が発覚した場合の最優先対応はどれか。","o":["工事継続しながら並行して対処する","作業停止・発注者への報告・原因調査・是正協議","施工業者に全ての責任を一方的に転嫁する","社内で解決策を固めてから発注者に報告","品質基準を引き下げる設計変更を申請する","保険会社への申告を最優先で行う"],"a":"B","ex":"重大な品質不良が発覚した場合は当該部分の作業を停止し、速やかに発注者・監理者に報告して原因調査と是正方針を協議することが最優先です。"},{"id":4,"cat":"現場担当者","type":"c","q":"労働災害発生時に元請業者が取るべき対応はどれか。","o":["マスコミへの公表対応を最優先とする","下請業者の単独責任として全て対応させる","救護・安全確保・行政報告・再発防止策の実施","工事は継続しながら事後に対応する","被災者の家族への説明を最初の優先とする","保険会社への連絡・申告を最初に優先する"],"a":"C","ex":"労働災害発生時は①被災者の救護・安全確保②警察・消防への通報③労基署への死傷報告④再発防止策策定の順で対応します。"},{"id":5,"cat":"現場担当者","type":"c","q":"「フロントローディング」の考え方で正しいものはどれか。","o":["工事の後半に集中的に資源を投入する","工事完了後にまとめて問題を解決する","竣工直前に品質検査を集中的に行う","設計前倒しで問題早期解決・施工手戻りを最小化","前払い金の受取額を最大化する交渉","着工前に工事費の全額前払いを受ける"],"a":"D","ex":"フロントローディングは設計・計画の前倒し検討で問題を早期に解決し、施工段階での設計変更・やり直しを最小化するアプローチです。"},{"id":6,"cat":"現場担当者","type":"c","q":"「建設DX推進」として現場管理職が取り組むべきことはどれか。","o":["ICTツールの活用を率先推進し生産性を向上させる","ICTツール導入の判断は若手に委ねる","ICT活用は設計段階のみに限定する","ドローンは安全リスクがあるため使用しない","費用が高いためデジタル化を見送る","本社IT部門の決定を待ってから対応する"],"a":"A","ex":"現場管理職がBIM/CIM・ICT測量・施工管理アプリ・ドローン等のDXツール活用を率先して推進し、生産性向上・担い手確保につなげます。"},{"id":7,"cat":"経理部","type":"c","q":"「収益認識基準（新収益基準）」が建設業の経理処理に与える主な影響はどれか。","o":["建設業は収益認識基準の適用除外になる","工事原価の計上時期には全く変化はない","工事進捗に応じた収益計上が原則となる","収益認識の変更は上場企業のみに影響","全工事が完成時一括計上に統一される","発注者の同意なく収益を計上できるようになる"],"a":"C","ex":"収益認識基準（ASC606/IFRS15）では工事の進捗に応じた履行義務の充足が収益計上の基本となり、従来の完成基準と異なる処理が必要になる場合があります。"},{"id":8,"cat":"経理部","type":"c","q":"「営業CFがマイナス」が続く場合に示すリスクはどれか。","o":["減価償却費が急増していることを示す","借入金が増加しているだけのこと","税金が過大に徴収されている状態","設備投資が活発だという証拠である","売上が減少しているだけで問題ない","本業CFがマイナスだと利益があっても倒産リスク"],"a":"F","ex":"営業CFマイナスが続くと本業での現金収入が不足し、利益計上していても資金繰りが悪化して黒字倒産（資金ショート）に至るリスクがあります。"},{"id":9,"cat":"経理部","type":"c","q":"「経審のX2点数（自己資本額及び平均利益額）」を高めるのに有効な施策はどれか。","o":["自己資本の充実と利益率の向上を図る","社員・作業員の数を削減する","借入金を増やして設備投資を拡大する","設備投資を最大限に拡大する","売上高だけを増加させる施策","役員報酬を大幅に引き上げる"],"a":"A","ex":"X2は自己資本額と平均利益額（営業利益+減価償却費の平均）で算定されます。内部留保の積み上げ・増資・収益性向上が有効です。"},{"id":10,"cat":"経理部","type":"c","q":"「インボイス制度」が建設業に与える主な影響はどれか。","o":["経営事項審査の評点算定式が変わる","建設業許可の要件が変更されること","建設工事の請負金額の上限が変わる","消費税の税率体系が変更されること","適格請求書が必要となり免税業者下請との取引に影響","法人税の計算方法が変更されること"],"a":"E","ex":"インボイス制度では仕入税額控除に適格請求書（インボイス）が必要となり、免税事業者（課税売上1000万円以下）の下請との取引方法の見直しが必要になりました。"},{"id":11,"cat":"経理部","type":"c","q":"「インフレ局面での建設原価上昇」に対する経理的な対応策はどれか。","o":["スライド条項の組み込みと工事予算の早期確定・発注","下請業者へコスト増加分を転嫁する","見積書の提出時期を意図的に遅らせる","工事を一時中断して原価上昇を回避する","材料費増加分を全額顧客に請求する","全ての材料費を固定単価で計上する"],"a":"A","ex":"インフレ局面では物価スライド条項の契約組み込み・早期資材発注・市場価格モニタリング・代替材の検討など多面的な対応が必要です。"},{"id":12,"cat":"経理部","type":"c","q":"「M&A時のデューデリジェンス（財務DD）」で経理部が担当する主な内容はどれか。","o":["競合他社の経営戦略と市場動向を分析","財務諸表・潜在債務・税務リスクを精査する業務","取得不動産の建物・立地状態を調査する","対象会社の経営幹部の経歴と法的調査","対象会社の主要顧客へのヒアリング調査","対象企業の役員・社員への採用面接調査"],"a":"B","ex":"財務DDでは財務諸表の正確性・品質、簿外債務・偶発債務・税務リスク・工事損失の認識状況等を調査し、取得価格・リスクを評価します。"},{"id":13,"cat":"設計部","type":"c","q":"「建築基準法の性能規定化」の意味として正しいものはどれか。","o":["規制を完全撤廃して設計を自由化する","建物デザインの自由度を制限する","省エネ性能のみを対象とした規定","全建築物に同一の仕様を義務付ける","達成性能を定め手法の選択を設計者に委ねる規定","地域ごとに異なる規制を全国統一する"],"a":"E","ex":"性能規定化は安全・耐久・省エネ等の達成すべき性能水準を定め、それを満足する手法の選択を設計者の裁量に委ねる規定方式です。"},{"id":14,"cat":"設計部","type":"c","q":"「CIM（Construction Information Modeling）」の説明として正しいものはどれか。","o":["建設会社間でデータ共有するプラットフォーム","建築設計専用のBIMソフトウェア","現場工事写真を整理・管理するアプリ","工事コストを管理する情報システム","施工現場の作業を映像で記録するシステム","土木分野で3Dモデルを設計から維持管理に一貫活用"],"a":"F","ex":"CIM（Construction Information Modeling）は主に土木分野で3次元モデルに属性情報を付加し、設計から維持管理まで一貫した情報活用を図る国交省主導の取り組みです。"},{"id":15,"cat":"設計部","type":"c","q":"「公共建築における設計VE」の特徴として正しいものはどれか。","o":["コスト削減なら機能・性能を下げてよい","機能確保しLCC低減を図り代替案を協働検討する","施工業者が単独で判断・実施する手法","設計が完全に完了した後だけに実施する","発注者だけが単独で実施できる手法","民間工事だけに適用できる設計手法"],"a":"B","ex":"設計VEは発注者・設計者・施工者が協力し、必要な機能・品質・安全性を維持しながらLCCを低減する代替案を検討するチームアプローチです。"},{"id":16,"cat":"設計部","type":"c","q":"「著作権」と建築設計の関係として正しいものはどれか。","o":["意匠権さえあれば著作権の取得は必要ない","建築設計には著作権が発生しないとされる","建築設計は著作権で保護される著作物となりうる","著作権の主張は商業建築のみに限られる","著作権は構造設計者だけに帰属するもの","著作権は設計者ではなく発注者に帰属する"],"a":"C","ex":"著作権法では建築物は著作物として保護され、設計図書・建築物自体が著作権（著作者人格権含む）の対象となります。設計者に帰属するのが原則です。"},{"id":17,"cat":"設計部","type":"c","q":"「長期優良住宅」の認定基準として含まれないものはどれか。","o":["維持管理・更新のしやすさの基準","居住スペースの住戸面積基準","建築面積の最低基準（最小面積）","構造躯体等の劣化対策の基準","省エネルギー性能に関する基準","地震に対する耐震性の基準"],"a":"C","ex":"長期優良住宅の認定基準は耐震性・省エネ性・維持管理の容易性・劣化対策・住戸面積・居住環境等です。建築面積の最低基準は規定されていません。"},{"id":18,"cat":"設計部","type":"c","q":"「コンストラクション・マネジメント（CM）方式」の特徴として正しいものはどれか。","o":["CMr活用で設計・施工分離発注し一元管理する方式","下請会社が全体工事の統括を担う方式","行政機関が設計・施工の全てを管理する方式","施工会社が設計業務も全て担う方式","設計・施工の全てを一社に委託する方式","設計事務所が施工監理業務のみを行う方式"],"a":"A","ex":"CM方式は発注者がCMr（コンストラクション・マネジャー）を活用し、設計と施工を分離発注してコスト・品質・工期を一元管理する事業方式です。"},{"id":19,"cat":"総務部","type":"c","q":"「同一労働同一賃金」が建設会社に求めることとして正しいものはどれか。","o":["下請業者の賃金も一律にする義務がある","外国人労働者にのみ適用される法律","建設業は法律の適用除外とされている","時給制の賃金体系を全廃する義務","正規・非正規の不合理な待遇差を解消する義務","全社員の給与を職種問わず一律にする"],"a":"E","ex":"同一労働同一賃金（パート・有期法・労働者派遣法）は正規・非正規の不合理な待遇差を禁止し、説明義務・待遇改善を義務付けます。"},{"id":20,"cat":"総務部","type":"c","q":"「建設業法改正（2020年）」で強化された下請取引の適正化として正しいものはどれか。","o":["一括下請負が条件なく全面解禁された","下請業者は建設業許可が不要になった","下請代金の支払い規定が任意となった","元請の監督責任が大幅に軽減された","工期は発注者が一方的に決定できるようになった","短工期禁止・共済普及・社会保険等の規制が強化"],"a":"F","ex":"2020年建設業法改正では著しく短い工期での契約禁止・下請代金の支払い適正化・退職金共済・CCUSの活用推進等が強化されました。"},{"id":21,"cat":"総務部","type":"c","q":"「ハラスメント防止対策」として会社が行うべきことはどれか。","o":["加害者が役員であれば対応しなくてよい","加害者の人事異動だけで対応完了できる","全て外部の弁護士に委託すれば十分である","相談窓口設置・教育実施・再発防止策が法的義務","被害者が申告した場合にのみ対応する","法的措置への備えだけすれば対応完了する"],"a":"D","ex":"改正労働施策総合推進法・男女均等法等でパワハラ・セクハラ防止措置（相談窓口設置・教育・調査・再発防止）が全事業主の義務です。"},{"id":22,"cat":"総務部","type":"c","q":"「建設業許可の更新」において総務部が管理すべき主な事項はどれか。","o":["下請業者との工事請負契約書の保管のみ","工事の品質記録と完成書類の保管業務のみ","更新期限・経管・専技の要件維持・財務・書類管理","社員全員の定期健康診断の管理のみ","設計図面と竣工図面の保管管理業務のみ","発注者との連絡窓口の管理業務のみ"],"a":"C","ex":"許可更新（5年ごと）では有効期限の管理・経管責任者・専技の要件継続確認・財産的基盤・書類整備が必要で、更新申請は期限30日前までに行います。"},{"id":23,"cat":"総務部","type":"c","q":"「働き方改革（建設業2024年問題）」への会社としての対応策はどれか。","o":["ICT活用・多能工育成・工期適正化で時間削減","建設業は法律の時間外規制の適用除外になる","現状維持でよく特別な対応は不要である","工期を一律延長するだけで解決できる","残業代の増額対応だけで問題を解決できる","社員数を増やすことだけで解決できる"],"a":"A","ex":"2024年4月から建設業にも時間外労働上限規制が適用。施工効率化・ICT活用・工期適正化・多能工育成・4週8閉所推進等の複合的対応が必要です。"},{"id":24,"cat":"総務部","type":"c","q":"「ESG経営推進」において総務部が担う役割はどれか。","o":["ESG情報開示・規程整備を社内横断で推進する","環境への対応は設計担当部門だけが行う","工事品質管理・施工監理を主に担当する","社内イベントの企画と運営だけを行う","税務申告書類の作成のみを担当する","投資家向けのサステナ報告書作成のみ"],"a":"A","ex":"総務部はESG情報（環境・社会・ガバナンス）の収集・開示・社内規程整備・サステナビリティ報告書作成等の横断的推進役を担います。"},{"id":25,"cat":"積算部","type":"c","q":"「ECI（Early Contractor Involvement）方式」における積算部の役割として正しいものはどれか。","o":["下請業者の技術審査と選定のみを担当する","工事竣工後に精算業務のみを行う担当者","設計者の代わりに設計図面を作成する","設計段階で施工コスト・工法知見を積算に反映","設計段階には全く関与せず施工後に参画","発注者への工事費報告業務だけを担当"],"a":"D","ex":"ECI方式では施工者が設計段階から参画し、積算部は施工コスト・工法の合理性・VE提案等の知見を設計段階から提供してリスク管理に貢献します。"},{"id":26,"cat":"積算部","type":"c","q":"「インフレ・資材高騰局面での積算」で重要なことはどれか。","o":["下請業者に価格の固定を強制する","旧来の標準単価をそのまま使用する","市場の相場変動を無視して積算する","市場価格確認・スライド条項活用で適正価格を確保","全費用を一律10%増額して対応する","発注者に相場変動を報告しない方針"],"a":"D","ex":"資材高騰局面では市場実勢価格の定期調査・複数業者への見積依頼・スライド条項の活用・早期発注などで適正な工事費を確保します。"},{"id":27,"cat":"積算部","type":"c","q":"「公共工事の設計変更ガイドライン」の主旨として正しいものはどれか。","o":["設計変更の実施回数を規定で制限するもの","設計変更は設計者だけの責任で実施する","設計変更を一切認めない方針とするもの","設計変更費用は元請が全額負担するもの","設計変更費用は施工完了後に一括精算する","変更に対し費用・工期を適切に変更するのが主旨"],"a":"F","ex":"公共工事の設計変更ガイドラインは、設計変更が生じた際に費用・工期を適切に変更して元請・下請が適正な対価を得られるよう適正化を図ることが主旨です。"},{"id":28,"cat":"積算部","type":"c","q":"「LCC（ライフサイクルコスト）を踏まえた積算」で考慮すべき事項はどれか。","o":["10年分のコストだけで判断すれば十分","LCC積算は設計者だけが実施するもの","解体に関わる費用は積算対象外とされる","建設費・運用費・修繕費・解体費を生涯で評価","建設費だけを最小化することを最優先とする","初期コスト最小化で維持費は考慮しなくてよい"],"a":"D","ex":"LCC積算では建設費（初期投資）だけでなく、使用期間中の維持管理費・修繕費・改修費・解体費までを含めた生涯コストで比較評価します。"},{"id":29,"cat":"積算部","type":"c","q":"「積算アウトソーシング」を活用する場合の注意点はどれか。","o":["外注した場合は全ての責任が外注先に移る","外注先には全ての原価情報を開示する","外注先に全て任せれば社内確認は不要","外注先は費用だけを基準に業者を選定する","外注費用は全て工事原価に算入できる","積算内容の確認・情報漏洩対策・社内知見の維持が必要"],"a":"F","ex":"積算アウトソーシングでは外注先への情報管理・NDA締結・積算結果の社内確認・社内積算力の維持（ブラックボックス化防止）が重要です。"},{"id":30,"cat":"積算部","type":"c","q":"「DXを活用した積算業務改革」として正しいものはどれか。","o":["AIが全自動で行うため担当者は一切不要","BIM連携とAI活用で積算を効率化・高精度化","積算DXは竣工完了後に実施するもの","積算ソフト導入だけで全ては解決できる","積算のDXは設計部だけが担当するもの","積算はアナログ手作業が最も正確である"],"a":"B","ex":"積算DXはBIM連携による数量自動算出・クラウドでのリアルタイム共有・AIによる過去工事データ活用で積算効率・精度・スピードを向上させます。"},{"id":31,"cat":"経理部","type":"c","q":"電子帳簿保存法における電子取引データ保存で、注文書締結日とタイムスタンプ付与日のズレが法的に許容される「業務処理に係る通常の期間」の上限として正しいものはどれか。","o":["1か月以内（月次処理のサイクル）","1週間以内（週次業務処理の上限）","2か月以内（業務処理サイクル特例の上限）","3か月以内（四半期の処理の上限）","3日以内（受領後即時処理が原則）","6か月以内（半年処理の上限目安）"],"a":"C","ex":"電子帳簿保存法では、月をまたぐ業務処理サイクルが通常行われている場合、最長2か月以内であれば「その業務の処理に係る通常の期間」として許容される。建設業では月またぎの請求・検収処理が一般的であり、この特例が実務上重要となる。"}];

function openResultMailto(toEmail,toName,level,autoCorrect,autoTotal,opens,passed,timedOut){
  if(!toEmail)return;
  const rate=autoTotal>0?Math.round(autoCorrect/autoTotal*100):0;
  const passLabel=passed===true?"合格":passed===false?"不合格":"—";
  const subject=encodeURIComponent("【建設PAD検定】"+level+"級 受験結果");
  const nl="\n";
  const body=encodeURIComponent(
    toName+" さん"+nl+nl+
    "建設PAD検定の受験結果をお知らせします。"+nl+nl+
    "━━━━━━━━━━━━━━━━"+nl+
    "　級　　："+level+"級"+nl+
    "　得点　："+(autoTotal>0?autoCorrect+" / "+autoTotal+"問":"—")+nl+
    "　正答率："+(autoTotal>0?rate+"%":"—")+nl+
    "　判定　："+passLabel+nl+
    (timedOut?"　※時間切れで終了しました"+nl:"")+
    "　受験日："+new Date().toLocaleDateString("ja-JP")+nl+
    "━━━━━━━━━━━━━━━━"+nl+nl+
    "引き続き学習を頑張ってください。"+nl+
    "KENZO検定"
  );
  window.location.href="mailto:"+toEmail+"?subject="+subject+"&body="+body;
}

    localStorage.setItem("kr",JSON.stringify(state.results));
    localStorage.setItem("kp",JSON.stringify(state.pending));
  }catch(e){}
}
function saveSheetsUrl(url){
  state.sheetsUrl=url;
  try{localStorage.setItem("ks_url",url);}catch(e){}
}
function sendToSheets(r){
  if(!state.sheetsUrl)return;
  const kind=r.kind==="fde"?"建設FDE検定":r.kind==="cs"?"CS検定":"建設PAD検定";
  const rate=r.autoTotal>0?Math.round(r.autoCorrect/r.autoTotal*100):"";
  const passed=r.passed===true?"合格":r.passed===false?"不合格":"未採点";
  // 受験回数を計算
  const sameLv=state.results.filter(x=>x.userEmail===r.userEmail&&x.kind===r.kind&&x.level===r.level);
  const attemptNo=sameLv.length;
  const payload={受験者名:r.userName||"不明",メールアドレス:r.userEmail||"",検定種別:kind,級:r.level+"級",受験日:r.date||"",受験回数:attemptNo,正答数:r.autoCorrect||0,総問題数:r.autoTotal||0,"正答率(%)":rate,合否:passed};
  fetch(state.sheetsUrl,{method:"POST",body:JSON.stringify(payload)}).catch(()=>{});
}

let timerInterval=null;
function startTimer(secs){
  clearInterval(timerInterval);
  state.timeLeft=secs;
  timerInterval=setInterval(()=>{
    if(state.timeLeft<=0){clearInterval(timerInterval);handleTimeout();return;}
    state.timeLeft--;
    const tmrEl=document.querySelector('.tmr');
    if(tmrEl){
      tmrEl.textContent="⏱ "+fmtTime(state.timeLeft);
      tmrEl.className='tmr'+(state.timeLeft<=60?' warn':'');
    }
  },1000);
}
function stopTimer(){clearInterval(timerInterval);state.timeLeft=null;}
function handleTimeout(){
  const u=state.currentUser;
  const corr=state.session.filter(a=>a.correct===true).length;
  const total=state.session.length;
  const rate=total>0?Math.round(corr/total*100):0;
  const nr={
    id:Date.now(),date:new Date().toLocaleDateString("ja-JP"),
    level:state.examLv,week:state.examWk,
    autoCorrect:corr,autoTotal:total,openCount:0,
    total:state.examQs.length,passed:rate>=80,
    userName:u?u.name:"不明",userEmail:u?u.email:"",
    timedOut:true,mode:"exam",kind:state.examKind
  };
  state.results=[nr,...state.results];
  state.timeLeft=null;state.timedOut=true;state.done=true;
  saveData();
  sendToSheets(nr);
  if(u&&u.email)openResultMailto(u.email,u.name,state.examLv,corr,total,0,rate>=80,true);
  render();
}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}

{id:202,cat:"関係データベース",type:"m",q:"関係データベースの定義を答えよ",o:["関係データベースとは、データをキーと値のペアで管理し、テーブル構造を持たないデータベースである。","関係データベースとは、すべてのデータを1つの大きな表にまとめて格納し、重複を許容することで検索速度を高めたデータベースである。","データを「表」の形で管理して、テーブル同士を関連付けできるデータベースのこと。","関係データベースとは、データをJSON形式のドキュメント単位で保存し、スキーマを固定しないデータベースである。","関係データベースとはテーブル間を共通のキーで扱うデータベースである。"],a:"CE",ex:""},

{id:205,cat:"関係データベース",type:"c",q:"関係データベースで管理している学生表、科目表、成績表がある。一人の学生は複数の科目を履修するものとして学生表に登録されていない学生や科目表に登録されていない科目は成績表に登録できないものとするとき、外部キーとして設定するのが適切なものはどれか",o:["学生表の学生番号、成績表の学生番号","学生表の学生名、科目表の科目名","成績表の学生番号と科目コード","成績表の成績"],a:"C",ex:"「学生表に登録されていない学生や科目表に登録されていない科目は成績表に登録できないものとするとき」→この文言から親テーブルが学生表と科目表であることがわかる。外部キー制約…外部キーには「親テーブルに存在しない値は、子テーブル側に登録できない」というルールがある。学生表にいない学生は成績表に登録できない→成績表の学生番号が、学生表を参照する外部キーである必要がある。科目表にいない科目は成績表に登録できない→成績表の科目コードが、科目表を参照する外部キーである必要がある。2つの制約を両方満たすには、成績表側に「学生番号」と「科目コード」の両方を外部キーとして持たせる必要がある。これがウの内容。"},
{id:206,cat:"UXデザイン",type:"c",q:"UXデザインで用いられることがある構造化シナリオ法の定義を答えよ",o:["構造化シナリオ法とは、「価値シナリオ」で得られる成果、「行動シナリオ」で必要な機能要件、「操作シナリオ」で画面のビジュアルデザインを定義し、最終的にこれらを統合してペルソナを設定する手法である。","構造化シナリオ法とは、ユーザーの利用シーンを「行動シナリオ」「価値シナリオ」「操作シナリオ」の3段階に分け、ユーザーの具体的な行動からその背後にある価値を導き出し、最終的に画面操作に落とし込む手法である。","構造化シナリオ法とは、「価値シナリオ」でユーザーが得たい体験を明確にし、「行動シナリオ」で画面上の具体的なボタン操作や遷移を設計し、「操作シナリオ」でその行動が日常のどんな場面で発生するかを記述する手法である。","構造化シナリオ法とは、UXデザインにおいて、ユーザーの利用シーンを「価値シナリオ」「行動シナリオ」「操作シナリオ」の3段階に分けて、抽象的な価値から具体的な画面操作へと段階的に具体化していく手法である。"],a:"D",ex:""},
{id:207,cat:"UXデザイン",type:"c",q:"UXデザインで用いられることがある構造化シナリオ法における３つのシナリオはどれか",o:["アクティビティ、インタラクション、バリュー","アクティビティ、インタラクション、ペルソナ","アクティビティ、バリュー、ペルソナ","インタラクション、バリュー、ペルソナ"],a:"A",ex:"価値シナリオ=バリューシナリオ(Value)、行動シナリオ=アクティビティシナリオ(Activity)、操作シナリオ=インタラクションシナリオ(Interaction)"},

{id:209,cat:"無線LAN",type:"c",q:"無線LANの定義を選べ",o:["無線LANとは、電波の届く範囲であれば距離に関係なく通信できるネットワークであり、有線LANと異なり通信内容が第三者に傍受される心配がない方式である。","無線LANとは、ケーブル配線が困難な場所において、有線LANの代替として一時的に利用される方式であり、恒久的な接続方式としては採用されない。","無線LANとは、同一のネットワーク内であれば、ケーブルの有無にかかわらずすべての機器が自動的に同じ暗号化方式を共有する接続形態を指す。","家庭やオフィスなど、限られた範囲内でコンピューター同士を繋ぐネットワークのこと。「無線LAN」はその名の通り、ケーブルを使わずに電波でこのネットワークに繋ぐ仕組み"],a:"D",ex:"無線LANは電波の届く範囲であれば距離に関係なく通信できるネットワーク。無線LANは有線LANより傍受リスクが高い。ウの選択肢は「自動的に同じ暗号化方式を共有する」が誤り。実際は機器ごとに対応している暗号化規格が異なる場合がある。"},
{id:210,cat:"無線LAN",type:"c",q:"無線LANで使用するWPA2の機能として適切なものはどれか",o:["2本のアンテナを用いることによってデータの送受信を高速化する","アクセスポイントをステルス化する","通信データを暗号化する","登録されたMACアドレスを持つ機器以外からのアクセスを拒否する"],a:"C",ex:"無線LAN（Wi-Fi）の通信を暗号化し、不正アクセスを防ぐためのセキュリティ規格のこと。無線LANは電波を使うので有線LANと違って「近くにいれば誰でも通信を傍受できてしまう」という弱点がある。それを防ぐために通信内容を暗号化する仕組みとして策定されたのがWPA2。"},
{id:211,cat:"メモリ",type:"c",q:"PCの画面表示に必要なデータを保持するのに使われる画面表示専用メモリはどれか",o:["EEPROM","VRAM","キャッシュメモリ","フラッシュメモリ"],a:"B",ex:""},
{id:212,cat:"セキュリティ",type:"o",q:"ランサムウェアとはなにか",ma:"PC内のファイルを勝手に暗号化(ロック)して使えなくして、「元に戻してほしければ身代金(Ransom)を払え」と要求してくる悪意あるソフトウェア(マルウェア)の一種"},
{id:213,cat:"セキュリティ",type:"m",q:"ランサムウェアの感染対策として適切なものを全て選べ（そもそも感染しないために）",o:["データの暗号化","セキュリティソフトを最新に保つ","OSやソフトウェアのアップデートをする","感染に備えて、重要なファイルは常時接続された外付けHDDに自動同期でバックアップしておく。","重要なファイルには複雑なパスワードを設定して保存する","怪しいメールを開かない"],a:"BCF",ex:"「データの暗号化」はランサムウェア対策としては意味をなさない。ランサムウェアはPCに繋がってる外付けHDDやネットワークドライブごと暗号化することがあるのでバックアップ先は感染時に切り離されている状態でないと意味がない。パスワード設定はランサムウェアは「ファイルごと暗号化して人質にする」ため防げない。"},
{id:214,cat:"セキュリティ",type:"c",q:"感染の被害を抑えるために適切なものはどれか",o:["感染したPCを他のPCとネットワーク接続し、ウイルス対策ソフトでスキャンを実行する。","UPSを導入をしておく","日頃から定期的にログインパスワードを変更する","データのバックアップを日頃からとる"],a:"D",ex:"スキャン自体は必要な作業だがネットワーク接続したままが誤り。ランサムウェアは同一ネットワーク内の他のPCやサーバーにも感染を広げる性質があるためまずネットワークから切り離す(隔離する)のが先。UPS(無停電電源装置)は停電時の電源対策であってランサムウェアとは全く関係ない。パスワード変更は不正ログイン対策であってランサムウェアは「ファイルを暗号化して人質に取る」攻撃でログインを突破されることが直接の原因ではないケースが多い。普段からバックアップを取っておけばたとえ感染しても「バックアップから復元すればいい」で被害を最小限にできる。"},
{id:215,cat:"ネットワーク",type:"c",q:"スマートフォンにおける「Wi-Fi」と「モバイル通信(4G/5G)」に関する記述のうち、適切なものはどれか。",o:["Wi-Fiは携帯電話会社が街中に設置した基地局の電波を利用する仕組みであり、モバイル通信は家庭やお店に設置されたルーターの電波を利用する仕組みである","Wi-Fiは家庭やお店などに設置されたルーターの電波を利用する仕組みであり、モバイル通信は携帯電話会社が設置した基地局の電波を利用する仕組みである","Wi-Fiとモバイル通信は同一の基地局を共有しており、通信距離によって自動的にどちらを使うか切り替わる仕組みである","モバイル通信はWi-Fiの電波が届かない場所を補うための予備的な通信手段であり、Wi-Fiの代替として一時的に利用されるものである"],a:"B",ex:"Wi-Fiは限られた範囲(建物内など)をカバーするルーター経由の通信、モバイル通信は携帯電話会社が街中に設置した基地局経由でより広い範囲をカバーする通信という正しい対応関係になっている。外出先でWi-Fiに繋いでなくてもスマホが使えるのはモバイル通信(4G/5Gの基地局の電波)を使ってるから。"},
{id:216,cat:"ネットワーク",type:"c",q:"キャリアアグリゲーションの説明として適切なもの",o:["移動中に携帯電話が接続する基地局を切り替える技術","携帯電話の通信のセキュリティ機能を高める技術","複数の異なる周波数の電波を束ねることによって無線通信を高速化する技術","無線LANにおいてアクセスポイントと呼ばれる基地局を経由して端末同士が通信を行う技術","通信速度を犠牲にする代わりに、消費電力を抑えることを目的とした技術である"],a:"C",ex:"キャリアアグリゲーションは複数の周波数帯(電波の帯域)を同時に束ねて使うことで通信速度を向上させる技術。ユーザーが操作するものではなく対応端末・対応回線であれば自動的に適用される"},
{id:217,cat:"プロトコル",type:"c",q:"プロトコルの定義を選べ",o:["プロトコルとは、特定のメーカーが自社製品専用に開発した、他社製品とは互換性のない通信規格のことである。","プロトコルとは、通信速度を測定するために用いられる指標であり、数値が高いほど通信品質が良いことを示す。","プロトコルとは、コンピューター同士が通信する際に、データのやり取りの手順や形式についてあらかじめ定められた共通の規約である。","プロトコルとは、ハードウェア機器(ケーブルやアンテナなど)の物理的な形状や規格を指す用語である。"],a:"C",ex:"プロトコルは世界中の専門家が集まる「標準化団体」がみんなで話し合って決めた「共通ルール」。みんなが同じ標準プロトコルに従っているから会社もOSも国も関係なく世界中の機器が繋がる。"},
{id:218,cat:"プロトコル",type:"c",q:"メールソフトが電子メールの送受信に用いるプロトコルの組み合わせとして適切なものはどれか",o:["送信プロトコルがIMAP4、受信プロトコルがPOP3","送信プロトコルがIMAP4、受信プロトコルがSMTP","送信プロトコルがPOP3、受信プロトコルがSMTP","送信プロトコルがSMTP、受信プロトコルがIMAP4"],a:"D",ex:"メール送信・転送にはSMTP、メール受信にはPOP3またはIMAP4（サーバー上でメールを管理する方式）を使用します。"},
{id:219,cat:"データベース",type:"c",q:"関係データベースにおけるデータの正規化に関する次の記述中のa, bに入れる字句の適切な組み合わせは。正規化の主な目的としてデータの重複を排除し（a）ことが挙げられる。正規化には複数の段階がありこれを進めていくと（b）",o:["a:圧縮率を向上させる　b:一つの表が複数の表に分割される","a:圧縮率を向上させる　b:複数の表が一つの表に統合される","a:一貫性を保つ　b:一つの表が複数の表に分割される","a:一貫性を保つ　b:複数の表が一つの表に統合される"],a:"C",ex:""},
{id:220,cat:"セキュリティ",type:"c",q:"インターネットバンキングなどのWebサイトで利用されているリスクベース認証の例として適切なものはどれか",o:["利用者がいつもログインに使っているPCとは異なるPCからのログインであったので本人しか知らない秘密の質問による追加の認証を行った","利用者がログインした後、画面操作が一定時間なかったので自動的にログアウトして再度ログインを求めた","利用者がログインするときにパスワードを連続して複数回間違って入力したのでアカウントをロックした","利用者がログインに使っているパスワードが長時間変更されていなかったのでパスワードの変更を施した"],a:"A",ex:"アクセス元のIPアドレス、位置情報、端末環境などの「リスク要因」を検知・分析し、通常と異なる（危険度が高い）と判断された場合にのみ追加認証（秘密の質問やワンタイムパスワード）を課す仕組みです。"},
{id:221,cat:"AI・機械学習",type:"c",q:"ニューラルネットワークの定義について正しいものを選べ",o:["大量のデータをそのまま記憶し、完全一致するデータが来たときにその答えを返す仕組み","人間の脳のニューロンの仕組みを模した数学的モデルで、データから重み（パラメータ）を自動調整することでパターンを学習する機械学習の手法","決められた計算式に確定的な入力を与えると、常に同じ出力を返す静的な数式","入力層・隠れ層・出力層からなる多層構造を持ち、各層でデータを非線形変換しながら特徴量を抽出していく、ディープラーニングに特化したモデル","誤差逆伝播法（バックプロパゲーション）によって重みを更新する、教師あり学習専用のアルゴリズム"],a:"B",ex:"大量のデータからパターンを学習し未知のデータに対して予測・分類・生成を行うソフトウェア技術のこと。ニューラルネットワークは「未知のデータに対しても汎化（一般化）して予測できる」のが特徴。「常に同じ出力」という説明は学習によって重みが変化し続ける本質と矛盾する。ディープラーニングは「隠れ層を複数重ねたニューラルネットワーク」の総称でありニューラルネットワーク自体はより広範な概念。"},
{id:222,cat:"AI・機械学習",type:"c",q:"ニューラルネットワークの学習に用いられるバックプロパゲーションで行われていることはどれか",o:["各ノードの重みを調整して誤差を小さくする","各ノードの重みを調整して最適な活性化関数を選択する","ノードの数を変更して誤差を小さくする","ノードの数を変更して処理速度を高める"],a:"A",ex:"出力層で計算した「正解との誤差」を出力側から入力側に逆向きに伝えながら各ノード間の重みを少しずつ調整していく学習アルゴリズム。各ノードは前の層から数値を受け取り重みを掛けて活性化関数に通して次の層へ渡す。"},

{id:224,cat:"マルウェア",type:"c",q:"ファイルに寄生し、感染したファイルが実行されることで自己を複製し、他のファイルにも感染を広げていくマルウェアはどれか。",o:["ワーム","ウイルス","トロイの木馬","スパイウェア"],a:"B",ex:"ウイルスは他のファイルに寄生するのが最大の特徴。単体では存在・活動できず、感染したファイル（実行ファイルやマクロなど）が実行されて初めて動き出す。ユーザーがそのファイルを他人に渡したり共有したりすることで感染が広がっていく。"},
{id:225,cat:"マルウェア",type:"c",q:"単独のプログラムとして存在し、他のファイルに寄生することなく、ネットワークを介して自己複製しながら拡散するマルウェアはどれか。",o:["ウイルス","ランサムウェア","ワーム","トロイの木馬"],a:"C",ex:"ワームは単独で存在・活動できる点がウイルスとの決定的な違い。宿主ファイルを必要とせずネットワークの脆弱性を突いて自分自身をコピーしながら他のコンピュータへ自動的に拡散していく。人間の操作を介さずに広がることもあるため感染速度が非常に速い。"},
{id:226,cat:"マルウェア",type:"c",q:"一見便利なソフトウェアやツールを装ってユーザーに自らインストールさせ、実行後に裏で不正な処理（バックドアの設置や情報窃取など）を行うマルウェアはどれか。",o:["ワーム","トロイの木馬","ウイルス","ランサムウェア"],a:"B",ex:"名前の由来はギリシャ神話の「トロイの木馬」。一見便利なアプリ・ツール・ゲームなどを装ってユーザー自身に自らインストールさせるのがポイント。ウイルスやワームと違って自己増殖はしない。インストール後バックドアを仕掛けて外部からの遠隔操作を可能にしたり情報を盗み出したりする。"},
{id:227,cat:"マルウェア",type:"c",q:"感染したコンピュータ内のファイルを暗号化し、復号と引き換えに金銭を要求するマルウェアはどれか。",o:["スパイウェア","トロイの木馬","ランサムウェア","ワーム"],a:"C",ex:"「Ransom（身代金）」+「Software」の造語。感染するとファイルやシステム全体を勝手に暗号化し「元に戻したければ金を払え」と要求する。近年は「盗んだデータを公開するぞ」と二重に脅す二重恐喝型も増えている。"},
{id:228,cat:"マルウェア",type:"c",q:"ユーザーに気づかれないよう端末内に潜伏し、キー入力履歴や個人情報、閲覧履歴などを収集して外部に送信するマルウェアはどれか。",o:["ランサムウェア","ワーム","ウイルス","スパイウェア"],a:"D",ex:"「Spy（スパイ）」の名の通りユーザーに気づかれないよう潜伏し続けるのが最大の特徴。キーボード入力（キーロガー）、閲覧履歴、個人情報などを収集し外部のサーバーへこっそり送信する。破壊活動をしないぶん発覚しにくく長期間気づかれないケースが多い。"},
{id:229,cat:"マルウェア",type:"c",q:"職場のPCに適用する情報セキュリティ対策のうち、マルウェア対策ソフトの導入の他にマルウェア感染を防止するための対策として適切なものだけを全て挙げたものはどれか。a: OSのセキュリティパッチ（修正モジュール）の適用　b: 起動ドライブとなっているハードディスクに対するパスワード設定　c: 複雑かつ十分な長さを持つログインパスワードの導入",o:["a","a, b","b","c"],a:"A",ex:""},
{id:230,cat:"OSS",type:"c",q:"OSSの正式名称として正しいものはどれか。",o:["Open Source Software","Open Standard Software","Open System Software","Open Shared Software"],a:"A",ex:"OSS＝Open Source Software（オープンソースソフトウェア）の略。「ソースコードが公開されている」ことが定義の核なのでSourceが正しい。"},
{id:231,cat:"OSS",type:"c",q:"OSSの定義として最も適切なものはどれか。",o:["ソースコードが公開されており、利用・改変・再配布が誰にでも許可されているソフトウェア","無償で利用できるソフトウェアであり、著作権が放棄されているもの","誰でもソースコードを閲覧できるが、改変や再配布は元の著作権者の許可が個別に必要なソフトウェア","個人や非営利団体が開発した、企業のライセンス管理を受けないソフトウェア"],a:"A",ex:"OSSの定義の核心は「ソースコードの公開」だけでなく、利用・改変・再配布が（一定のライセンス条件のもとで）自由に許可されているという点。"},

function getQs(lv,wk){
  const R30=arr=>arr.slice().sort(()=>Math.random()-0.5).slice(0,30);
  if(state.examKind==="fde"){
    if(lv===1)return FDE1_Q;
    if(lv===2)return FDE2_Q;
    if(lv===3)return FDE3_Q;
    return FDE4_Q;
  }
  if(state.examKind==="pad"){if(lv===4)return R30(PAD4_Q);if(lv===3)return R30(PAD3_Q);if(lv===2)return R30(PAD2_Q);if(lv===1)return R30(PAD1_Q);}
  if(state.examKind==="dc")return R30(DC_Q);
  if(state.examKind==="cs"){if(lv===4)return CS_Q.slice(0,30);if(lv===3)return CS_Q.slice(30,60);if(lv===2)return CS_Q.slice(60,90);if(lv===1)return CS_Q.slice(90);return CS_Q;}
  if(state.examKind==="kensetsu"){if(lv===4)return R30(KENSETSU_Q4);if(lv===3)return R30(KENSETSU_Q3);if(lv===2)return R30(KENSETSU_Q2);if(lv===1)return R30(KENSETSU_Q1);return[];}
  if(lv===3)return [...Q3,...PAD3_Q];
  if(lv===4)return Q4;
  if(lv===2)return Q2;
  if(lv===1)return CASE1_Q;
  return[];
}
function myResults(){
  if(!state.currentUser)return[];
  return state.results.filter(r=>r.userEmail===state.currentUser.email);
}
function pCount(){return state.pending.filter(p=>!p.scored).length;}

// ===== 記述式 自動採点（ニュアンスマッチング） =====
function autoGradeOpen(userAns, gradingAns){
  if(!userAns||!gradingAns)return false;
  const ua=userAns.trim();
  const uaNorm=ua.replace(/[ぁ-ん]/g,s=>String.fromCharCode(s.charCodeAt(0)+0x60))
                  .toLowerCase().replace(/\s+/g,"");
  const tokens=gradingAns.split(/[、,・。\n（）【】：「」『』,\s\/＋　]+/)
    .map(t=>t.trim()).filter(t=>t.length>=2||/^[a-zA-Z]$/.test(t));
  if(tokens.length===0)return false;
  const uaWords=ua.split(/[、,・。\s\n（）【】：「」　]+/).map(w=>w.trim()).filter(w=>w.length>=1);
  const matched=tokens.filter(t=>{
    const tNorm=t.replace(/[ぁ-ん]/g,s=>String.fromCharCode(s.charCodeAt(0)+0x60))
                  .toLowerCase().replace(/\s+/g,"");
    if(ua.includes(t)||uaNorm.includes(tNorm))return true;
    if(uaWords.some(w=>w.length>=2&&(t.includes(w)||tNorm.includes(w.toLowerCase()))))return true;
    if(t.length>=3&&(ua.includes(t.slice(0,Math.ceil(t.length*0.5)))||uaNorm.includes(tNorm.slice(0,Math.ceil(tNorm.length*0.5)))))return true;
    if(t.length>=4){
      const chars=[...t];
      const charHits=chars.filter(c=>ua.includes(c)).length;
      if(charHits/chars.length>=0.6)return true;
    }
    return false;
  }).length;
  const threshold=tokens.length<=2?1/tokens.length:0.5;
  return matched/tokens.length>=threshold;
}

// ========== DOM helpers ==========
function el(tag,attrs={},...children){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==="cls")e.className=v;
    else if(k==="style")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of children){
    if(c===null||c===undefined)continue;
    if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

function renderExam(){
  const qs=state.examQs;
  const q=qs[state.qIdx];
  if(!q)return div("main","問題が見つかりません");
  const c=div("main");

  // プログレスバー
  const ebar=div("ebar");
  ebar.append(btn("back-btn","← 中断",()=>goPage("dash")));
  const kindTag=state.examKind==="fde"?"FDE":state.examKind==="cs"?"CS":"建設PAD";
  ebar.append(el("div",{cls:"elv"},kindTag+" "+state.examLv+"級"));
  const pbar=div("pbar");
  const pct=((state.qIdx+(state.answered?1:0))/qs.length)*100;
  pbar.append(el("div",{cls:"pfill",style:{width:pct+"%"}}));
  ebar.append(pbar);
  ebar.append(el("div",{cls:"ptxt"},(state.qIdx+1)+" / "+qs.length));
  c.append(ebar);

  // ケーススタディ（1級）シナリオ折りたたみ表示
  if(state.examKind==="kenzo"&&state.examLv===1&&q.case){
    const cbox=div("cbox");
    cbox.append(div("cbox-title","ケース1：宮崎県内中堅ゼネコンA社のシステム選定"));
    const scenarioLines=CASE1_SCENARIO.split('\n');
    const bd=div("cbox-body");
    scenarioLines.forEach(line=>{
      if(line.trim())bd.append(el("p",{style:{marginBottom:"5px"}},line));
    });
    cbox.append(bd);
    c.append(cbox);
  }

  // 問題カード
  const qcard=div("qcard");
  const qmeta=div("qmeta");
  qmeta.append(el("span",{cls:"qcat"},q.cat));
  if(q.wk)qmeta.append(el("span",{cls:"ttag"},q.wk));
  if(q.sec)qmeta.append(el("span",{cls:"ttag"},"§"+q.sec));
  qmeta.append(el("span",{cls:"ttag"},TLAB[q.type]));
  qcard.append(qmeta);
  qcard.append(el("div",{cls:"qtxt"},"Q"+(state.qIdx+1)+". "+q.q));
  if(q.code){
    qcard.append(el("pre",{style:{background:"#1a1a1a",color:"#d4d4d4",padding:"14px 16px",borderRadius:"2px",fontSize:"11px",fontFamily:"monospace",margin:"0 0 16px 0",overflowX:"auto",lineHeight:"1.6",border:"1px solid rgba(200,169,110,.2)"}},q.code));
  }

  if(q.type==="c"||q.type==="f"||q.type==="m"){
    const opts=div("opts");
    (q.o.map((opt,i)=>({opt,k:OPT[i]}))).forEach(({opt,k})=>{
      let cls="obtn";
      if(state.answered){
        if(q.type==="m"){const inS=(state.sel||"").includes(k),inA=q.a.includes(k);if(inA&&inS)cls+=" ok";else if(!inA&&inS)cls+=" ng";else if(inA&&!inS)cls+=" sh";}else{if(k===q.a&&k===state.sel)cls+=" ok";else if(k===state.sel)cls+=" ng";else if(k===q.a)cls+=" sh";}
      }else if(q.type==="m"&&(state.sel||"").includes(k)){cls+=" sel";}
      const b=el("button",{cls,onClick:()=>chooseOpt(k)});
      b.append(div("okey",k));
      b.append(el("span",{cls:"otxt"},opt));
      opts.append(b);
    });
    qcard.append(opts);
    if(q.type==="m"&&!state.answered){const cb=el("button",{cls:"obtn confirm-m",onClick:()=>confirmM()});cb.append(el("span",{},"\u78BA\u8A8D\u3059\u308B"));qcard.append(cb);}
  }
  if(q.type==="tf"){
    const tfrow=div("tfrow");
    [["true","○ 正しい"],["false","✕ 誤り"]].forEach(([v,lb])=>{
      let cls="tfbtn";
      if(state.answered){
        if(v===q.a&&v===state.sel)cls+=" tf-ok";
        else if(v===state.sel)cls+=" tf-ng";
        else if(v===q.a)cls+=" tf-sh";
      }
      tfrow.append(el("button",{cls,onClick:()=>chooseTF(v)},lb));
    });
    qcard.append(tfrow);
  }
  if(q.type==="o"){
    const sb=state.answered?null:btn("osbtn","回答を送信",submitOpen);
    if(sb)sb.disabled=!state.openTxt.trim();
    const ta=el("textarea",{cls:"oarea",placeholder:"回答を入力してください...",
      onInput:e=>{state.openTxt=e.target.value;if(sb)sb.disabled=!e.target.value.trim();}},state.openTxt);
    if(state.answered)ta.setAttribute("disabled","");
    qcard.append(ta);
    if(sb)qcard.append(sb);
    if(state.answered){
      const mans=div("mans");mans.append(div("mansl","📋 模範解答"),document.createTextNode(q.ma));
      qcard.append(mans);
    }
  }
  c.append(qcard);

  if(state.answered&&q.type!=="o"){
    const correct=state.sel===q.a;
    const fb=div("fb "+(correct?"ok-fb":"ng-fb"));
    if(correct)fb.textContent="✓ 正解です！";
    else if(q.type==="tf")fb.textContent=`✗ 不正解。正解は「${q.a==="true"?"○ 正しい":"✕ 誤り"}」です。`;
    else if(q.type==="m"){const correctStr=[...q.a].map(c=>`${c}. ${q.o[OPT.indexOf(c)]}`).join("、");fb.textContent=`✗ 不正解。正解は「${correctStr}」です。`;}else fb.textContent=`✗ 不正解。正解は「${OPT.indexOf(q.a)+1}. ${q.o[OPT.indexOf(q.a)]}」です。`;
    c.append(fb);
    if(q.ex){
      const exp=div("exp");
      exp.append(el("span",{cls:"expl"},"💡 POINT"));
      exp.append(document.createTextNode(q.ex));
      c.append(exp);
    }
  }
  if(state.answered&&q.type==="o"){
    const ans=state.session.find(a=>a.id===q.id);
    const openCorrect=ans&&ans.correct===true;
    const fb=div("fb "+(openCorrect?"ok-fb":"ng-fb"));
    fb.textContent=openCorrect?"✓ 正解です！":"✗ 不正解。模範解答を確認してください。";
    c.append(fb);
    if(q.ex){
      const exp=div("exp");
      exp.append(el("span",{cls:"expl"},"💡 POINT"));
      exp.append(document.createTextNode(q.ex));
      c.append(exp);
    }
  }
  if(state.answered){
    const nxtLabel=state.qIdx+1>=qs.length?"結果を見る →":"次の問題 →";
    c.append(btn("nxt",nxtLabel,nextQ));
  }
  return c;
}

// ========== Google Sheets Export (Admin) ==========
function exportFromSheets(){
  if(typeof XLSX==="undefined"){alert("Excelライブラリの読み込み中です。しばらくしてから再試行してください。");return;}
  const url=state.sheetsUrl;
  if(!url){alert("Google Sheets連携URLが設定されていません。\n管理者画面でWebhook URLを保存してください。");return;}
  const loadingMsg=document.createElement("div");
  loadingMsg.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:20px 30px;border-radius:8px;z-index:9999;font-size:14px;";
  loadingMsg.textContent="☁️ Google Sheetsからデータを取得中...";
  document.body.append(loadingMsg);
  fetch(url).then(r=>r.json()).then(j=>{
    loadingMsg.remove();
    if(j.error){alert("取得エラー: "+j.error);return;}
    const rows=j.data||[];
    if(rows.length===0){alert("Google Sheetsにデータがありません。");return;}
    const wb=XLSX.utils.book_new();
    const headers=Object.keys(rows[0]);
    const wsData=[headers,...rows.map(r=>headers.map(h=>r[h]||""))];
    const ws=XLSX.utils.aoa_to_sheet(wsData);
    ws["!cols"]=headers.map(()=>({wch:18}));
    XLSX.utils.book_append_sheet(wb,"受験履歴",ws);
    const today=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\//g,"");
    XLSX.writeFile(wb,"kenzo_sheets_export_"+today+".xlsx");
  }).catch(e=>{loadingMsg.remove();alert("取得失敗: "+e+"\n\nWebhook URLが正しいか、Apps Scriptが「全員」アクセスでデプロイされているか確認してください。");});
}

// ========== Excel Export ==========
function exportXLSX(targetEmail){
  if(typeof XLSX==="undefined"){alert("Excelライブラリの読み込み中です。しばらくしてから再試行してください。");return;}
  const examResults=state.results;
  const filtered=targetEmail?examResults.filter(r=>r.userEmail===targetEmail):examResults;
  if(filtered.length===0&&state.pending.length===0){alert("エクスポートするデータがありません");return;}
  // 受験回数を計算（ユーザー×種別×級ごと）
  const attemptMap={};
  const sortedForCount=[...filtered].sort((a,b)=>a.id-b.id);
  for(const r of sortedForCount){
    const k=(r.userEmail||r.userName)+"|"+(r.kind||"kenzo")+"|"+(r.level||"");
    attemptMap[r.id]=(attemptMap[k]=(attemptMap[k]||0)+1);
  }
  // Sheet1: 受験履歴
  const wsData=[["受験者名","メールアドレス","検定種別","級","受験日","受験回数","正答数","総問題数","正答率(%)","合否"]];
  for(const r of filtered){
    const kind=r.kind==="fde"?"建設FDE検定":"KENZO検定";
    const rate=r.autoTotal>0?Math.round(r.autoCorrect/r.autoTotal*100):"";
    const passed=r.passed===true?"合格":r.passed===false?"不合格":"未採点";
    wsData.push([r.userName||"不明",r.userEmail||"",kind,r.level?r.level+"級":"",r.date||"",attemptMap[r.id]||"",r.autoCorrect||0,r.autoTotal||0,rate,passed]);
  }
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(wsData);
  ws["!cols"]=[{wch:15},{wch:28},{wch:15},{wch:8},{wch:12},{wch:8},{wch:8},{wch:8},{wch:10},{wch:8},{wch:25}];
  XLSX.utils.book_append_sheet(wb,"受験履歴",ws);
  // Sheet2: 記述式回答
  const pd=targetEmail?state.pending.filter(p=>p.userEmail===targetEmail):state.pending;
  if(pd.length>0){
    const pdData=[["受験者名","メールアドレス","提出日","問題","回答","模範解答","採点済み","得点(0〜10)"]];
    for(const p of pd){
      pdData.push([p.userName||"不明",p.userEmail||"",p.date||"",p.qText||"",p.answer||"",p.modelAnswer||"",p.scored?"はい":"いいえ",p.scored?(p.score||0):"未採点"]);
    }
    const ws2=XLSX.utils.aoa_to_sheet(pdData);
    ws2["!cols"]=[{wch:15},{wch:28},{wch:12},{wch:35},{wch:35},{wch:35},{wch:8},{wch:10}];
    XLSX.utils.book_append_sheet(wb,"記述式回答",ws2);
  }
  const today=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\//g,"");
  const fname=targetEmail?"kenzo_results_"+today+".xlsx":"kenzo_all_results_"+today+".xlsx";
  XLSX.writeFile(wb,fname);
}

    status.textContent=examPasswords[kind]?"🔒 パスワード設定済み":"🔓 パスワードなし（誰でも受験可）";
    c.append(status);
  }

  // Google Sheets 連携設定
  c.append(el("div",{cls:"stit",style:{marginTop:"28px"}},"📋 Google スプレッドシート連携"));
  const sheetsNote=el("div",{style:{fontSize:"11px",color:"var(--gr)",marginBottom:"10px",lineHeight:"1.7"}});
  sheetsNote.innerHTML='試験完了時に自動でGoogle スプレッドシートへ送信します。<br>下記の <a href="https://script.google.com/" target="_blank" style="color:var(--gd)">Google Apps Script</a> ウェブアプリURLを貼り付けてください。';
  c.append(sheetsNote);
  const sheetsRow=el("div",{style:{display:"flex",gap:"8px",alignItems:"center",marginBottom:"8px"}});
  const sheetsInp=el("input",{type:"text",placeholder:"https://script.google.com/macros/s/...",value:state.sheetsUrl||"",style:{flex:"1",padding:"8px 10px",border:"1px solid var(--bd)",borderRadius:"2px",fontFamily:"'Noto Sans JP',sans-serif",fontSize:"11px",background:"var(--wh)"}});
  const saveBtn=btn("sbtn","保存",()=>{saveSheetsUrl(sheetsInp.value.trim());alert(sheetsInp.value.trim()?"✅ Webhook URLを保存しました":"⚠️ URLをクリアしました");});
  const testBtn=btn("sbtn","接続テスト",()=>{
    const u=sheetsInp.value.trim();
    if(!u){alert("URLを入力してください");return;}
    const payload={受験者名:"テスト太郎",メールアドレス:"test@example.com",検定種別:"KENZO検定",級:"3級",受験日:new Date().toLocaleDateString("ja-JP"),受験回数:1,"正答数":10,"総問題数":15,"正答率(%)":67,合否:"テスト"};
    fetch(u,{method:"POST",body:JSON.stringify(payload)}).then(()=>alert("✅ テスト送信成功！スプレッドシートを確認してください")).catch(e=>alert("❌ 送信失敗: "+e));
  });
  sheetsRow.append(sheetsInp,saveBtn,testBtn);
  c.append(sheetsRow);
  if(state.sheetsUrl){
    const connectedBadge=el("div",{style:{fontSize:"10px",color:"var(--ok)",marginBottom:"16px"}});
    connectedBadge.textContent="✅ 連携設定済み — 試験完了時に自動送信されます";
    c.append(connectedBadge);
  }
  // ===== サイト公開設定 =====
  // (学習モード設定は別ページへ)
    const exportBtn=btn("back-btn","📊 全受験結果をExcelでエクスポート（このデバイスのデータ）",()=>exportXLSX());
  exportBtn.style.cssText="margin-top:20px;background:var(--ok);color:var(--wh);border:none;font-weight:700;width:100%;padding:10px;";
  c.append(exportBtn);
  const sheetsExportBtn=btn("back-btn","☁️ Google Sheetsから全データをエクスポート",()=>exportFromSheets());
  sheetsExportBtn.style.cssText="margin-top:8px;background:#1a73e8;color:var(--wh);border:none;font-weight:700;width:100%;padding:10px;";
  c.append(sheetsExportBtn);
  const logoutBtnA=btn("back-btn","← ログアウト / トップへ戻る",()=>logout());
  logoutBtnA.style.cssText="margin-top:10px;background:transparent;color:var(--gr);border:1px solid var(--bd);";
  c.append(logoutBtnA);
  return c;
}

// ========== Navigation & Actions ==========
function nav(mode){state.authMode=mode;state.page="top";render();}
function goPage(page){state.page=page;render();}

function loginExamPw(){
  const pw=examPasswords[state.examKind]||"";
  if(!pw||state.examPw===pw){
    state.examPwErr="";state.examPw="";
    state.authMode="user-login";render();
  }else{
    state.examPwErr="パスワードが正しくありません";render();
  }
}
function loginUser(){
  if(!state.uName.trim()){state.uErr="名前を入力してください";render();return;}
  if(!state.uEmail.trim()||!state.uEmail.includes("@")){state.uErr="有効なメールアドレスを入力してください";render();return;}
  state.currentUser={name:state.uName.trim(),email:state.uEmail.trim()};
  state.authMode="user";state.page="dash";state.uErr="";render();
}
function loginAdmin(){
  if(state.adminPin===ADMIN_PIN){state.authMode="admin";state.page="admin";state.adminPinErr=false;state.adminPin="";render();}
  else{state.adminPinErr=true;render();}
}
function logout(){stopTimer();state.authMode="top";state.currentUser=null;state.examKind=null;state.page="top";render();}

function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function startExam(lv,wk="all"){
  const mode="exam";
  if(state.timeLeft!==null&&!state.done){
    alert("⚠️ 試験が進行中です。\n現在の試験を完了または中断してから新しい試験を開始してください。");
    goPage("exam");
    return;
  }
  state.examLv=lv;state.examWk=wk;
  state.examQs=(state.examKind==="dc"?getQs(lv,wk):shuffleArray(getQs(lv,wk))).slice(0,30);
  state.qIdx=0;state.sel=null;state.openTxt="";state.answered=false;
  state.session=[];state.done=false;state.timedOut=false;
  state.page="exam";
  state.timeLeft=getTimeLimit(lv);
  render();
  startTimer(state.timeLeft);
}

function chooseOpt(k){
  if(state.answered)return;
  const q=state.examQs[state.qIdx];
  if(q.type==="m"){
    const arr=(state.sel||"").split("").filter(Boolean);
    const idx=arr.indexOf(k);
    if(idx>=0)arr.splice(idx,1);else arr.push(k);
    state.sel=arr.sort().join("");
    render();return;
  }
  state.sel=k;state.answered=true;
  state.session=[...state.session,{id:q.id,type:q.type,sel:k,correct:k===q.a}];
  render();
}
function confirmM(){
  const q=state.examQs[state.qIdx];
  if(state.answered)return;
  state.answered=true;
  state.session=[...state.session,{id:q.id,type:q.type,sel:state.sel||"",correct:(state.sel||"")===q.a}];
  render();
}
function chooseTF(v){
  if(state.answered)return;
  const q=state.examQs[state.qIdx];
  state.sel=v;state.answered=true;
  state.session=[...state.session,{id:q.id,type:q.type,sel:v,correct:v===q.a}];
  render();
}
function submitOpen(){
  if(!state.openTxt.trim()||state.answered)return;
  const q=state.examQs[state.qIdx];
  state.answered=true;
  // 自動採点：gaフィールド（採点用答え）があればそちらを、なければmaを使用
  const isCorrect=autoGradeOpen(state.openTxt.trim(),q.ga||q.ma);
  state.session=[...state.session,{id:q.id,type:"o",sel:state.openTxt.trim(),correct:isCorrect}];
  render();
}
function nextQ(){
  const qs=state.examQs;
  if(state.qIdx+1>=qs.length){
    const corr=state.session.filter(a=>a.correct===true).length;
    const total2=state.session.length;
    const u=state.currentUser;
    const nr={id:Date.now(),date:new Date().toLocaleDateString("ja-JP"),level:state.examLv,week:state.examWk,autoCorrect:corr,autoTotal:total2,openCount:0,total:qs.length,passed:corr/qs.length>=0.8,userName:u?u.name:"不明",userEmail:u?u.email:"",mode:"exam",kind:state.examKind};
    state.results=[nr,...state.results];saveData();stopTimer();state.done=true;
    sendToSheets(nr);
    if(state.currentUser&&state.currentUser.email){
      openResultMailto(state.currentUser.email,state.currentUser.name,state.examLv,corr,total2,0,nr.passed,false);
    }
    render();
  }else{
    state.qIdx++;state.sel=null;state.openTxt="";state.answered=false;render();
  }
}
function scoreIt(pid){
  const v=parseInt(state.scoreIn[pid]);
  if(isNaN(v))return;
  state.pending=state.pending.map(p=>p.id===pid?{...p,scored:true,score:v}:p);
  saveData();render();
}

// ========== Main Render ==========
function render(){
  let app=document.getElementById("app");
  if(!app){app=document.createElement("div");app.id="app";document.body.appendChild(app);}
  app.innerHTML="";
  const am=state.authMode;
  if(am==="top"){app.append(renderTop());return;}
  if(am==="user-login"||am==="admin-login"){app.append(renderAuth(am));return;}
  if(am==="exam-pw"){app.append(renderExamPwAuth());return;}
  const wrapper=div("app");
  wrapper.append(renderHeader());
  const pg=state.page;
  if(am==="user"){
    if(pg==="dash")wrapper.append(renderDash());
    else if(pg==="fde4sel")wrapper.append(renderFde4Sel());
    else if(pg==="fde3sel")wrapper.append(renderFde3Sel());
    else if(pg==="l4sel")wrapper.append(renderL4Sel());
    else if(pg==="l3sel")wrapper.append(renderL3Sel());
    else if(pg==="l2sel")wrapper.append(renderL2Sel());
    else if(pg==="l1sel")wrapper.append(renderL1Sel());
    else if(pg==="exam"){
      if(state.done){
        wrapper.append(renderResult());
      }else{
        wrapper.append(renderExam());
      }
    }
    else if(pg==="hist")wrapper.append(renderHist());
  }
  if(am==="admin"){
    if(pg==="admin")wrapper.append(renderAdmin());
    else if(pg==="allhist")wrapper.append(renderAllHist());
  }
  app.append(wrapper);
}

// 拡張機能がDOMを書き換えた場合に再初期化する
(function(){
  function initApp(){
    let app=document.getElementById("app");
    if(!app){app=document.createElement("div");app.id="app";document.body.appendChild(app);}
    render();
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",initApp);
  } else {
    initApp();
  }
  // MutationObserverで#appが消えた場合に再描画
  const obs=new MutationObserver(function(){
    if(!document.getElementById("app")){
      setTimeout(function(){
        let app=document.createElement("div");
        app.id="app";
        document.body.appendChild(app);
        render();
      },50);
    }
  });
  obs.observe(document.body,{childList:true});
})();
</script>
