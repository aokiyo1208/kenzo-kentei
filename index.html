function saveData(){
  try{
    localStorage.setItem("kr",JSON.stringify(state.results));

let timerInterval=null;
function startTimer(secs){
  clearInterval(timerInterval);
  state.timeLeft=secs;
  timerInterval=setInterval(()=>{
    if(state.timeLeft<=0){clearInterval(timerInterval);handleTimeout();return;}
    state.timeLeft--;
    const tmrEl=document.querySelector('.tmr');
    if(tmrEl){
      tmrEl.textContent="竢ｱ "+fmtTime(state.timeLeft);
      tmrEl.className='tmr'+(state.timeLeft<=60?' warn':'');
    }
  },1000);
}
function stopTimer(){clearInterval(timerInterval);state.timeLeft=null;}
function handleTimeout(){
  const u=state.currentUser;
  const auto=state.session.filter(a=>a.correct!==null);
  const corr=auto.filter(a=>a.correct).length;
  const opens=state.session.filter(a=>a.type==="o").length;
  const nr={
    id:Date.now(),date:new Date().toLocaleDateString("ja-JP"),
    level:state.examLv,week:state.examWk,
    autoCorrect:corr,autoTotal:auto.length,openCount:opens,
    total:getQs(state.examLv,state.examWk).length,passed:null,
    userName:u?u.name:"荳肴�",userEmail:u?u.email:"",
    timedOut:true,mode:"exam",kind:state.examKind
  };
  state.results=[nr,...state.results];
  state.timeLeft=null;state.timedOut=true;state.done=true;
  saveData();
  if(u&&u.email)openResultMailto(u.email,u.name,state.examLv,corr,auto.length,opens,null,true);
  render();
}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function getQs(lv,wk){
  if(state.examKind==="fde"){
    if(lv===3)return Q3FDE;
    return wk==="all"?Q5:Q5.filter(q=>q.wk===wk.replace("Week","W"));
  }
  if(lv===4)return Q4;
  if(lv===3)return Q3;
  if(lv===2)return Q2;
  return[];
}
function myResults(){
  if(!state.currentUser)return[];
  return state.results.filter(r=>r.userEmail===state.currentUser.email);
}
function pCount(){return state.pending.filter(p=>!p.scored).length;}

// ========== DOM helpers ==========
function el(tag,attrs={},...children){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==="cls")e.className=v;
    else if(k==="style")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of children){
    if(c===null||c===undefined)continue;
    if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}
function div(cls,...children){return el("div",{cls},...children);}
function btn(cls,text,onclick){return el("button",{cls,onClick:onclick},text);}
function badge(cls,text){return el("span",{cls:"badge "+cls},text);}

  c.append(div("anote","搭 險倩ｿｰ蠑丞屓遲斐�閾ｪ蜍墓治轤ｹ縺輔ｌ縺ｾ縺帙ｓ縲ょ推蝗樒ｭ斐ｒ遒ｺ隱阪＠10轤ｹ貅轤ｹ縺ｧ謗｡轤ｹ縺励※縺上□縺輔＞縲"));
  c.append(div("stit","謗｡轤ｹ蠕�■�"+pc+"莉ｶ�"));
  const unscored=state.pending.filter(p=>!p.scored);
  if(unscored.length===0){c.append(div("empty","謗｡轤ｹ蠕�■縺ｮ蝗樒ｭ斐�縺ゅｊ縺ｾ縺帙ｓ"));}
  else{
    for(const p of unscored){
      const prow=div("prow");
      prow.append(div("pq",p.qText));
      prow.append(el("div",{cls:"pa"},"蝗樒ｭ費ｼ"+p.answer));
      prow.append(el("div",{cls:"mref"},"搭 讓｡遽�ｧ｣遲費ｼ"+p.modelAnswer));
      const srow=div("score-row");
      const inp=el("input",{cls:"si",type:"number",min:"0",max:"10",placeholder:"0縲10",value:state.scoreIn[p.id]||"",onInput:e=>state.scoreIn[p.id]=e.target.value});
      srow.append(inp,el("span",{style:{fontSize:"10px",color:"var(--gr)"}},"轤ｹ/10轤ｹ"),btn("sbtn","謗｡轤ｹ遒ｺ螳",()=>scoreIt(p.id)));
      prow.append(srow);
      prow.append(el("div",{cls:"pm"},"謠仙�譌･�"+p.date+" � 蜿鈴ｨ楢�ｼ"+el("strong",{},p.userName||"荳肴�").outerHTML));
      c.append(prow);
    }
  }
  const scored=state.pending.filter(p=>p.scored);
  if(scored.length>0){
    c.append(el("div",{cls:"stit",style:{marginTop:"26px"}},"謗｡轤ｹ貂医∩"));
    const tbl=el("table",{cls:"tbl"});
    const thead=el("thead");thead.append(el("tr",{},el("th",{},"蜿鈴ｨ楢"),el("th",{},"蝠城｡"),el("th",{},"謠仙�譌･"),el("th",{},"蠕礼せ")));
    const tbody=el("tbody");
    for(const p of scored){
      const tr=el("tr",{});
      const qtd=el("td",{});qtd.style.cssText="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";qtd.textContent=p.qText;
      tr.append(el("td",{},el("strong",{},p.userName||"荳肴�")),qtd,el("td",{},p.date),el("td",{},badge("bi",p.score+"/10")));
      tbody.append(tr);
    }
    tbl.append(thead,tbody);c.append(tbl);
  }
  return c;
}

// ========== Navigation & Actions ==========
function nav(mode){state.authMode=mode;state.page="top";render();}
function goPage(page){state.page=page;render();}

function loginUser(){
  if(!state.uName.trim()){state.uErr="蜷榊燕繧貞�蜉帙＠縺ｦ縺上□縺輔＞";render();return;}
  if(!state.uEmail.trim()||!state.uEmail.includes("@")){state.uErr="譛牙柑縺ｪ繝｡繝ｼ繝ｫ繧｢繝峨Ξ繧ｹ繧貞�蜉帙＠縺ｦ縺上□縺輔＞";render();return;}
  state.currentUser={name:state.uName.trim(),email:state.uEmail.trim()};
  state.authMode="user";state.page="dash";state.uErr="";render();
}
function loginAdmin(){
  if(state.adminPin===ADMIN_PIN){state.authMode="admin";state.page="admin";state.adminPinErr=false;state.adminPin="";render();}
  else{state.adminPinErr=true;render();}
}
function logout(){stopTimer();state.authMode="top";state.currentUser=null;state.examKind=null;state.page="top";render();}

function startExam(lv,wk="all",mode=state.examMode){
  state.examLv=lv;state.examWk=wk;state.examMode=mode;
  state.qIdx=0;state.sel=null;state.openTxt="";state.answered=false;
  state.session=[];state.done=false;state.timedOut=false;
  state.page="exam";
  if(mode==="exam"){
    state.timeLeft=getTimeLimit(lv);
    render();
    startTimer(state.timeLeft);
  }else{
    state.timeLeft=null;
    render();
  }
}

function chooseOpt(k){
  if(state.answered)return;
  const q=getQs(state.examLv,state.examWk)[state.qIdx];
  state.sel=k;state.answered=true;
  state.session=[...state.session,{id:q.id,type:q.type,sel:k,correct:k===q.a}];
  render();
}
function chooseTF(v){
  if(state.answered)return;
  const q=getQs(state.examLv,state.examWk)[state.qIdx];
  state.sel=v;state.answered=true;
  state.session=[...state.session,{id:q.id,type:q.type,sel:v,correct:v===q.a}];
  render();
}
function submitOpen(){
  if(!state.openTxt.trim()||state.answered)return;
  const q=getQs(state.examLv,state.examWk)[state.qIdx];
  state.answered=true;
  // 蟄ｦ鄙偵Δ繝ｼ繝峨〒縺ｯ pending 縺ｫ霑ｽ蜉縺励↑縺
  if(state.examMode==="exam"){
    const u=state.currentUser;
    const p={id:Date.now(),examId:"L"+state.examLv+"-Q"+q.id,qText:q.q,answer:state.openTxt.trim(),modelAnswer:q.ma,date:new Date().toLocaleDateString("ja-JP"),scored:false,score:null,userName:u?u.name:"荳肴�",userEmail:u?u.email:""};
    state.pending=[...state.pending,p];
    saveData();
  }
  state.session=[...state.session,{id:q.id,type:"o",sel:state.openTxt.trim(),correct:null}];
  render();
}
function nextQ(){
  const qs=getQs(state.examLv,state.examWk);
  if(state.qIdx+1>=qs.length){
    if(state.examMode==="study"){
      // 蟄ｦ鄙偵Δ繝ｼ繝: 螻･豁ｴ縺ｫ菫晏ｭ倥＠縺ｪ縺
      stopTimer();state.done=true;render();
    }else{
      // 隧ｦ鬨薙Δ繝ｼ繝: 邨先棡繧剃ｿ晏ｭ
      const auto=state.session.filter(a=>a.correct!==null);
      const corr=auto.filter(a=>a.correct).length;
      const opens=state.session.filter(a=>a.type==="o").length;
      const u=state.currentUser;
      const nr={id:Date.now(),date:new Date().toLocaleDateString("ja-JP"),level:state.examLv,week:state.examWk,autoCorrect:corr,autoTotal:auto.length,openCount:opens,total:qs.length,passed:opens===0?corr/qs.length>=0.8:null,userName:u?u.name:"荳肴�",userEmail:u?u.email:"",mode:"exam",kind:state.examKind};
      state.results=[nr,...state.results];saveData();stopTimer();state.done=true;
      if(state.currentUser&&state.currentUser.email){
        openResultMailto(state.currentUser.email,state.currentUser.name,state.examLv,corr,auto.length,opens,nr.passed,false);
      }
      render();
    }
  }else{
    state.qIdx++;state.sel=null;state.openTxt="";state.answered=false;render();
  }
}
function scoreIt(pid){
  const v=parseInt(state.scoreIn[pid]);
  if(isNaN(v))return;
  state.pending=state.pending.map(p=>p.id===pid?{...p,scored:true,score:v}:p);
  saveData();render();
}

// ========== Main Render ==========
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const am=state.authMode;
  if(am==="top"){app.append(renderTop());return;}
  if(am==="user-login"||am==="admin-login"){app.append(renderAuth(am));return;}
  const wrapper=div("app");
  wrapper.append(renderHeader());
  const pg=state.page;
  if(am==="user"){
    if(pg==="dash")wrapper.append(renderDash());
    else if(pg==="fde4sel")wrapper.append(renderFde4Sel());
    else if(pg==="fde3sel")wrapper.append(renderFde3Sel());
    else if(pg==="l4sel")wrapper.append(renderL4Sel());
    else if(pg==="l3sel")wrapper.append(renderL3Sel());
    else if(pg==="l2sel")wrapper.append(renderL2Sel());
    else if(pg==="exam"){
      if(state.done){
        if(state.examMode==="study")wrapper.append(renderStudyResult());
        else wrapper.append(renderResult());
      }else{
        wrapper.append(renderExam());
      }
    }
    else if(pg==="hist")wrapper.append(renderHist());
  }
  if(am==="admin"){
    if(pg==="admin")wrapper.append(renderAdmin());
    else if(pg==="allhist")wrapper.append(renderAllHist());
  }
  app.append(wrapper);
}

render();
</script>
