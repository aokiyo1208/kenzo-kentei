<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KENZO検定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style
*{box-sizing:border-box;margin:0;padding:0}
:root{--bk:#1a1a1a;--dk:#2C2C2C;--gd:#C8A96E;--gl:#E8CFA0;--cr:#F5F0E8;--wh:#FAFAF7;--gr:#8A8A8A;--bd:#D8D0C4;--ok:#4A7C59;--ng:#8B3A3A;--pd:#5A6A7A;--st:#3A6B8A}
body{font-family:'Noto Sans JP',sans-serif;background:var(--cr);color:var(--dk);min-height:100vh}
#app{min-height:100vh}
.hdr{background:var(--bk);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(200,169,110,.3)}
.logo{font-family:'Noto Serif JP',serif;font-size:19px;font-weight:700;letter-spacing:.15em;color:var(--gd)}
.logo span{color:rgba(255,255,255,.4);font-weight:300;font-size:11px;margin-left:9px}
.nav{display:flex;gap:4px;align-items:center}
.nb{background:none;border:none;color:rgba(255,255,255,.5);font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:6px 12px;cursor:pointer;border-radius:3px;transition:all .2s}
.nb:hover,.nb.act{color:var(--gd);background:rgba(200,169,110,.15)}
.tmr{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:700;color:var(--gd);background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.25);border-radius:3px;padding:3px 10px;margin-right:6px}
.tmr.warn{color:#E07070;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.utag{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.45)}
.utag strong{color:var(--gd);font-size:12px}
.lout{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.35);font-size:10px;padding:3px 9px;border-radius:2px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-left:5px}
.lout:hover{color:rgba(255,255,255,.75)}
.main{padding:32px 24px;max-width:820px;margin:0 auto;width:100%}
.pt{font-family:'Noto Serif JP',serif;font-size:24px;font-weight:300;margin-bottom:4px}
.ps{font-size:11px;color:var(--gr);margin-bottom:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.sc{background:var(--wh);border:1px solid var(--bd);padding:18px;border-radius:2px}
.sl{font-size:9px;color:var(--gr);letter-spacing:.2em;text-transform:uppercase;margin-bottom:7px}
.sv{font-family:'Noto Serif JP',serif;font-size:30px;font-weight:300}
.su{font-size:11px;color:var(--gr);margin-left:3px}
.stit{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:700;margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--bd)}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:24px}
.lcard{background:var(--wh);border:1px solid var(--bd);padding:16px 10px;border-radius:2px;cursor:pointer;transition:all .25s;text-align:center;position:relative;overflow:hidden}
.lcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--lc,var(--gd));transform:scaleX(0);transition:transform .25s}
.lcard:hover::before{transform:scaleX(1)}
.lcard:hover{border-color:var(--gd);transform:translateY(-2px)}
.lcard.dis{opacity:.4;cursor:not-allowed;pointer-events:none}
.lb{font-family:'Noto Serif JP',serif;font-size:19px;font-weight:700;margin-bottom:4px}
.ld{font-size:9px;color:var(--gr)}
.ls{margin-top:7px;font-size:9px;padding:2px 6px;border-radius:2px;display:inline-block}
.lo{background:rgba(200,169,110,.15);color:var(--gd)}
.ll{background:rgba(0,0,0,.05);color:var(--gr)}
.tbl{width:100%;border-collapse:collapse;background:var(--wh);border:1px solid var(--bd)}
.tbl th{background:var(--dk);color:var(--wh);font-size:9px;padding:9px 13px;text-align:left}
.tbl td{padding:9px 13px;font-size:11px;border-bottom:1px solid var(--bd)}
.tbl tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:9px;font-weight:500}
.bp{background:rgba(74,124,89,.15);color:var(--ok)}
.bf{background:rgba(139,58,58,.15);color:var(--ng)}
.bpd{background:rgba(90,106,122,.15);color:var(--pd)}
.bi{background:rgba(200,169,110,.15);color:#8B6A30}
.bst{background:rgba(58,107,138,.15);color:var(--st)}
.ebar{display:flex;align-items:center;gap:13px;margin-bottom:22px}
.back-btn{background:none;border:1px solid var(--bd);color:var(--gr);font-family:'Noto Sans JP',sans-serif;font-size:10px;padding:6px 13px;cursor:pointer;border-radius:2px}
.back-btn:hover{border-color:var(--dk);color:var(--dk)}
.elv{font-family:'Noto Serif JP',serif;font-size:15px;font-weight:700;color:var(--gd)}
.pbar{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--gd),var(--gl));transition:width .4s}
.ptxt{font-size:10px;color:var(--gr);white-space:nowrap}
.qcard{background:var(--wh);border:1px solid var(--bd);border-radius:2px;padding:28px 32px;margin-bottom:14px;animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.qmeta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.qcat{font-size:9px;color:var(--gd);letter-spacing:.2em;text-transform:uppercase}
.ttag{font-size:9px;padding:2px 6px;border-radius:2px;background:rgba(0,0,0,.06);color:var(--gr)}
.qtxt{font-family:'Noto Serif JP',serif;font-size:17px;line-height:1.7;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:7px}
.obtn{display:flex;align-items:center;gap:11px;padding:11px 15px;border:1px solid var(--bd);background:var(--wh);cursor:pointer;border-radius:2px;transition:all .2s;text-align:left;width:100%;font-family:'Noto Sans JP',sans-serif;font-size:12px}
.obtn:hover{border-color:var(--gd)}
.obtn.ok{border-color:var(--ok)!important;background:rgba(74,124,89,.08)!important}
.obtn.ng{border-color:var(--ng)!important;background:rgba(139,58,58,.08)!important}
.obtn.sh{border-color:var(--ok)!important;background:rgba(74,124,89,.04)!important}
.okey{width:24px;height:24px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.obtn.ok .okey,.obtn.sh .okey{background:var(--ok);border-color:var(--ok);color:#fff}
.obtn.ng .okey{background:var(--ng);border-color:var(--ng);color:#fff}
.obtn.sel{border-color:var(--gd)!important;background:rgba(200,169,110,.13)!important}
.obtn.sel .okey{background:var(--gd);border-color:var(--gd);color:var(--dk)}
.tfrow{display:flex;gap:9px}
.tfbtn{flex:1;padding:14px;border:1px solid var(--bd);background:var(--wh);cursor:pointer;border-radius:2px;font-family:'Noto Serif JP',serif;font-size:17px;transition:all .2s;text-align:center}
.tfbtn:hover{border-color:var(--gd)}
.tfbtn.tf-ok{border-color:var(--ok)!important;background:rgba(74,124,89,.1)!important}
.tfbtn.tf-ng{border-color:var(--ng)!important;background:rgba(139,58,58,.1)!important}
.tfbtn.tf-sh{border-color:var(--ok)!important;background:rgba(74,124,89,.05)!important}
textarea.oarea{width:100%;min-height:90px;border:1px solid var(--bd);border-radius:2px;padding:11px;font-family:'Noto Sans JP',sans-serif;font-size:12px;resize:vertical;background:var(--wh);outline:none;display:block}
textarea.oarea:focus{border-color:var(--gd)}
.osbtn{background:var(--dk);color:var(--wh);border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:9px 22px;cursor:pointer;border-radius:2px;margin-top:8px}
.osbtn:hover{background:var(--gd);color:var(--dk)}
.osbtn:disabled{opacity:.4;cursor:not-allowed}
.mans{margin-top:12px;padding:12px;background:rgba(74,124,89,.07);border:1px solid rgba(74,124,89,.2);border-radius:2px;font-size:11px;color:var(--ok);line-height:1.6}
.mansl{font-size:9px;font-weight:700;margin-bottom:3px}
.fb{padding:11px 16px;border-radius:2px;margin-bottom:14px;font-size:12px}
.fb.ok-fb{background:rgba(74,124,89,.12);color:var(--ok)}
.fb.ng-fb{background:rgba(139,58,58,.12);color:var(--ng)}
.fb.pd-fb{background:rgba(90,106,122,.1);color:var(--pd)}
.exp{padding:11px 16px;background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.25);border-radius:2px;margin-bottom:14px;font-size:11px;line-height:1.8}
.expl{font-size:9px;font-weight:700;color:var(--gd);display:block;margin-bottom:3px}
.nxt{background:var(--dk);color:var(--wh);border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:11px 26px;cursor:pointer;border-radius:2px;display:block;margin-left:auto}
.nxt:hover{background:var(--gd);color:var(--dk)}
.rcard{background:var(--wh);border:1px solid var(--bd);border-radius:2px;padding:48px 32px;text-align:center}
.ricon{font-size:44px;margin-bottom:11px}
.rgold{width:32px;height:2px;background:var(--gd);margin:0 auto 14px}
.rtit{font-family:'Noto Serif JP',serif;font-size:22px;font-weight:300;margin-bottom:4px}
.rscore{font-family:'Noto Serif JP',serif;font-size:52px;font-weight:700;color:var(--gd);line-height:1;margin:14px 0}
.rscore span{font-size:16px;color:var(--gr);font-weight:300}
.racts{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.pbtn{background:var(--dk);color:var(--wh);border:none;font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:9px 20px;cursor:pointer;border-radius:2px}
.pbtn:hover{background:var(--gd);color:var(--dk)}
.sbtn2{background:none;color:var(--dk);border:1px solid var(--bd);font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:9px 20px;cursor:pointer;border-radius:2px}
.sbtn2:hover{border-color:var(--dk)}
.anote{background:rgba(90,106,122,.08);border:1px solid rgba(90,106,122,.2);border-radius:2px;padding:12px 16px;font-size:11px;color:var(--pd);line-height:1.7;margin-bottom:14px}
.empty{text-align:center;padding:48px 20px;color:var(--gr)}
.prow{padding:13px;border:1px solid var(--bd);border-radius:2px;background:var(--wh);margin-bottom:7px}
.pq{font-size:12px;font-weight:500;margin-bottom:4px}
.pa{font-size:11px;padding:7px;background:var(--cr);border-radius:2px;line-height:1.6}
.mref{font-size:10px;color:var(--gr);margin-top:3px;font-style:italic}
.pm{font-size:9px;color:var(--gr);margin-top:4px}
.si{border:1px solid var(--bd);border-radius:2px;padding:3px 7px;font-size:11px;width:60px;font-family:'Noto Sans JP',sans-serif}
.sbtn{background:var(--dk);color:var(--wh);border:none;padding:5px 11px;border-radius:2px;cursor:pointer;font-size:10px}
.sbtn:hover{background:var(--gd);color:var(--dk)}
.top-s{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bk);flex-direction:column}
.top-logo{font-family:'Noto Serif JP',serif;font-size:38px;font-weight:700;color:var(--gd);letter-spacing:.2em;margin-bottom:6px}
.top-sub{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.3em;margin-bottom:48px}
.top-cards{display:flex;gap:14px}
.tc{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:28px 32px;cursor:pointer;transition:all .3s;text-align:center;min-width:170px}
.tc:hover{background:rgba(200,169,110,.1);border-color:var(--gd);transform:translateY(-3px)}
.tc-icon{font-size:26px;margin-bottom:10px}
.tc-label{font-family:'Noto Serif JP',serif;font-size:16px;color:var(--wh);margin-bottom:3px}
.tc-desc{font-size:9px;color:rgba(255,255,255,.3)}
.auth-s{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bk)}
.auth-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:40px 44px;width:380px}
.auth-title{font-family:'Noto Serif JP',serif;font-size:19px;color:var(--wh);margin-bottom:4px;font-weight:400}
.auth-sub{font-size:10px;color:rgba(255,255,255,.3);margin-bottom:26px}
.auth-label{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.15em;margin-bottom:6px;display:block}
.auth-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:2px;padding:10px 13px;font-family:'Noto Sans JP',sans-serif;font-size:12px;color:var(--wh);outline:none;margin-bottom:11px;display:block}
.auth-input:focus{border-color:var(--gd)}
.auth-input::placeholder{color:rgba(255,255,255,.18)}
.auth-btn{width:100%;background:var(--gd);color:var(--dk);border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:700;padding:12px;cursor:pointer;border-radius:2px;margin-top:4px}
.auth-btn:hover{background:var(--gl)}
.auth-error{font-size:10px;color:#E07070;margin-bottom:8px}
.auth-back{background:none;border:none;color:rgba(255,255,255,.28);font-size:10px;cursor:pointer;margin-top:11px;font-family:'Noto Sans JP',sans-serif;display:block;width:100%;text-align:center}
.auth-back:hover{color:rgba(255,255,255,.6)}
.warn-bar{background:rgba(224,112,112,.1);border:1px solid rgba(224,112,112,.3);border-radius:2px;padding:11px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wtabs{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.wtab{padding:7px 14px;border:1px solid var(--bd);background:var(--wh);border-radius:2px;cursor:pointer;font-size:12px;font-family:'Noto Sans JP',sans-serif}
.wtab:hover{border-color:var(--gd)}
.hidden{display:none}
.score-row{display:flex;align-items:center;gap:6px;margin-top:7px}

.sq-row{border:1px solid var(--bd);border-radius:2px;margin-bottom:10px;overflow:hidden;background:var(--wh)}
.sq-hdr{padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;border-bottom:1px solid var(--bd)}
.sq-hdr.sq-ok{background:rgba(74,124,89,.07)}
.sq-hdr.sq-ng{background:rgba(139,58,58,.07)}
.sq-hdr.sq-pd{background:rgba(90,106,122,.07)}
.sq-body{padding:12px 14px;font-size:11px;color:var(--gr);line-height:1.7}
.sq-ans{margin-top:6px;padding:6px 10px;border-radius:2px;font-size:11px}
.sq-ans.ans-ok{background:rgba(74,124,89,.08);color:var(--ok)}
.sq-ans.ans-ng{background:rgba(139,58,58,.08);color:var(--ng)}
.sq-exp{margin-top:6px;padding:8px 10px;background:rgba(200,169,110,.08);border-radius:2px;font-size:10px;color:#8B6A30;line-height:1.6}
/* ケーススタディ（1級） */
.cbox{background:var(--wh);border:1px solid var(--bd);border-left:4px solid var(--gd);border-radius:2px;padding:20px 24px;margin-bottom:22px}
.cbox-title{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:700;color:var(--gd);letter-spacing:.1em;margin-bottom:10px}
.cbox-body{font-size:12px;line-height:2;color:var(--dk)}
.cbox-body ul{padding-left:1.4em;margin:.5em 0}
.cbox-body li{margin:.2em 0}
.cbox-body strong{color:var(--gd);font-weight:700}
.ctag{display:inline-block;background:rgba(44,62,80,.1);color:#2C3E50;font-size:9px;padding:2px 7px;border-radius:2px;font-weight:700;letter-spacing:.1em;margin-bottom:6px}
.case-toggle{background:none;border:1px solid var(--bd);color:var(--gr);font-family:'Noto Sans JP',sans-serif;font-size:10px;padding:4px 10px;cursor:pointer;border-radius:2px;margin-bottom:12px}
.case-toggle:hover{border-color:var(--gd);color:var(--gd)}
.top-admin{margin-top:20px;text-align:center;cursor:pointer;color:var(--mu);font-size:11px;opacity:.4;letter-spacing:.05em}.top-admin:hover{opacity:.8}
/* ===== スマホ対応 (max-width:640px) ===== */
@media(max-width:640px){
  /* トップページ */
  .top-s{padding:32px 0}
  .top-logo{font-size:26px;letter-spacing:.08em}
  .top-sub{font-size:10px;margin-bottom:28px;letter-spacing:.15em}
  .top-cards{flex-direction:column;align-items:stretch;width:100%;padding:0 16px;gap:10px}
  .tc{padding:14px 18px;min-width:unset;display:flex;align-items:center;gap:14px;text-align:left}
  .tc-icon{font-size:22px;margin-bottom:0;flex-shrink:0}
  .tc-label{font-size:14px;margin-bottom:1px}
  .tc-desc{font-size:9px}

  /* ヘッダー */
  .hdr{padding:0 12px;height:48px}
  .logo{font-size:13px;letter-spacing:.05em}
  .nb{font-size:10px;padding:4px 7px}
  .act{font-size:10px;padding:4px 9px}
  .tmr{font-size:11px;padding:3px 8px}
  .utag{font-size:10px;padding:3px 8px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* メインコンテンツ */
  .main{padding:14px 12px}

  /* 統計カード */
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .sc{padding:12px 10px}
  .sv{font-size:22px}
  .sl{font-size:8px}
  .su{font-size:10px}
  .stit{font-size:12px;margin-bottom:8px}

  /* レベルグリッド */
  .lgrid{grid-template-columns:repeat(2,1fr);gap:8px}
  .lcard{padding:14px 8px}

  /* 試験進行バー */
  .ebar{gap:8px;margin-bottom:14px}
  .ptxt{font-size:9px}
  .elv{font-size:13px}
  .back-btn{font-size:9px;padding:5px 10px}

  /* 問題カード */
  .qcard{padding:16px 14px}
  .qtxt{font-size:14px;line-height:1.7}
  .obtn{padding:9px 12px;font-size:11px;gap:8px}
  .okey{width:22px;height:22px;font-size:10px;flex-shrink:0}
  .opts{gap:7px}

  /* 記述式 */
  .oarea{font-size:12px;padding:10px}

  /* フィードバック・解説 */
  .fb{padding:10px 14px;font-size:11px}
  .exp{padding:10px 14px}
  .expl{font-size:11px;line-height:1.7}

  /* 次の問題ボタン */
  .nxt{font-size:11px;padding:10px 20px;margin-top:8px}

  /* 結果カード */
  .rcard{padding:24px 16px}
  .ricon{font-size:36px}
  .rtit{font-size:16px}
  .rscore{font-size:32px}
  .racts{flex-direction:column;align-items:stretch;gap:8px}
  .pbtn{font-size:11px;padding:11px 16px;text-align:center}
  .sbtn2{font-size:11px;padding:11px 16px;text-align:center}

  /* 認証ボックス */
  .auth-box{padding:24px 18px;margin:0 16px;width:calc(100% - 32px)}
  .auth-title{font-size:16px}
  .auth-input{font-size:14px;padding:10px 12px}
  .auth-btn{font-size:13px;padding:12px}

  /* 受験履歴テーブル */
  .tbl{font-size:10px}

  /* スコア行 */
  .score-row{flex-wrap:wrap;gap:4px}

  /* ページング */
  .prow{flex-direction:column;gap:8px;align-items:flex-start}
}

/* タブレット対応 (max-width:900px) */
@media(max-width:900px){
  .lgrid{grid-template-columns:repeat(3,1fr)}
  .top-cards{flex-wrap:wrap;justify-content:center}
  .tc{min-width:140px}
  .main{padding:24px 16px}
}
</style>
</head>
<body>

重要な原則はどれか？","o":["スピード優先","属人化","権限と責任の一致","部門分離"],"a":"C","ex":"発注業務では、権限（誰が発注できるか）と責任（原価・品質の結果責任）が一致していることが最も重要です。"},{"id":17,"sec":"H","cat":"発注業務","type":"f","q":"中小企業において現場監督が発注業務を担う主な理由はどれか？","o":["ガバナンス強化","スピード確保","内部統制","分業体制"],"a":"B","ex":"中小企業では専門の購買部門がなく、現場の状況を最もよく把握している現場監督がスピード重視で発注を担うことが多いです。"},{"id":18,"sec":"H","cat":"発注業務","type":"f","q":"企業規模が拡大した際に購買機能を分離する主な目的はどれか？","o":["現場負担増加","原価の個別最適","原価の全体最適化","工期短縮"],"a":"C","ex":"企業規模が大きくなると、現場ごとのバラバラな発注では原価管理が難しくなるため、購買機能を集約して全体最適を図ります。"},{"id":19,"sec":"H","cat":"発注業務","type":"f","q":"現場が発注を行い、本社が原価責任を持つ場合のリスクはどれか？","o":["スピード向上","原価の可視化","責任の不一致","品質向上"],"a":"C","ex":"発注する現場と原価責任を負う本社が分離していると、誰がコストをコントロールすべきか曖昧になり、責任の不一致が生じます。"},{"id":20,"sec":"H","cat":"発注業務","type":"f","q":"実務上、協力会社の選定を担うことが多いのはどれか？","o":["営業","積算","現場監督","経理"],"a":"C","ex":"実務では現場の状況・工程・品質を最もよく把握している現場監督が、協力会社の選定・手配を行うケースが多いです。"},{"id":21,"sec":"H","cat":"発注業務","type":"f","q":"原価統制の観点から協力会社の単価を管理すべき部門はどれか？","o":["営業","積算","現場監督","購買"],"a":"D","ex":"原価統制の理想形は、専門知識と全社視点を持つ購買部門が単価交渉・管理を一元的に担うことです。"},{"id":22,"sec":"H","cat":"発注業務","type":"f","q":"現場監督に発注権限を持たせる最大のメリットはどれか？","o":["原価安定","スピード向上","標準化","内部統制"],"a":"B","ex":"現場監督が発注権限を持つ最大のメリットは、現場の変化に即応できるスピードです。ただし原価管理や標準化は課題となります。"},{"id":23,"sec":"H","cat":"発注業務","type":"f","q":"現場主導型組織で最も起こりやすい課題はどれか？","o":["柔軟性低下","原価のブラックボックス化","工期遅延","人員過多"],"a":"B","ex":"現場が個別に発注を行うと、単価や取引先の情報が本社に集まらず、原価がブラックボックス化しやすくなります。"},{"id":24,"sec":"H","cat":"発注業務","type":"f","q":"購買部門を設置することで最も実現できるものはどれか？","o":["個別最適","属人化","単価の標準化","現場裁量拡大"],"a":"C","ex":"購買部門が単価交渉・管理を集約することで、現場ごとにバラバラだった単価を会社全体で標準化できます。"},{"id":25,"sec":"H","cat":"発注業務","type":"f","q":"購買主導型組織のデメリットとして最も適切なのはどれか？","o":["原価不明確","スピード低下","利益不安定","品質低下"],"a":"B","ex":"購買部門を経由した承認・発注プロセスが加わることで、現場の緊急ニーズへの対応が遅れるスピード低下が生じやすいです。"},{"id":26,"sec":"H","cat":"発注業務","type":"f","q":"発注業務を現場と購買で分担する場合に最も重要なことはどれか？","o":["曖昧な役割分担","属人化","明確なルール設計","スピード優先"],"a":"C","ex":"現場と購買が連携するには、どちらが何をどこまで担うかを明確なルールとして設計・共有することが不可欠です。"},{"id":27,"sec":"H","cat":"発注業務","type":"f","q":"現場ごとに単価がバラバラな状態で起こる問題はどれか？","o":["利益安定","原価のばらつき","工期短縮","品質向上"],"a":"B","ex":"同じ工種・作業でも現場によって単価が異なると、会社全体の原価が不安定になり、利益予測や原価改善が困難になります。"},{"id":28,"sec":"H","cat":"発注業務","type":"f","q":"発注業務のDXで最も解決すべき課題はどれか？","o":["現場人数削減","原価データの一元化","工期短縮","安全管理"],"a":"B","ex":"発注DXの核心は、FAXや紙・電話でバラバラに行われていた発注情報をシステムに集約し、原価データを一元管理することです。"},{"id":29,"sec":"H","cat":"発注業務","type":"f","q":"現場に権限を持たせつつ統制を効かせるために最も有効な方法はどれか？","o":["完全自由化","紙運用","システムによる可視化","属人化"],"a":"C","ex":"システムで発注データを記録・可視化することで、現場の裁量を保ちながら本社も原価状況をリアルタイムで把握できます。"},{"id":30,"sec":"H","cat":"発注業務","type":"f","q":"発注権限を本社に集中させる主な目的はどれか？","o":["現場効率化","原価統制","スピード向上","現場裁量強化"],"a":"B","ex":"本社集中型の発注体制は、単価の交渉力強化・不正防止・原価の全社管理を目的とした原価統制が主な狙いです。"},{"id":31,"sec":"H","cat":"発注業務","type":"f","q":"発注ルールが存在しない場合に最も起こりやすい問題はどれか？","o":["利益最大化","原価統一","不正・ミス増加","工期短縮"],"a":"C","ex":"発注ルールがなければ、担当者の判断に委ねられるため、誤発注・水増し・癒着などの不正やミスが発生しやすくなります。"},{"id":32,"sec":"H","cat":"発注業務","type":"f","q":"現場と購買の役割が曖昧な場合に起こる問題はどれか？","o":["スピード向上","責任不明確","品質向上","工期短縮"],"a":"B","ex":"役割が曖昧だと「誰が最終承認するのか」「誰が原価に責任を持つのか」が不明確になり、トラブル時の対応が遅れます。"},{"id":33,"sec":"H","cat":"発注業務","type":"f","q":"全社的な原価改善を実現するために最も重要なことはどれか？","o":["現場任せ","単価の標準化","属人化","個別最適"],"a":"B","ex":"現場ごとにバラバラな単価を統一・標準化することが、全社的な原価改善の基盤となります。"},{"id":34,"sec":"H","cat":"発注業務","type":"f","q":"現場が独自に協力会社を固定化することで起こりやすい問題はどれか？","o":["柔軟性向上","競争原理の低下","品質向上","工期短縮"],"a":"B","ex":"特定の協力会社との固定的な関係が続くと、見積りの競争が生まれず、単価が適正水準より高止まりする競争原理の低下が起きます。"},{"id":35,"sec":"H","cat":"発注業務","type":"f","q":"現場主導と購買主導の最適な関係はどれか？","o":["完全に現場任せ","完全に本社管理","権限と統制のバランス","属人化"],"a":"C","ex":"現場のスピード・柔軟性と、購買の原価統制・標準化を両立させる「権限と統制のバランス」が最も理想的な組織設計です。"}];

const Q2=[{"id":1,"cat":"FDEの本質","type":"c","q":"初回ヒアリング後の初動として最も適切なのはどれか","o":["既存ツールの導入可否を並行検討する","現状業務のKPIを定義し、改善余地を数値化する","主要ユースケースに絞った簡易プロトタイプを提示する","詳細要件を網羅した仕様書を作成する"],"a":"B","ex":"初動で最も重要なのは現状の定量把握。KPI定義で改善余地を明確にしてから次のステップへ進む。"},{"id":2,"cat":"FDEの本質","type":"c","q":"FDEが価値を最大化しやすい条件はどれか","o":["意思決定者と現場双方にアクセスできる","開発期間が長期で確保されている","技術スタックが統一されている","要件が明確に固定されている"],"a":"A","ex":"FDEは意思決定者と現場の両方と連携することで、判断と実行が高速に回せる。"},{"id":3,"cat":"FDEの本質","type":"c","q":"要件が曖昧なプロジェクトの進め方として最も適切なのはどれか","o":["仮説ベースで小さく検証を回す","顧客判断に委ねる","全体設計を固めてから着手する","要件確定まで開発を控える"],"a":"A","ex":"曖昧さを前提に仮説検証を繰り返すことで、要件を漸進的に明確化する。"},{"id":4,"cat":"FDEの本質","type":"c","q":"FDEの行動として信頼毀損リスクが最も高いのはどれか","o":["スコープ調整を行い段階的に提供する","仕様変更の影響範囲を整理して再提案する","調整内容を顧客に共有せず内部判断で変更する","優先度の低い機能を後工程に回す"],"a":"C","ex":"顧客への情報遮断は信頼関係の根本的な破壊につながる。透明性が信頼の基盤。"},{"id":5,"cat":"FDEの本質","type":"c","q":"成果が出ないプロジェクトの特徴はどれか","o":["改善サイクルが回っている","開発スピードが一定である","顧客との定例がある","成果指標が曖昧なまま進行している"],"a":"D","ex":"何をもって成功とするかが不明確なまま進むと、方向修正ができず成果に結びつかない。"},{"id":6,"cat":"業務理解（建設）","type":"c","q":"DX初期フェーズで最も優先度が低いのはどれか","o":["見積回収の効率化","原価管理の全面刷新","請求処理の電子化","発注管理の整理"],"a":"B","ex":"原価管理の全面刷新は複雑度・影響範囲が大きく、初期フェーズには不向き。小さく確実な改善から始める。"},{"id":7,"cat":"業務理解（建設）","type":"c","q":"協力会社の対応を踏まえた最適設計はどれか","o":["IT教育を前提に設計する","アナログ入力をデータ化する仕組みを持つ","全社統一フォーマットを強制する","利用企業を限定する"],"a":"B","ex":"協力会社はITリテラシーが多様。アナログ入力を受け付けつつデータ化する設計が現実的。"},{"id":8,"cat":"業務理解（建設）","type":"c","q":"紙運用が残る環境での現実的アプローチはどれか","o":["完全電子化を短期間で実施","紙運用を維持する","段階的にデータ化レイヤーを挟む","電子化完了まで運用停止"],"a":"C","ex":"紙と電子の並走期間を設け、段階的にデータ化を進めることが現場混乱を最小化する。"},{"id":9,"cat":"業務理解（建設）","type":"c","q":"ROIが最も出やすい領域はどれか","o":["ブランディング","現場施工改善","採用管理","事務処理の一元化"],"a":"D","ex":"事務処理は繰り返し頻度が高く、電子化・一元化による工数削減効果が定量的に測定しやすい。"},{"id":10,"cat":"業務理解（建設）","type":"c","q":"現場負荷が高い状況での導入戦略はどれか","o":["管理部門のみ導入","現場の余力が出るまで延期","高インパクト領域から段階導入","全工程を一括導入"],"a":"C","ex":"負荷が高い中でも最大成果を得るには、インパクトの大きい領域から優先的に段階導入する。"},{"id":11,"cat":"要件定義","type":"c","q":"要件定義の進め方として最も適切なのはどれか","o":["MVP単位で定義し改善を前提とする","技術制約から逆算する","顧客に要件整理を委ねる","全要件を初期に確定する"],"a":"A","ex":"MVPで最小限の価値を定義し、学習を積み重ねながら要件を進化させるのが現代的な手法。"},{"id":12,"cat":"要件定義","type":"c","q":"PoCの失敗要因として最も多いのはどれか","o":["UI未完成","スコープ過大","データ不足","技術不足"],"a":"B","ex":"PoCは検証目的であるべきところ、スコープが広すぎると検証スピードが落ち失敗につながる。"},{"id":13,"cat":"要件定義","type":"c","q":"優先順位設計の基準として最も適切なのはどれか","o":["UI改善度","インパクト×実現性","顧客要望数","実装難易度"],"a":"B","ex":"インパクト（効果の大きさ）と実現性（実現可能性）の掛け合わせが合理的な優先順位判断の基準。"},{"id":14,"cat":"要件定義","type":"c","q":"変更が頻発する案件の進め方はどれか","o":["開発停止","設計優先","短サイクルで改善","要件固定"],"a":"C","ex":"変化を前提に短いサイクルで仮説検証を回す方が、固定化よりも変化への適応力が高い。"},{"id":15,"cat":"要件定義","type":"c","q":"要件定義で最も重視すべきはどれか","o":["UI","技術仕様","業務成果","工数"],"a":"C","ex":"要件定義の目的は業務課題の解決。技術やUIはその手段にすぎず、業務成果が起点となる。"},{"id":16,"cat":"技術・実装","type":"c","q":"短期間で価値を出す構成はどれか","o":["フルスクラッチ","外注中心","既存ツール＋API","自社開発"],"a":"C","ex":"既存ツールをAPIで連携することで、開発工数を最小化しながら早期に価値提供できる。"},{"id":17,"cat":"技術・実装","type":"c","q":"ノーコードを避けるべきケースはどれか","o":["PoC段階","高度カスタマイズ必要","短期開発","要件不確定"],"a":"B","ex":"ノーコードはカスタマイズ限界があるため、高度な業務固有処理が必要な場合は適さない。"},{"id":18,"cat":"技術・実装","type":"c","q":"RAG導入の主目的はどれか","o":["UI改善","コスト削減","ナレッジ活用","自動化"],"a":"C","ex":"RAGは社内ドキュメントなどのナレッジを検索・活用してAI回答の精度を上げる技術。"},{"id":19,"cat":"技術・実装","type":"c","q":"API連携の価値はどれか","o":["UI統一","サーバー強化","データ統合","デザイン改善"],"a":"C","ex":"APIによりシステム間のデータを統合し、二重入力やデータ不整合を防ぐことが主な価値。"},{"id":20,"cat":"技術・実装","type":"c","q":"技術選定の基準として最も重要なのはどれか","o":["コスト","開発速度","継続運用性","最新性"],"a":"C","ex":"どれだけ最新・安価でも継続運用できなければ意味がない。保守性・拡張性が最重要基準。"},{"id":21,"cat":"運用・定着","type":"c","q":"定着しない原因として最も多いのはどれか","o":["UI","コスト","技術不足","現場負荷"],"a":"D","ex":"いくら良いシステムでも現場が忙しく使う余裕がなければ定着しない。現場負荷の軽減が鍵。"},{"id":22,"cat":"運用・定着","type":"c","q":"運用定着に必要なのはどれか","o":["UI改善","マニュアル","教育","業務組み込み"],"a":"D","ex":"マニュアルや教育だけでは不十分。日常業務のフローにシステムを組み込むことで自然に定着する。"},{"id":23,"cat":"運用・定着","type":"c","q":"適切なKPIはどれか","o":["コード量","デザイン評価","開発時間","利用率"],"a":"D","ex":"システムの成否は実際に使われているかで測る。利用率が業務改善の起点となるKPI。"},{"id":24,"cat":"運用・定着","type":"c","q":"改善サイクルとして正しいのはどれか","o":["開発→終了","実装→運用→改善","設計→終了","要件→終了"],"a":"B","ex":"システムは一度作って終わりではなく、運用データを基に継続的に改善するサイクルが正しい。"},{"id":25,"cat":"運用・定着","type":"c","q":"使われないシステムの特徴はどれか","o":["UIが良い","安定","業務乖離","高速"],"a":"C","ex":"実際の業務フローと乖離したシステムは、使い勝手以前の問題として現場に受け入れられない。"},{"id":26,"cat":"実務判断","type":"c","q":"顧客が要望過多な場合の対応はどれか","o":["一部拒否","開発延期","全て対応","優先順位整理"],"a":"D","ex":"要望をすべて受けるのでも拒否するのでもなく、インパクトと実現性で優先順位を整理して対話する。"},{"id":27,"cat":"実務判断","type":"c","q":"クレーム対応として最適なのはどれか","o":["改修のみ","原因説明","謝罪＋対応提示","調査優先"],"a":"C","ex":"クレームには謝罪で誠意を示した上で具体的な対応策を提示することが信頼回復の基本。"},{"id":28,"cat":"実務判断","type":"c","q":"信頼を維持する行動はどれか","o":["期限遵守","小さく改善","上記すべて","状況共有"],"a":"C","ex":"信頼は単一の行動ではなく、改善・約束遵守・透明な情報共有のすべての積み重ねで形成される。"},{"id":29,"cat":"実務判断","type":"c","q":"優先順位判断の基準はどれか","o":["UI","ビジネスインパクト","技術難易度","工数"],"a":"B","ex":"FDEとして最終的な判断軸は常にビジネス成果への影響度（インパクト）であるべき。"},{"id":30,"cat":"実務判断","type":"c","q":"最終成果として最も適切なのはどれか","o":["コード品質","システム完成","ドキュメント","業務改善"],"a":"D","ex":"システムはあくまで手段。FDEが目指す最終ゴールは業務改善であり、現場に価値が生まれることが成果。"}];

// ストラテジ Q1-35
{id:1,sec:"ストラテジ",cat:"DX・経営",type:"c",q:"DX（デジタルトランスフォーメーション）の目的として最も適切なものはどれか。",o:["最新技術を導入すること","紙をゼロにすることだけを目的にすること","デジタル技術を活用し、ビジネスモデルや業務プロセスを変革すること","IT部門の人員を削減すること"],a:"C",ex:"DX＝紙廃止ではなく、デジタル技術でビジネスモデル・業務・組織を変えること。A・Bは手段の一部。"},
{id:2,sec:"ストラテジ",cat:"建設DX",type:"c",q:"建設会社が建設PADのようなクラウド型受発注システムを導入する主な効果として最も適切なのはどれか。",o:["現場の安全パトロールが不要になる","見積・発注・請求情報の一元管理と、取引先とのやり取りの可視化","現場での墨出し作業が早くなる","原価計算が不要になる"],a:"B",ex:"見積・発注・請求・支払の情報一元管理と可視化がメイン。現場安全パトロールとは別領域。"},
{id:3,sec:"ストラテジ",cat:"ITパスポート",type:"c",q:"ITパスポート試験でいう「ストラテジ系」に含まれる内容として適切なのはどれか。",o:["CPUの動作クロック","企業活動・経営戦略・法務","メモリの種類","ネットワークプロトコル"],a:"B",ex:"ストラテジ系＝経営・企業活動・法務・経営戦略など。CPU・メモリ・ネットワークはテクノロジ系。"},
{id:4,sec:"ストラテジ",cat:"経営戦略",type:"c",q:"SWOT分析における「O（Opportunity）」の例として最も適切なのはどれか。",o:["自社に若手人材が少ない","新たに建設DX補助金制度が始まった","主要な取引先が倒産した","コア社員の退職が続いている"],a:"B",ex:"外部環境のプラス要因が「機会(O)」。建設DX補助金スタートはまさに外部チャンス。"},
{id:5,sec:"ストラテジ",cat:"ビジネスモデル",type:"c",q:"サブスクリプション型（SaaS）の料金モデルの特徴として適切なのはどれか。",o:["一度購入すれば永続的に利用できる","月額／年額の継続課金で、常に最新版を利用できる","導入時の一括買い切りのみ","利用ユーザ数は料金に影響しない"],a:"B",ex:"SaaS型の典型：月額・年額継続課金で常に最新版が使える。買い切りは旧パッケージモデル。"},
{id:6,sec:"ストラテジ",cat:"ビジネスモデル",type:"c",q:"BtoB取引に該当するものはどれか。",o:["施主から注文住宅を請け負う","ECサイトで個人がDIY用の建材を買う","ゼネコンが専門工事会社に工事を発注する","個人が建築系YouTuberに課金する"],a:"C",ex:"ゼネコンと専門工事会社の企業間取引がBtoB。コンビニや個人向けはBtoC。"},
{id:7,sec:"ストラテジ",cat:"建設DX",type:"c",q:"建設会社における「情報の非対称性」を減らす施策として最も適切なのはどれか。",o:["口頭でしか情報を伝えない","FAXのみでやり取りする","クラウド上で見積・契約・図面・写真などを共有する","現場ごとに独自ルールで管理する"],a:"C",ex:"クラウドで情報共有すると発注側・受注側の情報ギャップが減る。FAXや口頭では逆効果。"},
{id:8,sec:"ストラテジ",cat:"AI・RPA",type:"c",q:"RPAが最も得意とする業務はどれか。",o:["施工計画の立案","作業員の配置計画","定型的な請求書入力や転記作業","クレーム対応の電話応対"],a:"C",ex:"決まりきった事務作業の自動化がRPAの得意技。判断・交渉・設計は人やAIの仕事。"},
{id:9,sec:"ストラテジ",cat:"経営指標",type:"c",q:"IT投資の効果を測る指標として適切なのはどれか。",o:["ROE（自己資本利益率）","ROI（投資収益率）","PBR（株価純資産倍率）","PER（株価収益率）"],a:"B",ex:"投資額に対してどれだけリターンがあったかを見るのがROI(Return on Investment)。"},
{id:10,sec:"ストラテジ",cat:"システム",type:"c",q:"ERPパッケージの説明として最も適切なのはどれか。",o:["画像編集専用ソフトウェア","建築CADソフト","財務・人事・販売など基幹業務を統合管理するシステム","現場監督向けチャットアプリ"],a:"C",ex:"ERP＝会計・人事・販売など基幹システムを統合管理するプラットフォーム。"},
{id:11,sec:"ストラテジ",cat:"ワークフロー",type:"c",q:"OUKAGAIのようなワークフローシステムを導入する主な狙いとして最も適切なのはどれか。",o:["稟議のプロセスを属人化すること","稟議・決裁の経路を標準化し、承認状況を可視化すること","稟議の証跡を残さないこと","稟議書をすべて紙と電子で両立する"],a:"B",ex:"稟議経路を標準化し「誰のところで止まっているか」まで可視化。属人化・紙台帳からの卒業。"},
{id:12,sec:"ストラテジ",cat:"AI・機械学習",type:"c",q:"機械学習（Machine Learning）の説明として最も適切なのはどれか。",o:["人がすべてのルールをプログラムに書き込む方式","データからパターンを学習し、予測や分類を行う方式","OSの更新機能の一種","ネットワーク帯域を自動調整する仕組み"],a:"B",ex:"データからパターンを学ぶ。ルールをすべて人が書くif文の山とは別物。"},
{id:13,sec:"ストラテジ",cat:"AI・機械学習",type:"c",q:"生成AI（Generative AI）の典型的な活用例として最も適切なのはどれか。",o:["コンクリートの配合設計計算のみ","既存のメールを自動で削除する","工事写真から説明文（キャプション）を自動生成する","現場のモルタルを自動で練る"],a:"C",ex:"テキスト・画像など「新しいコンテンツを生む」のが生成AI。工事写真→キャプション自動生成が好例。"},
{id:14,sec:"ストラテジ",cat:"AI・機械学習",type:"c",q:"AI導入時に考慮すべき「バイアス」の説明として最も適切なのはどれか。",o:["OSのバージョン差","学習データの偏りにより、不公平な結果が出てしまうこと","ネットワークの遅延","CPUクロックのばらつき"],a:"B",ex:"偏ったデータで学習すると不公平な判断が出る。「AIだから公平」は危険な思い込み。"},
{id:15,sec:"ストラテジ",cat:"AI倫理",type:"c",q:"「人間中心のAI」の考え方として最も適切なのはどれか。",o:["AIが人間の判断をすべて置き換えるべき","人間はAIに完全に従うべき","AIの設計・利用は、人間の尊厳・権利を尊重して行うべき","AIは倫理とは無関係でよい"],a:"C",ex:"AIはツール。主役は人。人権・尊厳・説明責任などを尊重して設計・運用する思想。"},
{id:16,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"個人情報保護法において「個人情報」に該当するものはどれか。",o:["工事名だけ","施工場所だけ","氏名と住所の組み合わせ","鉄筋の径"],a:"C",ex:"「個人を識別できる情報の組み合わせ」が個人情報。氏名＋住所はその典型。"},
{id:17,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"電子帳簿保存法に対応したシステム運用として適切なのはどれか。",o:["取引データをPDFにして保存するが、検索機能は持たない","取引データを削除してもバックアップは取らない","日付や金額などで検索できる形で電磁的記録を保存する","電子データは毎年プリントアウトして保存する"],a:"C",ex:"日付・金額・相手先で検索できる形の保存が要件の一つ。紙に戻せばOKではない。"},
{id:18,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"マイナンバーを取り扱う事業者に求められる対応として最も適切なのはどれか。",o:["社内の誰でも閲覧可能にする","メールで自由に送付する","利用目的を限定し、安全管理措置を講じる","紙に印刷して机の上に置いておく"],a:"C",ex:"利用目的の限定＋アクセス制御・保管・廃棄などの安全管理措置が必要。"},
{id:19,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"著作権侵害に該当する行為はどれか。",o:["フリー素材サイトの利用規約を守って画像を使う","自社で撮影した写真を自社資料に使う","他人が作成した有料CADデータを、許可なく配布する","パブリックドメインの資料を利用する"],a:"C",ex:"他人の有料CADデータを無断配布は著作権侵害。フリー素材・パブリックドメインは条件を守ればOK。"},
{id:20,sec:"ストラテジ",cat:"情報セキュリティ",type:"c",q:"情報セキュリティの3要素「CIA」のうち、C（Confidentiality）が意味するものはどれか。",o:["完全性","可用性","機密性","継続性"],a:"C",ex:"CIA：C(機密性)＝見ていい人だけが見られる、I(完全性)＝改ざんなし、A(可用性)＝必要なときに使える。"},
{id:21,sec:"ストラテジ",cat:"BCP・リスク管理",type:"c",q:"BCP（事業継続計画）の説明として最も適切なのはどれか。",o:["新規事業を立ち上げる計画","災害・障害時にも重要業務を継続または早期復旧するための計画","コスト削減のための計画","人員削減計画"],a:"B",ex:"BCP＝事業継続計画。災害・障害等でも重要業務を止めない・早期回復するための準備。"},
{id:22,sec:"ストラテジ",cat:"BCP・リスク管理",type:"c",q:"建設会社でBCPを考える際に、ITシステムに関して重要な観点はどれか。",o:["図面フォーマットの統一","社内LANの配線色","クラウドサービスやバックアップを活用したデータの冗長化","PCの色を揃えること"],a:"C",ex:"クラウド・バックアップ・冗長構成でデータとシステムを守る設計が最重要。"},
{id:23,sec:"ストラテジ",cat:"ITガバナンス",type:"c",q:"ITガバナンスの目的として最も適切なのはどれか。",o:["IT投資を現場に任せる","組織全体としてIT活用を経営目標に沿って最適化・統制すること","ITを使わない文化を守ること","IT部門だけが意思決定すること"],a:"B",ex:"IT活用を経営戦略と整合させ、組織全体でコントロールすること。野良SaaS乱立の逆。"},
{id:24,sec:"ストラテジ",cat:"経営指標",type:"c",q:"KPI（重要業績評価指標）の説明として最も適切なのはどれか。",o:["経営理念そのもの","最終的なゴール（KGI）","KGI達成に向けて進捗を測るための中間指標","社員の年齢"],a:"C",ex:"KGI＝最終ゴール、KPI＝そこへの途中の進捗指標。例：KGI「電子契約率80%」→KPI「今月の電子契約件数」。"},
{id:25,sec:"ストラテジ",cat:"建設DX",type:"c",q:"建設PADの導入効果を測るKPIとして適切なのはどれか。",o:["現場の騒音レベル","FAX送受信枚数の減少","人員の削減数","営業車のガソリン代"],a:"B",ex:"FAX枚数の減少で電子化の進捗が数字で見える。騒音・ガソリン代・人員数は直接的なDX進捗指標にならない。"},
{id:26,sec:"ストラテジ",cat:"ビジネスモデル",type:"c",q:"新規ITサービスのビジネスモデルとして「プラットフォーム型」に該当するものはどれか。",o:["ユーザー同士をマッチングし、取引の場を提供する","物販のみ行う","受託開発のみ行う","営業を行わない"],a:"A",ex:"Uberやマッチングサービスのように「場を提供して両者をつなぐ」のがプラットフォーム型。"},
{id:27,sec:"ストラテジ",cat:"ソフトウェア",type:"c",q:"OSS（オープンソースソフトウェア）の特徴として最も適切なのはどれか。",o:["ソースコードが公開され、ライセンスに従えば改変・再配布可能","必ず無料で、ライセンスも不要","商用利用は禁止されている","ソースコードは非公開"],a:"A",ex:"ソースコード公開＋ライセンス条件を守れば改変・再配布OK。「完全無料・権利ゼロ」ではない。"},
{id:28,sec:"ストラテジ",cat:"建設FDE",type:"c",q:"「デジタルデバイド」解消に向けた建設FDEの役割として最も適切なのはどれか。",o:["ITが苦手な社員を放置する","現場や事務社員に寄り添って、ツール導入や教育を支援する","システム部門だけで完結する","「分からない人が悪い」と伝える"],a:"B",ex:"現場に寄り添うインストラクター＋設計者がFDE。切り捨ては逆効果。"},
{id:29,sec:"ストラテジ",cat:"ITパスポート",type:"c",q:"ITパスポート試験の合格イメージとして最も適切なのはどれか。",o:["プロのプログラマーとして即戦力","企業活動全般で通用するITの基礎リテラシーを持っている","サーバ構築の専門家","ネットワーク設計の専門家"],a:"B",ex:"「会社でITの会話についていける基礎リテラシー」レベル。エンジニアのスペシャリストではなくIT教養。"},
{id:30,sec:"ストラテジ",cat:"建設FDE",type:"c",q:"KENZOの建設FDEに特に求められるスタンスとして最も適切なのはどれか。",o:["コードだけ書ければよく、現場理解は不要","建設業の業務を理解しつつ、ITと現場の橋渡し役を担う","ITツールの批判だけする","ベンダー任せでよい"],a:"B",ex:"建設業務を分からずITだけでは役立たない。業務×ITの橋渡しこそFDEの仕事。"},
{id:31,sec:"ストラテジ",cat:"ビジネス思考",type:"c",q:"「プロダクトアウト」の説明として適切なのはどれか。",o:["市場ニーズから発想して商品開発する","技術起点で作りたいものを作り、市場に出す","顧客の声を聞かない","原価だけを見て設計する"],a:"B",ex:"「うちの技術でこれ作れるから売ろう」がプロダクトアウト。マーケットインはその逆。"},
{id:32,sec:"ストラテジ",cat:"ビジネス思考",type:"c",q:"「マーケットイン」の説明として適切なのはどれか。",o:["技術的に面白いものを優先する","社内事情だけで決める","顧客のニーズから逆算して商品・サービスを設計する","原価を最小にすることだけ考える"],a:"C",ex:"「顧客の困りごとから逆算してサービス設計」。DX文脈ではマーケットインが推奨されがち。"},
{id:33,sec:"ストラテジ",cat:"ITパスポート",type:"c",q:"ITパスポート試験で「テクノロジ系」に分類される内容はどれか。",o:["経営戦略","会計","情報セキュリティ・ネットワーク・データベース","会社法"],a:"C",ex:"情報セキュリティ・ネットワーク・DB・ハード・ソフトなどの「技術要素」がテクノロジ系。"},
{id:34,sec:"ストラテジ",cat:"AI・DX",type:"c",q:"AIチャットボットを社内問い合わせ対応に導入する主なメリットとして最も適切なのはどれか。",o:["問い合わせ履歴が一切残らなくなる","深夜や休日でも基本的な質問に対応できる","人事評価が不要になる","社員数を必ず減らせる"],a:"B",ex:"24時間365日よくある質問を捌いてくれるのが強み。人をゼロにするわけではない。"},
{id:35,sec:"ストラテジ",cat:"DX推進",type:"c",q:"建設会社のDX推進において、最も避けるべき状態はどれか。",o:["現場の課題をヒアリングしてツール導入を検討する","形だけシステムを入れて、誰も使っていない","パイロット導入から始める","小さな成功例を社内で共有する"],a:"B",ex:"「システムだけ入れて誰も使わない」が最もよくある失敗。小さな成功を積み上げるのが王道。"},
// マネジメント Q36-55
{id:36,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"プロジェクトマネジメントで「スコープ」とは何を指すか。",o:["プロジェクトメンバーの人数","プロジェクトの予算","プロジェクトで実施する作業の範囲","会議の回数"],a:"C",ex:"スコープ＝「どこからどこまでやるか」の範囲。ここがブレると工期・コスト双方に影響する。"},
{id:37,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"WBS（Work Breakdown Structure）の目的として最も適切なのはどれか。",o:["作業を大きくまとめる","作業を階層的に分解し、抜け漏れをなくす","責任者を一人に集中させる","仕様変更を容易にする"],a:"B",ex:"大きな仕事を「木の枝」のように分解し、抜け漏れを減らす技法。"},
{id:38,sec:"マネジメント",cat:"開発手法",type:"c",q:"ウォーターフォール型開発の特徴として最も適切なのはどれか。",o:["仕様変更を前提に、小さく繰り返す","要件定義→設計→実装→テストの順に上から下へ進む","ドキュメントはほとんど作成しない","リリースを毎日行う"],a:"B",ex:"要件→設計→実装→テストを「流れ落ちる」ように進める。後戻りコストが高いのが特徴。"},
{id:39,sec:"マネジメント",cat:"開発手法",type:"c",q:"アジャイル開発の特徴として最も適切なのはどれか。",o:["一度決めた仕様は変更しない","小さく作って動かし、フィードバックを得ながら改善を繰り返す","ウォーターフォールよりもテストが不要","顧客とのコミュニケーションを減らす"],a:"B",ex:"小さく作ってユーザーに見せてフィードバックしながら回す。「完璧に決めてから作る」の逆。"},
{id:40,sec:"マネジメント",cat:"開発・運用",type:"c",q:"DevOpsの考え方として最も適切なのはどれか。",o:["開発と運用を分断する","開発と運用が連携し、継続的な改善・自動化を行う","運用部門を廃止する","テストを省略する"],a:"B",ex:"Dev(開発)とOps(運用)が一体となって自動化・継続改善する。「作って投げる」文化からの卒業。"},
{id:41,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"ITサービスマネジメントにおいて「インシデント管理」が扱うのはどれか。",o:["新機能の企画","システム障害やサービス中断への対処","販促キャンペーンの計画","中期経営計画"],a:"B",ex:"実際に起きた障害に対処するプロセス。問題管理は根本原因を潰すほう。"},
{id:42,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"変更管理の目的として最も適切なのはどれか。",o:["変更を口頭で素早く行う","影響評価や承認を行い、無秩序な変更を防ぐ","記録を残さない","現場の判断で勝手に変更させる"],a:"B",ex:"テストや承認なしに本番を変えると事故るので、変更を統制するためのプロセス。"},
{id:43,sec:"マネジメント",cat:"テスト・移行",type:"c",q:"システム移行プロジェクトにおいて特に重要なテストはどれか。",o:["画面の色味テスト","データ移行テスト","インストール時間テスト","キーボード入力テスト"],a:"B",ex:"正しくデータが移っているか（件数・項目・値）を検証しないと、後で地獄を見る。"},
{id:44,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"SLA（サービスレベル合意）で定義される内容として最も適切なのはどれか。",o:["社員の給与水準","取締役の人数","稼働率・応答時間などサービス品質の目標値","株主構成"],a:"C",ex:"稼働率・応答時間・復旧目標時間(RTO)など「どのレベルのサービスか」の約束。"},
{id:45,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"プロジェクトのクリティカルパスとは何を意味するか。",o:["最も費用が高いタスクの集合","並行して実行できるタスク群","遅れると全体の工期に直接影響するタスクの経路","管理しなくてよいタスクの集合"],a:"C",ex:"ここが遅れると工期全体が遅延する「肝」の経路。ここを守るために他を調整する。"},
{id:46,sec:"マネジメント",cat:"品質管理",type:"c",q:"品質保証活動として適切なのはどれか。",o:["本番でユーザに使わせてから直す","レビューやテストを通じて欠陥を早期に発見・是正する","不具合を隠す","品質をコストでしか判断しない"],a:"B",ex:"レビュー・テストで早めにバグを捕まえるのが基本。「本番でテスト」は冗談。"},
{id:47,sec:"マネジメント",cat:"テスト・移行",type:"c",q:"受入テスト（ユーザ受入テスト）の主な目的として最も適切なのはどれか。",o:["ベンダ側の都合で仕様を調整する","利用者側の観点で、要件通りに動作するか確認する","ネットワーク速度を測る","サーバ室の温度を測る"],a:"B",ex:"「ユーザー視点で要件通りか」を確認するフェーズ。ベンダ側単体の都合ではない。"},
{id:48,sec:"マネジメント",cat:"インフラ",type:"c",q:"ITサービスの可用性を高める手段として最も適切なのはどれか。",o:["単一サーバ構成にする","冗長構成（クラスタリング・多重化）をとる","バックアップを取らない","停止時間を記録しない"],a:"B",ex:"サーバを冗長化して、どれかが死んでも全体が止まらないようにする。"},
{id:49,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"障害対応における「初動」で最も優先すべきことはどれか。",o:["責任を追及する","影響範囲と重要度を把握し、関係者にエスカレーションする","障害を隠す","すぐに再起動だけを繰り返す"],a:"B",ex:"何がどこまで影響しているかを把握し、関係者に共有＆エスカレーション。原因追及はその後。"},
{id:50,sec:"マネジメント",cat:"ワークフロー",type:"c",q:"OUKAGAIでの稟議フロー変更をプロジェクトとして実施する場合に、最も重要なポイントはどれか。",o:["一部の人だけに仕様を説明する","現場ユーザーの業務をヒアリングし、承認経路・権限を整理する","とりあえず現在の紙の流れをそのまま画面化する","システム部門だけで決める"],a:"B",ex:"紙の流れを鵜呑みにせず、現場・総務・経理などからヒアリングして「あるべき承認経路」を整理する。"},
{id:51,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"ITサービスマネジメントにおける「問題管理」の役割はどれか。",o:["個別障害への即時対応","障害の根本原因分析と再発防止策の検討","新規機能の企画","利用料金の請求"],a:"B",ex:"同じ障害を繰り返さないよう「なぜ？」を深掘りして恒久対策を打つプロセス。"},
{id:52,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"プロジェクトで「スコープ・クリープ」が発生している状態として最も適切なのはどれか。",o:["当初合意していない要件が次々と追加されていく","当初計画どおりに進んでいる","予算が余っている","工期が短縮されている"],a:"A",ex:"「ついでにこれも」と合意していない要件が肥大していく状態。早期に変更管理プロセスを使う。"},
{id:53,sec:"マネジメント",cat:"建設FDE",type:"c",q:"IT人材育成の観点から、建設FDE研修でやるべきこととして最も適切なのはどれか。",o:["現場には行かず、座学だけ行う","建設業の業務理解と、IT基礎（クラウド・セキュリティ・AIなど）をセットで学ぶ","ツールの操作だけを覚える","プログラミング言語だけ学ぶ"],a:"B",ex:"業務理解＋IT基礎をセットで学ぶことで、現場と話ができる人材になる。"},
{id:54,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"SLAの「稼働率99.9%」のおおよその年間停止許容時間として最も近いものはどれか。",o:["約87.6時間","約8.8時間","約1時間","約0.1時間"],a:"B",ex:"1年≒8760時間 → 0.1%≒8.76時間。だいたい「9時間弱」がSLA 99.9%の意味。"},
{id:55,sec:"マネジメント",cat:"IT導入・運用",type:"c",q:"IT導入後の「定着化フェーズ」で行うべき活動として最も適切なのはどれか。",o:["トレーニングやFAQ整備、運用ルールの見直し","導入したら放置する","利用状況を見ない","クレームだけ集める"],a:"A",ex:"マニュアル・FAQ・研修・ルール見直しなど「使われる状態」を作るのが定着化フェーズ。"},
// テクノロジ Q56-80
{id:56,sec:"テクノロジ",cat:"ハードウェア",type:"c",q:"CPUの主な役割として最も適切なのはどれか。",o:["データを長期保存する","プログラムの命令を解釈・実行する","画面に色を付ける","電源を供給する"],a:"B",ex:"CPUはコンピュータの「頭脳」。命令を読んで実行する。"},
{id:57,sec:"テクノロジ",cat:"ハードウェア",type:"c",q:"RAMの特徴として最も適切なのはどれか。",o:["電源を切っても内容が保持される","電源を切ると内容が消える","ディスクとして使われる","ネットワーク機器である"],a:"B",ex:"RAMは電源を切ると消える「作業用机」。HDD/SSDは「倉庫」。"},
{id:58,sec:"テクノロジ",cat:"ハードウェア",type:"c",q:"SSDとHDDの違いとして適切なのはどれか。",o:["SSDは回転する円盤、HDDはメモリチップ","SSDは機械的動作なしで高速、HDDは回転磁気ディスク","どちらも同じ構造","SSDはデータ保存不可"],a:"B",ex:"SSD＝フラッシュメモリで高速・衝撃に強い。HDD＝回転ディスク＋磁気ヘッド。"},
{id:59,sec:"テクノロジ",cat:"ネットワーク",type:"c",q:"ネットワークにおけるIPアドレスの役割として正しいものはどれか。",o:["PCの性能を表す指標","端末や機器を一意に識別するための番号","暗号化の鍵","OSのバージョン"],a:"B",ex:"IPアドレス＝ネットワーク上の「住所」。PCやサーバを識別するための番号。"},
{id:60,sec:"テクノロジ",cat:"ネットワーク",type:"c",q:"DNSの役割として最も適切なのはどれか。",o:["IPアドレスとドメイン名を相互に変換する","暗号化を行う","メールを保存する","ディスク容量を管理する"],a:"A",ex:"DNS＝「人間向けの住所(ドメイン名)」と「機械向けの住所(IP)」を変換する電話帳。"},
{id:61,sec:"テクノロジ",cat:"ネットワーク",type:"c",q:"TCP/IPの説明として最も適切なのはどれか。",o:["ディスプレイの規格","インターネット等で使われる標準的な通信プロトコル群","ハードディスクの種類","CPUのソケット規格"],a:"B",ex:"インターネットの標準プロトコル群。ほぼすべてのネットワーク通信がこれ前提。"},
{id:62,sec:"テクノロジ",cat:"セキュリティ",type:"c",q:"ファイアウォールの主な役割として正しいものはどれか。",o:["不正な通信を遮断する","電源を安定化する","ディスクを冷却する","ディスプレイの明るさを調整する"],a:"A",ex:"ファイアウォール＝怪しい通信を壁で止める番人。ポートやIPでフィルタリング。"},
{id:63,sec:"テクノロジ",cat:"セキュリティ",type:"c",q:"情報セキュリティの3要素において「A（Availability）」が意味するものはどれか。",o:["機密性","可用性","完全性","継続性"],a:"B",ex:"CIAのA＝Availability(可用性)：必要なときにちゃんと使えること。"},
{id:64,sec:"テクノロジ",cat:"セキュリティ",type:"c",q:"ハッシュ関数の特徴として最も適切なのはどれか。",o:["元のデータを必ず復元できる","同じ入力に対しては同じ値が得られる","暗号化と同じである","画像専用である"],a:"B",ex:"同じ入力→同じハッシュ値。逆算は現実的に困難。改ざん検知などに活用される。"},
{id:65,sec:"テクノロジ",cat:"暗号・認証",type:"c",q:"共通鍵暗号方式の特徴として正しいものはどれか。",o:["暗号化と復号に同じ鍵を用いる","暗号化鍵と復号鍵が異なる","鍵を使わない","通信相手ごとに必ず異なるアルゴリズムを使う"],a:"A",ex:"送信・受信で同じ鍵を使う方式。鍵の受け渡しが課題。"},
{id:66,sec:"テクノロジ",cat:"暗号・認証",type:"c",q:"公開鍵暗号方式の特徴として最も適切なのはどれか。",o:["1本の鍵で暗号化・復号する","公開鍵で暗号化し、秘密鍵で復号する","鍵を使わない","送信者と受信者で同じ秘密鍵を共有する"],a:"B",ex:"公開鍵で暗号化→秘密鍵で復号。インターネットの鍵交換の土台。"},

{id:79,sec:"テクノロジ",cat:"Web・セキュリティ",type:"c",q:"HTTPS通信の主な役割として最も適切なのはどれか。",o:["通信を高速化する","通信内容を暗号化し、盗聴や改ざんを防ぐ","データを圧縮する","広告を非表示にする"],a:"B",ex:"HTTPSで通信を暗号化し、盗聴・改ざんを防ぐ。ブラウザの鍵マークの正体。"},

{id:81,sec:"コード",cat:"Pythonコード",type:"c",q:"次のコードの出力として正しいものはどれか。",code:"x = 3\ny = 4\nprint(x + y * 2)",o:["7","11","14","3"],a:"B",ex:"演算順序で掛け算が先：4×2=8 → 3+8=11。"},
{id:82,sec:"コード",cat:"Pythonコード",type:"c",q:"次のコードの出力として正しいものはどれか。",code:"total = 0\nfor i in [1, 2, 3, 4]:\n    total = total + i\nprint(total)",o:["4","6","10","20"],a:"C",ex:"1+2+3+4=10。forループで全要素を順に加算する。"},
{id:83,sec:"コード",cat:"Pythonコード",type:"c",q:"次のコードの出力として正しいものはどれか。",code:"a = 5\nif a >= 10:\n    print(\"big\")\nelif a >= 5:\n    print(\"middle\")\nelse:\n    print(\"small\")",o:["big","middle","small","エラー"],a:"B",ex:"a=5なのでa>=10は偽、a>=5が真。出力は\"middle\"。"},
{id:84,sec:"コード",cat:"Pythonコード",type:"c",q:"次のコードの出力として正しいものはどれか。",code:"nums = [2, 4, 6]\nnums.append(8)\nprint(len(nums))",o:["2","3","4","5"],a:"C",ex:"2,4,6,8の4要素になる。len()は要素数を返す。"},
{id:85,sec:"コード",cat:"Pythonコード",type:"c",q:"次のコードの出力として正しいものはどれか。",code:"count = 0\nfor i in range(3):  # 0,1,2\n    count += 2\nprint(count)",o:["2","4","6","8"],a:"C",ex:"2を3回足す：0→2→4→6。range(3)は0,1,2の3回ループ。"},
{id:86,sec:"コード",cat:"Pythonコード",type:"c",q:"次の関数の出力として正しいものはどれか。",code:"def f(x):\n    return x * x - 1\nprint(f(3))",o:["6","8","9","10"],a:"B",ex:"3×3−1=9−1=8。"},
{id:87,sec:"コード",cat:"Pythonコード",type:"c",q:"次のコードの出力として正しいものはどれか。",code:"def is_even(n):\n    if n % 2 == 0:\n        return True\n    else:\n        return False\nprint(is_even(5))",o:["True","False","0","エラー"],a:"B",ex:"5は奇数なのでFalse。5%2=1≠0なのでelseブランチへ。"},
{id:88,sec:"コード",cat:"Pythonコード",type:"c",q:"次のコードの出力として正しいものはどれか。",code:"a = [1, 2, 3]\nb = a\nb[0] = 9\nprint(a[0])",o:["1","2","3","9"],a:"D",ex:"b=aは同じリストを指す参照代入。bを変えるとaも変わる。"},
{id:89,sec:"コード",cat:"擬似コード",type:"c",q:"次の擬似コードの説明として最も適切なのはどれか。",code:"sum = 0\nfor each n in list:\n    if n > 0:\n        sum = sum + n",o:["list内のすべての値を掛け算する","list内の正の値だけを合計する","list内の負の値だけを合計する","list内の要素数を数える"],a:"B",ex:"リスト中の「正の値(n>0)だけ」を合計する処理。"},

{id:92,sec:"テクノロジ応用",cat:"AI・安全",type:"c",q:"AI画像認識を用いて重機の接近を検知し、アラートを出すシステムは、主にどのような効果を狙ったものか。",o:["工期短縮のみ","労働安全性の向上","設計変更の自動化","コスト削減のみ"],a:"B",ex:"人と機械の接触事故を減らす＝安全性向上が主目的。"},
{id:93,sec:"テクノロジ応用",cat:"クラウド・セキュリティ",type:"c",q:"建設会社がクラウド型ストレージを利用する際、テナント管理で特に注意すべき点はどれか。",o:["他社テナントのデータにアクセスできるようにする","テナントを共有してコスト削減する","取引先ごとや部門ごとにアクセス権を分離し、不要な閲覧を防ぐ","全ユーザに全テナントの管理権限を与える"],a:"C",ex:"部門・取引先単位に権限を分離し「見なくてよい人には見せない」が基本。"},
{id:94,sec:"テクノロジ応用",cat:"セキュリティ",type:"c",q:"「ゼロトラスト」の考え方として最も適切なのはどれか。",o:["社内ネットワークは完全に信頼してよい","一度認証したら永続的に信頼する","ネットワーク内外を問わず、すべてのアクセスを前提として信頼せず検証する","社外からのアクセスのみ検証する"],a:"C",ex:"「内も外も信用しないで毎回検証する」という前提。「社内は安全」の時代は終わっている。"},
{id:95,sec:"テクノロジ応用",cat:"電子契約",type:"c",q:"電子契約サービスで付与される「タイムスタンプ」の主な役割として適切なのはどれか。",o:["文書のサイズを小さくする","ある時刻にその文書が存在し、改ざんされていないことを証明する","文書を暗号化する","文書のデザインを統一する"],a:"B",ex:"「この時刻にこのデータが存在し、その後改ざんされていない」ことの証明。"},
{id:96,sec:"テクノロジ応用",cat:"現場DX",type:"c",q:"建設FDEが現場DXを企画する際、最初にやるべきこととして最も適切なのはどれか。",o:["最新のツールをカタログから選ぶ","まず現場・事務の業務フローと課題をヒアリングする","ベンダーやSIerの指示に従う","価格でツールを選ぶ"],a:"B",ex:"現状の業務フローと「本当の困りごと」を聞くところから。ツール選定はその後。"},
{id:97,sec:"テクノロジ応用",cat:"モバイル・セキュリティ",type:"c",q:"モバイル端末を現場で活用する際のセキュリティ対策として最も適切なのはどれか。",o:["画面ロックを無効にする","公共Wi-Fiのみ使う","MDM（モバイルデバイス管理）などでリモートロック・ワイプを可能にする","パスワードを付箋に書いて貼る"],a:"C",ex:"MDMで紛失時のリモートロック・ワイプができるようにしておくと安心。"},

{id:99,sec:"テクノロジ応用",cat:"AI・チューニング",type:"c",q:"社内の問い合わせ対応にAIチャットボットを導入したところ、誤回答も多く発生した。このとき建設FDEがとるべき対応として最も適切なのはどれか。",o:["AIの回答を正しいとみなす","誤り事例を収集し、プロンプトやナレッジデータの改善・チューニングを行う","すぐにAIを廃止する","利用ログを一切取らない"],a:"B",ex:"どこで間違えているかをログから拾い、プロンプト・ナレッジ・設定を改善する。"},

// ========== 建設PAD検定 1級 ケーススタディ問題1 ==========
const CASE1_SCENARIO=`宮崎県内の中堅ゼネコンA社は、請求書のデジタル化を検討している。地域では燈 Digital Billderの導入が進んでおり、同社にも導入圧力がある。一方で、建設PADも提案されている。

A社の現状：
・月間請求書：250件
・見積・発注・請求はバラバラに管理
・協力会社：約120社
・DX専任人材なし

上記の条件のもと、どのシステムを採用すべきかを以下の設問に答えよ。`;

const CASE1_Q=[];
const PAD4_Q=[
{id:1,cat:"基本操作",type:"m",q:"作業開始直後に最初に確認すべきことはどれか。（正しいもの2つを選べ）",o:["業務段階に合った入口を選ぶ。","前回開いていた一覧画面の検索条件をそのまま使い、表示された先頭行から処理する。","通知件数を見てから、対象書類の種類を決めずに未処理の操作へ進む。","取引先名を先に確認し、対象物件や書類種別は詳細画面で照合する。","メニューを開く前に、保存済みデータの有無を優先して確認する。","自分が処理する業務が見積・注文・請求のどの段階かを整理して入口を選ぶ。"],a:"AF"},
{id:2,cat:"基本操作",type:"m",q:"Homeを開いたあと、次の操作へ進む判断として最も適切なものはどれか。（正しいもの2つを選べ）",o:["直近で使ったメニューを開き、同じ取引先の書類があれば処理を続ける。","未読件数が多いメニューから順に開き、対象書類は表示後に決める。","一覧画面を開く前に、すべての設定メニューを確認する。","検索欄に取引先名を入れて、表示された書類種別に合わせて作業を決める。","処理目的に合う入口を選ぶ。","処理目的に合わせて、見積・注文・請求など該当する入口を選ぶ。"],a:"EF"},
{id:3,cat:"物件・工事管理",type:"m",q:"物件・工事を新規登録する前に確認すべきことはどれか。（正しいもの2つを選べ）",o:["支払通知書の対象請求が決まってから、物件名を登録する。","請求書の明細を先に入力し、物件名は送信直前に合わせる。","見積依頼を作成してから、必要に応じて物件情報を後から探す。","既存登録の重複がないか確認する。","同じ物件・工事件名が既に登録されていないか、紐づきも含めて確認する。","注文書番号が発行されてから、物件登録の要否を判断する。"],a:"DE"},
{id:4,cat:"見積管理",type:"m",q:"見積依頼を作成する時、送信前に必須項目としてまず揃えるべき組み合わせはどれか。（正しいもの2つを選べ）",o:["物件・工事、依頼先業者、工種、工事概要、見積要領、添付資料の有無。","物件・業者・工種・工期・内容を揃える。","依頼先業者、工種、見積返信期限、見積要領、添付資料、依頼一覧の表示条件。","物件・工事、依頼先業者、工種、見積返信期限、工事着手及び完成時期、依頼内容。","物件・工事、依頼先業者、見積番号、見積単価、数量、呼称。","物件・工事、工事概要、見積要領、添付資料、PDF確認、保存先一覧。"],a:"BC"},
{id:5,cat:"見積管理",type:"m",q:"見積依頼で依頼先業者を選ぶ時の理解として正しいものはどれか。（正しいもの2つを選べ）",o:["依頼先を複数選べるが、送信後は最初に回答した業者のみが依頼一覧に残る。","未利用の取引先を招待する必要がある。","依頼先は見積要領の本文に会社名を記載すると、一覧側にも自動で反映される。","依頼先は物件に参加している取引先から選ぶが、送信時点では選択内容を確認を後回しにする。","依頼先を複数選べるが、同じ工種では1社ずつ依頼を作り分ける必要がある。","複数業者を選択できるため、送信前に選択した全業者が依頼対象として正しいか確認する。"],a:"BF"},
{id:6,cat:"見積管理",type:"m",q:"見積依頼で複数業者を選択して送信する場合、送信後に一覧で確認すべきことはどれか。（正しいもの2つを選べ）",o:["依頼先ごとに保存済み下書きが送信済みに変換されているか。","依頼先ごとに添付資料の閲覧可否が承認済み表示になっているか。","依頼先ごとの工事概要が18文字以内に自動調整されているか。","依頼先ごとの提出状況、返信期限、ステータス、見積金額が確認できるか。","依頼先ごとに見積要領の本文が別々に編集済みか。","見積依頼一覧を開く。"],a:"DF"},
{id:7,cat:"見積管理",type:"m",q:"見積依頼の「保存」と「送信」の違いとして正しいものはどれか。（正しいもの2つを選べ）",o:["保存は入力内容を保持し、PDFで確認すると依頼先へ通知される操作である。","保存は物件選択を確定し、送信は依頼先選択を確定する操作である。","返信済み依頼の見積書タブを確認する。","保存は入力内容を保持する操作、送信は依頼先業者へ見積依頼を渡す操作である。","保存は添付資料を登録し、送信は見積要領のみを相手に渡す操作である。","保存は依頼先へ通知し、送信は依頼一覧でステータスを更新するための操作である。"],a:"CD"},
{id:8,cat:"注文管理",type:"m",q:"注文書を下書き保存した段階の理解として正しいものはどれか。（正しいもの2つを選べ）",o:["下書き保存後は見積依頼のステータスも提出済みに変わり、返信期限は無効になる。","下書き保存後は注文書PDFが確定し、発注金額の修正は請求側で行う。","下書きは入力内容を保持する状態であり、相手先への正式な送信や承認完了とは分けて考える。","依頼先業者欄で複数選択して送信する。","下書き保存後は支払い通知書の対象として選択できるため、請求承認を省ける。","下書き保存後は協力会社側で承認待ちとして扱われ、請求作成も可能になる。"],a:"CD"},
{id:9,cat:"注文管理",type:"m",q:"注文書作成時にワークフローを使う場合、先に確認すべきことはどれか。（正しいもの2つを選べ）",o:["工期の目安を取引先に伝えるため。","支払い通知書の作成権限を確認し、権限があれば注文書の申請も完了とする。","請求書の支払期限が入力されているかを確認し、期限があれば承認申請へ進む。","相殺金額の有無を確認し、相殺がなければワークフローを使わず送信する。","見積依頼の返信期限を確認し、期限内であれば承認者の確認を省いて申請する。","承認経路、承認者、申請対象の注文内容、金額が正しいか確認する。"],a:"AF"},
{id:10,cat:"注文管理",type:"m",q:"ワークフロー無しで注文書を扱う場合に注意すべきことはどれか。（正しいもの2つを選べ）",o:["承認経路がないため、注文内容は作成者確認で完了したものとして扱う。","ワークフローがない注文書は協力会社側に表示されないため、請求対象にもならない。","ワークフローがない場合は、注文書ではなく支払い通知書から発注内容を確定する。","見積依頼詳細の見積書タブで比較する。","ワークフローがない注文書は見積依頼と紐づかないため、発注金額を請求側で調整する。","社内承認の画面遷移がない分、送信前に物件、取引先、金額、条件を自分で慎重に確認する。"],a:"DF"},
{id:11,cat:"注文管理",type:"m",q:"協力会社側で注文書を確認するとき、最初に見るべき状態はどれか。（正しいもの2つを選べ）",o:["請求一覧で支払済になっているかを確認し、支払済でなければ注文書を承認する。","支払い通知書の有無を確認し、通知があれば注文書も承認済みとして扱う。","見積依頼の期限が残っているかを確認し、期限内であれば注文内容も承認する。","承認待ち、承認済、修正依頼、否決、キャンセルなど現在のステータスを確認する。","見積依頼から注文書作成ボタンを押す。","注文書の詳細PDFが開けるかを確認し、開ければ内容確認前に閉じる。"],a:"DE"},
{id:12,cat:"注文管理",type:"m",q:"協力会社側で注文書に修正依頼を出す場面として適切なものはどれか。（正しいもの2つを選べ）",o:["支払条件のみを後で見直したいが、注文内容には問題がないとき。","注文書の内容は合っているが、請求書の振込先を後で変更したいとき。","見積依頼の返信期限を延ばしたいが、発注内容には問題がないとき。","発注金額、工事内容、条件、対象物件などに確認・修正が必要なとき。","支払い通知書の支払期限を変更したいが、注文内容には問題がないとき。","注文書内容を確定し送信準備を整える。"],a:"DF"},
{id:13,cat:"請求管理",type:"m",q:"出来高請求書を作成する前提として最も重要なものはどれか。（正しいもの2つを選べ）",o:["見積依頼が未提出のまま残っており、返信期限内であること。","支払い通知書が先に作成され、支払予定額が確定していること。","対象物件に取引先が参加しており、請求書番号の採番候補が残っていること。","一般請求書が保存済みで、同じ請求年月が入力されていること。","対象となる注文書が存在し、請求可能な承認状態になっていること。","物件・取引先・金額・工期・振込先を確認。"],a:"EF"},
{id:14,cat:"物件・工事管理",type:"m",q:"出来高請求で対象物件が表示されない場合、最初に切り分けるべきことはどれか。（正しいもの2つを選べ）",o:["支払い通知書が作成済みかを確認し、未作成なら通知書を先に作る。","注文書の詳細PDFが開けるかを確認し、開ければ承認済みとして扱う。","請求書の銀行口座が登録されているかを確認し、未登録なら物件を再登録する。","請求可能な注文書が存在するか、注文書が承認済みか、過去請求が止まっていないかを確認する。","注文書一覧から差し戻し操作を行う。","見積依頼の添付資料があるかを確認し、添付があれば出来高請求へ進む。"],a:"DE"},
{id:15,cat:"請求管理",type:"m",q:"一般請求書を作成するとき、送信前に必ず確認すべき組み合わせはどれか。（正しいもの2つを選べ）",o:["支払い通知書の通知日、承認者、ワークフロー名、検索条件。","宛先・対象工事・請求日・締め日・請求年月・支払期限・明細・振込先・添付。","注文書PDFの表示有無、ホーム画面の通知件数、ログアウト履歴。","発注する工事の種類を明確にするため。","見積一覧の提出状況、注文一覧の操作ボタン、支払済の件数。","見積依頼の返信期限、注文書の承認日、支払い通知書の通知日。"],a:"BD"},
{id:16,cat:"請求管理",type:"m",q:"一般請求書で取引先を変更するときに注意すべきことはどれか。（正しいもの2つを選べ）",o:["取引先変更は支払い通知書のみに影響し、一般請求書の入力内容には関係しない。","取引先変更後は注文書の承認状態も自動で確定するため、請求作成へ進める。","差し戻して内容を修正し再送信する。","取引先を変更しても明細や宛先は必ず維持されるため、PDF確認のみでよい。","入力済み内容が変わる可能性があるため、宛先、明細、金額、添付を再確認する。","取引先変更後は相殺請求書の金額が優先されるため、明細確認は後で行う。"],a:"CE"},
{id:17,cat:"支払管理",type:"m",q:"「支払通知書より引用」を使う判断として適切なものはどれか。（正しいもの2つを選べ）",o:["注文書の承認者を請求書の送付先として使いたいとき。","ホーム画面の通知内容を請求明細に入れたいとき。","見積依頼の内容を一般請求書へ転記したいとき。","支払時の送金先口座を明確にするため。","見積依頼の特記内容を注文書の条項へ転記したいとき。","支払通知書の内容をもとに請求書へ反映したいとき。"],a:"DF"},
{id:18,cat:"ファイル・添付",type:"m",q:"PDFで確認する操作の目的として正しいものはどれか。（正しいもの2つを選べ）",o:["PDFを開いた時点で相手先への送信も完了するため。","PDFは支払い通知書のみに使う確認で、一般請求書では使わないため。","承認者の割り当てと権限設定を確認する。","PDFを表示すると請求書の承認状態が自動で承認済みに変わるため。","PDFを表示すれば、振込先や明細は帳票側で自動補正されるため。","送信前に帳票としての見え方、宛先、金額、明細、添付漏れを確認するため。"],a:"CF"},
{id:19,cat:"建設PAD操作",type:"m",q:"保存する操作と先方へ送信する操作の違いとして正しいものはどれか。（正しいもの2つを選べ）",o:["保存すると相手先へ通知され、送信は社内メモとして残す操作である。","保存は入力途中の保持で、送信は相手先の一覧に表示させる操作である。","保存は承認済みにする操作、送信は支払済みにする操作である。","送信はPDF表示の別名であり、相手先への共有状態には影響しない。","保存は入力内容を保持する操作、送信は相手先へ書類を渡す操作である。","見積情報を引き継ぎ入力の手間を省ける。"],a:"EF"},
{id:20,cat:"請求管理",type:"m",q:"請求一覧で対象請求を探すとき、最初に使うべき確認軸はどれか。（正しいもの2つを選べ）",o:["注文書のワークフロー名、承認者の人数、申請コメント。","送信済み状態と取引先の受信状況を確認。","取引先、物件・工事名、請求年月、支払期限、ステータス、金額。","対象物件の選択状態、一覧の検索条件、表示中ステータス。","支払い通知書の作成ボタン、相殺請求書の表示位置、PDFの開閉状態。","見積依頼の返信期限、添付資料名、工種の表示順。"],a:"BC"},
{id:21,cat:"請求管理",type:"m",q:"請求一覧で対象請求が見つからない場合の切り分けとして適切なものはどれか。（正しいもの2つを選べ）",o:["支払い通知書を先に作成し、通知書側から請求を探す。","対象請求書が承認済みか確認する。","注文書のPDFのみを確認し、請求一覧の検索条件は変更しない。","相殺請求書一覧を優先し、元請求の確認を後回しにする。","対象請求がないと判断し、すぐ新しい請求書を作成する。","検索条件・取引先・物件・請求年月・ステータス・権限を順に確認する。"],a:"BF"},
{id:22,cat:"支払管理",type:"m",q:"支払い通知書を作成する前に確認すべきことはどれか。（正しいもの2つを選べ）",o:["対象請求書、請求金額、支払条件、支払期限、承認状態が合っているか確認する。","注文書の下書き保存日時とワークフロー名のみを確認する。","相殺請求書の理由欄を優先し、元の請求書の詳細確認を後回しにする。","債務を差し引いて精算する操作のこと。","ホーム画面の通知件数を確認し、件数があれば通知書を作成する。","見積依頼の提出状況と返信期限のみを確認する。"],a:"AD"},
{id:23,cat:"請求管理",type:"m",q:"相殺請求書を作成するとき、最も重要な確認はどれか。（正しいもの2つを選べ）",o:["支払い通知書の作成者が誰かを確認し、金額確認は一覧で済ませること。","どの請求に対して、いくらを、どの理由で控除・相殺するのかが説明できること。","注文書の下書きが残っているかどうかを確認すること。","PDFで表示できるかのみを確認し、相殺理由は後から補足すること。","未送信であることを確認してから変更する。","見積依頼の返信期限が切れているかどうかを確認すること。"],a:"BE"},
{id:24,cat:"請求管理",type:"m",q:"協力会社側で一般請求書を作成する場合、最初に選ぶべきものはどれか。（正しいもの2つを選べ）",o:["ホーム画面の通知種別。","支払い通知書の作成者。","差異の原因を先に確認する。","書類を送信・表示する取引先。","問い合わせコメントの要点。","注文書の承認者。"],a:"CD"},
{id:25,cat:"請求管理",type:"m",q:"請求書の明細行を追加する目的として適切なものはどれか。（正しいもの2つを選べ）",o:["見積依頼の返信先を増やすため。","注文書の承認者を複数にするため。","支払い通知書の承認経路を増やすため。","複数形式の書類を添付できる。","作業内容・数量・単価・税率を行ごとに分けて表すため。","問い合わせコメントを分類するため。"],a:"DE"},
{id:26,cat:"建設PAD操作",type:"m",q:"インボイス番号を確認する目的として適切なものはどれか。（正しいもの2つを選べ）",o:["適格請求書に必要な登録番号を請求書上で示すため。","支払い通知書の支払期限を入力するため。","請求書の備考欄を固定するため。","見積依頼の提出期限を自動で延長するため。","注文書の承認ステータスを承認済みにするため。","支払通知書を取引先に送信する操作。"],a:"AF"},
{id:27,cat:"請求管理",type:"m",q:"請求書を送信する前にPDFで違和感を見つけた場合の対応として正しいものはどれか。（正しいもの2つを選べ）",o:["入力画面に戻って原因箇所を修正し、再度PDFで確認してから送信する。","支払い通知書を先に作成し、PDFの違和感は通知書側で補正する。","請求一覧でステータスのみ確認し、明細の見え方は処理対象から外す。","送信後に相手先へ修正依頼を出してもらう前提で進める。","支払通知書と請求書の明細を照合する。","PDF表示ができているため、そのまま先方へ送信する。"],a:"AE"},
{id:28,cat:"承認・ワークフロー",type:"m",q:"承認待ちの書類を処理するとき、最初に確認すべきことはどれか。（正しいもの2つを選べ）",o:["一覧から取消操作し取引先にも連絡する。","見積依頼の返信期限が過ぎているか。","対象書類・物件・取引先・金額が自分の承認対象と合っているか。","問い合わせ入力ボタンが表示されているか。","請求一覧の支払済件数が増えているか。","PDFで開ける書類が何件あるか。"],a:"AC"},
{id:29,cat:"建設PAD操作",type:"m",q:"差し戻しを受けた書類を修正する時の進め方として適切なものはどれか。（正しいもの2つを選べ）",o:["差し戻し理由を確認・修正し、内容とPDFを確認してから再申請する。","対象書類を削除し、新規作成すれば差し戻し履歴を確認しなくてよい。","請求一覧の検索条件を変え、表示された別書類で処理を続ける。","出来高金額を確定し請求の根拠とする。","問い合わせを選び、差し戻し理由に近い確認内容を入力する。","差し戻し理由を見ずに、同じ内容で再送信する。"],a:"AD"},
{id:30,cat:"建設PAD操作",type:"m",q:"作業終了時にログアウトする理由として最も適切なものはどれか。（正しいもの2つを選べ）",o:["ログアウトすると差し戻し理由が自動で取引先へ通知されるため。","共用端末や離席時に、別の人が自分のアカウントで操作する事故を防ぐため。","差し戻して出来高範囲内での再請求を依頼。","ログアウトすると未送信の書類が自動で相手先へ送信されるため。","ログアウトすると承認待ちの書類が一括承認されるため。","ログアウトすると請求一覧の検索条件が全社共通で保存されるため。"],a:"BC"},
{id:31,cat:"基本操作",type:"m",q:"Homeを開く主な目的はどれか。（正しいもの2つを選べ）",o:["ログイン後の起点として、主要な状況や各機能への入口を確認するため。","一覧、作成、詳細のどこで確認すべき内容か切り分ける場面。","不明点がある時に操作手順を確認し、次の画面へ進む材料を得る場面。","画面遷移前に、現在扱っている書類種別と対象工事を確認する場面。","書類ごとに処理フローが異なるため。","作業後にアカウント操作を終了し、共用端末での誤操作を防ぐ場面。"],a:"AE"},
{id:32,cat:"基本操作",type:"m",q:"契約書メニューを使う場面として最も適切なものはどれか。（正しいもの2つを選べ）",o:["ログイン後に主要機能への入口と現在の処理状況を確認する場面。","メニューから見積、注文、請求のどの業務入口へ進むか判断する場面。","契約に関する書類を確認・管理したいとき。","メニュー名ではなく、処理したい書類と状態から入口を選ぶ場面。","検索条件やフィルタを確認する。","作業後にアカウント操作を終了し、共用端末での誤操作を防ぐ場面。"],a:"CE"},
{id:33,cat:"基本操作",type:"m",q:"見積依頼関連メニューで最初に判断すべきことはどれか。（正しいもの2つを選べ）",o:["新しく依頼を作るのか、既存依頼の提出状況を見るのか、提出済み見積を確認するのか。","請求明細を増やすのか、振込先を変えるのか、インボイス番号を入力するのか。","注文書を承認するのか、請書PDFを確認するのか、出来高請求へ進むのか。","ログアウトするのか、権限設定を変えるのか、ユーザーを追加するのか。","支払い通知書を作るのか、相殺請求書を作るのか、請求一覧を絞るのか。","一覧データを外部で活用するため。"],a:"AF"},
{id:34,cat:"基本操作",type:"m",q:"注文書・請書メニューを使う場面として最も適切なものはどれか。（正しいもの2つを選べ）",o:["注文書の送信前に、見積内容との整合と承認経路を確認する場面。","書類に社印を表示させるため。","注文書が請求の前提になるため、承認状態と対象工事を確認する場面。","発注金額や注文条件を確定させ、相手先の確認状態を追う場面。","注文書や注文請書の状態、PDF、添付、承認状況を確認したいとき。","協力会社側で注文内容を確認し、承認または修正依頼を判断する場面。"],a:"BE"},
{id:35,cat:"基本操作",type:"m",q:"請求関連メニューを使う場面として最も適切なものはどれか。（正しいもの2つを選べ）",o:["承認済み注文書を前提に、進捗率や今回請求額を入力する場面。","注文書と請求履歴をセットで見て、請求可能な対象を選ぶ場面。","前回までの出来高と今回請求分を合わせて、累計金額を確認する場面。","書類受信やステータス変化を確認できる。","一般請求、出来高請求、支払通知、請求一覧など請求処理を行いたいとき。","過去請求の承認状態、累計率、端数を確認してから作成する場面。"],a:"DE"},
{id:36,cat:"建設PAD操作",type:"m",q:"ストレージを使う目的として最も適切なものはどれか。（正しいもの2つを選べ）",o:["書類作成から相手先確認までを画面上で追跡し、後続処理を判断する。","書類やファイルを保管・参照し、後から探せるようにするため。","取引先が未利用で連携が必要な場合。","見積依頼と注文書発行を中心に整備し、請求は後続確認として扱う。","紙書類の作成負担を下げつつ、承認や請求の確認漏れを減らす。","工事別に見積・注文・請求を整理し、担当者が状態を確認しやすくする。"],a:"BC"},
{id:37,cat:"建設PAD操作",type:"m",q:"組織・ユーザーを使う目的として最も適切なものはどれか。（正しいもの2つを選べ）",o:["送信前に帳票の見え方を確認するため。","工事別に見積・注文・請求を整理し、担当者が状態を確認しやすくする。","紙書類の作成負担を下げつつ、承認や請求の確認漏れを減らす。","電子帳票の保管と検索を主軸にし、送信後の状態確認も行う。","利用者や組織単位の設定・権限まわりを管理するため。","書類作成から相手先確認までを画面上で追跡し、後続処理を判断する。"],a:"AE"},
{id:38,cat:"協力会社管理",type:"m",q:"取引先管理を使う目的として最も適切なものはどれか。（正しいもの2つを選べ）",o:["承認・送信済み書類の誤りを修正する場面。","協力会社など取引先情報を登録・確認・管理するため。","取引先への提出状況を一覧化し、金額確認は各書類の詳細で行う。","見積比較、発注、請求確認を同じ工事件名で追えるようにする。","見積依頼と注文書発行を中心に整備し、請求は後続確認として扱う。","工事ごとの帳票を電子保管し、承認状況は社内確認で補完する。"],a:"AB"},
{id:39,cat:"物件・工事管理",type:"m",q:"物件作成・更新を使う目的として最も適切なものはどれか。（正しいもの2つを選べ）",o:["承認済みの注文内容をもとに、請求可能な状態か確認する場面。","協力会社側で注文内容を確認し、承認または修正依頼を判断する場面。","取引先マスタを更新し書類も確認する。","見積・注文・請求の対象になる工事や物件情報を登録・更新するため。","注文書が請求の前提になるため、承認状態と対象工事を確認する場面。","注文書の送信前に、見積内容との整合と承認経路を確認する場面。"],a:"CD"},
{id:40,cat:"物件・工事管理",type:"m",q:"物件を選択する操作が重要な理由はどれか。（正しいもの2つを選べ）",o:["承認済みの注文内容をもとに、請求可能な状態か確認する場面。","発注金額や注文条件を確定させ、相手先の確認状態を追う場面。","見積、注文、請求を正しい工事・物件に紐づけるため。","注文書と請書の内容、金額、取引先、対象工事を確認する場面。","下書き、承認待ち、承認済み、差し戻しの状態を見て次処理を決める場面。","完了工事と進行中案件を区別するため。"],a:"CF"},
{id:41,cat:"検索・一覧操作",type:"m",q:"書類検索を使う目的として最も適切なものはどれか。（正しいもの2つを選べ）",o:["期限超過の案件を確認しやすくする機能。","電子帳票の保管と検索を主軸にし、送信後の状態確認も行う。","工事別に見積・注文・請求を整理し、担当者が状態を確認しやすくする。","目的の書類を条件で探し、過去の書類や関連書類へたどり着くため。","書類作成から相手先確認までを画面上で追跡し、後続処理を判断する。","見積比較、発注、請求確認を同じ工事件名で追えるようにする。"],a:"AD"},
{id:42,cat:"建設PAD操作",type:"m",q:"ヘルプセンターを見る場面として最も適切なものはどれか。（正しいもの2つを選べ）",o:["メニュー名ではなく、処理したい書類と状態から入口を選ぶ場面。","一覧、作成、詳細のどこで確認すべき内容か切り分ける場面。","画面遷移前に、現在扱っている書類種別と対象工事を確認する場面。","関連書類のみを効率よく確認できるため。","操作手順や不明点を調べ、自己解決の材料を得たいとき。","ログイン後に主要機能への入口と現在の処理状況を確認する場面。"],a:"DE"},
{id:43,cat:"建設PAD操作",type:"m",q:"ログアウトを行う目的として最も適切なものはどれか。（正しいもの2つを選べ）",o:["作業後にアカウント操作を終了し、共用端末での誤操作を防ぐ場面。","共用端末や作業終了時に、自分のアカウント操作を終了するため。","不明点がある時に操作手順を確認し、次の画面へ進む材料を得る場面。","メニューから見積、注文、請求のどの業務入口へ進むか判断する場面。","前者は全書類、後者は特定物件の書類のみ。","画面遷移前に、現在扱っている書類種別と対象工事を確認する場面。"],a:"BE"},
{id:44,cat:"建設PAD操作",type:"m",q:"見積り作成画面を使う場面として正しいものはどれか。（正しいもの2つを選べ）",o:["支払い通知書から請求書へ引用する場面。","物件・業者・工種・期限を入力し、協力会社へ見積依頼をする場面。","相殺理由と控除額を入力し、支払額を調整する場面。","提出済み見積の比較のみを行い、依頼先や期限は入力しない場面。","送信後変更不可のため事前に内容確認する。","注文書の承認日を入力し、請求可能な注文に変える場面。"],a:"BE"},
{id:45,cat:"建設PAD操作",type:"m",q:"見積一覧を使う主な目的として正しいものはどれか。（正しいもの2つを選べ）",o:["ログイン履歴、権限設定、ユーザー追加状況を確認するため。","届いたが元請側で未確認の状態。","依頼先の提出状況・返信期限・ステータス・見積金額を一覧で確認するため。","請求書の振込先、インボイス番号、税率、税込金額を確認するため。","注文書の承認経路、承認者、請書PDF、発注金額を確定するため。","相殺金額、控除理由、支払通知書の通知日を確認するため。"],a:"BC"},
{id:46,cat:"請求管理",type:"m",q:"一般請求書を使う場面として最も適切なものはどれか。（正しいもの2つを選べ）",o:["送信先を選ぶ際、取引先変更で入力内容が変わる可能性を確認する場面。","請求書として相手先に渡す前に、宛先、金額、振込先、添付を確認する場面。","処理段階を把握し次の対応を判断するため。","支払条件、支払期限、請求番号、請求日を整えて請求書を作る場面。","請求根拠となる明細と資料を揃え、差し戻しを防ぐために確認する場面。","通常の請求書を作成し、明細・振込先・送付先を整えて送信するとき。"],a:"CF"},
{id:47,cat:"請求管理",type:"m",q:"出来高請求書を使う場面として最も適切なものはどれか。（正しいもの2つを選べ）",o:["工事の進捗に応じた複数回請求として扱い、100%超過を確認する場面。","対象注文が表示されない時に、注文書の状態や請求履歴を確認する場面。","前回までの出来高と今回請求分を合わせて、累計金額を確認する場面。","注文書に基づき、工事の進捗や出来高に応じて請求するとき。","注文書と請求履歴をセットで見て、請求可能な対象を選ぶ場面。","添付内容と書類記載が一致するか確認。"],a:"DF"},
{id:48,cat:"支払管理",type:"m",q:"支払い通知書を使う場面として最も適切なものはどれか。（正しいもの2つを選べ）",o:["複数請求がある時に、注文番号や請求年月を照合して通知する場面。","対象請求、支払期限、支払条件、金額を確認して通知する場面。","請求に対する支払予定や支払内容を相手先へ通知するとき。","請求一覧から対象を選び、支払内容の通知対象を取り違えないようにする場面。","会社単位と個人単位で権限を管理するため。","支払予定を共有する前に、請求書の承認状態と金額を確認する場面。"],a:"CE"},
{id:49,cat:"請求管理",type:"m",q:"相殺請求書を使う場面として最も適切なものはどれか。（正しいもの2つを選べ）",o:["控除後の金額が一覧や通知内容とずれないか確認する場面。","対象請求に対して控除・相殺する金額と理由を整理する場面。","相手先へ説明できる根拠を添えて、控除内容を処理する場面。","類似書類を複数作る際に再入力を省く場面。","相殺後の支払額と元の請求額の整合を確認する場面。","支払額から控除・相殺する金額や内容を請求処理上で扱うとき。"],a:"DF"},
{id:50,cat:"請求管理",type:"m",q:"請求一覧を使う場面として最も適切なものはどれか。（正しいもの2つを選べ）",o:["請求書PDFや操作ボタンへ進む前に、取引先と金額を確認する場面。","取引先の情報確認・編集・招待管理のため。","受信・作成された請求の状態を見て、承認待ちや差し戻しを判断する場面。","支払い通知、承認、確認へ進む前に対象行を特定する場面。","複数の請求から、注文番号や請求年月を使って対象を選ぶ場面。","受信・作成された請求書を検索し、金額、期限、承認、支払状況を確認するとき。"],a:"BF"},
{id:51,cat:"基本知識",type:"m",q:"建設PADが正式にリリースされた日はいつか。（正しいもの2つを選べ）",o:["2019年4月1日","2023年3月9日","2020年2月17日","2021年8月1日にリリースされた。","2021年8月1日","2022年8月1日"],a:"DE"}
];

{id:51,cat:"建設PAD操作",type:"m",q:"見積一覧のNoを問い合わせ対応で使う目的はどれか。（正しいもの2つを選べ）",o:["注文書の承認者を切り替えるため。","相殺請求書の控除理由を自動入力するため。","支払い通知書の支払期限を延長するため。","請求書の税率を変更するため。","問い合わせ対象を特定するため。","対象依頼を特定し、類似案件との取り違えを防ぐため。"],a:"EF"},
{id:52,cat:"物件・工事管理",type:"m",q:"見積依頼で物件名を確認する理由はどれか。（正しいもの2つを選べ）",o:["ログアウト時の確認メッセージを変えるため。","支払い通知書の支払期限を決めるため。","相殺請求書の控除額を計算するため。","工事・物件の一致を確認するため。","どの工事・物件への依頼かを依頼先と自社で一致させるため。","注文書の承認者を自動で割り当てるため。"],a:"DE"},
{id:53,cat:"見積管理",type:"m",q:"見積依頼の依頼先業者を確認する理由はどれか。（正しいもの2つを選べ）",o:["依頼先を確定し、複数選択時も漏れや誤りがないか確認するため。","注文書の承認済みステータスを確定するため。","ホーム画面の通知件数を依頼先ごとに集計するため。","相殺請求書の控除理由を業者名から自動判定するため。","請求書の振込先を確定し、支払通知書の作成準備に使うため。","誤発注を防ぐためである。"],a:"AF"},
{id:54,cat:"注文管理",type:"m",q:"見積一覧に注文番号が表示されている場合、確認できることはどれか。（正しいもの2つを選べ）",o:["見積依頼の返信期限が延長されたこと。","請求書の振込先が承認済みになったこと。","注文書が作成済みと確認できる。","支払い通知書の送信先が確定したこと。","相殺請求書の控除理由が確定したこと。","その見積が注文情報と紐づいている可能性があること。"],a:"CF"},
{id:55,cat:"見積管理",type:"m",q:"見積依頼で工種を入力・確認する目的はどれか。（正しいもの2つを選べ）",o:["注文書の承認者を工種名から自動で決めるため。","請求書の振込先を工種ごとに分けるため。","相殺請求書の控除理由を工種に置き換えるため。","工事内容の区分を示し、業者が見積対象を判断しやすくするため。","依頼する工事の種類を確認するため。","支払い通知書の支払期限を工種ごとに変えるため。"],a:"DE"},
{id:56,cat:"検索・一覧操作",type:"m",q:"見積一覧のステータスを見る理由はどれか。（正しいもの2つを選べ）",o:["依頼先の進捗状態（未提出・検討中・提出中）を確認するため。","注文書PDFの印刷要否を判断するため。","ログアウト前に未保存データを探すため。","相殺請求書の控除額を確定するため。","回答期限を双方で認識するため。","請求書の支払期限を延ばすか判断するため。"],a:"AE"},
{id:57,cat:"物件・工事管理",type:"m",q:"見積依頼で工事着手及び完成時期を入力する時の注意点はどれか。（正しいもの2つを選べ）",o:["完成日を空欄にしても、業者側で工期を自動判断する。","依頼内容を正確に業者へ伝えるため。","開始日と終了日の前後関係を確認し、終了日が開始日より後になるようにする。","工期は相殺請求書の控除理由として入力する。","着手日と完成日は請求書の支払期限と同じ日付にする。","工期は注文書作成後に初めて確定するため、見積依頼では仮条件として扱う。"],a:"BC"},
{id:58,cat:"建設PAD操作",type:"m",q:"見積一覧の見積合計金額を見る目的はどれか。（正しいもの2つを選べ）",o:["見積条件を業者に示すためである。","支払い通知書の作成権限を確認するため。","見積依頼の送信先業者を追加するため。","問い合わせ理由欄へ確認内容を転記するため。","見積額を比較し、注文判断の材料にするため。","請求書の振込先を確定するため。"],a:"AE"},
{id:59,cat:"見積管理",type:"m",q:"見積依頼日時を見る理由として正しいものはどれか。（正しいもの2つを選べ）",o:["請求書の発行日を決めるため。","支払い通知書の支払予定日を確定するため。","工事期間を双方で確認するため。","依頼日から返信期限や催促タイミングを確認するため。","相殺請求書の控除額を決めるため。","注文書の承認者を変更するため。"],a:"CD"},
{id:60,cat:"建設PAD操作",type:"m",q:"見積返信期限を設定・確認する目的はどれか。（正しいもの2つを選べ）",o:["請求書の支払期限を確定するため。","依頼先の回答期限を明確にし、期限超過時の対応判断に使うため。","注文書の承認日を決めるため。","相殺請求書の控除理由を確定するため。","ログアウト時に未保存データを削除するため。","対象物件・工事を確認するため。"],a:"BF"},

{id:147,cat:"注文管理",type:"m",q:"アカウントを持っていない協力会社へ注文書を送る時、最初に切り替える操作はどれか。（正しいもの2つを選べ）",o:["注文書・請書作成で物件選択後、メールアドレスを直接指定するに切り替える。","CSV出力で協力会社メールを検索し、ダウンロードする。","見積依頼で依頼先を複数選択し、注文書へ変換する。","終了まで利用を待つのが正しい対応。","支払い通知書で書類タイプを取り交わした注文書にする。","取引先一覧で未登録会社を選び、承認状況を承認済みに変える。"],a:"AD"},
{id:148,cat:"物件・工事管理",type:"m",q:"メールアドレス直接指定に切り替えた後、登録済み取引先から選び直したい場合の理解はどれか。（正しいもの2つを選べ）",o:["注文条項フォームを追加すると登録済み取引先選択へ戻る。","PDFで確認を押すと登録済み取引先選択へ戻る。","承認待ちになった後に一覧から登録済み取引先へ戻す。","切り替え後に表示される取引先から選ぶボタンで戻す。","エラー内容や操作状況を準備する。","物件選択を解除すると自動的に登録済み取引先選択へ戻る。"],a:"DE"},
{id:149,cat:"注文管理",type:"m",q:"アカウントなし協力会社へ注文書を送る時、通常の取引先送信より追加で入力が必要なものはどれか。（正しいもの2つを選べ）",o:["見積依頼の工事概要、見積要領、返信期限、添付資料名。","CSVの検索条件、詳細検索の入力欄、青いダウンロードボタン。","支払い通知書の承認日、請求年月、支払期限、請求番号。","操作方法や使い方を調べるためだ。","ワークフローの最終承認者、差し戻しコメント、却下理由。","受注側の社名、住所、電話番号、送付先メールアドレス。"],a:"DF"},
{id:150,cat:"注文管理",type:"m",q:"アカウントなし協力会社への注文書送信が完了したと判断する画面上の手がかりはどれか。（正しいもの2つを選べ）",o:["支払い通知書確認ボタンが受信済み一覧に表示される。","注文書・注文請書を送信しましたのメッセージが画面上部に出る。","データの準備ができました、というCSV通知が表示される。","お問い合わせ入力ボタンが請求書詳細に表示される。","承認済みの一般請求書が送信済み一覧に表示される。","アカウント設定と基本操作を習得する。"],a:"BF"}
];

{id:151,cat:"注文管理",type:"m",q:"注文書作成で約款データの添付先を選ぶ場面として正しいものはどれか。（正しいもの2つを選べ）",o:["注文書のみ、注文請書のみ、注文書・請書双方のどれに付けるか決める。","変更契約中、変更契約済、否決のどの状態に付けるか決める。","受信した請求書、取り交わした注文書のどちらへ付けるか決める。","承認、問い合わせ、拒否のどの回答に付けるか決める。","見積内容を引き継ぎ効率よく作成できる。","CSV検索結果、準備完了画面のどちらへ付けるか決める。"],a:"AE"},
{id:152,cat:"注文管理",type:"m",q:"注文書に添付する約款PDFで拡張子に関する注意として正しいものはどれか。（正しいもの2つを選べ）",o:["大文字の.PDFで添付する。","CSV形式へ変換して添付する。","小文字の.pdfで添付する。","複数業者の価格を比較するためである。","拡張子を外して添付する。","画像として分割して添付する。"],a:"CD"},
{id:153,cat:"注文管理",type:"m",q:"注文書を下書き保存した後に相手へ届かないと言われた場合、最初に確認することはどれか。（正しいもの2つを選べ）",o:["支払い通知書の通知数が増えているか。","社内承認を先行させる必要がある場合。","下書き状態のまま送信まで完了していないか。","CSVの詳細検索で注文書が出力できるか。","承認済みの一般請求書に引用されているか。","見積回答の添付資料が開けるか。"],a:"BC"},
{id:154,cat:"注文管理",type:"m",q:"注文書・請書の承認状況確認で、修正依頼後に再送した時の状態理解として正しいものはどれか。（正しいもの2つを選べ）",o:["再送後はCSVの準備完了画面に移る。","再送後は承認状況が再び承認待ちになる。","再送後は変更契約済として旧書類にのみ表示される。","請求内容に誤りがあり修正が必要時。","再送後は協力会社側の支払通知書として届く。","再送後は非承認として請求書一覧へ移る。"],a:"BD"},
{id:155,cat:"請求管理",type:"m",q:"出来高請求書の承認・問い合わせ・拒否で、承認を選んだ場合のコメント扱いとして正しいものはどれか。（正しいもの2つを選べ）",o:["コメントは支払い通知書作成時にのみ入力する。","承認を選んだ時のみコメントは任意である。","拒否を選んだ時のみコメントが任意である。","支払の正確性と内部統制のためである。","承認、問い合わせ、拒否のすべてでコメントが必須である。","問い合わせを選んだ時のみコメントが任意である。"],a:"BD"},
{id:156,cat:"請求管理",type:"m",q:"出来高請求書に問い合わせをした後の正しい待ち方はどれか。（正しいもの2つを選べ）",o:["CSV出力で問い合わせ内容をダウンロードするまで待つ。","受注側が出来高請求書を修正して再送するか、問い合わせに回答するまで待つ。","承認済みとして支払い通知書を作成し、回答は後で確認する。","拒否済みとして請求書番号を再利用し、再作成を待つ。","立替金等を請求書から差し引く場合。","変更契約中として注文書一覧に移動するまで待つ。"],a:"BE"},
{id:157,cat:"基本操作",type:"m",q:"発注側で支払い通知書を確認する入口として正しいものはどれか。（正しいもの2つを選べ）",o:["CSV出力の詳細検索で対象通知を開く。","見積関連の依頼一覧から支払い通知書確認を押す。","注文書・請書の一覧から新変更契約を押して対象を表示する。","請求関連から支払い通知書を開き、物件または通知で対象を絞る。","ワークフローの承認ルート設定から通知書を開く。","支払漏れを防ぐためである。"],a:"DF"},
{id:158,cat:"支払管理",type:"m",q:"受信済みの支払い通知書を内容確認する操作として正しいものはどれか。（正しいもの2つを選べ）",o:["差戻しは修正依頼、取消は中止である。","注文書一覧で新変更契約ボタンをクリックする。","受信済みの支払い通知書一覧で支払い通知書確認ボタンをクリックする。","承認ルート設定で新規登録ボタンをクリックする。","送信済みの一般請求書一覧でキャンセルボタンをクリックする。","CSV検索結果で青いダウンロードボタンをクリックする。"],a:"AC"},
{id:159,cat:"支払管理",type:"m",q:"協力会社側で届いた支払通知書へ返答する時の選択肢として正しい組み合わせはどれか。（正しいもの2つを選べ）",o:["保存、編集、キャンセルから選び、編集中の一般請求書へ戻す。","承認、問い合わせ、拒否から選び、必要に応じてコメント付きで送信する。","承認待ち、変更契約中、変更契約済から選び、注文書一覧へ戻す。","複数承認者でチェックし誤りを防ぐ。","検索、ダウンロード、準備完了から選び、CSVを取得する。","承認、差し戻し、却下から選び、PDF確認後に最終承認者へ送る。"],a:"BD"},
{id:160,cat:"注文管理",type:"m",q:"一般請求書が発注側から問い合わせされた時、協力会社側で最初に確認するものはどれか。（正しいもの2つを選べ）",o:["注文書の承認状況が変更契約中になっているかと、新変更契約の内容。","ワークフローの承認ルートが最終承認者まで進んだかと、金額範囲。","送信済み一般請求書の承認状況がお問い合わせになっているかと、お問い合わせ入力の内容。","CSV出力の検索結果が準備完了になっているかと、出力ファイル名。","過去書類を必要時に参照できるため。","支払い通知書が承認済みになっているかと、青いダウンロードボタン。"],a:"CE"},
{id:161,cat:"請求管理",type:"m",q:"一般請求書の問い合わせに回答するのみの場合の操作として正しいものはどれか。（正しいもの2つを選べ）",o:["支払通知書確認から拒否を選び、請求書を終了する。","お問い合わせ入力で回答を入力し送信する。","CSV出力で問い合わせ内容を検索してダウンロードする。","必要な担当者に確実に届くためだ。","編集ボタンで請求書を修正し、PDF確認せず承認済みにする。","新変更契約から注文書を作り直し、承認待ちにする。"],a:"BD"},
{id:162,cat:"請求管理",type:"m",q:"一般請求書の内容修正が必要な問い合わせを受けた場合の流れとして正しいものはどれか。（正しいもの2つを選べ）",o:["支払い通知書の作成元書類検索で受信した請求書を引用する。","注文書一覧で新変更契約を作り、請求書番号を引き継ぐ。","CSV出力で対象請求を検索し、ダウンロードして完了する。","外部ツールで集計・分析するためだ。","お問い合わせ入力で回答のみ送り、請求書の承認状況を承認済みに変える。","編集で請求書を修正し、PDFで反映を確認して先方へ再送する。"],a:"DF"},
{id:163,cat:"基本操作",type:"m",q:"協力会社側で保存中の一般請求書を再編集する入口として正しいものはどれか。（正しいもの2つを選べ）",o:["支払い通知書確認から問い合わせを選択する。","送信済みの一般請求書で承認済みの行をクリックする。","編集中の一般請求書一覧から対象行の編集ボタンをクリックする。","CSV出力の検索結果からダウンロードする。","注文書・請書一覧から詳細PDFを開く。","複数取引先に効率よく送信するため。"],a:"CF"},
{id:164,cat:"請求管理",type:"m",q:"作成途中の一般請求書で保存するを押した後の状態として正しいものはどれか。（正しいもの2つを選べ）",o:["受信済みの支払い通知書に確認待ちとして表示される。","送信済みの一般請求書に承認済みとして表示される。","編集中の一般請求書に保存データが表示される。","注文書一覧に承認待ちとして表示される。","CSV出力に準備完了として表示される。","建設会社や工事関連企業が対象だ。"],a:"CF"},
{id:165,cat:"請求管理",type:"m",q:"一般請求書が拒否された時、協力会社側の承認状況表示として正しいものはどれか。（正しいもの2つを選べ）",o:["支払い通知書の承認状況が承認待ちに変わる。","送信済み一般請求書の承認状況が変更契約済に変わる。","建設業務の書類処理を効率化するため。","編集中の一般請求書に下書きとして戻る。","送信済み一般請求書の承認状況が非承認に変わる。","CSV出力の状態がデータ準備中に変わる。"],a:"CE"},
{id:166,cat:"請求管理",type:"m",q:"請求書承認状況が右側に隠れて見えない場合の実務対応として正しいものはどれか。（正しいもの2つを選べ）",o:["注文書の変更契約画面から承認状況を確認する。","請求書番号を変更して一覧を再作成する。","CSVを出力しないと承認状況は見られない。","見積・注文・請求・支払通知書等だ。","物件をクローズして承認状況を再表示する。","一覧を右にスクロールして承認状況を確認する。"],a:"DF"},
{id:167,cat:"支払管理",type:"m",q:"支払い通知書作成で作成元書類検索を使う時、書類タイプとして選べる正しい組み合わせはどれか。（正しいもの2つを選べ）",o:["受信した見積依頼、編集中の見積書。","アカウント登録と取引先招待が必要。","承認ルート、支払い承認ルートグループ。","変更契約中の注文書、否決された注文書。","CSV検索結果、ダウンロード履歴。","受信した請求書、取り交わした注文書。"],a:"BF"},
{id:168,cat:"支払管理",type:"m",q:"支払い通知書の作成元書類検索で、対象書類を絞るために入力する日付はどれか。（正しいもの2つを選べ）",o:["ワークフロー設定日。","書類のデジタル化で業務効率が向上。","CSV出力日。","物件作成日。","承認日。","請求書作成日。"],a:"BE"},
{id:169,cat:"承認・ワークフロー",type:"m",q:"ワークフロー機能の前提理解として正しいものはどれか。（正しいもの2つを選べ）",o:["支払い通知書を送ると自動的に無効になる機能である。","協力会社側のみが使う機能で、発注側の承認には関係しない。","CSV出力を使う場合のみ有効になり、請求承認には関係しない。","オプション機能であり、利用する場合は承認ルート設定や承認手順を確認する。","法令に準拠して電子的に保存される。","全ユーザーで常時有効であり、注文書送信時に必ず自動適用される。"],a:"DE"},
{id:170,cat:"物件・工事管理",type:"m",q:"支払い承認ルートを新規登録する時、後から判別しやすくするために入力するものはどれか。（正しいもの2つを選べ）",o:["変更契約番号。","支払い通知書番号。","請求書番号。","CSV出力名。","支払い承認ルート名。","電話・メール等でサポートを受けられる。"],a:"EF"},
{id:171,cat:"支払管理",type:"m",q:"支払い承認ルートで金額に応じて表示・非表示を分けたい場合に使う設定はどれか。（正しいもの2つを選べ）",o:["PDF拡張子設定。","工事概要の文字数設定。","複数業者の見積を比較して選ぶため。","通知数表示設定。","請求金額の範囲設定。","CSV準備完了設定。"],a:"CE"},
{id:172,cat:"承認・ワークフロー",type:"m",q:"承認者の順序に関する理解として正しいものはどれか。（正しいもの2つを選べ）",o:["承認者は協力会社側が支払通知書で選択する。","最上部が最終承認者で、そこまで承認されると請求書が承認される。","追加した承認者はすべて参考表示で、承認可否に影響しない。","承認者の順序はCSV出力順のみに使われる。","繰り返し使う書類を効率よく作る。","最下部の承認者が最終承認者で、最初に承認すると完了する。"],a:"BE"},
{id:173,cat:"承認・ワークフロー",type:"m",q:"承認者を増やしたい場合の操作として正しいものはどれか。（正しいもの2つを選べ）",o:["追加で承認者欄を増やし、プラスから具体的な承認者ユーザーを選ぶ。","書類の期限切れを防ぐためである。","注文条項フォームを追加し、条項名に承認者を入力する。","CSV検索条件を追加し、ダウンロード後に承認者を選ぶ。","支払い通知書のコメント欄に承認者名を入力する。","見積依頼の依頼先欄に承認者を追加する。"],a:"AB"},
{id:174,cat:"承認・ワークフロー",type:"m",q:"承認者を削除したい場合の操作として正しいものはどれか。（正しいもの2つを選べ）",o:["支払状況を把握・分析するためだ。","支払い通知書を拒否すると承認者が削除される。","CSV出力を取り消すと承認者が削除される。","請求金額の範囲設定を外すと全員削除される。","追加した承認者の右側のバツで削除する。","承認対象書類のPDFを閉じると削除される。"],a:"AE"},
{id:175,cat:"基本操作",type:"m",q:"承認者が承認対象書類を確認する入口として正しいものはどれか。（正しいもの2つを選べ）",o:["複数物件を横断して書類を探すため。","物件作成画面から参加ユーザーを選び、承認対象書類を開く。","CSV出力から詳細検索を開き、承認対象書類をダウンロードする。","見積依頼の依頼一覧から承認フローを作成する。","HOMEの通知情報から承認フローを選び、対象書類をクリックする。","取引先招待から会社名を選び、承認対象書類を開く。"],a:"AE"},
{id:176,cat:"承認・ワークフロー",type:"m",q:"承認判断前にPDFで確認する理由として正しいものはどれか。（正しいもの2つを選べ）",o:["支払い通知書の通知数を確認してから物件選択するため。","取引先が書類を受け取ったか確認する。","CSVの準備完了メッセージを確認してからダウンロードするため。","見積依頼の工事概要を18文字以内にするため。","取引先招待メールが届いたか確認してから承認するため。","注文書・請書などの書面内容を確認してから承認、差し戻し、却下を選ぶため。"],a:"BF"},
{id:177,cat:"承認・ワークフロー",type:"m",q:"ワークフローで差し戻しまたは却下を選ぶ場合のコメント扱いとして正しいものはどれか。（正しいもの2つを選べ）",o:["差し戻し、却下の場合はコメントを必ず入力する。","コメントは協力会社側の請求書番号欄に入力する。","承認、差し戻し、却下のすべてでコメントは任意である。","承認の場合のみコメントが必須である。","コメントはCSV出力時に自動で付与される。","担当者の異動・退職があった場合だ。"],a:"AF"},
{id:178,cat:"承認・ワークフロー",type:"m",q:"承認操作の最終確認画面で行う判断として正しいものはどれか。（正しいもの2つを選べ）",o:["請求書の内容に誤りがある場合だ。","データの準備ができましたという表示で青いダウンロードを選ぶ。","承認しますかという確認に対して、はいまたはキャンセルを選ぶ。","注文書・注文請書を送信しましたという表示を待つ。","取引先から選ぶボタンで宛先指定に戻す。","お問い合わせ入力で回答を入力して送信する。"],a:"AC"},
{id:179,cat:"注文管理",type:"m",q:"ワークフロー設定で支払い承認ルートと注文書ワークフローの関係としてヘルプ上近い説明はどれか。（正しいもの2つを選べ）",o:["請求内容を検証して認める行為だ。","支払い承認ルートは見積依頼の複数業者選択と同義とされている。","支払い承認ルートはアカウントなし送信のメール指定と同義とされている。","支払い承認ルートはCSV出力の条件設定と同義とされている。","支払い承認ルートは物件クローズの取消しと同義とされている。","金額範囲や承認者設定の考え方は注文書のワークフローと同義とされている。"],a:"AF"},
{id:180,cat:"承認・ワークフロー",type:"m",q:"承認ルート設定で承認者を選ぶ際、プラスボタンの役割として正しいものはどれか。（正しいもの2つを選べ）",o:["承認対象書類をPDF出力する。","期限内に見積回答を受け取るためだ。","支払通知書の問い合わせを開く。","請求金額の範囲設定を初期化する。","CSVダウンロードを開始する。","具体的な承認者ユーザーを一覧から選択する。"],a:"BF"},
{id:181,cat:"CSV・データ連携",type:"m",q:"CSV出力の最初の操作として正しいものはどれか。（正しいもの2つを選べ）",o:["HOMEの通知情報から承認フローを選択する。","メニュー欄からCSV出力を選択する。","注文書一覧から新変更契約を選択する。","請求関連から支払い通知書確認を選択する。","類似書類を効率よく作成するためだ。","見積関連から見積り作成を選択する。"],a:"BE"},
{id:182,cat:"CSV・データ連携",type:"m",q:"CSV出力で条件を入力する前に開くものはどれか。（正しいもの2つを選べ）",o:["支払い通知書確認。","お問い合わせ入力。","取引が終了した業者を整理するため。","承認ルート設定。","新変更契約。","詳細検索。"],a:"CF"},
{id:183,cat:"CSV・データ連携",type:"m",q:"CSV出力で検索ボタンを押す前に行うことはどれか。（正しいもの2つを選べ）",o:["赤枠内などの検索条件に出力したい内容を入力する。","一般請求書を編集中一覧へ保存する。","承認ルートの最終承認者を削除する。","金額変更や追加発注を検討すること。","支払い通知書の承認状況を拒否にする。","注文書のPDF拡張子を小文字に変える。"],a:"AD"},
{id:184,cat:"CSV・データ連携",type:"m",q:"CSV出力で検索後、最初のダウンロード前に確認することはどれか。（正しいもの2つを選べ）",o:["支払通知書の通知数が消えているか。","検索結果が出力したい対象内容と合っているか。","承認フローの最終確認がはいになっているか。","注文書が変更契約済になっているか。","請求書の問い合わせコメントが空欄か。","書類の真正性を担保するためである。"],a:"BF"},
{id:185,cat:"CSV・データ連携",type:"m",q:"CSV出力でデータの準備ができましたと表示された後の操作はどれか。（正しいもの2つを選べ）",o:["支払い通知書確認ボタンをクリックする。","青いダウンロードボタンをクリックする。","新変更契約ボタンをクリックする。","承認するボタンをクリックする。","情報漏洩を防ぎ適切に管理するため。","お問い合わせ入力ボタンをクリックする。"],a:"BE"},
{id:186,cat:"CSV・データ連携",type:"m",q:"CSV出力を使う時に最も避けるべき判断はどれか。（正しいもの2つを選べ）",o:["出力対象の内容を事前に決めておく。","画面下の結果を見てからダウンロードする。","準備完了後に青いダウンロードボタンを押す。","支払内容の内訳を把握するためだ。","検索条件を入力してから検索する。","検索条件と表示結果を照合せずにダウンロードする。"],a:"DF"},
{id:187,cat:"CSV・データ連携",type:"m",q:"CSV出力がオプション機能であることを踏まえた一次対応として正しいものはどれか。（正しいもの2つを選べ）",o:["工事内容や条件が変更になった場合。","CSVメニューが見当たらない場合、注文書を変更契約済にする。","CSVメニューが見当たらない場合、請求書番号を変更する。","CSVメニューが見当たらない場合、協力会社側で承認を選ぶ。","CSVメニューが見当たらない場合、利用契約や権限の有無も確認する。","CSVメニューが見当たらない場合、支払通知書を拒否する。"],a:"AE"},
{id:188,cat:"CSV・データ連携",type:"m",q:"CSV出力の検索結果が目的と違う場合、次に行うべきことはどれか。（正しいもの2つを選べ）",o:["注文書一覧で新変更契約を作る。","支払い通知書確認で問い合わせを選ぶ。","いつ誰に送信したか確認するためだ。","青いダウンロードボタンで先に取得してから修正する。","承認フローで却下コメントを入力する。","詳細検索の条件を見直して再検索する。"],a:"CF"},
{id:189,cat:"基本操作",type:"m",q:"協力会社側で支払通知書が届いた時の入口として正しいものはどれか。（正しいもの2つを選べ）",o:["物件作成、参加取引先、作成の順に開く。","CSV出力、詳細検索、ダウンロードの順に開く。","見積依頼、依頼先選択、先方へ送信の順に開く。","HOME、通知情報、請求関連、該当通知の順に開く。","期限超過を防ぎ対応漏れをなくす。","注文書・請書一覧、新変更契約、変更契約中の順に開く。"],a:"DE"},
{id:190,cat:"支払管理",type:"m",q:"支払通知書の内容を協力会社側で確認する操作として正しいものはどれか。（正しいもの2つを選べ）",o:["取引先から選ぶをクリックして宛先画面で確認する。","詳細検索をクリックしてCSV結果で確認する。","承認ルート設定をクリックして最終承認者で確認する。","紙保存や提出が必要な場合に行う。","支払い通知書確認をクリックして別ページの書類画面で確認する。","新変更契約をクリックして注文書作成画面で確認する。"],a:"DE"},
{id:191,cat:"支払管理",type:"m",q:"協力会社側で支払通知書へ返答する時、プルダウンで選ぶ項目として正しいものはどれか。（正しいもの2つを選べ）",o:["検索、準備完了、ダウンロード。","承認、差し戻し、却下。","保存、編集、キャンセル。","承認待ち、変更契約中、変更契約済。","承認、問い合わせ、拒否。","番号の重複や付け間違いを防ぐため。"],a:"EF"},
{id:192,cat:"協力会社管理",type:"m",q:"協力会社側で見積回答を作成する前に添付資料を確認する理由はどれか。（正しいもの2つを選べ）",o:["請求に対して入金があったか確認する。","支払い承認ルートの最終承認者を確認するため。","変更契約中の注文書を承認済みにするため。","請求書番号を重複使用できるか確認するため。","発注条件・図面を確認し、見積範囲と単価の前提を合わせるため。","CSVダウンロードの準備完了を確認するため。"],a:"AE"},
{id:193,cat:"協力会社管理",type:"m",q:"協力会社側の見積作成で数字入力に関する注意として正しいものはどれか。（正しいもの2つを選べ）",o:["数字は発注側が承認時に自動補正する。","数字は添付資料にあれば画面入力しない。","数字はCSV出力後に入力する。","よく使う検索条件を素早く呼び出す。","見積単価は全角、数量は半角で入力する。","見積単価や数量などは半角で入力する。"],a:"DF"},
{id:194,cat:"注文管理",type:"m",q:"協力会社側で注文書・請書を受け取った時、内容に不備がある場合の返答はどれか。（正しいもの2つを選べ）",o:["CSVを出力し、修正箇所をファイル名に入れる。","修正箇所を担当者に明確に伝えるため。","保存を選び、発注側の注文書を編集する。","承認を選び、請求書の備考で修正箇所を伝える。","修正依頼を選び、コメントで修正箇所を伝える。","拒否を選び、出来高請求書をそのまま作成する。"],a:"BE"},
{id:195,cat:"注文管理",type:"m",q:"協力会社側で注文書・請書を承認した後に確認する状態はどれか。（正しいもの2つを選べ）",o:["CSV状態が準備完了になっているか。","一般請求書が編集中になっているか。","書類状況が承認済みになっているか。","書類の状態と次の操作を把握するため。","書類状況が変更契約中になっているか。","支払通知書が問い合わせになっているか。"],a:"CD"},
{id:196,cat:"請求管理",type:"m",q:"協力会社側で出来高請求書を作成する時、引用元として選ぶものはどれか。（正しいもの2つを選べ）",o:["CSV詳細検索から該当行を選ぶ。","取引先も建設PADを利用していること。","取引先招待一覧から該当会社を選ぶ。","注文書選択のプルダウンから該当注文書を選ぶ。","支払通知書確認から該当通知書を選ぶ。","承認ルート設定から最終承認者を選ぶ。"],a:"BD"},
{id:197,cat:"請求管理",type:"m",q:"協力会社側の出来高請求書で必須入力に近い組み合わせはどれか。（正しいもの2つを選べ）",o:["送信後に誤りが発覚した場合である。","承認ルート名、金額範囲、最終承認者、却下コメント。","見積返信期限、工事概要、見積要領、依頼先。","CSV検索条件、詳細検索、準備完了、青いボタン。","請求書発行日、請求書番号、請求率または出来高金額。","注文条項、約款添付先、メール直接指定、電話番号。"],a:"AE"},
{id:198,cat:"請求管理",type:"m",q:"協力会社側で一般請求書を途中保存した後の再開方法として正しいものはどれか。（正しいもの2つを選べ）",o:["編集中の一般請求書から編集をクリックする。","注文書の変更契約中の行から編集する。","送信済み一般請求書の承認済み行から編集する。","発注側の支払い通知書作成元から編集する。","CSV出力の検索結果から編集する。","業務の流れを把握し適切に対応する。"],a:"AF"},
{id:199,cat:"請求管理",type:"m",q:"協力会社側で一般請求書が問い合わせになった場合、請求内容の修正が必要な時の操作はどれか。（正しいもの2つを選べ）",o:["期限の迫った書類を優先するためだ。","注文書一覧から新変更契約を作成する。","お問い合わせ入力に回答のみ入れて承認済みにする。","編集で修正し、PDFで確認して先方へ送信する。","支払通知書の承認を選んで請求書を確定する。","CSVをダウンロードして発注側へ送る。"],a:"AD"},
{id:200,cat:"請求管理",type:"m",q:"協力会社側で一般請求書が承認されたか確認する時、見落としやすい操作はどれか。（正しいもの2つを選べ）",o:["承認状況が右側にある場合は横スクロールして確認する。","支払通知書の問い合わせを拒否に変える。","処理漏れを防ぎ業務を滞らせないため。","CSVの青いダウンロードボタンを押して確認する。","注文書の約款PDFを小文字拡張子に変える。","見積依頼の添付資料を開いて承認状況を確認する。"],a:"AC"}
];
const PAD_LEVELS=[{lv:4,label:"4\u7D1A",color:"#5B8C5A",desc:"\u696D\u754C\u57FA\u790E",ok:true},{lv:3,label:"3\u7D1A",color:"#4A7C59",desc:"\u5EFA\u8A2DPAD\u57FA\u790E\u6A5F\u80FD",ok:true},{lv:2,label:"2\u7D1A",color:"#3B6B47",desc:"PAD\u30BD\u30EA\u30E5\u30FC\u30B7\u30E7\u30F3",ok:true},{lv:1,label:"1\u7D1A",color:"#2C5236",desc:"\u30E6\u30FC\u30B9\u30B1\u30FC\u30B9\u554F\u984C",ok:true}];

const FDE4_Q=[{"id":1,"cat":"FDEの定義","type":"m","q":"FDE（Forward Deployed Engineer）の定義および最大の特徴として、最も適切なものはどれですか（2つ選べ）","o":["「課題抽出」「実装」「定着」のすべてのフェーズに一気通貫で顧客に携わる点","営業が獲得した案件の契約締結と、トラブル時の窓口業務に特化する点","顧客の要望をそのまま開発チームに伝えるだけのブリッジエンジニアである点","自社プロダクトの純粋な要件定義と開発進捗報告のみを短期接点で行う点","顧客の要望をそのまま開発チームへ転送するだけでよい","顧客の課題を深く理解し課題抽出から定着まで一気通貫で支援する"],"a":"AF"},{"id":2,"cat":"他職種との違い","type":"m","q":"他職種との比較において、FDEが顧客と持つ接点（距離）の性質として正しいものはどれですか（2つ選べ）","o":["契約時のみに限定された「一過性の接点」である","顧客と直接会うことはなく、すべてオンラインツール経由の間接的な接点である","商談時や要件確認時のみの「短期接点」である","常駐または定期訪問による「長期接点」である","完璧な資料が完成してから情報共有する","完璧を求めず気づいた時点で情報をNotionに更新していく"],"a":"DF"},{"id":3,"cat":"FDEの動き方","type":"m","q":"顧客は通常業務を抱えながら対応しています。FDEに求められる「動き方」として適切なものはどれですか（2つ選べ）","o":["FDE側が能動的に作業を提案し、具体的なたたき台等を作成して提示する","業務の進捗が遅れている場合は、先方の担当者を強く問い詰める","先方から具体的な指示や要件定義書が提出されるまで、実装作業を待つ","先方の業務を止めてでも、ヒアリングのための時間を最優先で確保させる","担当フェーズのみに集中し前後フェーズには関与しない","情報をチーム内で横展開しナレッジとして共有する"],"a":"AF"},{"id":4,"cat":"ナレッジの横展開","type":"m","q":"ある業種で得た課題や知見に対するFDEの行動指針として、正しいものはどれですか（2つ選べ）","o":["その業種の専門家になるために、自社のエンジニアリング業務を一時中断する","その顧客固有の秘密として、社内の他メンバーにも共有しないようにする","業種に依存しない課題の共通点を見つけ、他顧客にも横展開できる形でナレッジ化する","他業種の顧客には一切真似ができないよう、複雑な個別カスタマイズに終始する","プロダクト機能の説明のみを行い課題解決には関与しない","スピードと質を両立させ顧客への価値提供を最大化する"],"a":"CF"},{"id":5,"cat":"完璧主義の排除","type":"m","q":"FDEの行動指針として「完璧主義を持ち込まない」とあります。これは具体的にどういう動き方を意味していますか（2つ選べ）","o":["下書きや荒い粒度であっても、まずは前に進めながら洗練させていく","完璧なシステムが作れないと判断した場合は、その時点で改善提案を諦める","上司のレビューを受けるまでは、一切の資料を顧客に見せないようにする","成果物のクオリティは低くてよいため、適当に作ったシステムをそのまま納品する","顧客の承認が得られてからドキュメント作業を開始する","顧客ニーズを的確に把握し最適な解決策を提案する"],"a":"AF"},{"id":6,"cat":"業務フローの柔軟性","type":"m","q":"業務フローの各フェーズの関係性についての記述として、最も適切なものはどれですか（2つ選べ）","o":["すべてのフェーズはFDEが単独で主導し、他部署が介入することはない","フェーズは「今の主軸は何か」を示すラベルであり、状況に応じて往来するものである","フェーズは厳密な工程区分であり、前の工程に戻ることは原則として禁止されている","フェーズは顧客の企業規模によって割り振られ、一度決まったら変更できない","チーム全員の合意が取れてからナレッジを登録する","録音・文字起こしツールを活用してMTG内容を正確に記録する"],"a":"BF"},{"id":7,"cat":"Phase1の目的","type":"m","q":"Phase 1（導入決定〜事前ヒアリング）の主導部署と、このフェーズの主たる目的として正しいものはどれですか（2つ選べ）","o":["【FDE主導】顧客のネッ const FDE3_Q=[{"id":26,"cat":"定着支援の定義","type":"m","q":"Phase 3（改善提案・実装）の「定着支援」におけるFDEの仕事の定義として、最も適切なものはどれですか（2つ選べ）","o":["システムやツールを本番環境に「実装・配置」した時点で、FDEの仕事は完了となる","現場に入って一緒に触る、使い方レクチャー、ドキュメント配布などを組み合わせ、使ってもらい定着するまでが仕事である","現場のユーザーがツールを嫌がった場合は、すぐに元の古い業務様式に完全に戻して撤退する","使い方マニュアルをメールで一本送れば、その後の定着支援はすべて顧客の自己責任である","顧客の要望をそのまま開発チームへ転送するだけでよい","顧客の課題を深く理解し課題抽出から定着まで一気通貫で支援する"],"a":"BF"},{"id":27,"cat":"使われない場合の対処","type":"m","q":"実装したツールが現場で「使われない」という壁にぶつかったとき、FDEが取るべきアプローチとして正しいものはどれですか（2つ選べ）","o":["「現場のITリテラシーが低いからだ」と諦め、何もしない","原因は追究せず、さらに難易度の高い最先端のAI機能を上乗せして実装する","使わない社員に対して、利用を強制するような罰則規定を勝手に作成する","使われない原因（難しい／習慣が変えられない／メリットが見えない）を特定し、再設計する","完璧な資料が完成してから情報共有する","完璧を求めず気づいた時点で情報をNotionに更新していく"],"a":"DF"},{"id":28,"cat":"ナレッジ化の目的","type":"m","q":"ナレッジ化において、日々の知見を「ナレッジ化（資産化）する理由」ではないものはどれですか（2つ選べ）","o":["ナレッジが蓄積されれば、新規顧客への営業時のフックとなるため","競合他社に高値でナレッジベースを売却して利益を得るため","顧客ごとに得た知見を横展開できるようにするため","新規FDEメンバーが過去事例を参照できるようにするため","担当フェーズのみに集中し前後フェーズには関与しない","情報をチーム内で横展開しナレッジとして共有する"],"a":"BF"},{"id":29,"cat":"ナレッジの登録ルール","type":"m","q":"FDEナレッジへの「登録ルール」として、正しいものはどれですか（2つ選べ）","o":["KENZOとして価値があるかに関わらず、顧客の愚痴や雑談レベルの内容をすべてそのまま登録する","すべての実装が完了し、プロジェクトが「完了」するまで登録してはならない","課題が明確化した瞬間に登録する（完了を待たない）。また、「事実 ＋ それによる不都合」で記入する","具体的な競合製品名や、先方の担当者の批判的な個人名をタイトルに必ず入れる","プロダクト機能の説明のみを行い課題解決には関与しない","スピードと質を両立させ顧客への価値提供を最大化する"],"a":"CF"},{"id":30,"cat":"ナレッジの進捗管理","type":"m","q":"FDEナレッジの「進捗管理ルール」において、毎週月曜日（祝日の場合は翌営業日）のナレッジ確認時にチェックすべき項目に含まれないものはどれですか（2つ選べ）","o":["先方の担当者が今月の有給休暇を何日消化しているか","前週の業務を通し、ナレッジ化すべきものはないか","対応状況が変わったもの、または進捗が進んだものはないか","部署内で相談すべきものはないか","顧客の承認が得られてからドキュメント作業を開始する","顧客ニーズを的確に把握し最適な解決策を提案する"],"a":"AF"},{"id":31,"cat":"DX提案の入口","type":"m","q":"DX手法整理ナレッジにおいて、「どこからDXしたらよいか分からない」という顧客へ、FDEが行うアプローチとして、最も効果的なものはどれですか（2つ選べ）","o":["「DXとは何か」という概念から丁寧に説明し、顧客の知識レベルを引き上げてから提案に進む","「今お使いの様式を見せてもらえれば、どんなDX手法があるかご提案できます」と書類起点で切り込む","DXの必要性が理解できていない顧客への支援は不向きと判断し、担当を交代する","顧客が理解できるまで提案を保留し、社内で完璧な提案書が完成してから臨む","チーム全員の合意が取れてからナレッジを登録する","録音・文字起こしツールを活用してMTG内容を正確に記録する"],"a":"BF"},{"id":32,"cat":"DX提案の書類受領","type":"m","q":"DX手法整理フローでは、まず「様式受領」をおこないます。その際、顧客への依頼トークとして最も適切なものはどれですか（2つ選べ）","o":["「書類は顧客が自ら整理し、完全なリストにしてから提出してください」と伝える","「整理した状態でご提出いただかないと、精査ができません」と伝える","「精査や整理は不要です。フォルダごとそのまま送っていただければ、こちらで整理します」と伝える","「提出できる書類がそろってから連絡ください」と待ちの姿勢をとる","完璧に把握してから顧客への回答を開始する","Asana等のツールでタスクと進捗を可視化・共有する"],"a":"CF"},{"id":33,"cat":"DXリスト化でのAI活用","type":"m","q":"DX手法整理における「リスト化」では、AIを活用して様式をリスト化します。その際に抽出すべき4つの項目として正しいものはどれですか（2つ選べ）","o":["ファイルサイズ・作成者・更新日時・保存場所","ファイル名（様式名）・書類の分類・推定用途・発生頻度","フォント・色・ページ数・印刷設定","顧客企業の売上・従業員数・設立年・資本金","担当外の業務は一切引き受けない","課題を抽象化して汎用的な解決策を見つける"],"a":"BF"},{"id":34,"cat":"DX手法の判別","type":"m","q":"DX手法整理における「DX手法への落とし込み」では、AIを活用して書類ごとに手法を判別します。その後、FDEが行うべき重要な作業はどれですか（2つ選べ）","o":["AIが生成した結果を上司に提出し、上司が修正するまで作業を止める","AIが判別できなかった書類は対象外として無視する","AIの出力結果はすべて正確なので、そのままスプシに転記して顧客に提示する","AIの出力結果を目視で確認・修正し、書類の用途と手法の整合性や自社プロダクトとの紐づきを確認する","顧客が困っていなければ提案は行わない","現場で気づいた改善点をドキュメント化して共有する"],"a":"DF"},{"id":35,"cat":"DX手法の顧客提示","type":"m","q":"DX手法整理における「顧客への共有・提案」では、商談でスプレッドシートを共有する際の正しい進め方はどれですか（2つ選べ）","o":["すべての書類について順番に漏れなく説明し、顧客が全体を把握してから次のアクションを決める","競合他社との比較を優先して説明する","顧客の反応に関係なく、事前に決めた手法のみを必ず説明する","全体をざっと眺めてもらい、顧客が「これって？」と反応したところだけ止まって深掘りする","全タスクを完了してから次フェーズへ進む","顧客環境に応じて柔軟に業務フローを調整する"],"a":"DF"},{"id":36,"cat":"自社プロダクト優先","type":"m","q":"DX手法整理の設計方針において、「推奨サービス」として最上位に配置されているのはどれですか（2つ選べ）","o":["クラウドサイン・kintoneなどの他社ツール","コスト最安値のSaaS","顧客が現在使用しているツール","自社プロダクト（OUKAGAI／建設PAD）","顧客の要望をそのまま開発チームへ転送するだけでよい","顧客の課題を深く理解し課題抽出から定着まで一気通貫で支援する"],"a":"DF"},{"id":37,"cat":"DX手法の商談中確認","type":"m","q":"DX提案において、商談中に必ず確認すべき3つの質問として正しいものはどれですか（2つ選べ）","o":["「DXを諦める可能性はありますか？」「他のツールに乗り換える予定は？」「契約期間はどのくらいですか？」","「今日一番気になった手法はどれですか？」「次のステップとして何から始めますか？」「次回いつお時間いただけますか？」","「他社への提案はしていますか？」「社内の反対意見はありますか？」「上司への説明はしましたか？」","「予算はいくらですか？」「競合他社と比べてどうですか？」「契約しますか？」","完璧な資料が完成してから情報共有する","完璧を求めず気づいた時点で情報をNotionに更新していく"],"a":"BF"},{"id":38,"cat":"DXフローの目的","type":"m","q":"DX手法整理ナレッジが「FDEメンバー間の提案品質を揃える」ために作られている理由として、最も適切なものはどれですか（2つ選べ）","o":["これまで個人の経験に依存していた「DX手法の引き出し」を共通
