<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KENZO検定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bk:#1a1a1a;--dk:#2C2C2C;--gd:#C8A96E;--gl:#E8CFA0;--cr:#F5F0E8;--wh:#FAFAF7;--gr:#8A8A8A;--bd:#D8D0C4;--ok:#4A7C59;--ng:#8B3A3A;--pd:#5A6A7A;--st:#3A6B8A}
body{font-family:'Noto Sans JP',sans-serif;background:var(--cr);color:var(--dk);min-height:100vh}
#app{min-height:100vh}
.hdr{background:var(--bk);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(200,169,110,.3)}
.logo{font-family:'Noto Serif JP',serif;font-size:19px;font-weight:700;letter-spacing:.15em;color:var(--gd)}
.logo span{color:rgba(255,255,255,.4);font-weight:300;font-size:11px;margin-left:9px}
.nav{display:flex;gap:4px;align-items:center}
.nb{background:none;border:none;color:rgba(255,255,255,.5);font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:6px 12px;cursor:pointer;border-radius:3px;transition:all .2s}
.nb:hover,.nb.act{color:var(--gd);background:rgba(200,169,110,.15)}
.tmr{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:700;color:var(--gd);background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.25);border-radius:3px;padding:3px 10px;margin-right:6px}
.tmr.warn{color:#E07070;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.utag{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.45)}
.utag strong{color:var(--gd);font-size:12px}
.lout{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.35);font-size:10px;padding:3px 9px;border-radius:2px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-left:5px}
.lout:hover{color:rgba(255,255,255,.75)}
.main{padding:32px 24px;max-width:820px;margin:0 auto;width:100%}
.pt{font-family:'Noto Serif JP',serif;font-size:24px;font-weight:300;margin-bottom:4px}
.ps{font-size:11px;color:var(--gr);margin-bottom:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.sc{background:var(--wh);border:1px solid var(--bd);padding:18px;border-radius:2px}
.sl{font-size:9px;color:var(--gr);letter-spacing:.2em;text-transform:uppercase;margin-bottom:7px}
.sv{font-family:'Noto Serif JP',serif;font-size:30px;font-weight:300}
.su{font-size:11px;color:var(--gr);margin-left:3px}
.stit{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:700;margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--bd)}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:24px}
.lcard{background:var(--wh);border:1px solid var(--bd);padding:16px 10px;border-radius:2px;cursor:pointer;transition:all .25s;text-align:center;position:relative;overflow:hidden}
.lcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--lc,var(--gd));transform:scaleX(0);transition:transform .25s}
.lcard:hover::before{transform:scaleX(1)}
.lcard:hover{border-color:var(--gd);transform:translateY(-2px)}
.lcard.dis{opacity:.4;cursor:not-allowed;pointer-events:none}
.lb{font-family:'Noto Serif JP',serif;font-size:19px;font-weight:700;margin-bottom:4px}
.ld{font-size:9px;color:var(--gr)}
.ls{margin-top:7px;font-size:9px;padding:2px 6px;border-radius:2px;display:inline-block}
.lo{background:rgba(200,169,110,.15);color:var(--gd)}
.ll{background:rgba(0,0,0,.05);color:var(--gr)}
.tbl{width:100%;border-collapse:collapse;background:var(--wh);border:1px solid var(--bd)}
.tbl th{background:var(--dk);color:var(--wh);font-size:9px;padding:9px 13px;text-align:left}
.tbl td{padding:9px 13px;font-size:11px;border-bottom:1px solid var(--bd)}
.tbl tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:9px;font-weight:500}
.bp{background:rgba(74,124,89,.15);color:var(--ok)}
.bf{background:rgba(139,58,58,.15);color:var(--ng)}
.bpd{background:rgba(90,106,122,.15);color:var(--pd)}
.bi{background:rgba(200,169,110,.15);color:#8B6A30}
.bst{background:rgba(58,107,138,.15);color:var(--st)}
.ebar{display:flex;align-items:center;gap:13px;margin-bottom:22px}
.back-btn{background:none;border:1px solid var(--bd);color:var(--gr);font-family:'Noto Sans JP',sans-serif;font-size:10px;padding:6px 13px;cursor:pointer;border-radius:2px}
.back-btn:hover{border-color:var(--dk);color:var(--dk)}
.elv{font-family:'Noto Serif JP',serif;font-size:15px;font-weight:700;color:var(--gd)}
.pbar{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--gd),var(--gl));transition:width .4s}
.ptxt{font-size:10px;color:var(--gr);white-space:nowrap}
.qcard{background:var(--wh);border:1px solid var(--bd);border-radius:2px;padding:28px 32px;margin-bottom:14px;animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.qmeta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.qcat{font-size:9px;color:var(--gd);letter-spacing:.2em;text-transform:uppercase}
.ttag{font-size:9px;padding:2px 6px;border-radius:2px;background:rgba(0,0,0,.06);color:var(--gr)}
.qtxt{font-family:'Noto Serif JP',serif;font-size:17px;line-height:1.7;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:7px}
.obtn{display:flex;align-items:center;gap:11px;padding:11px 15px;border:1px solid var(--bd);background:var(--wh);cursor:pointer;border-radius:2px;transition:all .2s;text-align:left;width:100%;font-family:'Noto Sans JP',sans-serif;font-size:12px}
.obtn:hover{border-color:var(--gd)}
.obtn.ok{border-color:var(--ok)!important;background:rgba(74,124,89,.08)!important}
.obtn.ng{border-color:var(--ng)!important;background:rgba(139,58,58,.08)!important}
.obtn.sh{border-color:var(--ok)!important;background:rgba(74,124,89,.04)!important}
.okey{width:24px;height:24px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.obtn.ok .okey,.obtn.sh .okey{background:var(--ok);border-color:var(--ok);color:#fff}
.obtn.ng .okey{background:var(--ng);border-color:var(--ng);color:#fff}
.tfrow{display:flex;gap:9px}
.tfbtn{flex:1;padding:14px;border:1px solid var(--bd);background:var(--wh);cursor:pointer;border-radius:2px;font-family:'Noto Serif JP',serif;font-size:17px;transition:all .2s;text-align:center}
.tfbtn:hover{border-color:var(--gd)}
.tfbtn.tf-ok{border-color:var(--ok)!important;background:rgba(74,124,89,.1)!important}
.tfbtn.tf-ng{border-color:var(--ng)!important;background:rgba(139,58,58,.1)!important}
.tfbtn.tf-sh{border-color:var(--ok)!important;background:rgba(74,124,89,.05)!important}
textarea.oarea{width:100%;min-height:90px;border:1px solid var(--bd);border-radius:2px;padding:11px;font-family:'Noto Sans JP',sans-serif;font-size:12px;resize:vertical;background:var(--wh);outline:none;display:block}
textarea.oarea:focus{border-color:var(--gd)}
.osbtn{background:var(--dk);color:var(--wh);border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:9px 22px;cursor:pointer;border-radius:2px;margin-top:8px}
.osbtn:hover{background:var(--gd);color:var(--dk)}
.osbtn:disabled{opacity:.4;cursor:not-allowed}
.mans{margin-top:12px;padding:12px;background:rgba(74,124,89,.07);border:1px solid rgba(74,124,89,.2);border-radius:2px;font-size:11px;color:var(--ok);line-height:1.6}
.mansl{font-size:9px;font-weight:700;margin-bottom:3px}
.fb{padding:11px 16px;border-radius:2px;margin-bottom:14px;font-size:12px}
.fb.ok-fb{background:rgba(74,124,89,.12);color:var(--ok)}
.fb.ng-fb{background:rgba(139,58,58,.12);color:var(--ng)}
.fb.pd-fb{background:rgba(90,106,122,.1);color:var(--pd)}
.exp{padding:11px 16px;background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.25);border-radius:2px;margin-bottom:14px;font-size:11px;line-height:1.8}
.expl{font-size:9px;font-weight:700;color:var(--gd);display:block;margin-bottom:3px}
.nxt{background:var(--dk);color:var(--wh);border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:11px 26px;cursor:pointer;border-radius:2px;display:block;margin-left:auto}
.nxt:hover{background:var(--gd);color:var(--dk)}
.rcard{background:var(--wh);border:1px solid var(--bd);border-radius:2px;padding:48px 32px;text-align:center}
.ricon{font-size:44px;margin-bottom:11px}
.rgold{width:32px;height:2px;background:var(--gd);margin:0 auto 14px}
.rtit{font-family:'Noto Serif JP',serif;font-size:22px;font-weight:300;margin-bottom:4px}
.rscore{font-family:'Noto Serif JP',serif;font-size:52px;font-weight:700;color:var(--gd);line-height:1;margin:14px 0}
.rscore span{font-size:16px;color:var(--gr);font-weight:300}
.racts{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.pbtn{background:var(--dk);color:var(--wh);border:none;font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:9px 20px;cursor:pointer;border-radius:2px}
.pbtn:hover{background:var(--gd);color:var(--dk)}
.sbtn2{background:none;color:var(--dk);border:1px solid var(--bd);font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:9px 20px;cursor:pointer;border-radius:2px}
.sbtn2:hover{border-color:var(--dk)}
.anote{background:rgba(90,106,122,.08);border:1px solid rgba(90,106,122,.2);border-radius:2px;padding:12px 16px;font-size:11px;color:var(--pd);line-height:1.7;margin-bottom:14px}
.empty{text-align:center;padding:48px 20px;color:var(--gr)}
.prow{padding:13px;border:1px solid var(--bd);border-radius:2px;background:var(--wh);margin-bottom:7px}
.pq{font-size:12px;font-weight:500;margin-bottom:4px}
.pa{font-size:11px;padding:7px;background:var(--cr);border-radius:2px;line-height:1.6}
.mref{font-size:10px;color:var(--gr);margin-top:3px;font-style:italic}
.pm{font-size:9px;color:var(--gr);margin-top:4px}
.si{border:1px solid var(--bd);border-radius:2px;padding:3px 7px;font-size:11px;width:60px;font-family:'Noto Sans JP',sans-serif}
.sbtn{background:var(--dk);color:var(--wh);border:none;padding:5px 11px;border-radius:2px;cursor:pointer;font-size:10px}
.sbtn:hover{background:var(--gd);color:var(--dk)}
.top-s{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bk);flex-direction:column}
.top-logo{font-family:'Noto Serif JP',serif;font-size:38px;font-weight:700;color:var(--gd);letter-spacing:.2em;margin-bottom:6px}
.top-sub{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.3em;margin-bottom:48px}
.top-cards{display:flex;gap:14px}
.tc{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:28px 32px;cursor:pointer;transition:all .3s;text-align:center;min-width:170px}
.tc:hover{background:rgba(200,169,110,.1);border-color:var(--gd);transform:translateY(-3px)}
.tc-icon{font-size:26px;margin-bottom:10px}
.tc-label{font-family:'Noto Serif JP',serif;font-size:16px;color:var(--wh);margin-bottom:3px}
.tc-desc{font-size:9px;color:rgba(255,255,255,.3)}
.auth-s{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bk)}
.auth-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:40px 44px;width:380px}
.auth-title{font-family:'Noto Serif JP',serif;font-size:19px;color:var(--wh);margin-bottom:4px;font-weight:400}
.auth-sub{font-size:10px;color:rgba(255,255,255,.3);margin-bottom:26px}
.auth-label{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.15em;margin-bottom:6px;display:block}
.auth-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:2px;padding:10px 13px;font-family:'Noto Sans JP',sans-serif;font-size:12px;color:var(--wh);outline:none;margin-bottom:11px;display:block}
.auth-input:focus{border-color:var(--gd)}
.auth-input::placeholder{color:rgba(255,255,255,.18)}
.auth-btn{width:100%;background:var(--gd);color:var(--dk);border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:700;padding:12px;cursor:pointer;border-radius:2px;margin-top:4px}
.auth-btn:hover{background:var(--gl)}
.auth-error{font-size:10px;color:#E07070;margin-bottom:8px}
.auth-back{background:none;border:none;color:rgba(255,255,255,.28);font-size:10px;cursor:pointer;margin-top:11px;font-family:'Noto Sans JP',sans-serif;display:block;width:100%;text-align:center}
.auth-back:hover{color:rgba(255,255,255,.6)}
.warn-bar{background:rgba(224,112,112,.1);border:1px solid rgba(224,112,112,.3);border-radius:2px;padding:11px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wtabs{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.wtab{padding:7px 14px;border:1px solid var(--bd);background:var(--wh);border-radius:2px;cursor:pointer;font-size:12px;font-family:'Noto Sans JP',sans-serif}
.wtab:hover{border-color:var(--gd)}
.hidden{display:none}
.score-row{display:flex;align-items:center;gap:6px;margin-top:7px}

.sq-row{border:1px solid var(--bd);border-radius:2px;margin-bottom:10px;overflow:hidden;background:var(--wh)}
.sq-hdr{padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;border-bottom:1px solid var(--bd)}
.sq-hdr.sq-ok{background:rgba(74,124,89,.07)}
.sq-hdr.sq-ng{background:rgba(139,58,58,.07)}
.sq-hdr.sq-pd{background:rgba(90,106,122,.07)}
.sq-body{padding:12px 14px;font-size:11px;color:var(--gr);line-height:1.7}
.sq-ans{margin-top:6px;padding:6px 10px;border-radius:2px;font-size:11px}
.sq-ans.ans-ok{background:rgba(74,124,89,.08);color:var(--ok)}
.sq-ans.ans-ng{background:rgba(139,58,58,.08);color:var(--ng)}
.sq-exp{margin-top:6px;padding:8px 10px;background:rgba(200,169,110,.08);border-radius:2px;font-size:10px;color:#8B6A30;line-height:1.6}
/* ケーススタディ（1級） */
.cbox{background:var(--wh);border:1px solid var(--bd);border-left:4px solid var(--gd);border-radius:2px;padding:20px 24px;margin-bottom:22px}
.cbox-title{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:700;color:var(--gd);letter-spacing:.1em;margin-bottom:10px}
.cbox-body{font-size:12px;line-height:2;color:var(--dk)}
.cbox-body ul{padding-left:1.4em;margin:.5em 0}
.cbox-body li{margin:.2em 0}
.cbox-body strong{color:var(--gd);font-weight:700}
.ctag{display:inline-block;background:rgba(44,62,80,.1);color:#2C3E50;font-size:9px;padding:2px 7px;border-radius:2px;font-weight:700;letter-spacing:.1em;margin-bottom:6px}
.case-toggle{background:none;border:1px solid var(--bd);color:var(--gr);font-family:'Noto Sans JP',sans-serif;font-size:10px;padding:4px 10px;cursor:pointer;border-radius:2px;margin-bottom:12px}
.case-toggle:hover{border-color:var(--gd);color:var(--gd)}
</style>
</head>
<body>
<div id="app"></div>

<script>
const Q4=[
{id:1,cat:"ユーザー登録",type:"c",q:"招待URLの有効期限は？",o:["24時間","1週間","3日","1か月"],a:"B",ex:"セキュリティと利便性のバランスから1週間です。"},
{id:2,cat:"ユーザー登録",type:"c",q:"登録時にチェックが必要な項目は？",o:["利用規約に同意する","メルマガ購読","位置情報の共有","端末認証"],a:"A",ex:"法的拘束力を持つのは利用規約への同意です。"},
{id:3,cat:"ユーザー登録",type:"c",q:"会員登録完了後にできることは？",o:["契約書が自動生成","物件が自動作成","取引先が自動登録","建設PADへログイン"],a:"D",ex:"登録完了＝利用権限の付与です。"},
{id:4,cat:"ユーザー登録",type:"c",q:"登録した基本情報は何に反映？",o:["注文書等の基本情報","CSV出力条件","契約書の条項","ストレージ容量"],a:"A",ex:"発注書・契約書に自動反映されます。"},
{id:5,cat:"プロフィール編集",type:"c",q:"組織情報編集はどこから？",o:["契約書","請求関連","組織・ユーザー","CSV出力"],a:"C",ex:"組織管理領域に配置されています。"},
{id:6,cat:"プロフィール編集",type:"c",q:"組織情報編集の注意点は？",o:["（必須）は必ず入力","（任意）も必ず入力","半角数字は不可","住所は入力不可"],a:"A",ex:"必須項目は書面生成に必要な情報です。"},
{id:7,cat:"通知情報",type:"c",q:"通知情報はどこから操作？",o:["契約書","HOME","組織・ユーザー","注文書・請書"],a:"B",ex:"全体横断情報なのでHOMEに配置。"},
{id:8,cat:"二段階認証",type:"c",q:"二段階認証はどこから開く？",o:["物件作成・更新","見積関連","HOME","ストレージ"],a:"C",ex:"アカウント全体の管理なのでHOMEです。"},
{id:9,cat:"二段階認証",type:"c",q:"二段階認証の操作は？",o:["事前設定パスワードを入力","取引先コードを入力","物件名を入力","ワンタイムパスワード"],a:"A",ex:"建設PADでは事前設定した二段階パスワードで認証します。"},
{id:10,cat:"二段階認証",type:"c",q:"パスワードを忘れた場合は？",o:["アカウント削除","パスワードを忘れた方はこちら","取引先を招待","PDFで確認"],a:"B",ex:"リカバリー導線は標準UI設計です。"},
{id:11,cat:"取引先招待",type:"c",q:"取引先招待で何が可能になる？",o:["自動入金","自動請求","自動施工","電子取引"],a:"D",ex:"招待の目的は電子書面のやり取りです。"},
{id:12,cat:"取引先招待",type:"c",q:"招待メール送信画面はどこ？",o:["取引先管理→招待する","契約・注文書→契約書","請求関連→一般通知書","見積関連→見積り依頼"],a:"A",ex:"関係構築フェーズなので取引先管理メニューです。"},
{id:13,cat:"取引先招待",type:"c",q:"招待先メールアドレスについて正しいのは？",o:["後から変更できる","招待メールが送られる","会社住所として使われる","CSV出力先になる"],a:"B",ex:"入力＝送信先指定です。"},
{id:14,cat:"取引先招待",type:"c",q:"取引先側でメールアドレス変更は？",o:["できない","できる","管理者だけできる","月1回できる"],a:"A",ex:"セキュリティ上、変更不可です。"},
{id:15,cat:"取引先招待",type:"c",q:"メールアドレス変更が必要な場合は？",o:["CSV出力から申請","取引先がプロフィール編集","サポートセンターに依頼","物件をクローズ"],a:"C",ex:"中央管理（サポートセンター）が妥当です。"},

{id:11,sec:"ストラテジ",cat:"ワークフロー",type:"c",q:"OUKAGAIのようなワークフローシステムを導入する主な狙いとして最も適切なのはどれか。",o:["稟議のプロセスを属人化すること","稟議・決裁の経路を標準化し、承認状況を可視化すること","稟議の証跡を残さないこと","稟議書をすべて紙と電子で両立する"],a:"B",ex:"稟議経路を標準化し「誰のところで止まっているか」まで可視化。属人化・紙台帳からの卒業。"},
{id:12,sec:"ストラテジ",cat:"AI・機械学習",type:"c",q:"機械学習（Machine Learning）の説明として最も適切なのはどれか。",o:["人がすべてのルールをプログラムに書き込む方式","データからパターンを学習し、予測や分類を行う方式","OSの更新機能の一種","ネットワーク帯域を自動調整する仕組み"],a:"B",ex:"データからパターンを学ぶ。ルールをすべて人が書くif文の山とは別物。"},
{id:13,sec:"ストラテジ",cat:"AI・機械学習",type:"c",q:"生成AI（Generative AI）の典型的な活用例として最も適切なのはどれか。",o:["コンクリートの配合設計計算のみ","既存のメールを自動で削除する","工事写真から説明文（キャプション）を自動生成する","現場のモルタルを自動で練る"],a:"C",ex:"テキスト・画像など「新しいコンテンツを生む」のが生成AI。工事写真→キャプション自動生成が好例。"},
{id:14,sec:"ストラテジ",cat:"AI・機械学習",type:"c",q:"AI導入時に考慮すべき「バイアス」の説明として最も適切なのはどれか。",o:["OSのバージョン差","学習データの偏りにより、不公平な結果が出てしまうこと","ネットワークの遅延","CPUクロックのばらつき"],a:"B",ex:"偏ったデータで学習すると不公平な判断が出る。「AIだから公平」は危険な思い込み。"},
{id:15,sec:"ストラテジ",cat:"AI倫理",type:"c",q:"「人間中心のAI」の考え方として最も適切なのはどれか。",o:["AIが人間の判断をすべて置き換えるべき","人間はAIに完全に従うべき","AIの設計・利用は、人間の尊厳・権利を尊重して行うべき","AIは倫理とは無関係でよい"],a:"C",ex:"AIはツール。主役は人。人権・尊厳・説明責任などを尊重して設計・運用する思想。"},
{id:16,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"個人情報保護法において「個人情報」に該当するものはどれか。",o:["工事名だけ","施工場所だけ","氏名と住所の組み合わせ","鉄筋の径"],a:"C",ex:"「個人を識別できる情報の組み合わせ」が個人情報。氏名＋住所はその典型。"},
{id:17,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"電子帳簿保存法に対応したシステム運用として適切なのはどれか。",o:["取引データをPDFにして保存するが、検索機能は持たない","取引データを削除してもバックアップは取らない","日付や金額などで検索できる形で電磁的記録を保存する","電子データは毎年プリントアウトして保存する"],a:"C",ex:"日付・金額・相手先で検索できる形の保存が要件の一つ。紙に戻せばOKではない。"},
{id:18,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"マイナンバーを取り扱う事業者に求められる対応として最も適切なのはどれか。",o:["社内の誰でも閲覧可能にする","メールで自由に送付する","利用目的を限定し、安全管理措置を講じる","紙に印刷して机の上に置いておく"],a:"C",ex:"利用目的の限定＋アクセス制御・保管・廃棄などの安全管理措置が必要。"},
{id:19,sec:"ストラテジ",cat:"法令・情報管理",type:"c",q:"著作権侵害に該当する行為はどれか。",o:["フリー素材サイトの利用規約を守って画像を使う","自社で撮影した写真を自社資料に使う","他人が作成した有料CADデータを、許可なく配布する","パブリックドメインの資料を利用する"],a:"C",ex:"他人の有料CADデータを無断配布は著作権侵害。フリー素材・パブリックドメインは条件を守ればOK。"},
{id:20,sec:"ストラテジ",cat:"情報セキュリティ",type:"c",q:"情報セキュリティの3要素「CIA」のうち、C（Confidentiality）が意味するものはどれか。",o:["完全性","可用性","機密性","継続性"],a:"C",ex:"CIA：C(機密性)＝見ていい人だけが見られる、I(完全性)＝改ざんなし、A(可用性)＝必要なときに使える。"},
{id:21,sec:"ストラテジ",cat:"BCP・リスク管理",type:"c",q:"BCP（事業継続計画）の説明として最も適切なのはどれか。",o:["新規事業を立ち上げる計画","災害・障害時にも重要業務を継続または早期復旧するための計画","コスト削減のための計画","人員削減計画"],a:"B",ex:"BCP＝事業継続計画。災害・障害等でも重要業務を止めない・早期回復するための準備。"},
{id:22,sec:"ストラテジ",cat:"BCP・リスク管理",type:"c",q:"建設会社でBCPを考える際に、ITシステムに関して重要な観点はどれか。",o:["図面フォーマットの統一","社内LANの配線色","クラウドサービスやバックアップを活用したデータの冗長化","PCの色を揃えること"],a:"C",ex:"クラウド・バックアップ・冗長構成でデータとシステムを守る設計が最重要。"},
{id:23,sec:"ストラテジ",cat:"ITガバナンス",type:"c",q:"ITガバナンスの目的として最も適切なのはどれか。",o:["IT投資を現場に任せる","組織全体としてIT活用を経営目標に沿って最適化・統制すること","ITを使わない文化を守ること","IT部門だけが意思決定すること"],a:"B",ex:"IT活用を経営戦略と整合させ、組織全体でコントロールすること。野良SaaS乱立の逆。"},
{id:24,sec:"ストラテジ",cat:"経営指標",type:"c",q:"KPI（重要業績評価指標）の説明として最も適切なのはどれか。",o:["経営理念そのもの","最終的なゴール（KGI）","KGI達成に向けて進捗を測るための中間指標","社員の年齢"],a:"C",ex:"KGI＝最終ゴール、KPI＝そこへの途中の進捗指標。例：KGI「電子契約率80%」→KPI「今月の電子契約件数」。"},
{id:25,sec:"ストラテジ",cat:"建設DX",type:"c",q:"建設PADの導入効果を測るKPIとして適切なのはどれか。",o:["現場の騒音レベル","FAX送受信枚数の減少","人員の削減数","営業車のガソリン代"],a:"B",ex:"FAX枚数の減少で電子化の進捗が数字で見える。騒音・ガソリン代・人員数は直接的なDX進捗指標にならない。"},
{id:26,sec:"ストラテジ",cat:"ビジネスモデル",type:"c",q:"新規ITサービスのビジネスモデルとして「プラットフォーム型」に該当するものはどれか。",o:["ユーザー同士をマッチングし、取引の場を提供する","物販のみ行う","受託開発のみ行う","営業を行わない"],a:"A",ex:"Uberやマッチングサービスのように「場を提供して両者をつなぐ」のがプラットフォーム型。"},
{id:27,sec:"ストラテジ",cat:"ソフトウェア",type:"c",q:"OSS（オープンソースソフトウェア）の特徴として最も適切なのはどれか。",o:["ソースコードが公開され、ライセンスに従えば改変・再配布可能","必ず無料で、ライセンスも不要","商用利用は禁止されている","ソースコードは非公開"],a:"A",ex:"ソースコード公開＋ライセンス条件を守れば改変・再配布OK。「完全無料・権利ゼロ」ではない。"},
{id:28,sec:"ストラテジ",cat:"建設FDE",type:"c",q:"「デジタルデバイド」解消に向けた建設FDEの役割として最も適切なのはどれか。",o:["ITが苦手な社員を放置する","現場や事務社員に寄り添って、ツール導入や教育を支援する","システム部門だけで完結する","「分からない人が悪い」と伝える"],a:"B",ex:"現場に寄り添うインストラクター＋設計者がFDE。切り捨ては逆効果。"},
{id:29,sec:"ストラテジ",cat:"ITパスポート",type:"c",q:"ITパスポート試験の合格イメージとして最も適切なのはどれか。",o:["プロのプログラマーとして即戦力","企業活動全般で通用するITの基礎リテラシーを持っている","サーバ構築の専門家","ネットワーク設計の専門家"],a:"B",ex:"「会社でITの会話についていける基礎リテラシー」レベル。エンジニアのスペシャリストではなくIT教養。"},
{id:30,sec:"ストラテジ",cat:"建設FDE",type:"c",q:"KENZOの建設FDEに特に求められるスタンスとして最も適切なのはどれか。",o:["コードだけ書ければよく、現場理解は不要","建設業の業務を理解しつつ、ITと現場の橋渡し役を担う","ITツールの批判だけする","ベンダー任せでよい"],a:"B",ex:"建設業務を分からずITだけでは役立たない。業務×ITの橋渡しこそFDEの仕事。"},
{id:31,sec:"ストラテジ",cat:"ビジネス思考",type:"c",q:"「プロダクトアウト」の説明として適切なのはどれか。",o:["市場ニーズから発想して商品開発する","技術起点で作りたいものを作り、市場に出す","顧客の声を聞かない","原価だけを見て設計する"],a:"B",ex:"「うちの技術でこれ作れるから売ろう」がプロダクトアウト。マーケットインはその逆。"},
{id:32,sec:"ストラテジ",cat:"ビジネス思考",type:"c",q:"「マーケットイン」の説明として適切なのはどれか。",o:["技術的に面白いものを優先する","社内事情だけで決める","顧客のニーズから逆算して商品・サービスを設計する","原価を最小にすることだけ考える"],a:"C",ex:"「顧客の困りごとから逆算してサービス設計」。DX文脈ではマーケットインが推奨されがち。"},
{id:33,sec:"ストラテジ",cat:"ITパスポート",type:"c",q:"ITパスポート試験で「テクノロジ系」に分類される内容はどれか。",o:["経営戦略","会計","情報セキュリティ・ネットワーク・データベース","会社法"],a:"C",ex:"情報セキュリティ・ネットワーク・DB・ハード・ソフトなどの「技術要素」がテクノロジ系。"},
{id:34,sec:"ストラテジ",cat:"AI・DX",type:"c",q:"AIチャットボットを社内問い合わせ対応に導入する主なメリットとして最も適切なのはどれか。",o:["問い合わせ履歴が一切残らなくなる","深夜や休日でも基本的な質問に対応できる","人事評価が不要になる","社員数を必ず減らせる"],a:"B",ex:"24時間365日よくある質問を捌いてくれるのが強み。人をゼロにするわけではない。"},
{id:35,sec:"ストラテジ",cat:"DX推進",type:"c",q:"建設会社のDX推進において、最も避けるべき状態はどれか。",o:["現場の課題をヒアリングしてツール導入を検討する","形だけシステムを入れて、誰も使っていない","パイロット導入から始める","小さな成功例を社内で共有する"],a:"B",ex:"「システムだけ入れて誰も使わない」が最もよくある失敗。小さな成功を積み上げるのが王道。"},
// マネジメント Q36-55
{id:36,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"プロジェクトマネジメントで「スコープ」とは何を指すか。",o:["プロジェクトメンバーの人数","プロジェクトの予算","プロジェクトで実施する作業の範囲","会議の回数"],a:"C",ex:"スコープ＝「どこからどこまでやるか」の範囲。ここがブレると工期・コスト双方に影響する。"},
{id:37,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"WBS（Work Breakdown Structure）の目的として最も適切なのはどれか。",o:["作業を大きくまとめる","作業を階層的に分解し、抜け漏れをなくす","責任者を一人に集中させる","仕様変更を容易にする"],a:"B",ex:"大きな仕事を「木の枝」のように分解し、抜け漏れを減らす技法。"},
{id:38,sec:"マネジメント",cat:"開発手法",type:"c",q:"ウォーターフォール型開発の特徴として最も適切なのはどれか。",o:["仕様変更を前提に、小さく繰り返す","要件定義→設計→実装→テストの順に上から下へ進む","ドキュメントはほとんど作成しない","リリースを毎日行う"],a:"B",ex:"要件→設計→実装→テストを「流れ落ちる」ように進める。後戻りコストが高いのが特徴。"},
{id:39,sec:"マネジメント",cat:"開発手法",type:"c",q:"アジャイル開発の特徴として最も適切なのはどれか。",o:["一度決めた仕様は変更しない","小さく作って動かし、フィードバックを得ながら改善を繰り返す","ウォーターフォールよりもテストが不要","顧客とのコミュニケーションを減らす"],a:"B",ex:"小さく作ってユーザーに見せてフィードバックしながら回す。「完璧に決めてから作る」の逆。"},
{id:40,sec:"マネジメント",cat:"開発・運用",type:"c",q:"DevOpsの考え方として最も適切なのはどれか。",o:["開発と運用を分断する","開発と運用が連携し、継続的な改善・自動化を行う","運用部門を廃止する","テストを省略する"],a:"B",ex:"Dev(開発)とOps(運用)が一体となって自動化・継続改善する。「作って投げる」文化からの卒業。"},
{id:41,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"ITサービスマネジメントにおいて「インシデント管理」が扱うのはどれか。",o:["新機能の企画","システム障害やサービス中断への対処","販促キャンペーンの計画","中期経営計画"],a:"B",ex:"実際に起きた障害に対処するプロセス。問題管理は根本原因を潰すほう。"},
{id:42,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"変更管理の目的として最も適切なのはどれか。",o:["変更を口頭で素早く行う","影響評価や承認を行い、無秩序な変更を防ぐ","記録を残さない","現場の判断で勝手に変更させる"],a:"B",ex:"テストや承認なしに本番を変えると事故るので、変更を統制するためのプロセス。"},
{id:43,sec:"マネジメント",cat:"テスト・移行",type:"c",q:"システム移行プロジェクトにおいて特に重要なテストはどれか。",o:["画面の色味テスト","データ移行テスト","インストール時間テスト","キーボード入力テスト"],a:"B",ex:"正しくデータが移っているか（件数・項目・値）を検証しないと、後で地獄を見る。"},
{id:44,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"SLA（サービスレベル合意）で定義される内容として最も適切なのはどれか。",o:["社員の給与水準","取締役の人数","稼働率・応答時間などサービス品質の目標値","株主構成"],a:"C",ex:"稼働率・応答時間・復旧目標時間(RTO)など「どのレベルのサービスか」の約束。"},
{id:45,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"プロジェクトのクリティカルパスとは何を意味するか。",o:["最も費用が高いタスクの集合","並行して実行できるタスク群","遅れると全体の工期に直接影響するタスクの経路","管理しなくてよいタスクの集合"],a:"C",ex:"ここが遅れると工期全体が遅延する「肝」の経路。ここを守るために他を調整する。"},
{id:46,sec:"マネジメント",cat:"品質管理",type:"c",q:"品質保証活動として適切なのはどれか。",o:["本番でユーザに使わせてから直す","レビューやテストを通じて欠陥を早期に発見・是正する","不具合を隠す","品質をコストでしか判断しない"],a:"B",ex:"レビュー・テストで早めにバグを捕まえるのが基本。「本番でテスト」は冗談。"},
{id:47,sec:"マネジメント",cat:"テスト・移行",type:"c",q:"受入テスト（ユーザ受入テスト）の主な目的として最も適切なのはどれか。",o:["ベンダ側の都合で仕様を調整する","利用者側の観点で、要件通りに動作するか確認する","ネットワーク速度を測る","サーバ室の温度を測る"],a:"B",ex:"「ユーザー視点で要件通りか」を確認するフェーズ。ベンダ側単体の都合ではない。"},
{id:48,sec:"マネジメント",cat:"インフラ",type:"c",q:"ITサービスの可用性を高める手段として最も適切なのはどれか。",o:["単一サーバ構成にする","冗長構成（クラスタリング・多重化）をとる","バックアップを取らない","停止時間を記録しない"],a:"B",ex:"サーバを冗長化して、どれかが死んでも全体が止まらないようにする。"},
{id:49,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"障害対応における「初動」で最も優先すべきことはどれか。",o:["責任を追及する","影響範囲と重要度を把握し、関係者にエスカレーションする","障害を隠す","すぐに再起動だけを繰り返す"],a:"B",ex:"何がどこまで影響しているかを把握し、関係者に共有＆エスカレーション。原因追及はその後。"},
{id:50,sec:"マネジメント",cat:"ワークフロー",type:"c",q:"OUKAGAIでの稟議フロー変更をプロジェクトとして実施する場合に、最も重要なポイントはどれか。",o:["一部の人だけに仕様を説明する","現場ユーザーの業務をヒアリングし、承認経路・権限を整理する","とりあえず現在の紙の流れをそのまま画面化する","システム部門だけで決める"],a:"B",ex:"紙の流れを鵜呑みにせず、現場・総務・経理などからヒアリングして「あるべき承認経路」を整理する。"},
{id:51,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"ITサービスマネジメントにおける「問題管理」の役割はどれか。",o:["個別障害への即時対応","障害の根本原因分析と再発防止策の検討","新規機能の企画","利用料金の請求"],a:"B",ex:"同じ障害を繰り返さないよう「なぜ？」を深掘りして恒久対策を打つプロセス。"},
{id:52,sec:"マネジメント",cat:"プロジェクト管理",type:"c",q:"プロジェクトで「スコープ・クリープ」が発生している状態として最も適切なのはどれか。",o:["当初合意していない要件が次々と追加されていく","当初計画どおりに進んでいる","予算が余っている","工期が短縮されている"],a:"A",ex:"「ついでにこれも」と合意していない要件が肥大していく状態。早期に変更管理プロセスを使う。"},
{id:53,sec:"マネジメント",cat:"建設FDE",type:"c",q:"IT人材育成の観点から、建設FDE研修でやるべきこととして最も適切なのはどれか。",o:["現場には行かず、座学だけ行う","建設業の業務理解と、IT基礎（クラウド・セキュリティ・AIなど）をセットで学ぶ","ツールの操作だけを覚える","プログラミング言語だけ学ぶ"],a:"B",ex:"業務理解＋IT基礎をセットで学ぶことで、現場と話ができる人材になる。"},
{id:54,sec:"マネジメント",cat:"ITサービス管理",type:"c",q:"SLAの「稼働率99.9%」のおおよその年間停止許容時間として最も近いものはどれか。",o:["約87.6時間","約8.8時間","約1時間","約0.1時間"],a:"B",ex:"1年≒8760時間 → 0.1%≒8.76時間。だいたい「9時間弱」がSLA 99.9%の意味。"},

// ========== 建設PAD検定 1級 ケーススタディ問題1 ==========
const CASE1_SCENARIO=`宮崎県内の中堅ゼネコンA社は、請求書のデジタル化を検討している。地域では燈 Digital Billderの導入が進んでおり、同社にも導入圧力がある。一方で、建設PADも提案されている。

A社の現状：
・月間請求書：250件
・見積・発注・請求はバラバラに管理
・協力会社：約120社
・DX専任人材なし

// ===== 記述式 自動採点（ニュアンスマッチング） =====
function autoGradeOpen(userAns, gradingAns){
  if(!userAns||!gradingAns)return false;
  const ua=userAns.trim();
  const uaNorm=ua.replace(/[ぁ-ん]/g,s=>String.fromCharCode(s.charCodeAt(0)+0x60))
                  .toLowerCase().replace(/\s+/g,"");
  const tokens=gradingAns.split(/[、,・。\n（）【】：「」『』,\s\/＋　]+/)
    .map(t=>t.trim()).filter(t=>t.length>=2||/^[a-zA-Z]$/.test(t));
  if(tokens.length===0)return false;
  const uaWords=ua.split(/[、,・。\s\n（）【】：「」　]+/).map(w=>w.trim()).filter(w=>w.length>=1);
  const matched=tokens.filter(t=>{
    const tNorm=t.replace(/[ぁ-ん]/g,s=>String.fromCharCode(s.charCodeAt(0)+0x60))
                  .toLowerCase().replace(/\s+/g,"");
    if(ua.includes(t)||uaNorm.includes(tNorm))return true;
    if(uaWords.some(w=>w.length>=2&&(t.includes(w)||tNorm.includes(w.toLowerCase()))))return true;
    if(t.length>=3&&(ua.includes(t.slice(0,Math.ceil(t.length*0.5)))||uaNorm.includes(tNorm.slice(0,Math.ceil(tNorm.length*0.5)))))return true;
    if(t.length>=4){
      const chars=[...t];
      const charHits=chars.filter(c=>ua.includes(c)).length;
      if(charHits/chars.length>=0.6)return true;
    }
    return false;
  }).length;
  const threshold=tokens.length<=2?1/tokens.length:0.5;
  return matched/tokens.length>=threshold;
}

// ========== DOM helpers ==========
function el(tag,attrs={},...children){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==="cls")e.className=v;
    else if(k==="style")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of children){
    if(c===null||c===undefined)continue;
    if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}
function div(cls,...children){return el("div",{cls},...children);}
function btn(cls,text,onclick){return el("button",{cls,onClick:onclick},text);}
function badge(cls,text){return el("span",{cls:"badge "+cls},text);}
function passedBadge(passed,mode){
  if(passed===true)return badge("bp","合格");
  if(passed===false)return badge("bf","不合格");
  return badge("bpd","採点中");
}

// ========== Render: Exam / Study ==========
function renderExam(){
  const qs=state.examQs;
  const q=qs[state.qIdx];
  if(!q)return div("main","問題が見つかりません");
  const c=div("main");

  // プログレスバー
  const ebar=div("ebar");
  ebar.append(btn("back-btn","← 中断",()=>goPage("dash")));
  const kindTag=state.examKind==="fde"?"FDE":state.examKind==="cs"?"CS":"建設PAD";
  ebar.append(el("div",{cls:"elv"},kindTag+" "+state.examLv+"級"));
  const pbar=div("pbar");
  const pct=((state.qIdx+(state.answered?1:0))/qs.length)*100;
  pbar.append(el("div",{cls:"pfill",style:{width:pct+"%"}}));
  ebar.append(pbar);
  ebar.append(el("div",{cls:"ptxt"},(state.qIdx+1)+" / "+qs.length));
  c.append(ebar);

  // ケーススタディ（1級）シナリオ折りたたみ表示
  if(state.examKind==="kenzo"&&state.examLv===1&&q.case){
    const cbox=div("cbox");
    cbox.append(div("cbox-title","ケース1：宮崎県内中堅ゼネコンA社のシステム選定"));
    const scenarioLines=CASE1_SCENARIO.split('\n');
    const bd=div("cbox-body");
    scenarioLines.forEach(line=>{
      if(line.trim())bd.append(el("p",{style:{marginBottom:"5px"}},line));
    });
    cbox.append(bd);
    c.append(cbox);
  }

  // 問題カード
  const qcard=div("qcard");
  const qmeta=div("qmeta");
  qmeta.append(el("span",{cls:"qcat"},q.cat));
  if(q.wk)qmeta.append(el("span",{cls:"ttag"},q.wk));
  if(q.sec)qmeta.append(el("span",{cls:"ttag"},"§"+q.sec));
  qmeta.append(el("span",{cls:"ttag"},TLAB[q.type]));
  qcard.append(qmeta);
  qcard.append(el("div",{cls:"qtxt"},"Q"+(state.qIdx+1)+". "+q.q));
  if(q.code){
    qcard.append(el("pre",{style:{background:"#1a1a1a",color:"#d4d4d4",padding:"14px 16px",borderRadius:"2px",fontSize:"11px",fontFamily:"monospace",margin:"0 0 16px 0",overflowX:"auto",lineHeight:"1.6",border:"1px solid rgba(200,169,110,.2)"}},q.code));
  }

  if(q.type==="c"||q.type==="f"||q.type==="m"){
    const opts=div("opts");
    q.o.forEach((opt,i)=>{
      const k=OPT[i];
      let cls="obtn";
      if(state.answered){
        if(q.type==="m"){const inS=(state.sel||"").includes(k),inA=q.a.includes(k);if(inA&&inS)cls+=" ok";else if(!inA&&inS)cls+=" ng";else if(inA&&!inS)cls+=" sh";}else{if(k===q.a&&k===state.sel)cls+=" ok";else if(k===state.sel)cls+=" ng";else if(k===q.a)cls+=" sh";}
      }else if(q.type==="m"&&(state.sel||"").includes(k)){cls+=" sel";}
      const b=el("button",{cls,onClick:()=>chooseOpt(k)});
      b.append(div("okey",k));
      b.append(el("span",{cls:"otxt"},opt));
      opts.append(b);
    });
    qcard.append(opts);
    if(q.type==="m"&&!state.answered){const cb=el("button",{cls:"obtn confirm-m",onClick:()=>confirmM()});cb.append(el("span",{},"\u78BA\u8A8D\u3059\u308B"));qcard.append(cb);}
  }
  if(q.type==="tf"){
    const tfrow=div("tfrow");
    [["true","○ 正しい"],["false","✕ 誤り"]].forEach(([v,lb])=>{
      let cls="tfbtn";
      if(state.answered){
        if(v===q.a&&v===state.sel)cls+=" tf-ok";
        else if(v===state.sel)cls+=" tf-ng";
        else if(v===q.a)cls+=" tf-sh";
      }
      tfrow.append(el("button",{cls,onClick:()=>chooseTF(v)},lb));
    });
    qcard.append(tfrow);
  }
  if(q.type==="o"){
    const sb=state.answered?null:btn("osbtn","回答を送信",submitOpen);
    if(sb)sb.disabled=!state.openTxt.trim();
    const ta=el("textarea",{cls:"oarea",placeholder:"回答を入力してください...",
      onInput:e=>{state.openTxt=e.target.value;if(sb)sb.disabled=!e.target.value.trim();}},state.openTxt);
    if(state.answered)ta.setAttribute("disabled","");
    qcard.append(ta);
    if(sb)qcard.append(sb);
    if(state.answered){
      const mans=div("mans");mans.append(div("mansl","📋 模範解答"),document.createTextNode(q.ma));
      qcard.append(mans);
    }
  }
  c.append(qcard);

  if(state.answered&&q.type!=="o"){
    const correct=state.sel===q.a;
    const fb=div("fb "+(correct?"ok-fb":"ng-fb"));
    if(correct)fb.textContent="✓ 正解です！";
    else if(q.type==="tf")fb.textContent=`✗ 不正解。正解は「${q.a==="true"?"○ 正しい":"✕ 誤り"}」です。`;
    else fb.textContent=`✗ 不正解。正解は「${OPT.indexOf(q.a)+1}. ${q.o[OPT.indexOf(q.a)]}」です。`;
    c.append(fb);
    if(q.ex){
      const exp=div("exp");
      exp.append(el("span",{cls:"expl"},"💡 POINT"));
      exp.append(document.createTextNode(q.ex));
      c.append(exp);
    }
  }
  if(state.answered&&q.type==="o"){
    const ans=state.session.find(a=>a.id===q.id);
    const openCorrect=ans&&ans.correct===true;
    const fb=div("fb "+(openCorrect?"ok-fb":"ng-fb"));
    fb.textContent=openCorrect?"✓ 正解です！":"✗ 不正解。模範解答を確認してください。";
    c.append(fb);
    if(q.ex){
      const exp=div("exp");
      exp.append(el("span",{cls:"expl"},"💡 POINT"));
      exp.append(document.createTextNode(q.ex));
      c.append(exp);
    }
  }
  if(state.answered){
    const nxtLabel=state.qIdx+1>=qs.length?"結果を見る →":"次の問題 →";
    c.append(btn("nxt",nxtLabel,nextQ));
  }
  return c;
}

// ========== Google Sheets Export (Admin) ==========
function exportFromSheets(){
  if(typeof XLSX==="undefined"){alert("Excelライブラリの読み込み中です。しばらくしてから再試行してください。");return;}
  const url=state.sheetsUrl;
  if(!url){alert("Google Sheets連携URLが設定されていません。\n管理者画面でWebhook URLを保存してください。");return;}
  const loadingMsg=document.createElement("div");
  loadingMsg.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:20px 30px;border-radius:8px;z-index:9999;font-size:14px;";
  loadingMsg.textContent="☁️ Google Sheetsからデータを取得中...";
  document.body.append(loadingMsg);
  fetch(url).then(r=>r.json()).then(j=>{
    loadingMsg.remove();
    if(j.error){alert("取得エラー: "+j.error);return;}
    const rows=j.data||[];
    if(rows.length===0){alert("Google Sheetsにデータがありません。");return;}
    const wb=XLSX.utils.book_new();
    const headers=Object.keys(rows[0]);
    const wsData=[headers,...rows.map(r=>headers.map(h=>r[h]||""))];
    const ws=XLSX.utils.aoa_to_sheet(wsData);
    ws["!cols"]=headers.map(()=>({wch:18}));
    XLSX.utils.book_append_sheet(wb,"受験履歴",ws);
    const today=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\//g,"");
    XLSX.writeFile(wb,"kenzo_sheets_export_"+today+".xlsx");
  }).catch(e=>{loadingMsg.remove();alert("取得失敗: "+e+"\n\nWebhook URLが正しいか、Apps Scriptが「全員」アクセスでデプロイされているか確認してください。");});
}

// ========== Excel Export ==========
function exportXLSX(targetEmail){
  if(typeof XLSX==="undefined"){alert("Excelライブラリの読み込み中です。しばらくしてから再試行してください。");return;}
  const examResults=state.results;
  const filtered=targetEmail?examResults.filter(r=>r.userEmail===targetEmail):examResults;
  if(filtered.length===0&&state.pending.length===0){alert("エクスポートするデータがありません");return;}
  // 受験回数を計算（ユーザー×種別×級ごと）
  const attemptMap={};
  const sortedForCount=[...filtered].sort((a,b)=>a.id-b.id);
  for(const r of sortedForCount){
    const k=(r.userEmail||r.userName)+"|"+(r.kind||"kenzo")+"|"+(r.level||"");
    attemptMap[r.id]=(attemptMap[k]=(attemptMap[k]||0)+1);
  }
  // Sheet1: 受験履歴
  const wsData=[["受験者名","メールアドレス","検定種別","級","受験日","受験回数","正答数","総問題数","正答率(%)","合否"]];
  for(const r of filtered){
    const kind=r.kind==="fde"?"建設FDE検定":"KENZO検定";
    const rate=r.autoTotal>0?Math.round(r.autoCorrect/r.autoTotal*100):"";
    const passed=r.passed===true?"合格":r.passed===false?"不合格":"未採点";
    wsData.push([r.userName||"不明",r.userEmail||"",kind,r.level?r.level+"級":"",r.date||"",attemptMap[r.id]||"",r.autoCorrect||0,r.autoTotal||0,rate,passed]);
  }
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(wsData);
  ws["!cols"]=[{wch:15},{wch:28},{wch:15},{wch:8},{wch:12},{wch:8},{wch:8},{wch:8},{wch:10},{wch:8},{wch:25}];
  XLSX.utils.book_append_sheet(wb,"受験履歴",ws);
  // Sheet2: 記述式回答
  const pd=targetEmail?state.pending.filter(p=>p.userEmail===targetEmail):state.pending;
  if(pd.length>0){
    const pdData=[["受験者名","メールアドレス","提出日","問題","回答","模範解答","採点済み","得点(0〜10)"]];
    for(const p of pd){
      pdData.push([p.userName||"不明",p.userEmail||"",p.date||"",p.qText||"",p.answer||"",p.modelAnswer||"",p.scored?"はい":"いいえ",p.scored?(p.score||0):"未採点"]);
    }
    const ws2=XLSX.utils.aoa_to_sheet(pdData);
    ws2["!cols"]=[{wch:15},{wch:28},{wch:12},{wch:35},{wch:35},{wch:35},{wch:8},{wch:10}];
    XLSX.utils.book_append_sheet(wb,"記述式回答",ws2);
  }
  const today=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\//g,"");
  const fname=targetEmail?"kenzo_results_"+today+".xlsx":"kenzo_all_results_"+today+".xlsx";
  XLSX.writeFile(wb,fname);
}

          const diff=rate-prevRate;
          const color=diff>0?"var(--ok)":diff<0?"var(--ng)":"var(--gr)";
          const label=diff>0?"▲ +"+diff+"%":diff<0?"▼ "+diff+"%":"→ 0%";
          diffEl=el("td",{style:{color,fontSize:"11px",fontWeight:"700"}},label);
        }
        const tr=el("tr",{});
        if(i===lvRecs.length-1)tr.style.background="rgba(200,169,110,.05)";
        tr.append(
          el("td",{style:{fontSize:"11px",color:"var(--gr)"}},(i+1)+"回目"+(i===lvRecs.length-1?" ★":"")),
          el("td",{},r.date),
          el("td",{style:{fontFamily:"'Noto Serif JP',serif",fontWeight:"700",fontSize:"13px"}},rate!==null?rate+"%":"—"),
          el("td",{style:{fontSize:"11px"}},r.autoTotal>0?r.autoCorrect+"/"+r.autoTotal+"問":"—"),
          diffEl,
          el("td",{},passedBadge(r.passed,r.mode))
        );
        tbody.append(tr);
      });
      const rates=lvRecs.map(r=>r.autoTotal>0?Math.round(r.autoCorrect/r.autoTotal*100):null).filter(v=>v!==null);
      if(rates.length>0){
        const best=Math.max(...rates);
        const latest=rates[rates.length-1];
        const sumRow=el("tr",{style:{background:"rgba(0,0,0,.03)",borderTop:"2px solid var(--bd)"}});
        sumRow.append(
          el("td",{colspan:"2",style:{fontSize:"10px",color:"var(--gr)",fontStyle:"italic"}},"集計"),
          el("td",{style:{fontSize:"11px",color:"var(--gd)",fontWeight:"700"}},"最高 "+best+"%"),
          el("td",{style:{fontSize:"11px",color:"var(--pd)"}},"最新 "+latest+"%"),
          el("td",{colspan:"2",style:{fontSize:"10px",color:"var(--gr)"}},lvRecs.filter(r=>r.passed===true).length+"回合格 / "+lvRecs.length+"回受験")
        );
        tbody.append(sumRow);
      }
      tbl.append(thead,tbody);ucard.append(tbl);
    }
    c.append(ucard);
  }
  const backBtn=btn("back-btn","← 管理者画面へ",()=>goPage("admin"));
  backBtn.style.marginTop="20px";
  c.append(backBtn);
  return c;
}

  exportBtn.style.cssText="margin-top:20px;background:var(--ok);color:var(--wh);border:none;font-weight:700;width:100%;padding:10px;";
  c.append(exportBtn);

// ========== Navigation & Actions ==========
function nav(mode){state.authMode=mode;state.page="top";render();}
function goPage(page){state.page=page;render();}

function loginExamPw(){
  const pw=examPasswords[state.examKind]||"";
  if(!pw||state.examPw===pw){
    state.examPwErr="";state.examPw="";
    state.authMode="user-login";render();
  }else{
    state.examPwErr="パスワードが正しくありません";render();
  }
}
function loginUser(){
  if(!state.uName.trim()){state.uErr="名前を入力してください";render();return;}
  if(!state.uEmail.trim()||!state.uEmail.includes("@")){state.uErr="有効なメールアドレスを入力してください";render();return;}
  state.currentUser={name:state.uName.trim(),email:state.uEmail.trim()};
  state.authMode="user";state.page="dash";state.uErr="";render();
}
function loginAdmin(){
  if(state.adminPin===ADMIN_PIN){state.authMode="admin";state.page="admin";state.adminPinErr=false;state.adminPin="";render();}
  else{state.adminPinErr=true;render();}
}
function logout(){stopTimer();state.authMode="top";state.currentUser=null;state.examKind=null;state.page="top";render();}

function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function startExam(lv,wk="all"){
  const mode="exam";
  if(state.timeLeft!==null&&!state.done){
    alert("⚠️ 試験が進行中です。\n現在の試験を完了または中断してから新しい試験を開始してください。");
    goPage("exam");
    return;
  }
  state.examLv=lv;state.examWk=wk;
  state.examQs=state.examKind==="cs"?getQs(lv,wk):shuffleArray(getQs(lv,wk));
  state.qIdx=0;state.sel=null;state.openTxt="";state.answered=false;
  state.session=[];state.done=false;state.timedOut=false;
  state.page="exam";
  state.timeLeft=getTimeLimit(lv);
  render();
  startTimer(state.timeLeft);
}

function chooseOpt(k){
  if(state.answered)return;
  const q=state.examQs[state.qIdx];
  if(q.type==="m"){
    const arr=(state.sel||"").split("").filter(Boolean);
    const idx=arr.indexOf(k);
    if(idx>=0)arr.splice(idx,1);else arr.push(k);
    state.sel=arr.sort().join("");
    render();return;
  }
  state.sel=k;state.answered=true;
  state.session=[...state.session,{id:q.id,type:q.type,sel:k,correct:k===q.a}];
  render();
}
function confirmM(){
  const q=state.examQs[state.qIdx];
  if(state.answered)return;
  state.answered=true;
  state.session=[...state.session,{id:q.id,type:q.type,sel:state.sel||"",correct:(state.sel||"")===q.a}];
  render();
}
function chooseTF(v){
  if(state.answered)return;
  const q=state.examQs[state.qIdx];
  state.sel=v;state.answered=true;
  state.session=[...state.session,{id:q.id,type:q.type,sel:v,correct:v===q.a}];
  render();
}
function submitOpen(){
  if(!state.openTxt.trim()||state.answered)return;
  const q=state.examQs[state.qIdx];
  state.answered=true;
  // 自動採点：gaフィールド（採点用答え）があればそちらを、なければmaを使用
  const isCorrect=autoGradeOpen(state.openTxt.trim(),q.ga||q.ma);
  state.session=[...state.session,{id:q.id,type:"o",sel:state.openTxt.trim(),correct:isCorrect}];
  render();
}
function nextQ(){
  const qs=state.examQs;
  if(state.qIdx+1>=qs.length){
    const corr=state.session.filter(a=>a.correct===true).length;
    const total2=state.session.length;
    const u=state.currentUser;
    const nr={id:Date.now(),date:new Date().toLocaleDateString("ja-JP"),level:state.examLv,week:state.examWk,autoCorrect:corr,autoTotal:total2,openCount:0,total:qs.length,passed:corr/qs.length>=0.8,userName:u?u.name:"不明",userEmail:u?u.email:"",mode:"exam",kind:state.examKind};
    state.results=[nr,...state.results];saveData();stopTimer();state.done=true;
    sendToSheets(nr);
    if(state.currentUser&&state.currentUser.email){
      openResultMailto(state.currentUser.email,state.currentUser.name,state.examLv,corr,total2,0,nr.passed,false);
    }
    render();
  }else{
    state.qIdx++;state.sel=null;state.openTxt="";state.answered=false;render();
  }
}
function scoreIt(pid){
  const v=parseInt(state.scoreIn[pid]);
  if(isNaN(v))return;
  state.pending=state.pending.map(p=>p.id===pid?{...p,scored:true,score:v}:p);
  saveData();render();
}

// ========== Main Render ==========
function render(){
  let app=document.getElementById("app");
  if(!app){app=document.createElement("div");app.id="app";document.body.appendChild(app);}
  app.innerHTML="";
  const am=state.authMode;
  if(am==="top"){app.append(renderTop());return;}
  if(am==="user-login"||am==="admin-login"){app.append(renderAuth(am));return;}
  if(am==="exam-pw"){app.append(renderExamPwAuth());return;}
  const wrapper=div("app");
  wrapper.append(renderHeader());
  const pg=state.page;
  if(am==="user"){
    if(pg==="dash")wrapper.append(renderDash());
    else if(pg==="fde4sel")wrapper.append(renderFde4Sel());
    else if(pg==="fde3sel")wrapper.append(renderFde3Sel());
    else if(pg==="l4sel")wrapper.append(renderL4Sel());
    else if(pg==="l3sel")wrapper.append(renderL3Sel());
    else if(pg==="l2sel")wrapper.append(renderL2Sel());
    else if(pg==="l1sel")wrapper.append(renderL1Sel());
    else if(pg==="exam"){
      if(state.done){
        wrapper.append(renderResult());
      }else{
        wrapper.append(renderExam());
      }
    }
    else if(pg==="hist")wrapper.append(renderHist());
  }
  if(am==="admin"){
    if(pg==="admin")wrapper.append(renderAdmin());
    else if(pg==="allhist")wrapper.append(renderAllHist());
  }
  app.append(wrapper);
}

// 拡張機能がDOMを書き換えた場合に再初期化する
(function(){
  function initApp(){
    let app=document.getElementById("app");
    if(!app){app=document.createElement("div");app.id="app";document.body.appendChild(app);}
    render();
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",initApp);
  } else {
    initApp();
  }
  // MutationObserverで#appが消えた場合に再描画
  const obs=new MutationObserver(function(){
    if(!document.getElementById("app")){
      setTimeout(function(){
        let app=document.createElement("div");
        app.id="app";
        document.body.appendChild(app);
        render();
      },50);
    }
  });
  obs.observe(document.body,{childList:true});
})();
</script>
